:root{--ink:#17122b;--night:#1b1f45;--night2:#262b5e;--cream:#fff4dc;--muted:#c9c3e6;--brass:#e7b54a;--red:#f0424f;--blue:#2f8cf0;--yellow:#ffc928;--green:#35c96a;--violet:#9b6bff;
  --f:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#121433;color:var(--cream);font-family:var(--f);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas#g{position:fixed;inset:0;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;font-family:var(--f)}
#ui *{pointer-events:none}
#ui button,#ui input,#ui .veil,#ui .veil *,#ui .coach.tap,#ui .credits{pointer-events:auto}
#ui button *{pointer-events:none}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-0.14em}
button{font-family:var(--f);font-weight:800;border:0;cursor:pointer;color:inherit;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* ---- HUD -------------------------------------------------------------------------------------------- */
.top{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:6px 66px 6px 8px;pointer-events:none}
.top.small{height:40px;padding:3px 60px 3px 4px}
.ibtn{width:44px;height:44px;border-radius:14px;background:rgba(18,16,48,.78);border:2.5px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.3);display:grid;place-items:center;font-size:22px;color:var(--cream)}
.ibtn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.ibtn[disabled]{opacity:.38}
.small .ibtn{width:36px;height:36px;font-size:18px;border-radius:11px}
.label{flex:1;min-width:0;text-align:center;font-weight:900;font-size:16px;letter-spacing:.2px;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.label small{display:block;font-weight:700;font-size:11px;color:var(--muted);text-shadow:none}
.chip{height:36px;border-radius:18px;background:rgba(18,16,48,.82);border:2.5px solid var(--ink);display:flex;align-items:center;gap:5px;padding:0 10px 0 5px;font-weight:900;font-size:16px;white-space:nowrap;pointer-events:none}
.chip .ico{font-size:24px;color:var(--brass)}
.chip.keys{padding:0 7px;gap:2px}
.chip.keys .ico{font-size:17px;color:#5a5480}
.chip.keys .ico.on{color:#ffd56a}
button.chip.keys{position:relative;font:inherit;font-weight:900;color:var(--cream);cursor:pointer}
button.chip.keys::after{content:'';position:absolute;inset:-6px -3px}
button.chip.keys:active{transform:translateY(2px)}
.small .chip{height:30px;font-size:13px}
.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

.tools{position:absolute;display:flex;gap:10px;align-items:center;justify-content:center;pointer-events:none}
.tools.col{flex-direction:column}
.tbtn{min-width:52px;height:52px;border-radius:16px;background:rgba(18,16,48,.85);border:2.5px solid var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:24px;color:var(--cream)}
.tbtn span{font-size:14px;font-weight:800}
.tbtn:active{transform:translateY(2px)}
.tbtn[disabled]{opacity:.35}
.tbtn.hot{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,201,40,.35),inset 0 -4px 0 rgba(0,0,0,.35)}
.small .tbtn,.tools.small .tbtn{min-width:40px;height:40px;font-size:18px;border-radius:12px;padding:0 6px}
.tools.small .tbtn span{display:none}

/* rubber-band buttons: a glossy tube around a dark plate */
.rb{position:relative;min-height:54px;padding:0 20px;border-radius:27px;background:var(--night2);color:var(--cream);font-size:19px;font-weight:900;letter-spacing:.3px;
  border:5px solid var(--c,var(--yellow));box-shadow:0 0 0 2.5px var(--ink),inset 0 0 0 2.5px var(--ink),0 5px 0 2px rgba(0,0,0,.45);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 2px 0 var(--ink)}
.rb::after{content:'';position:absolute;left:14px;right:14px;top:-4px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.rb:active{transform:translateY(3px);box-shadow:0 0 0 2.5px var(--ink),inset 0 0 0 2.5px var(--ink),0 2px 0 2px rgba(0,0,0,.45)}
.rb.big{min-height:64px;font-size:24px;border-radius:32px;padding:0 30px}
.rb.red{--c:var(--red)}.rb.blue{--c:var(--blue)}.rb.green{--c:var(--green)}.rb.yellow{--c:var(--yellow)}.rb.violet{--c:var(--violet)}
.rb[disabled]{filter:grayscale(.8);opacity:.6}
.rb .ico{font-size:24px}
.rb small{font-size:13px;font-weight:800;opacity:.9}
.price{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.35);border-radius:12px;padding:2px 8px 2px 4px;font-size:15px}
.price .ico{color:var(--brass);font-size:20px}

/* ---- cards / overlays ---------------------------------------------------------------------------------- */
.veil{position:absolute;inset:0;background:rgba(8,6,26,.62);display:flex;align-items:center;justify-content:center;padding:12px;animation:fade .2s ease}
.veil.clear{background:transparent}
@keyframes fade{from{opacity:0}}
.card{position:relative;width:min(92vw,400px);background:linear-gradient(180deg,#2a2f66,#1d2150);border:3px solid var(--ink);border-radius:26px;box-shadow:0 0 0 3px rgba(255,244,220,.12),0 10px 0 rgba(0,0,0,.45);padding:18px 16px 16px;text-align:center;
  transform-origin:50% 60%;animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{margin:0 0 4px;font-size:26px;font-weight:900;letter-spacing:.3px;text-shadow:0 3px 0 var(--ink)}
.card p{margin:6px 0;font-size:15px;font-weight:600;color:var(--muted);line-height:1.3}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.card .x{position:absolute;right:8px;top:8px}
.tag{display:inline-block;background:var(--cream);color:var(--ink);font-weight:900;font-size:13px;padding:3px 10px;border-radius:10px;transform:rotate(-3deg);border:2px solid var(--ink)}
.big-num{font-size:40px;font-weight:900;text-shadow:0 3px 0 var(--ink)}
.gain{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:900}
.gain .ico{font-size:30px;color:var(--brass)}
.bar{height:16px;border-radius:9px;background:rgba(0,0,0,.4);border:2px solid var(--ink);overflow:hidden;margin:8px 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ff9a2a);border-radius:7px;transition:width .6s ease}
.stk{width:120px;height:120px;margin:4px auto}
.coach{position:absolute;max-width:min(86vw,330px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;font-size:15px;line-height:1.25;box-shadow:0 5px 0 rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.coach.tap{pointer-events:auto}
.coach b{color:#b51f35}
.paw{position:absolute;width:58px;height:58px;color:#2b2638;filter:drop-shadow(0 3px 0 rgba(255,244,220,.65));pointer-events:none;transform:translate(-18px,-6px) rotate(-18deg);z-index:5}
.paw.tapping{animation:tapp 1.1s ease-in-out infinite}
@keyframes tapp{0%,100%{transform:translate(-18px,-6px) rotate(-18deg) scale(1)}45%{transform:translate(-18px,6px) rotate(-18deg) scale(.86)}}
.paw.dragging{transition:left .9s ease-in-out,top .9s ease-in-out}
.paw.above{transform:translate(-29px,-74px) rotate(162deg)}
.paw.above.tapping{animation:tappa 1.1s ease-in-out infinite}
@keyframes tappa{0%,100%{transform:translate(-29px,-74px) rotate(162deg) scale(1)}45%{transform:translate(-29px,-60px) rotate(162deg) scale(.86)}}

/* pressure counter + buttons */
.count{position:absolute;transform:translate(-50%,0);display:flex;align-items:center;gap:6px;font-size:26px;font-weight:900;text-shadow:0 3px 0 var(--ink);pointer-events:none}
.count .ring{width:26px;height:26px;border-radius:50%;border:6px solid var(--blue);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink)}
.press{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 10px 14px;pointer-events:none}
.press .row{display:flex;gap:8px;flex-wrap:nowrap;justify-content:center}
.press.wide{left:auto;top:52px;bottom:auto;width:min(46vw,270px);right:6px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px}
.press.wide .row{display:contents}
.press.wide .rb{min-height:46px;font-size:15px;padding:0 6px;border-width:4px;border-radius:23px;min-width:0;overflow:hidden;white-space:nowrap}
.press.wide.small{top:60px;width:min(46vw,176px);gap:4px;padding:2px}
.press.wide.small .rb{min-height:40px;font-size:13px;border-width:3px}
.press.wide .rb small{font-size:11px}
.goal{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(92vw,360px);background:rgba(18,16,48,.86);border:2.5px solid var(--ink);border-radius:14px;padding:5px 12px;
  font-weight:800;font-size:14px;line-height:1.2;text-align:center;color:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none}
.goal b{color:var(--yellow);font-weight:900}
.press.wide .goal{position:static;transform:none;width:auto;grid-column:1/-1;max-width:none;font-size:12px;padding:3px 8px;border-radius:10px}
.press.wide.small .goal{font-size:10.5px;padding:2px 6px;border-width:2px}
.card p.tip{background:rgba(255,244,220,.1);border:2px dashed rgba(255,244,220,.4);border-radius:14px;padding:6px 10px;color:var(--cream);font-weight:700}

/* map */
.mapnode{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--ink);
  background:radial-gradient(circle at 35% 30%,#fff3c4,#e7b54a 50%,#9a6a1c);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.45)}
.mapnode.done{background:radial-gradient(circle at 35% 30%,#fff,#cfe9d4 45%,#5aa86c)}
.mapnode.locked{background:radial-gradient(circle at 35% 30%,#7a7698,#4a4668 60%,#2e2b48);color:#9c98bd}
.mapnode.next{width:58px;height:58px;margin:-29px 0 0 -29px;font-size:20px;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 0 8px rgba(255,201,40,.3)}}
.mapnode .ico{font-size:22px}
.side{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:12px;display:grid;place-items:center;font-size:24px;border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.side.trophy{background:#4b3fa0;color:#ffe9a8}.side.launch{background:#1f7a6a;color:#d8fff1}
.side.locked{background:#3a3658;color:#77729a}
.side.done::after{content:'';position:absolute;right:-6px;top:-6px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
.maphead{position:absolute;left:0;right:0;top:52px;text-align:center;pointer-events:none}
.maphead h1{margin:0;font-size:28px;font-weight:900;text-shadow:0 3px 0 var(--ink);letter-spacing:.5px}
.maphead .sub{font-size:13px;font-weight:700;color:var(--muted)}
.mapfoot{position:absolute;left:0;right:0;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.mapfoot .row{display:flex;gap:5px;max-width:100vw;padding:0 4px}
.arrow{position:absolute;top:50%;width:44px;height:64px;margin-top:-32px;border-radius:14px;background:rgba(18,16,48,.8);border:2.5px solid var(--ink);font-size:30px;color:var(--cream);display:grid;place-items:center}

/* grids: looks, album, stash, house */
.tabs{display:flex;gap:6px;justify-content:center;margin:6px 0}
.tabs button{width:52px;height:44px;border-radius:12px;background:rgba(0,0,0,.3);border:2.5px solid var(--ink)}
.tabs button[aria-pressed=true]{background:var(--cream)}
.tabs .dot{display:block;width:26px;height:26px;margin:auto;border-radius:50%;border:6px solid var(--c);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink)}
.grid{display:grid;gap:8px;justify-content:center}
.cell{position:relative;border-radius:14px;background:rgba(0,0,0,.28);border:2.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);overflow:hidden}
.cell[aria-pressed=true]{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,201,40,.35)}
.cell canvas{display:block}
.cell .lock{position:absolute;right:4px;top:4px;font-size:16px;color:#8a85b0}
.polaroid{background:#fbf7ee;color:var(--ink);border-radius:6px;padding:5px 5px 2px;border:2px solid var(--ink);transform:rotate(var(--r,0deg))}
.polaroid.empty{background:#3a3762;color:#8f8ab5}
.polaroid b{display:block;font-size:10px;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{border-radius:12px;background:linear-gradient(180deg,#6d7486,#454b5c);border:3px solid var(--ink);display:grid;place-items:center;font-size:30px;color:#ffd56a;box-shadow:inset 0 -6px 0 rgba(0,0,0,.3)}
.box.open{background:linear-gradient(180deg,#3b3f66,#2a2d50);font-size:16px;color:var(--cream);font-weight:900}
.box.miss{opacity:.5}
.strip{position:relative;display:flex;margin:14px auto 6px;width:min(84vw,330px);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.strip div{flex:1;height:48px;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 var(--ink);border-right:2px solid var(--ink)}
.strip div:last-child{border-right:0}
.marker{position:absolute;top:58px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid var(--cream);transform:translateX(-12px)}
.stripwrap{position:relative;height:84px}
.settings label{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:800;font-size:15px;text-align:left}
.settings label span{flex:0 0 106px}
.settings input[type=range]{flex:1;height:44px;accent-color:var(--yellow)}
.settings b{width:44px;text-align:right}
.seg{display:flex;gap:6px}
.seg button{min-width:58px;min-height:44px;border-radius:12px;border:2.5px solid var(--ink);background:rgba(0,0,0,.3);font-size:16px}
.seg button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.credits{max-height:60vh;overflow:auto;text-align:left;font-size:12px;font-weight:600;color:var(--muted);line-height:1.35;touch-action:pan-y}
.credits *{touch-action:pan-y}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--cream);color:var(--ink);font-weight:900;font-size:14px;padding:8px 14px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.4);animation:pop .25s ease;pointer-events:none;width:max-content;max-width:min(90vw,340px);text-align:center;line-height:1.25}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#121433;font:900 22px var(--f);color:var(--cream);transition:opacity .4s}
.tbtn.cap{flex-direction:column;gap:0;min-width:56px;height:58px;padding:4px 4px}
.tbtn.cap em{font-style:normal;font-size:11px;font-weight:800;color:var(--muted);max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb small{white-space:nowrap}
.press .rb{min-height:52px;font-size:17px;padding:0 10px}
.top.small .label{visibility:hidden}
.tools.icons .tbtn span{display:none}
.tools.icons .tbtn{min-width:52px;padding:0}
.rb.hot{box-shadow:0 0 0 2.5px var(--ink),inset 0 0 0 2.5px var(--ink),0 0 0 6px rgba(255,201,40,.45),0 5px 0 2px rgba(0,0,0,.45);animation:glow2 1.4s ease-in-out infinite}
@keyframes glow2{50%{box-shadow:0 0 0 2.5px var(--ink),inset 0 0 0 2.5px var(--ink),0 0 0 10px rgba(255,201,40,.2),0 5px 0 2px rgba(0,0,0,.45)}}
