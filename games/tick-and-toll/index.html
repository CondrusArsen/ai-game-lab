<style>/* Tick & Toll — clockmaker's UI: brass plates, cream enamel cards, engraved display type (TT Display = Playfair
   Display Black, TT UI = Nunito; both OFL, embedded). Touch targets ≥ 44 px. Top-right 56 px kept free for the
   platform's own buttons. */
:root {
  --brass: #c99a3b; --brass-hi: #ffe7a3; --brass-dk: #7a5214; --cream: #fbf3e0; --cream2: #f1e2bd; --ink: #3b2a14;
  --teal: #1f5a63; --red: #c8283a; --gold: #ffd257;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  --ui: "TT UI", "Nunito", system-ui, sans-serif; --disp: "TT Display", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2a2c; overscroll-behavior: none; touch-action: none; }
body { font-family: var(--ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button { pointer-events: auto; font-family: var(--ui); cursor: pointer; }
[hidden] { display: none !important; }
svg { width: 100%; height: 100%; display: block; fill: currentColor; }

/* ---------- HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; padding-top: calc(var(--top) + 10px); text-align: center; }
.btn-icon { position: absolute; left: 12px; top: calc(var(--top) + 10px); width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 12px;
  color: var(--ink); background: radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass) 60%, var(--brass-dk)); box-shadow: 0 3px 0 rgba(60,35,5,.45), inset 0 0 0 2px rgba(255,240,200,.45); }
.btn-icon.down, .btn-round.down { transform: translateY(2px); box-shadow: 0 1px 0 rgba(60,35,5,.45); }
.prog { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }
.dial { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 16px; color: var(--ink);
  background: radial-gradient(circle, #fffaf0 0 56%, var(--brass) 58% 72%, var(--brass-dk) 74%); box-shadow: 0 2px 0 rgba(40,25,5,.35); }
.dial.nxt { filter: saturate(.4) brightness(.95); }
.bar { width: 128px; height: 13px; border-radius: 8px; background: rgba(255,250,235,.85); box-shadow: inset 0 0 0 2px var(--brass-dk), 0 2px 0 rgba(40,25,5,.3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(#ffe68a, #f0a92a); border-radius: 8px; transition: width .25s ease-out; }
.prog.bonus .bar i { background: linear-gradient(#bff6ec, #1fb5a3); }
.score { font-weight: 900; font-size: 46px; line-height: 1; margin-top: 6px; color: #fffaf0; letter-spacing: .5px;
  text-shadow: 2px 2px 0 #5a3a10, -2px 2px 0 #5a3a10, 2px -2px 0 #5a3a10, -2px -2px 0 #5a3a10, 2px 0 0 #5a3a10, -2px 0 0 #5a3a10, 0 -2px 0 #5a3a10, 0 4px 0 #5a3a10, 0 6px 10px rgba(0,0,0,.25); }
.score.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.best { font-weight: 800; font-size: 14px; color: #fffaf0; text-shadow: 0 1px 0 #5a3a10, 0 0 6px rgba(60,35,5,.5); margin-top: 2px; }
.coins { position: absolute; right: 12px; top: calc(var(--top) + 66px); display: flex; align-items: center; gap: 5px; padding: 4px 10px 4px 5px; border-radius: 16px;
  background: rgba(255,248,230,.9); box-shadow: inset 0 0 0 2px var(--brass), 0 2px 0 rgba(40,25,5,.3); font-weight: 900; font-size: 16px; }
.coins svg { width: 22px; height: 22px; }
.coins.pop { animation: pop .4s ease-out; }

/* ---------- title ---------- */
.title-card { position: absolute; left: 0; right: 0; top: calc(var(--top) + 7vh); text-align: center; }
.logo { font-family: var(--disp); font-weight: 900; font-size: clamp(44px, 13vw, 64px); line-height: .95; color: #fff6dc;
  text-shadow: 0 2px 0 #b47a1c, 0 4px 0 #7a5214, 0 6px 0 #4a3008, 0 10px 18px rgba(30,15,0,.35); letter-spacing: .5px; }
.tagline { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 14px; font-weight: 800; font-size: 15px; color: var(--ink);
  background: rgba(255,248,230,.88); box-shadow: inset 0 0 0 2px var(--brass); max-width: 88vw; }
.handhint { position: absolute; left: 0; right: 0; bottom: calc(var(--bot) + 120px); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.handhint .track { width: 190px; height: 6px; border-radius: 3px; background: rgba(255,250,235,.55); position: relative; }
.handhint .track i { position: absolute; left: 50%; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--gold); animation: swipeDot 1.6s ease-in-out infinite; }
.handhint .hand { width: 58px; height: 58px; order: 2; animation: swipe 1.6s ease-in-out infinite; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
.handhint .hh-text { order: 3; font-weight: 900; font-size: 16px; color: #fffaf0; text-shadow: 0 2px 0 #5a3a10, 0 0 8px rgba(40,25,5,.6); }
@keyframes swipe { 0%, 100% { transform: translateX(-70px) rotate(-8deg); } 50% { transform: translateX(70px) rotate(8deg); } }
@keyframes swipeDot { 0%, 100% { transform: translateX(-80px); } 50% { transform: translateX(80px); } }
.corner { position: absolute; bottom: calc(var(--bot) + 18px); display: flex; gap: 12px; }
.corner.left { left: 16px; } .corner.right { right: 16px; }
.btn-round { position: relative; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 13px; color: var(--ink);
  background: radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass) 60%, var(--brass-dk)); box-shadow: 0 4px 0 rgba(60,35,5,.5), inset 0 0 0 2px rgba(255,240,200,.5); }
.btn-round .dot { position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px #fff; }

/* ---------- wind-up gauge (3 notches beside Tick while falling) ---------- */
.gauge { position: absolute; left: 0; top: 0; display: flex; gap: 5px; padding: 4px 6px; border-radius: 12px; background: rgba(40,25,8,.55); will-change: transform; }
.gauge i { width: 12px; height: 12px; border-radius: 50%; background: #5a4630; box-shadow: inset 0 0 0 2px #9a7a3e; transition: background .12s, box-shadow .12s; }
.gauge i.on { background: radial-gradient(circle at 35% 30%, #fff3c0, #f2b934); box-shadow: 0 0 6px rgba(255,200,80,.9); }
.gauge.charged { background: rgba(255,170,40,.55); animation: gpulse .25s ease-in-out infinite alternate; }
.gauge.charged i { background: #fffbe6; box-shadow: 0 0 10px #ffd257; }
@keyframes gpulse { from { filter: brightness(1); } to { filter: brightness(1.35); } }

/* ---------- words, hints, toast ---------- */
.words { position: absolute; inset: 0; overflow: hidden; }
.word { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 900; pointer-events: none; animation: rise 1.2s ease-out forwards; }
.word.points { font-size: 20px; color: #fffaf0; text-shadow: 0 2px 0 #5a3a10, 1px 0 0 #5a3a10, -1px 0 0 #5a3a10; animation-duration: .8s; }
.word.praise { font-family: var(--disp); font-size: 28px; color: #ffe27a; text-shadow: 0 2px 0 #7a4a08, 0 4px 0 #4a2a04, 0 0 12px rgba(255,200,80,.6); }
.word.smash { font-family: var(--disp); font-size: 38px; color: #fff3c0; text-shadow: 0 2px 0 #b8202f, 0 4px 0 #6d0f18, 0 0 16px rgba(255,120,40,.7); }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 30% { transform: translate(-50%, -55%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
.hint { position: absolute; left: 50%; top: calc(var(--top) + 150px); transform: translateX(-50%); width: min(340px, 90vw); padding: 10px 14px; border-radius: 16px; text-align: center;
  font-weight: 800; font-size: 15px; line-height: 1.25; background: rgba(255,248,230,.94); box-shadow: inset 0 0 0 2px var(--brass), 0 4px 10px rgba(40,25,5,.25); }
.hint.in, .toast.in { animation: slideIn .3s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast { position: absolute; left: 50%; bottom: calc(var(--bot) + 96px); transform: translateX(-50%); width: min(340px, 90vw); padding: 10px 14px; border-radius: 14px; text-align: center;
  font-weight: 800; font-size: 14px; color: #fffaf0; background: rgba(40,25,10,.88); }

/* ---------- cards ---------- */
.modal-layer { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(24,16,6,.42); pointer-events: auto; padding: 12px; overflow: hidden; }
.modal-layer.in .card { animation: cardIn .32s cubic-bezier(.2,1.4,.4,1); }
@keyframes cardIn { from { opacity: 0; transform: scale(.85) translateY(20px); } to { opacity: 1; transform: none; } }
.card { width: min(360px, 94vw); overflow: visible; transform-origin: 50% 50%; padding: 20px 20px 18px; border-radius: 24px; text-align: center;
  background: radial-gradient(circle at 50% 0, #fffaf0, var(--cream) 50%, var(--cream2)); box-shadow: inset 0 0 0 3px var(--brass), inset 0 0 0 6px #fff6dc, inset 0 0 0 8px var(--brass-dk), 0 14px 30px rgba(20,10,0,.45); }
.card h2 { font-family: var(--disp); font-weight: 900; font-size: 32px; line-height: 1.05; margin: 4px 0 10px; color: var(--ink); }
.card h3 { font-family: var(--disp); font-size: 19px; margin: 12px 0 6px; text-align: left; }
.r-kicker { font-weight: 900; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--brass-dk); }
.r-big { font-weight: 900; font-size: 30px; color: var(--ink); }
.r-depth { height: 12px; border-radius: 7px; margin: 8px auto 10px; width: 80%; background: #fff; box-shadow: inset 0 0 0 2px var(--brass-dk); overflow: hidden; }
.r-depth i { display: block; height: 100%; background: linear-gradient(#ff8a8a, var(--red)); }
.r-cause { font-weight: 800; font-size: 15px; margin: 6px 0 10px; color: #6d1a22; }
.r-score { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin: 6px 0 12px; font-weight: 800; flex-wrap: wrap; }
.r-score b { font-size: 26px; font-weight: 900; }
.r-score em { font-style: normal; font-weight: 900; color: #fff; background: var(--red); padding: 2px 8px; border-radius: 10px; font-size: 13px; }
.r-reward { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 900; font-size: 26px; margin: 4px 0 8px; }
.r-reward svg { width: 34px; height: 34px; } .r-reward span { font-size: 13px; font-weight: 800; color: var(--brass-dk); }
.r-reward.big { font-size: 30px; }
.r-note { font-weight: 700; font-size: 14px; margin: 4px 0 12px; color: #5b4a33; line-height: 1.3; }
.r-note.small { font-size: 12px; } .r-note.warn { color: #8a1f1f; }
.bellmark { width: 64px; height: 64px; margin: 0 auto; color: #e9a51f; filter: drop-shadow(0 3px 0 #7a5214); animation: swing 1.4s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes swing { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
.track { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 4px; }
.track i { width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--brass-dk); }
.track i.on { background: radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass)); }
.track .chest { width: 40px; height: 40px; filter: grayscale(.6); } .track .chest.ready { filter: none; animation: pop .6s ease-out infinite alternate; }
.boxbig { width: 110px; height: 110px; margin: 0 auto; animation: pop .7s ease-out; }
.btn { display: block; width: 100%; min-height: 54px; margin: 8px 0 0; border: 0; border-radius: 16px; font-weight: 900; font-size: 19px; color: var(--ink);
  background: #fffaf0; box-shadow: inset 0 0 0 2px var(--brass), 0 4px 0 var(--brass-dk); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 12px; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.primary { background: linear-gradient(#ffe7a3, #e9b94a 55%, #cf9126); box-shadow: inset 0 0 0 2px #fff3c8, 0 4px 0 #7a5214, 0 6px 10px rgba(60,35,5,.25); font-size: 21px; }
.btn.down { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--brass), 0 1px 0 var(--brass-dk); }
.btn.ghost { background: rgba(255,250,240,.8); }
.row { display: flex; gap: 10px; } .row .btn { flex: 1; font-size: 16px; }
.btn.tiny { min-height: 44px; font-size: 14px; border-radius: 12px; margin-top: 6px; padding: 4px 6px; box-shadow: inset 0 0 0 2px var(--brass), 0 3px 0 var(--brass-dk); }
.btn.tiny svg { width: 18px; height: 18px; }
.btn.buy { background: linear-gradient(#ffe7a3, #e9b94a); } .btn.buy.poor { filter: grayscale(.8); opacity: .75; }
.thumb { width: 78px; height: 78px; margin: 0 auto; border-radius: 50%; background: center/contain no-repeat, radial-gradient(circle, #fffaf0 55%, #efe0bd); position: relative; box-shadow: inset 0 0 0 2px rgba(122,82,20,.4); }
.thumb.big { width: 132px; height: 132px; }
.thumb .lock { position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; padding: 4px; border-radius: 50%; color: #fff; background: var(--ink); }
.cc-head { display: flex; align-items: center; justify-content: space-between; } .cc-head .coins { position: static; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { padding: 8px 4px 6px; border-radius: 16px; background: rgba(255,255,255,.65); box-shadow: inset 0 0 0 2px rgba(201,154,59,.5); display: flex; flex-direction: column; align-items: center; }
.tile.on { box-shadow: inset 0 0 0 3px var(--brass), 0 0 0 2px #fff6dc; background: #fff; }
.tile.locked .thumb { filter: grayscale(.85) brightness(.9); }
.tile .nm { font-weight: 900; font-size: 13px; margin-top: 4px; line-height: 1.1; min-height: 28px; display: flex; align-items: center; }
.tag { font-size: 11px; font-weight: 800; color: #5b4a33; margin-top: 4px; line-height: 1.15; min-height: 26px; }
.tag.on { color: #1a7d4a; font-size: 13px; } .tag.goal { color: var(--brass-dk); }
.settingscard .srow { display: flex; align-items: center; gap: 10px; min-height: 52px; font-weight: 900; }
.srow label, .srow > span { flex: 0 0 104px; text-align: left; }
.srow input[type=range] { flex: 1; height: 44px; accent-color: var(--brass); pointer-events: auto; touch-action: pan-x; }
.srow b { width: 48px; text-align: right; }
.seg { display: flex; gap: 8px; flex: 1; } .seg button { flex: 1; min-height: 46px; border: 0; border-radius: 12px; font-weight: 900; font-size: 17px; background: #fff; box-shadow: inset 0 0 0 2px var(--brass); }
.seg button[aria-pressed=true] { background: linear-gradient(#ffe7a3, #d9a238); }
.twgrid { display: none; }
.tw { position: relative; aspect-ratio: 1; min-height: 48px; border-radius: 50%; border: 0; font-weight: 900; font-size: 17px; color: var(--ink); background: #fff; box-shadow: inset 0 0 0 2px var(--brass); }
.tw.done { background: radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass)); }
.tw.cur { box-shadow: inset 0 0 0 3px var(--red), 0 0 0 3px #fff6dc; background: #fffaf0; }
.tw.bonus::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; border: 2px dashed #1fb5a3; }
.tw.locked { opacity: .45; } .tw em { position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; }
.creditscard .r-note { text-align: left; }
.card.result { position: relative; }
.card-tools { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; justify-content: space-between; pointer-events: none; }
.card-tools .mini { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 10px; color: var(--ink); background: radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass) 65%, var(--brass-dk)); box-shadow: 0 3px 0 rgba(60,35,5,.4); }
.card-tools .mini.down { transform: translateY(2px); }

/* ---------- small frames (the platform card 390×219, landscape phones) ---------- */
@media (max-height: 520px) {
  .score { font-size: 30px; margin-top: 2px; } .best { font-size: 12px; }
  .prog { transform: scale(.85); margin-top: 0; }
  .btn-icon { width: 44px; height: 44px; padding: 11px; top: calc(var(--top) + 6px); }
  .coins { top: calc(var(--top) + 8px); right: 64px; font-size: 14px; }
  .title-card { top: 6px; } .logo { font-size: 38px; } .tagline { font-size: 12px; margin-top: 4px; padding: 3px 10px; }
  .handhint { bottom: 64px; } .handhint .hand { width: 40px; height: 40px; }
  .corner { bottom: 8px; } .btn-round { width: 46px; height: 46px; padding: 10px; }
  .card { padding: 12px 16px; }
  .card h2 { font-size: 24px; margin: 0 0 6px; } .btn { min-height: 44px; font-size: 16px; margin-top: 6px; } .btn.primary { font-size: 17px; }
  .bellmark { width: 40px; height: 40px; } .r-big { font-size: 22px; } .r-score b { font-size: 20px; } .r-reward { font-size: 20px; }
  .hint { top: 64px; font-size: 13px; padding: 6px 10px; }
  .modal-layer { padding: 6px; }
}
@media (max-height: 260px) {
  .title-card .tagline, .handhint .hh-text, .best { display: none; }
  .logo { font-size: 30px; } .handhint { bottom: 50px; }
  .card { width: min(560px, 96vw); } .card h2 { font-size: 20px; } .r-note { margin: 2px 0 4px; font-size: 12px; } .track { margin: 2px 0; }
  .bellmark, .boxbig { display: none; } .r-depth { margin: 4px auto; }
}

/* ---------- store key art (?cover) ---------- */
.cover-title { display: none; }
.cover-ui .hud, .cover-ui .gauge, .cover-ui .words, .cover-ui .hint, .cover-ui .handhint, .cover-ui .corner, .cover-ui .title-card, .cover-ui .toast { display: none !important; }
.cover-ui .cover-title { display: flex; flex-direction: column; align-items: center; position: absolute; right: 4vw; top: 50%; transform: translateY(-50%); width: 46vw; text-align: center; }
.ct-logo { font-family: var(--disp); font-weight: 900; font-size: 9.2vw; line-height: .9; color: #fff6dc;
  text-shadow: 0 .25vw 0 #d39a2a, 0 .5vw 0 #a8721a, 0 .75vw 0 #7a5214, 0 1vw 0 #4a3008, 0 1.6vw 2.4vw rgba(30,15,0,.45); }
.ct-sub { margin-top: 2.2vw; padding: .8vw 2.2vw; border-radius: 2vw; font-weight: 900; font-size: 2.3vw; color: var(--ink); background: rgba(255,248,230,.92); box-shadow: inset 0 0 0 .25vw var(--brass), 0 .5vw 1.4vw rgba(30,15,0,.3); }
/* ---------- v2: jump stars, bottomless HUD, banner ---------- */
.hud .depthbox { display: none; }
.hud.endless .prog, .hud.endless .starbar { display: none; }
.hud.endless .depthbox { display: inline-flex; align-items: baseline; gap: 8px; margin-top: 2px; padding: 3px 12px; border-radius: 14px; background: rgba(20,12,4,.45); color: #fff6dc; font-weight: 900; }
.depthbox .dl { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
.depthbox .dv { font-size: 26px; } .depthbox .dr { font-size: 13px; color: #ffd257; }
.starbar { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 2px 10px 2px 6px; border-radius: 14px; background: rgba(20,12,4,.38); }
.srow3 { display: inline-flex; gap: 1px; vertical-align: middle; }
.srow3 i { width: 18px; height: 18px; color: rgba(255,246,220,.3); transition: color .2s, transform .2s; }
.srow3 i.on { color: #ffd257; filter: drop-shadow(0 1px 0 #7a5214); }
.srow3 i.lost { animation: lost .6s ease-out; }
@keyframes lost { 0% { transform: scale(1.6) rotate(-20deg); color: #ff6b6b; } 100% { transform: none; } }
.srow3.mini i { width: 13px; height: 13px; } .srow3.tiny i { width: 9px; height: 9px; }
.starbar .jumps { font-weight: 900; font-size: 15px; color: #fff6dc; } .starbar .jumps em { font-style: normal; font-size: 12px; opacity: .8; margin-left: 1px; }
