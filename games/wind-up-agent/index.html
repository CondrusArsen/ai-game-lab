:root{--ink:#14102a;--cream:#fff4d6;--cream2:#f3dfae;--navy:#241d4d;--navy2:#2e2768;--brass:#f0b847;--red:#df3f2e;--teal:#33bdb1;--green:#59d36b;--gold:#ffcf3f;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --fd:'Seymour One','Arial Black',sans-serif;--fu:'Nunito','Arial Rounded MT Bold',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#16122f;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:var(--fu);font-weight:800;color:var(--cream)}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

/* tin badge buttons */
.tinbtn{border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#fffaf0,#f1d99c);box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.7);color:var(--ink);min-height:48px;min-width:48px;padding:6px 14px;position:relative;transition:transform .06s}
.tinbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -2px 0 rgba(0,0,0,.12)}
.tinbtn.round{width:50px;height:50px;padding:0;border-radius:50%;display:grid;place-items:center}
.tinbtn svg{width:26px;height:26px;fill:var(--ink);stroke:var(--ink)}
.tinbtn.primary{background:linear-gradient(#ffe066,#f7a21b);font-family:var(--fd);font-size:20px;letter-spacing:.5px;min-height:58px;padding:8px 22px}
.tinbtn.teal{background:linear-gradient(#7ff0e2,#2aa89d);font-family:var(--fd);font-size:16px}
.tinbtn.red{background:linear-gradient(#ff8a73,#d23a2a);color:#fff;font-family:var(--fd);font-size:16px}
.tinbtn.wide{width:100%}
.tinbtn[disabled]{filter:grayscale(.8);opacity:.6;pointer-events:none}
.tinbtn .rivet{position:absolute;width:6px;height:6px;border-radius:50%;background:#c79a3c;box-shadow:inset 0 1px 0 #fff3}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 60px) 0 calc(var(--sal) + 8px);display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#hud .hud-left{display:flex;gap:8px;pointer-events:auto}
#hud .hud-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lvltitle{font-family:var(--fd);font-size:19px;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink);white-space:nowrap;line-height:1.15}
.lvltitle small{font-family:var(--fu);font-weight:900;font-size:12px;display:block;text-align:center;color:var(--gold);letter-spacing:.5px}
.markers{display:flex;gap:6px}
.markers i{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--ink);background:#4a416f;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.markers i.on{background:radial-gradient(circle at 35% 35%,#e9ffd8,#59d36b 55%,#2f9a3f);box-shadow:0 0 10px #59d36b}
.markers i.cur{border-color:var(--gold);background:#6a5fa0}
.trayrow{display:flex;gap:6px;align-items:center;pointer-events:auto}
.budget{display:flex;gap:4px;padding:3px 9px;background:linear-gradient(#fff4d6,#e9d29a);border:2.5px solid var(--ink);border-radius:14px;min-height:38px;align-items:center;box-shadow:0 3px 0 var(--ink)}
.budget .ic{width:30px;height:30px;transition:transform .25s,filter .25s,opacity .25s;background:none;border:0;padding:0;display:grid;place-items:center;pointer-events:none}
.budget .ic svg{width:30px;height:30px}
.budget .ic.spent{filter:grayscale(1) brightness(.75);opacity:.35;transform:scale(.8)}
.budget .ic.pop{animation:spend .35s ease-out}
/* two kinds of ammo: the icons become buttons, the loaded one stands up with a gold ring */
.budget.multi{gap:6px;padding:3px 8px}
.budget.multi .ic{pointer-events:auto;width:38px;height:38px;border-radius:50%;cursor:pointer}
.budget.multi .ic svg{width:28px;height:28px}
.budget.multi .ic.sel{background:radial-gradient(circle,#fff 40%,#ffe066 75%);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--gold);transform:translateY(-3px) scale(1.06)}
.budget.multi .ic.sel::after{content:'';position:absolute}
.bouncechip{font-family:var(--fd);font-size:15px;color:#fff;background:#c22d78;border:2.5px solid var(--ink);border-radius:999px;padding:4px 10px;box-shadow:0 3px 0 var(--ink);opacity:.75;transition:opacity .2s,background .2s}
.bouncechip.live{opacity:1}
.bouncechip.low{background:#e8434f}
.bouncechip.tick{animation:spend .3s ease-out}
@keyframes spend{0%{transform:scale(1.35)}100%{transform:scale(.82)}}

/* bottom workbench band */
#band{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 12px calc(var(--sab) + 8px);pointer-events:none;text-align:center}
.toolchip{display:flex;align-items:center;gap:6px;font-family:var(--fd);font-size:13px;color:var(--ink);background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;box-shadow:0 3px 0 var(--ink)}
.toolchip svg{width:22px;height:22px}
body.aiming .hint{opacity:0!important}
.hint{font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink);max-width:340px;line-height:1.25;transition:opacity .3s}
.cancelzone{position:absolute;left:calc(var(--sal) + 10px);bottom:calc(var(--sab) + 10px);height:58px;min-width:118px;border:3px dashed var(--cream);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--cream);background:rgba(20,16,42,.55);font-size:15px;pointer-events:none;transition:background .1s,transform .1s}
.cancelzone span{font-size:22px}
.cancelzone.hot{background:#d23a2a;border-style:solid;transform:scale(1.08)}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 132px);transform:translate(-50%,-6px);background:rgba(20,16,42,.88);border:2px solid var(--cream);color:var(--cream);border-radius:14px;padding:7px 14px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* modal cards */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px);background:rgba(10,8,24,.5);z-index:5;overflow-y:auto}
.modal.clear{background:transparent;pointer-events:none}
.modal.clear .card{pointer-events:auto}
.card{width:100%;max-width:370px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);overflow:hidden;animation:pop .28s cubic-bezier(.2,1.5,.5,1);position:relative;margin:auto}
.card::after{content:'';position:absolute;inset:7px;border:2px dashed rgba(20,16,42,.18);border-radius:18px;pointer-events:none}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.card .band{background:var(--navy2);color:var(--gold);font-family:var(--fd);font-size:22px;text-align:center;padding:14px 12px 12px;border-bottom:3px solid var(--ink);line-height:1.15;text-shadow:0 2px 0 var(--ink)}
.card .band.red{background:#b8302a;color:#fff}
.card .band.green{background:#2f8f4a;color:#fff}
.card .band small{display:block;font-family:var(--fu);font-size:13px;color:#fff;opacity:.9;margin-top:3px;text-shadow:none}
.card .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.card p{margin:0;font-size:15px;line-height:1.3;text-align:center}
.card .muted{color:#6a5f80;font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row .tinbtn{flex:1}
.stat{display:flex;justify-content:space-between;align-items:center;background:#fbe8bb;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:15px}
.stat b{font-family:var(--fd);font-size:17px}
.cogs{display:inline-flex;align-items:center;gap:4px}
.cogs svg{width:20px;height:20px}
.stamp{align-self:center;font-family:var(--fd);font-size:20px;color:#2f8f4a;border:3px solid #2f8f4a;border-radius:10px;padding:2px 12px;transform:rotate(-6deg);animation:stamp .35s cubic-bezier(.2,1.6,.5,1)}
@keyframes stamp{0%{transform:rotate(-6deg) scale(2.2);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
.meter{height:16px;border:2px solid var(--ink);border-radius:10px;background:#e9d6a3;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#f59e1b)}
.capsrow{display:flex;align-items:center;gap:10px;font-size:13px}
.capsrow .meter{flex:1}
.failpic{align-self:center;width:96px;height:96px}

/* menu: one centred column on phones; on wide screens tools + play on the left, the level map on the right,
   inside a frame of limited width (nothing stretches edge to edge) */
.menu,.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:4;background:radial-gradient(120% 70% at 50% 0%,#3a2f7a 0%,#1b1640 60%,#120e2a 100%);touch-action:pan-y;display:flex}
.page{z-index:4}
.menu-in,.page-in{width:100%;max-width:520px;margin:auto;padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:10px}
.page-in{margin-top:0}
.hqteaser{display:flex;gap:10px;align-items:center;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:6px;text-align:left;margin-top:6px}
.hqteaser canvas{width:62%;height:auto;border-radius:12px;flex:0 0 62%}
.hqteaser div{display:flex;flex-direction:column;gap:3px;min-width:0}
.hqteaser b{font-family:var(--fd);font-weight:400;font-size:15px}

.menu-grid{display:flex;flex-direction:column;gap:12px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}

.purses{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.purse,.starsn{display:inline-flex;align-items:center;gap:5px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 11px 3px 5px;font-family:var(--fd);font-size:15px;box-shadow:0 3px 0 var(--ink)}
.purse svg,.starsn svg{width:22px;height:22px}
.card .starsn{box-shadow:none;border-width:2px;padding:1px 8px 1px 3px;font-size:13px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolcard{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:5px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;text-align:center;min-height:0}

.toolcard h3{margin:0;font-family:var(--fd);font-size:13px;line-height:1.1}
.toolcard .sub{font-size:12px;color:#6a5f80}
.toolcard .bar{width:90%;height:9px;border:2px solid var(--ink);border-radius:8px;background:#e9d6a3;overflow:hidden}
.toolcard .bar i{display:block;height:100%;background:#59d36b}
.toolcard.locked{filter:saturate(.25);opacity:.85}
.toolcard.locked::before{content:'🔒';position:absolute;top:6px;right:8px;font-size:18px}
.toolcard.sel{outline:4px solid var(--gold);outline-offset:2px}
.chap{font-size:13px;color:#d9cfee;display:flex;gap:6px;align-items:center}
.chap b{font-family:var(--fd);font-weight:400;color:var(--gold)}
.chap.ch2 b{color:#ff8fd0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lvl{height:50px;border:3px solid var(--ink);border-radius:14px;background:#fbe8bb;color:var(--ink);font-family:var(--fd);font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 3px 0 var(--ink);position:relative;min-height:48px;padding:0;line-height:1}
.lvl em{font-style:normal;font-size:10px;letter-spacing:-1px;color:#b47a00;line-height:1;margin-top:2px}

.lvl.done{background:linear-gradient(#a8f0b4,#59d36b)}
.lvl.cur{background:linear-gradient(#ffe066,#f7a21b);animation:bob 1.2s ease-in-out infinite}
.lvl.lock{background:#5b5280;color:#9c95bb}
.lvl.boss::after{content:'★';position:absolute;top:-9px;right:-6px;font-size:16px;color:var(--red);text-shadow:0 0 2px #fff}
@keyframes bob{50%{transform:translateY(-3px)}}
.menubar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--fd);font-size:11px;padding:6px 2px;min-height:64px;line-height:1.05;position:relative}
.navbtn svg{width:28px;height:28px}
.navbtn span{font-family:var(--fu);font-weight:900;font-size:12px;line-height:1.05;overflow-wrap:anywhere}
.navbtn .badge{position:absolute;top:-9px;right:-6px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;font-size:11px;padding:1px 6px;font-family:var(--fd);font-weight:400}
.section-title{font-family:var(--fd);font-size:15px;color:var(--cream);text-shadow:0 2px 0 var(--ink)}
.section-title.dark{color:var(--ink);text-shadow:none;font-size:14px;margin-top:4px}
.iconbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.iconbtn svg{width:24px;height:24px}
@media (min-width:760px) and (min-aspect-ratio:1/1){

}

  .menu-in{gap:6px}

/* shop */
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-height:44px;border:3px solid var(--ink);border-radius:14px;background:#5b5280;color:var(--cream);font-family:var(--fd);font-size:13px}
.tabs button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--ink);position:relative;min-height:44px}
.item canvas{width:100%;height:78px}
.item .nm{font-size:11px;line-height:1.1;text-align:center;min-height:24px;display:flex;align-items:center}
.item .pr{font-family:var(--fd);font-size:12px;display:flex;align-items:center;gap:3px}
.item .pr svg{width:15px;height:15px}
.item.sel{outline:4px solid var(--gold);outline-offset:1px}
.item .chk{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:#59d36b;border:3px solid var(--ink);display:grid;place-items:center;font-size:14px;color:#fff}
.preview{display:flex;gap:10px;align-items:center;background:rgba(255,244,214,.08);border:2px solid rgba(255,244,214,.25);border-radius:18px;padding:6px}
.preview canvas{width:120px;height:150px}
.preview .info{flex:1;display:flex;flex-direction:column;gap:6px}
.preview .info b{font-family:var(--fd);font-size:15px}

/* settings panel (kit) restyled */
.gt-settings{background:transparent!important;color:var(--ink)!important;padding:0!important;max-width:none!important;font:800 15px var(--fu)!important}
.gt-settings h2{display:none}
.gt-row{display:flex;align-items:center;gap:10px;min-height:52px}
.gt-row label,.gt-row>span{flex:0 0 96px;font-size:15px}
.gt-row input[type=range]{flex:1;height:44px;accent-color:#f59e1b}
.gt-pct{width:46px;text-align:right;font-family:var(--fd);font-size:13px}
.gt-seg{display:flex;gap:6px}
.gt-seg button{min-width:60px;min-height:46px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--fd);font-size:14px;color:var(--ink)}
.gt-seg button[aria-pressed=true]{background:var(--gold)}
.gt-note{font-size:13px;color:#a33}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;font-size:15px}
.toggle button{min-width:78px;min-height:46px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--fd);font-size:13px;color:var(--ink)}
.toggle button[aria-pressed=true]{background:var(--gold)}
.credits{white-space:pre-line;font-size:13px;line-height:1.35;text-align:left}

/* boot splash */
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#3a2f7a,#120e2a);z-index:9;transition:opacity .4s}
.boot.gone{opacity:0;pointer-events:none}
.boot-key{width:70px;height:70px;border-radius:50%;border:6px solid var(--brass);border-top-color:transparent;animation:spin 1s linear infinite}
.boot-title{font-family:var(--fd);font-size:24px;color:var(--gold);text-shadow:0 3px 0 var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}

/* hint bulb: bottom-right on the workbench (portrait), in the HUD column (landscape) */
#btnHint{position:fixed;right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 12px);z-index:3;background:linear-gradient(#fffaf0,#f1d99c)}
#btnHint svg{width:30px;height:30px;fill:none;stroke:none}
#btnHint.pulse{animation:bulb 1.1s ease-in-out infinite}
#btnHint.on{background:linear-gradient(#ffe066,#f7a21b)}
@keyframes bulb{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,224,102,.0)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 10px rgba(255,224,102,.55)}}
body.aiming #btnHint{opacity:.35}

/* Chief Owl's tips */
.coach{position:absolute;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 74px);bottom:calc(var(--sab) + 8px);max-width:560px;margin:0 auto;z-index:4;display:flex;gap:8px;align-items:flex-end;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:6px 10px 8px 6px;animation:pop .28s cubic-bezier(.2,1.5,.5,1);pointer-events:none}
.coach canvas{width:64px;height:64px;flex:0 0 64px}
.coach .cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.coach b{font-family:var(--fd);font-weight:400;font-size:12px;color:#7b4cc0}
.coach p{margin:0;font-size:14px;line-height:1.25}
.coach .crow{display:flex;gap:8px;align-items:center;justify-content:flex-end;pointer-events:auto}
.coach .cok{min-height:40px;font-size:15px;padding:4px 14px}
.coach .cskip{background:none;border:0;color:#6a5f80;font-size:12px;text-decoration:underline;min-height:36px;padding:0 4px}
.coach.tap{pointer-events:auto}
body.aiming .coach:not(.tap){opacity:.92}
.coach-focus{animation:cfocus 1s ease-in-out infinite!important;position:relative;z-index:5}
@keyframes cfocus{0%,100%{box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--gold)}50%{box-shadow:0 0 0 3px var(--ink),0 0 0 12px rgba(255,207,63,.45)}}

/* result stars, hint card */
.bigstars{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.bigstars i{width:58px;height:58px;display:block}
.bigstars i svg{width:100%;height:100%}
.bigstars i.on{animation:starpop .45s cubic-bezier(.2,1.6,.5,1) both}
.bigstars i:nth-child(2){transform:translateY(-8px)}
.bigstars i.on:nth-child(2){animation-name:starpop2}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starpop2{0%{transform:translateY(-8px) scale(0) rotate(-40deg)}100%{transform:translateY(-8px) scale(1) rotate(0)}}
.card p.small{font-size:12px}
.pips{display:inline-flex;gap:2px}
.pips i{width:20px;height:20px;display:block}
.pips i svg{width:100%;height:100%}
.hintrow{display:flex;gap:10px;align-items:center}
.hintrow canvas{width:76px;height:76px;flex:0 0 76px}
.hintrow>div{flex:1;display:flex;flex-direction:column;gap:8px}
.card p.clue{font-size:16px;text-align:left;font-weight:900}
.hintrow .muted{text-align:left}

/* Shop HQ */
.page .sub{margin:0;color:#d9cfee;font-size:13px}
.page .tabs button{font-size:12px}
.hq-grid{display:flex;flex-direction:column;gap:12px}
.hq-stage{border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:#1d1844;line-height:0}
.hq-stage canvas{display:block;width:100%;cursor:pointer}
.hq-panel{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.medals{display:grid;grid-template-columns:1fr;gap:8px}
