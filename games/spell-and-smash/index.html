<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1a46">
<title>Spell &amp; Smash</title>
<link rel="icon" href="data:,">
<style>:root{--ink:#1c1230;--plum:#2a1b4a;--violet:#8f4dff;--violet2:#5e27c9;--orange:#ff8a24;--orange2:#d4560f;--cream:#fff6e8;--moon:#f6f0e1;--mint:#2fd3b0;--red:#ff4f6a;
  --sat:0px;--sab:0px;--ui:"SpellUI",system-ui,-apple-system,"Segoe UI",sans-serif;--disp:"SpellDisplay","SpellUI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#120c24;color:var(--cream);font:700 16px/1.25 var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#hud .top{position:absolute;left:0;right:0;top:var(--sat);height:54px;display:flex;align-items:center;gap:8px;padding:0 64px 0 8px}
#hud .bottom{position:absolute;left:0;right:0;bottom:var(--sab);height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
#hud .btn{pointer-events:auto}
.lvtitle{display:flex;flex-direction:column;line-height:1.05;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(28,18,48,.8)}
.lvtitle .lvnum{font-weight:800;font-size:19px;color:#fff}
.lvtitle .lvch{font-size:12.5px;color:#d8c8ff;letter-spacing:.02em}
.spells{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:22px;background:rgba(28,18,48,.72);border:2.5px solid var(--ink);box-shadow:inset 0 0 0 2px rgba(180,140,255,.35);font-size:15px;transition:opacity .15s}
.spells .dots{display:flex;gap:5px}
.spells .dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);background:linear-gradient(160deg,#d8b8ff,var(--violet) 55%,var(--violet2));box-shadow:0 0 10px rgba(160,110,255,.7)}
.spells .dots i.used{background:#3a2c55;box-shadow:none;opacity:.6}
.spells.zero{opacity:.75}.spells.zero b{color:#ffb0bd}
.spells.pop{animation:pop .35s}.spells.shake{animation:shake .4s}
.spells.hide{opacity:0}
/* paint vial (user feedback 2026-10-05): remaining paint drains live while drawing; ★★★ / ★★ marks sit on the bar */
.spells{flex-direction:column;gap:3px;padding:6px 12px 6px;border-radius:20px;align-items:stretch}
.spells .srow2{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px}
.spells .dots i{width:13px;height:13px;border-width:2px}
.vial{position:relative;width:132px;height:13px;margin:12px 2px 2px;border-radius:8px;background:#20163a;border:2.5px solid var(--ink);box-shadow:inset 0 0 0 1.5px rgba(180,140,255,.3)}
.vial .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--left,1) * 100%);border-radius:6px;background:linear-gradient(180deg,#e6d2ff,var(--violet) 55%,var(--violet2));box-shadow:0 0 8px rgba(160,110,255,.7);transition:width .08s linear}
.vial .mk{position:absolute;top:-3px;bottom:-3px;width:2.5px;margin-left:-1.25px;background:#ffe6a0;border-radius:2px;box-shadow:0 0 0 1px var(--ink)}
.vial .m3{left:calc(var(--m3,1) * 100%)}.vial .m2{left:calc(var(--m2,1) * 100%)}
.vial .st{position:absolute;top:-15px;width:16px;height:16px;margin-left:-8px;color:#ffd25a;filter:drop-shadow(0 1.5px 0 var(--ink));transition:color .2s,transform .2s}
.vial .st svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.6}
.vial .s1{left:6px}.vial .s2{left:calc(var(--m2,1) * 100%)}.vial .s3{left:calc(var(--m3,1) * 100%)}
.vial .st.lost{color:#4a3c66;transform:scale(.8)}
.vial .st.drop{animation:stardrop .45s}
@keyframes stardrop{0%{transform:scale(1.3)}60%{transform:translateY(5px) scale(.7)}100%{transform:scale(.8)}}
.vial.dry{border-color:#c2324a;animation:shake .4s}
.spells.teachme{animation:teachme 1.2s ease-in-out infinite;border-color:#ffd25a}
@keyframes teachme{0%,100%{box-shadow:0 0 0 0 rgba(255,210,90,.0),inset 0 0 0 2px rgba(180,140,255,.35)}50%{box-shadow:0 0 0 6px rgba(255,210,90,.55),inset 0 0 0 2px rgba(180,140,255,.35)}}
body.drafting .toast{bottom:calc(var(--sab) + 150px)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cancelzone{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) scale(.9);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:24px;background:rgba(28,18,48,.85);border:2.5px dashed rgba(255,140,160,.8);color:#ffd0d8;font-size:14px;opacity:0;transition:.15s;pointer-events:none;min-height:48px}
.cancelzone svg{width:22px;height:22px}
.cancelzone em{font-style:normal}
.cancelzone.on{opacity:1;transform:translateX(-50%) scale(1)}
.cancelzone.hot{background:#c2324a;color:#fff;border-style:solid}
.unsaved{position:absolute;left:50%;top:calc(var(--sat) + 52px);transform:translateX(-50%);font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(194,50,74,.85);display:none}
.unsaved.on{display:block}

.btn{font:inherit;color:inherit;border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:48px;min-height:48px;padding:0 18px;border-radius:18px;touch-action:manipulation;position:relative;transition:transform .08s}
.btn svg{width:24px;height:24px;flex:none}
.btn.down{transform:scale(.94)}
.btn.icon{width:52px;height:52px;padding:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7d5cc8,#3d2670);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.25);color:#fff}
.btn.icon svg{width:26px;height:26px}
.btn.hint{background:radial-gradient(circle at 35% 30%,#ffe9a0,#f0a73a 60%,#b86a12);color:var(--ink)}
.btn.hint.used{filter:saturate(.6) brightness(.9)}
.btn.hint .badge{position:absolute;right:-8px;top:-8px;font-style:normal;display:flex;align-items:center;gap:1px;padding:1px 5px 1px 3px;border-radius:10px;background:#2a1c4e;border:2px solid var(--ink);color:#bfe9ff;font-size:12px;font-weight:800;line-height:1}
.btn.hint .badge svg{width:13px;height:13px;stroke-width:2.2}
.btn.hint .badge:empty{display:none}
.btn.hint.open{box-shadow:0 4px 0 var(--ink),0 0 14px rgba(255,214,120,.8),inset 0 2px 0 rgba(255,255,255,.25)}
.btn.hint.open .badge{color:#9dffb0}
.ov.hintask .bigGem{flex:none;width:56px;height:56px;color:#9fe3ff;filter:drop-shadow(0 3px 0 var(--ink))}
.ov.hintask .bigGem svg{width:56px;height:56px}
.ov.hintask .gems{display:flex;gap:6px;justify-content:center;margin:8px 0 2px}
.ov.hintask .gems i{width:28px;height:28px;color:#4a3c66}.ov.hintask .gems i.on{color:#9fe3ff;filter:drop-shadow(0 0 6px rgba(140,220,255,.8))}
.ov.hintask .gems svg{width:28px;height:28px}
.ov.hintask .note{color:#cfe9ff;text-align:center}
.ov.hintask .row .btn{font-size:16px;min-height:52px;padding:0 10px;white-space:nowrap;gap:6px}
.ov.hintask .row .useCrystal{flex:1.25}
.ov.hintask .useCrystal svg{color:#1d6a8a}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.btn small{display:block;font-size:11.5px;font-weight:700;color:#cdbdf2;margin-top:1px}
.btn.remixBtn span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.winStars{display:flex;justify-content:center;gap:6px;margin:-2px 0 4px}
.winStars .ws{width:46px;height:46px;color:#3e2f60;transform:scale(.6);opacity:.6;animation:wsIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
.winStars .ws svg{width:46px;height:46px;stroke:var(--ink);stroke-width:1.5}
.winStars .ws:nth-child(2){transform:translateY(-8px) scale(.6)}
.winStars .ws.on{color:#ffd25a;filter:drop-shadow(0 0 8px rgba(255,200,80,.7))}
@keyframes wsIn{to{transform:scale(1);opacity:1}}
.winStars .ws:nth-child(2).on,.winStars .ws:nth-child(2){animation-name:wsIn2}
@keyframes wsIn2{to{transform:translateY(-8px) scale(1.08);opacity:1}}
.unlock .gemIcon{width:28px;height:28px;color:#9fe3ff;flex:none}.unlock .gemIcon svg{width:28px;height:28px}
.unlock.remixIntro{text-align:left;align-items:flex-start}
.unlock.remixIntro .gemIcon{color:#ffd25a}
.unlock.remixIntro b{display:block;color:#ffd25a;font-size:15px}
.unlock.remixIntro small{display:block;color:#e6dcff;font-size:13px;line-height:1.3}
.btn.lv .mini{display:flex;gap:0;font-style:normal;margin-top:1px}
.btn.lv .mini span{width:13px;height:13px;color:rgba(42,18,6,.35)}.btn.lv .mini span.on{color:#fff6b0}
.btn.lv .mini svg{width:13px;height:13px;stroke:var(--ink);stroke-width:2}
.btn.chapter .stc{font-style:normal;color:#ffd25a}.btn.chapter .stc svg,.ov .head .total svg{width:13px;height:13px;vertical-align:-1px;stroke:none}
.ov .head .total{display:flex;align-items:center;gap:3px;color:#ffd25a;font-weight:800;font-size:15px}
.ov .head .total svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(180deg,#ffb35a,var(--orange) 45%,var(--orange2));color:#2a1206;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.45);font-weight:800;font-size:19px;min-height:56px;padding:0 24px}
.btn.ghost{background:rgba(255,255,255,.08);border:2.5px solid rgba(220,200,255,.45);color:#f2e8ff;font-size:16px}
.btn.ghost.danger{border-color:rgba(255,120,140,.6);color:#ffc2cc}
.btn.locked{opacity:.55}

.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 92px);transform:translate(-50%,10px);max-width:min(92vw,420px);padding:10px 16px;border-radius:16px;background:rgba(20,12,36,.92);border:2px solid rgba(200,170,255,.5);font-size:14.5px;text-align:center;opacity:0;transition:.2s;pointer-events:none;z-index:6}
.toast.on{opacity:1;transform:translate(-50%,0)}
.teach{position:absolute;left:50%;top:calc(var(--boardTop) + 10px);transform:translate(-50%,-6px);width:max-content;max-width:min(88vw,380px);padding:9px 14px;border-radius:14px;background:rgba(255,246,232,.95);color:#3a2350;border:3px solid var(--ink);font-size:14.5px;text-align:center;opacity:0;transition:.25s;pointer-events:none;z-index:4;box-shadow:0 4px 0 var(--ink)}
.teach.on{opacity:1;transform:translate(-50%,0)}
.teach.muted{opacity:0!important}
@media (max-height:420px){.teach{font-size:11px;padding:4px 8px;border-width:2px;box-shadow:0 2px 0 var(--ink);max-width:calc(var(--boardW) + 40px)}.toast{font-size:11px;padding:5px 9px}}
@media (max-height:260px){.teach{display:none}.intro .tagline{display:none}}

.intro{position:absolute;left:var(--boardLeft);top:var(--boardTop);width:var(--boardW);height:calc(var(--boardH) * .21);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:3;transition:opacity .5s}
.intro.on{display:flex}.intro.gone{opacity:0}
.intro .logo{font:400 calc(var(--boardW) * var(--logoFs,.118))/1 var(--disp);color:var(--orange);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink),0 0 18px rgba(255,140,40,.55);letter-spacing:.01em;white-space:nowrap}
.intro .tagline{margin-top:6px;font-size:calc(var(--boardW) * .034);color:#efe4ff;text-shadow:0 2px 0 var(--ink);text-align:center;max-width:78%}
.intro .introHero{position:absolute;right:-6px;top:calc(var(--boardH) * .2);width:calc(var(--boardW) * .3);height:calc(var(--boardW) * .3)}

#layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;background:rgba(10,6,22,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov .card{position:relative;width:min(100%,380px);max-height:100%;overflow:auto;padding:18px 18px 20px;border-radius:26px;background:linear-gradient(170deg,#3b2670,#221545 70%);border:3.5px solid var(--ink);box-shadow:0 8px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.18),0 0 40px rgba(140,90,255,.25);text-align:center;animation:rise .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.ov h2{margin:4px 0 6px;font-size:24px}
.ov h2.big{font:400 40px/1 var(--disp);color:var(--orange);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink),0 0 16px rgba(255,140,40,.5);margin:6px 0 10px}
.ov p{margin:4px 0;color:#e6dcff;font-size:15px}
.ov p.meta{color:#bfaee8;font-size:13px}
.ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ov .col{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ov .col .btn{width:100%}
.ov canvas.hero{display:block;margin:-6px auto -2px}
.ov.win{align-items:flex-start;padding-top:calc(var(--sat) + 58px);background:linear-gradient(180deg,rgba(10,6,22,.55),rgba(10,6,22,0) 70%)}
.ov.win .card{background:linear-gradient(170deg,#4a2a7a,#2a1650 70%);padding:10px 16px 16px}
.ov.win canvas.hero{margin:-14px auto -10px}
.ov.win h2.big{font-size:36px;margin:2px 0 6px}
.ov.win.complete{align-items:center;padding-top:16px;background:rgba(10,6,22,.6)}
.ov.sheet{align-items:flex-end;background:none;padding:0 10px calc(var(--sab) + 10px)}
.ov.sheet,.ov.win{pointer-events:none}.ov.sheet .card,.ov.win .card{pointer-events:auto}
.ov.sheet.top{align-items:flex-start;padding:calc(var(--sat) + 56px) 10px 0}
.ov.sheet .card{width:min(100%,420px);text-align:left;padding:12px 14px 14px;border-radius:24px}
.ov.sheet .sheetHead{display:flex;align-items:center;gap:8px}
.ov.sheet .sheetHead canvas.hero{margin:-10px 0 -10px -6px}
.ov.sheet h3{margin:0 0 3px;font-size:19px}
.ov.fail h3{color:#ffb4c2}
.ov.sheet .cause{color:#fff;font-size:15.5px}
.ov.sheet .row{justify-content:stretch;margin-top:10px}
.ov.sheet .row .btn{flex:1}
.unlock{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px}
.unlock .sw,.styles .btn i{display:inline-block;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink)}
.ov .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ov .head h2{margin:0;flex:1;text-align:left}
.ov.levels .card,.ov.settings .card,.ov.credits .card{width:min(100%,420px);text-align:left}
.chapters{display:flex;flex-direction:column;gap:8px}
.btn.chapter{justify-content:flex-start;text-align:left;gap:12px;padding:8px 12px;background:rgba(255,255,255,.06);border:2.5px solid rgba(220,200,255,.3);border-radius:18px;min-height:64px}
.btn.chapter .chip{flex:none;width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal}
.btn.chapter .chip b{font-size:20px;text-shadow:0 2px 0 var(--ink)}
.btn.chapter span{display:flex;flex-direction:column;gap:1px}
.btn.chapter small{font-size:12px;color:#cdbdf2;font-weight:700}
.btn.chapter em{font-style:normal;font-size:12px;color:#ffcf8a}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.btn.lv{min-width:0;width:100%;aspect-ratio:1;padding:0;border-radius:16px;border:3px solid var(--ink);font-size:18px;flex-direction:column;gap:0}
.btn.lv svg{width:16px;height:16px}
.btn.lv.open{background:linear-gradient(180deg,#fff6e8,#e8d8ff);color:#3a2350;box-shadow:0 3px 0 var(--ink)}
.btn.lv.done{background:linear-gradient(180deg,#ffb35a,var(--orange2));color:#2a1206;box-shadow:0 3px 0 var(--ink)}
.btn.lv.locked{background:rgba(255,255,255,.06);color:#8c7cb4;border-color:rgba(28,18,48,.6)}
.srow{display:flex;align-items:center;gap:10px;min-height:52px}
.srow label,.srow>span{flex:0 0 116px;font-size:15px}
.srow input[type=range]{flex:1;height:44px;accent-color:var(--orange)}
.srow .pct{width:46px;text-align:right;font-size:14px}
.srow.col2{align-items:flex-start;padding-top:8px}
.seg{display:flex;gap:6px}
.seg .btn{min-width:60px;border:2.5px solid var(--violet);background:transparent}
.seg .btn.on{background:var(--violet);color:#fff}
.btn.toggle{min-width:76px;border:2.5px solid rgba(220,200,255,.45);background:rgba(255,255,255,.06)}
.btn.toggle.on{background:var(--mint);color:#08302a;border-color:var(--ink)}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.styles .btn{min-width:46px;width:46px;height:46px;padding:0;border-radius:50%;border:2.5px solid transparent}
.styles .btn.sel{border-color:#fff}
.styles .btn.locked i{opacity:.25}
.note{font-size:13px;color:#ffb0bd}
pre.credits{white-space:pre-wrap;font:600 12px/1.45 var(--ui);color:#e6dcff;max-height:60vh;overflow:auto;background:rgba(0,0,0,.2);padding:10px;border-radius:12px}

/* wide / short frames (the platform 390×219 card, desktop 783×441, landscape phones): controls move to the sides */
body.wide #hud .top{left:0;width:var(--boardLeft);top:6px;height:auto;flex-direction:column;align-items:center;padding:0;gap:6px}
body.wide #hud .bottom{top:60px;bottom:6px;right:0;left:auto;width:var(--boardLeft);height:auto;flex-direction:column;justify-content:flex-start;padding:0;gap:8px}
body.wide #hud .bottom .retry{order:2}
body.wide .lvtitle{align-items:center;text-align:center}
body.wide .lvtitle .lvnum{font-size:14px}.body.wide .lvtitle .lvch{display:none}
body.wide .lvtitle .lvch{display:none}
body.wide .spells{flex-direction:column;padding:6px;gap:4px;font-size:0}
body.wide .spells b{display:none}
body.wide .spells .srow2{flex-direction:column;gap:4px}
body.wide .vial{width:13px;height:96px;margin:4px auto 0}
body.wide .vial .fill{top:auto;width:auto;right:0;height:calc(var(--left,1) * 100%)}
body.wide .vial .mk{left:-3px!important;right:-3px;top:auto;bottom:auto;width:auto;height:2.5px;margin:0 0 -1.25px}
body.wide .vial .m3{bottom:calc(var(--m3,1) * 100%)}body.wide .vial .m2{bottom:calc(var(--m2,1) * 100%)}
body.wide .vial .st{top:auto;left:auto!important;right:-17px;margin:0 0 -7px;width:13px;height:13px}
body.wide .vial .st svg{width:13px;height:13px}
body.wide .vial .s1{bottom:4px}body.wide .vial .s2{bottom:calc(var(--m2,1) * 100%)}body.wide .vial .s3{bottom:calc(var(--m3,1) * 100%)}
@media (max-height:300px){body.wide .vial{height:40px;margin-top:2px}body.wide .spells{padding:4px;gap:3px}body.wide .spells .dots i{width:10px;height:10px}body.wide .spells .srow2{gap:2px}}
body.wide .btn.icon{width:46px;height:46px}
body.wide .cancelzone{left:auto;right:4px;bottom:auto;top:calc(50% - 24px);transform:none;padding:8px}
body.wide .cancelzone em{display:none}
body.wide .toast{bottom:8px}
@media (max-height:300px){body.wide .btn.icon{width:40px;height:40px;min-width:40px;min-height:40px}body.wide .btn.icon svg{width:20px;height:20px}body.wide #hud .bottom{top:46px}.ov .card{transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.ov .card{animation:none}.spells.pop{animation:none}}
</style>
