  --ui:'Nunito','Trebuchet MS',system-ui,sans-serif; --logo:'Pacifico','Nunito',cursive;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#FFD9C2;color:var(--ink);font-family:var(--ui);font-weight:800;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;height:100vh;height:100dvh}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui *{pointer-events:auto}
#ui .pass,#ui .pass *,#ui .hint,#ui .toast,#ui .banner,#ui .strip .lbl,#ui .strip .arr,#ui .strip .track,#ui .strip .mid,#ui .strip .knob{pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{min-height:48px;min-width:48px;padding:0 18px;border:3px solid var(--ink);border-radius:18px;background:var(--cream);
  box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:18px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .06s ease, box-shadow .06s ease;position:relative}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled],.btn.off{filter:saturate(.25) brightness(1.05);opacity:.75}
.btn.orange{background:linear-gradient(#FFB15C,var(--apricot) 55%,var(--apricotD));color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.btn.mint{background:linear-gradient(#6FE6C4,var(--mint) 55%,var(--mintD));color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.btn.blue{background:linear-gradient(#8DB6FF,var(--blue) 55%,var(--blueD));color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.btn.pink{background:linear-gradient(#FFC6D6,var(--pink));}
.btn .gloss{position:absolute;left:10%;right:10%;top:4px;height:30%;border-radius:12px;background:rgba(255,255,255,.35);pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:26px;height:26px}

/* ---------- workshop ---------- */
.ws{position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:560px;display:flex;flex-direction:column;padding:calc(8px + var(--safeT)) 12px calc(10px + var(--safeB));gap:8px;pointer-events:none}
.ws>*{pointer-events:auto}
.topbar{display:flex;align-items:center;gap:8px;min-height:48px}
.topbar .grow{flex:1}
.pill{height:40px;padding:0 12px 0 6px;border:3px solid var(--ink);border-radius:22px;background:var(--cream);display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2B8,var(--gold) 45%,#C9820B);border:2.5px solid var(--ink);display:inline-block;box-shadow:inset 0 0 0 3px rgba(160,95,10,.35)}
.rankchip{white-space:nowrap;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border:3px solid var(--ink);border-radius:22px;background:var(--cream);box-shadow:0 3px 0 var(--ink);font-weight:900}
.rankchip .bar{width:62px;height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.rankchip .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#8DB6FF);width:0}
.rival{display:flex;gap:10px;align-items:stretch;min-height:92px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:6px 10px 6px 6px;box-shadow:0 4px 0 var(--ink);position:relative;transform:rotate(-1deg)}
.rival::before{content:"";position:absolute;top:-10px;left:72px;width:64px;height:18px;margin-left:-32px;background:rgba(255,158,187,.75);border:2px solid rgba(74,43,31,.35);transform:rotate(3deg)}
.rival canvas{width:132px;height:80px;flex:0 0 132px;background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(122,67,48,.1) 13px 14px),repeating-linear-gradient(90deg,transparent 0 13px,rgba(122,67,48,.1) 13px 14px),#FFFDF8;border-radius:10px;border:2px solid rgba(74,43,31,.3)}
.rival .txt{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:2px}
.rival .txt>*{flex-shrink:0}
.rival .tag{font-size:12px;font-weight:900;letter-spacing:.08em;display:flex;gap:6px;flex-wrap:wrap}
.rival .tag b{background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px}
.rival .tag b.boss{background:var(--apricot)}
.rival .name{font-family:var(--logo);font-weight:400;font-size:22px;line-height:1.15;color:var(--redD);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rival .note{font-size:13px;line-height:1.2;opacity:.85}
.rival .rk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900}
.rival .rk .bar{width:70px;height:10px;border:2.5px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden}
.rival .rk .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#8DB6FF)}
.matbox{flex:1;position:relative;min-height:150px}
#mat{position:absolute;inset:0;touch-action:none}
.hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);max-width:92%;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:15px;font-weight:900;text-align:center;box-shadow:0 3px 0 var(--ink);pointer-events:none;line-height:1.2}
.hint::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.inkrow{display:flex;align-items:center;gap:8px}
.ink{flex:1;height:30px;border:3px solid var(--ink);border-radius:16px;background:#fff;position:relative;overflow:hidden;display:flex;align-items:center}
.ink i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#9DC0FF,var(--blue));transition:width .12s}
.ink i::after{content:"";position:absolute;left:6px;right:6px;top:4px;height:6px;border-radius:4px;background:rgba(255,255,255,.45)}
.ink span{position:relative;margin:auto;font-weight:900;font-size:14px;letter-spacing:.12em;color:var(--ink);text-shadow:0 1px 0 #fff}
.ink.empty{animation:shake .35s}
.ink.empty span{color:var(--redD)}
.bag{width:36px;height:44px;flex:0 0 36px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.conn{font-size:14px;font-weight:900;text-align:right;min-height:18px}
.conn.warn{color:var(--apricotD)}
.shelf{display:flex;gap:8px}
.tile{flex:1;min-height:60px;border:3px solid var(--ink);border-radius:14px;background:var(--cream);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;position:relative}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile .ic{width:22px;height:22px}
.tile .nm{font-size:14px;font-weight:900;line-height:1}
.tile .pr{font-size:13px;display:flex;align-items:center;gap:3px;font-weight:900}
.tile .pr .coin{width:15px;height:15px;border-width:2px}
.tile .pips{display:flex;gap:2px}
.tile .pips i{width:6px;height:6px;border-radius:2px;background:rgba(74,43,31,.18)}
.tile .pips i.on{background:var(--blue)}
.tile.can{background:linear-gradient(#FFFFFF,#E6FFF6)}
.tile.can::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--mint);border:2.5px solid var(--ink)}
.tile.look{flex:0 0 64px}
.fightrow{display:flex;gap:8px}
.fight{flex:1;min-height:64px;font-size:30px;border-radius:22px}
.fight svg{width:30px;height:30px}

/* ---------- battle HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none}
.hud .top{position:absolute;left:0;right:0;top:calc(6px + var(--safeT));display:flex;align-items:center;gap:8px;padding:0 10px}
.hud .top>*{pointer-events:auto}
.hpbar{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hpbar .nm{max-width:100%;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
.hpbar .b{width:100%;height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.hpbar .b i{display:block;height:100%;transition:width .2s}
.hpbar.p .b i{background:linear-gradient(#9DC0FF,var(--blue))}
.hpbar.r{align-items:flex-end;text-align:right}
.hpbar.r .b i{background:linear-gradient(#FFB3C2,var(--red));margin-left:auto}
.vs{font-family:var(--logo);font-weight:400;font-size:20px;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.strip{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--safeB));height:96px;border:3px solid var(--ink);border-radius:30px;
  background:linear-gradient(rgba(255,249,240,.92),rgba(255,236,220,.92));box-shadow:0 4px 0 var(--ink);pointer-events:auto;touch-action:none}
.strip .track{position:absolute;left:28px;right:28px;top:50%;height:14px;margin-top:-7px;border-radius:8px;background:rgba(74,43,31,.15)}
.strip .mid{position:absolute;left:50%;top:18px;bottom:18px;width:3px;margin-left:-1.5px;background:rgba(74,43,31,.25);border-radius:2px}
.strip .knob{position:absolute;top:50%;left:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#fff,#9DC0FF 40%,var(--blue) 70%,var(--blueD));box-shadow:0 3px 0 var(--ink);transition:left .08s}
.strip.held .knob{transition:none}
.strip .arr{position:absolute;top:50%;margin-top:-14px;font-size:22px;font-weight:900;opacity:.55}
.strip .arr.l{left:18px}.strip .arr.r{right:18px}
.strip .lbl{position:absolute;left:0;right:0;top:-30px;text-align:center;font-size:15px;font-weight:900;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff;pointer-events:none}
.stallbox{position:absolute;left:50%;top:calc(70px + var(--safeT));transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 8px 6px 14px;box-shadow:0 3px 0 var(--ink);pointer-events:auto;font-weight:900}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--logo);font-weight:400;font-size:56px;color:#fff;
  text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink);pointer-events:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.banner.boss{color:var(--apricot)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- sheets / modals ---------- */
.shade{position:absolute;inset:0;background:rgba(74,43,31,.45);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;animation:fade .2s}
.shade.center{align-items:center}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:92%;overflow:auto;background:var(--cream);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 16px calc(16px + var(--safeB));position:relative;animation:rise .25s cubic-bezier(.2,1.2,.4,1)}
.shade.center .sheet{border-radius:24px;border-bottom:3px solid var(--ink);width:min(420px,94%)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:-12px;height:14px;background:radial-gradient(circle at 10px 14px,var(--pink) 9px,transparent 10px) 0 0/20px 14px repeat-x}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 10px;font-family:var(--logo);font-weight:400;font-size:30px;text-align:center;line-height:1.3}
.sheet h2.win{color:var(--mintD)}.sheet h2.loss{color:var(--redD)}.sheet h2.draw{color:var(--apricotD)}
.sheet p{margin:6px 0;font-size:16px;line-height:1.3;text-align:center}
.sheet .row{display:flex;gap:10px;margin-top:12px}
.sheet .row .btn{flex:1}
.cause{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:16px;font-weight:900;text-align:center}
.facts{font-size:14px;opacity:.85;margin-top:4px;text-align:center}
.reward{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px;font-weight:900;margin:8px 0}
.reward .coin{width:34px;height:34px}
.prog{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:900}
.prog .b{width:180px;height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.prog .b i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#8DB6FF);transition:width .8s}
.rankup{font-family:var(--logo);font-weight:400;font-size:34px;color:var(--apricot);text-align:center;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.list{display:flex;flex-direction:column;gap:8px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.ladder button{min-height:48px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:900;font-size:16px;position:relative}
.ladder button.done{background:#E6FFF6}
.ladder button.cur{background:linear-gradient(#FFB15C,var(--apricot));color:#fff;text-shadow:0 1px 0 var(--ink)}
.ladder button.boss{border-radius:50%}
.ladder button[disabled]{opacity:.4}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-height:44px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:900}
.tabs button[aria-selected=true]{background:var(--blue);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.item{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:120px}
.item canvas{width:72px;height:72px}
.item.sel{outline:4px solid var(--mint);outline-offset:-1px}
.item .nm{font-size:12px;text-align:center;line-height:1.1}
.item .pr{font-size:13px;display:flex;align-items:center;gap:3px}
.item .pr .coin{width:14px;height:14px;border-width:2px}
.note{font-size:13px;opacity:.8;text-align:center;margin-top:8px}
.settings-wrap .gt-settings{background:transparent;padding:0;max-width:none;font-family:var(--ui);color:var(--ink)}
.settings-wrap .gt-settings h2{display:none}
.settings-wrap .gt-row label,.settings-wrap .gt-row>span{font-weight:900}
.settings-wrap .gt-seg button{border:3px solid var(--ink);border-radius:10px;margin-left:4px;color:var(--ink)}
.settings-wrap .gt-seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.settings-wrap input[type=range]{accent-color:var(--blue)}
.toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:900;pointer-events:none;animation:fade .2s;max-width:90%;text-align:center}
.logo{font-family:var(--logo);font-weight:400;font-size:26px;line-height:1;color:#fff;margin:0;text-shadow:0 3px 0 var(--blueD),2px 0 0 var(--blueD),-2px 0 0 var(--blueD),0 -2px 0 var(--blueD),0 5px 0 var(--ink);white-space:nowrap}
.credits{font-size:13px;line-height:1.4;text-align:left;white-space:pre-wrap;background:#fff;border:2px solid rgba(74,43,31,.3);border-radius:12px;padding:8px;max-height:40vh;overflow:auto;font-weight:700}
.big-preview{width:100%;height:220px;border-radius:14px;border:3px solid var(--ink);background:#FFFDF8}
.pausebig{display:flex;flex-direction:column;gap:10px}
.pausebig .btn{width:100%}

/* ---------- wide (landscape / the platform card) ---------- */
.wide .ws{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto auto 1fr auto;column-gap:10px;row-gap:6px;padding:6px 8px}
.wide .ws .matbox{grid-column:1;grid-row:1/7;aspect-ratio:8.4/7.8;height:calc(100vh - 12px - var(--safeT) - var(--safeB));min-height:0;max-width:62vw}
.wide .ws{height:100%;overflow:hidden}
.wide .ws .topbar,.wide .ws .rival,.wide .ws .inkrow,.wide .ws .conn,.wide .ws .shelf,.wide .ws .fightrow{grid-column:2}
.wide .rival{min-height:92px}.wide .rival canvas{width:100px;height:62px;flex-basis:100px}
.wide .fight{min-height:52px;font-size:24px}
.wide .strip{height:76px;left:20%;right:20%}
.wide .strip .knob{width:54px;height:54px;margin:-27px 0 0 -27px}
.tiny .rival,.tiny .shelf,.tiny .conn,.tiny .logo,.tiny .bag{display:none}
.tiny .pill{padding:0 8px 0 4px;font-size:15px}.tiny .topbar{gap:4px}
.tiny .hint{font-size:11px;padding:3px 6px;border-width:2px}
.tiny .rival{min-height:48px;padding:3px}.tiny .rival canvas{display:none}
.tiny .rival .name{font-size:16px}
.tiny .tile{min-height:44px}.tiny .tile .nm{display:none}
.tiny .ws{row-gap:4px}.tiny .pill,.tiny .rankchip{height:34px}
.tiny .fight{min-height:46px;font-size:20px}
.tiny .strip{height:58px;bottom:6px}.tiny .strip .knob{width:46px;height:46px;margin:-23px 0 0 -23px}.tiny .strip .lbl{display:none}
.tiny .hud .top{top:2px}.tiny .hpbar .nm{font-size:11px}.tiny .hpbar .b{height:12px}
.tiny .icon-btn{width:44px;height:44px}

/* ---------- v2: move parts, weapon chip, parts card, coach marks ---------- */
.modeseg{display:flex;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 3px 0 var(--ink);flex:0 0 auto;background:var(--cream)}
.modeseg button{width:46px;height:44px;display:grid;place-items:center;background:var(--cream)}
.modeseg button+button{border-left:3px solid var(--ink)}
.modeseg button.on{background:linear-gradient(#BCD4FF,#8DB6FF)}
.modeseg svg{width:25px;height:25px}
.resetparts{position:absolute;right:8px;top:8px;min-height:44px;font-size:14px;padding:0 12px;gap:4px}
.resetparts span svg{width:20px;height:20px;display:block}
.connrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.chip{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 12px 0 4px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;font-weight:900;font-size:14px;box-shadow:0 2px 0 var(--ink);white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.chip svg{width:24px;height:24px;flex:0 0 24px}
#mat.arrange{cursor:grab}
.hint.moving{display:none}
.parts .part{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;margin:8px 0;text-align:left}
.parts .part b{font-size:18px}
.traits{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;align-items:center;margin:6px 0;font-size:14px}
.dots{display:flex;gap:3px}
.dots i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.on{background:var(--blue)}
.parts p{margin:4px 0 0;text-align:left;font-size:14px}
.howto p{text-align:left;font-size:16px;margin:8px 0}
.coach{position:fixed;inset:0;pointer-events:none;z-index:50}
.coach.hidden{display:none}
.coach-ring{position:absolute;border:4px solid #fff;border-radius:22px;box-shadow:0 0 0 4px rgba(34,194,154,.95),0 0 26px rgba(34,194,154,.8);animation:ringpulse 1.1s ease-in-out infinite}
@keyframes ringpulse{50%{transform:scale(1.05);opacity:.75}}
.coach-hand{position:absolute;width:40px;height:48px;filter:drop-shadow(0 3px 0 rgba(74,43,31,.45))}
.coach-hand svg{width:40px;height:48px}
.coach-bubble{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px 8px;box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:16px;line-height:1.28;pointer-events:none;color:var(--ink)}
.coach-skip{pointer-events:auto;display:block;margin:6px 0 0 auto;font-size:13px;font-weight:800;opacity:.7;text-decoration:underline;min-height:30px;padding:0 4px}
.coach.tiny .coach-bubble{font-size:12px;line-height:1.2;padding:4px 8px;border-width:2px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}
.coach.tiny .coach-skip{display:inline-block;margin:0 0 0 6px;min-height:24px;font-size:11px;padding:0 2px;vertical-align:middle}.coach.tiny .coach-hand,.coach.tiny .coach-hand svg{width:28px;height:34px}

/* ---------- v2 responsive: landscape / desktop ---------- */
.wide .ws{display:grid;max-width:none;grid-template-columns:auto 340px;grid-template-rows:auto auto auto auto auto 1fr auto;justify-content:center;align-content:stretch;column-gap:16px;row-gap:8px;padding:8px 12px}
.wide .ws .matbox{grid-column:1;grid-row:1/8;aspect-ratio:8.4/7.8;height:calc(100dvh - 16px - var(--safeT) - var(--safeB));width:auto;max-width:calc(100vw - 390px);min-height:0}
.wide .ws .topbar{grid-column:2;grid-row:1}.wide .ws .rival{grid-column:2;grid-row:2}.wide .ws .inkrow{grid-column:2;grid-row:3}
.wide .ws .connrow{grid-column:2;grid-row:4}.wide .ws .shelf{grid-column:2;grid-row:5;align-self:start}.wide .ws .fightrow{grid-column:2;grid-row:7;align-self:end}
.wide .tile{min-height:66px;max-height:86px}
.wide .fight{min-height:58px;font-size:26px}
.wide .strip{left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 24px))}
.hud .top{max-width:980px;margin:0 auto}
.strip{max-width:620px;margin:0 auto}
@media (min-width:1100px) and (min-height:700px){ .wide .ws{grid-template-columns:auto 380px;column-gap:24px;padding:16px 24px} .wide .ws .matbox{height:calc(100dvh - 32px);max-width:calc(100vw - 460px)} }
.short .ws{row-gap:5px;padding:6px 10px}.short .ws .matbox{height:calc(100dvh - 12px - var(--safeT) - var(--safeB))}

.short .tile{min-height:50px;max-height:58px}.short .fight{min-height:46px;font-size:22px}
.short .icon-btn{width:44px;height:44px}.short .modeseg button{height:44px}.short .pill,.short .rankchip{height:38px}
.tiny .ws{grid-template-columns:auto 1fr;grid-template-rows:auto auto auto 1fr auto}
.tiny .ws .matbox{grid-row:1/6;height:calc(100dvh - 12px);max-width:58vw}
.tiny .ws .inkrow{grid-row:2}.tiny .ws .connrow{display:none}.tiny .ws .fightrow{grid-row:5}
.tiny .modeseg button{width:38px;height:40px}</style>
