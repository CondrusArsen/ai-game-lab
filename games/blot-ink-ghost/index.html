:root{
  --void:#07080c; --gloom:#121a2b; --gloom2:#2a3654; --cold:#4a6a9a; --lamp:#ffd9a0; --spot:#fff0d6;
  --accent:#e0412f; --paper:#f1ece0; --dim:rgba(241,236,224,.55); --faint:rgba(241,236,224,.22);
  --f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif; --fd:'Yeseva One','Jost',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--void);color:var(--paper);font-family:var(--f);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:1px solid var(--lamp);outline-offset:3px}
.hidden{display:none!important}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;font-size:13px;letter-spacing:.04em}
#hud > *{pointer-events:auto}
.meter{min-width:0}
.meter .lab{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.meter .lab b{color:var(--paper);font-weight:500;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.bar{position:relative;height:3px;width:min(150px,32vw);margin-top:6px}
.bar:before{content:"";position:absolute;left:0;right:0;top:1px;height:1px;background:var(--faint)}
.bar i{position:absolute;left:0;top:0;height:3px;background:var(--paper);transition:width .15s}
#ink .bar i{background:var(--cold)} #ink.low .bar i{background:var(--accent)}
#mid{text-align:center}
#mid .t{font-size:11px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
#mid .c{font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
#right{justify-self:end;display:flex;gap:12px;align-items:start}
#right .cnt{text-align:right}
.ib{width:44px;height:44px;display:grid;place-items:center;margin-top:-8px}
.ib svg{width:22px;height:22px;stroke:var(--paper);fill:none;stroke-width:1.4}
#combo{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:15px;letter-spacing:.2em;color:var(--lamp);pointer-events:none;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:14px;color:var(--paper);pointer-events:none;text-align:center;max-width:90vw;opacity:0;transition:opacity .3s;background:rgba(7,8,12,.6);padding:4px 10px}
#toast.on{opacity:1}

/* ---------- кнопки действий ---------- */
#actions{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:10px;flex-wrap:wrap;pointer-events:none}
.act{pointer-events:auto;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);transition:color .15s,transform .1s}
.act .o{width:58px;height:58px;border-radius:50%;border:1px solid var(--faint);display:grid;place-items:center;position:relative;background:rgba(7,8,12,.55)}
.act svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.act .n{font-size:12px;letter-spacing:.06em;text-align:center;line-height:1.1}
.act .k{position:absolute;right:-2px;top:-4px;font-size:10px;color:var(--dim)}
.act .cost{position:absolute;left:-4px;bottom:-2px;font-size:11px;color:var(--cold);font-variant-numeric:tabular-nums}
.act.ready{color:var(--lamp)} .act.ready .o{border-color:var(--lamp)}
.act.ready.pulse .o{animation:pulse 1.2s ease-in-out infinite}
.act.low .cost{color:var(--accent)}
.act.none{color:var(--dim)} .act.none .o{border-color:var(--faint);border-style:dashed}
.act:active{transform:scale(.94)}
.act .cd{position:absolute;inset:-1px;border-radius:50%}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,217,160,.0)}50%{box-shadow:0 0 0 6px rgba(255,217,160,.18)}}

/* ---------- экраны ---------- */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:rgba(7,8,12,.78);overflow-y:auto;touch-action:pan-y;z-index:10}
.scr.solid{background:var(--void)}
.scr .inner{width:min(560px,100%);margin-block:auto;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
.scr h1{font-family:var(--fd);font-weight:400;font-size:clamp(48px,13vw,92px);margin:0;letter-spacing:.02em;line-height:1}
.scr h2{font-family:var(--fd);font-weight:400;font-size:clamp(26px,6vw,36px);margin:0;line-height:1.1;text-wrap:balance}
.scr h3{font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0}
.scr p{margin:0;font-size:16px;line-height:1.55;font-weight:300;max-width:62ch}
.sub{color:var(--dim);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:12px;min-height:46px;font-size:18px;font-weight:300;text-align:left;color:var(--paper);padding:0 2px}
.li .num{width:22px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.li:hover,.li:focus-visible{color:var(--lamp)}
.li:hover span:last-child:before,.li:focus-visible span:last-child:before{content:"— "}
.li.dis{color:var(--faint);pointer-events:none}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:0 18px;border:1px solid var(--faint);font-size:16px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px}
.btn.main{border-color:var(--lamp);color:var(--lamp)}
.btn:hover{border-color:var(--paper)}
.line{height:1px;background:var(--faint)}
.night{display:flex;flex-direction:column;gap:6px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.lv{min-height:64px;text-align:left;padding:8px 10px;border-left:1px solid var(--faint);display:flex;flex-direction:column;gap:3px}
.lv .a{font-size:11px;color:var(--dim);letter-spacing:.12em}
.lv .b{font-size:16px}
.lv .s{font-size:12px;color:var(--lamp);letter-spacing:.2em}
.lv:hover{border-color:var(--lamp)} .lv.lock{opacity:.35;pointer-events:none}
.lv.cur{border-color:var(--lamp)}
.set{display:grid;grid-template-columns:120px 1fr;gap:14px 16px;align-items:center}
.set label{color:var(--dim);font-size:14px}
.seg{display:flex;gap:16px}
.seg button{min-height:44px;font-size:16px;color:var(--dim)} .seg button.on{color:var(--lamp)}
.seg button.on:before{content:"— "}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--faint)}
input[type=range]::-moz-range-track{height:1px;background:var(--faint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--lamp);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--lamp);border:0}
.confirm{border-left:1px solid var(--accent);padding:8px 12px;display:flex;flex-direction:column;gap:10px}
.ups{display:flex;flex-direction:column;gap:14px}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.up .nm{font-size:17px} .up .ds{grid-column:1;color:var(--dim);font-size:13px}
.up .pips{display:flex;gap:4px;margin-top:4px} .up .pips i{width:18px;height:3px;background:var(--faint)} .up .pips i.on{background:var(--lamp)}
.up .bt{grid-row:1/4;grid-column:2}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pg{min-height:96px;text-align:left;padding:10px;border:1px solid var(--faint);font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.pg b{color:var(--paper);font-weight:500;font-size:14px}
.pg.on:hover{border-color:var(--lamp)}
.stars{display:flex;flex-direction:column;gap:8px}
.st{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--dim)} .st i{width:14px;height:14px;border:1px solid var(--faint);transform:rotate(45deg)} .st.on{color:var(--paper)} .st.on i{background:var(--lamp);border-color:var(--lamp)}
.paper{background:#e8dfc8;color:#1a1410;padding:18px 18px 16px;font-family:var(--fd);display:flex;flex-direction:column;gap:8px;transform:rotate(-1deg)}
.paper .mast{font-size:13px;letter-spacing:.3em;text-transform:uppercase;border-bottom:2px solid #1a1410;padding-bottom:6px;text-align:center}
.paper .hl{font-size:clamp(20px,5vw,28px);line-height:1.05}
.paper .bd{font-family:var(--f);font-size:14px;line-height:1.45}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--faint);display:flex;flex-direction:column;gap:4px}
.opt b{font-weight:500;font-size:17px} .opt span{color:var(--dim);font-size:14px}
.opt:hover{border-color:var(--lamp)} .opt:hover b{color:var(--lamp)}
.guide{display:flex;flex-direction:column;gap:12px}
.gi b{display:block;font-weight:500;font-size:16px;margin-bottom:2px} .gi span{color:var(--dim);font-size:14px;line-height:1.45}
.plan{border-left:1px solid var(--faint);padding-left:12px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--dim)}
.plan b{color:var(--paper);font-weight:400}
.hintc{color:var(--dim);font-size:13px;letter-spacing:.06em}

/* ---------- обучение ---------- */
#tut{position:fixed;inset:0;pointer-events:none;z-index:8}
#tut .spot{position:fixed;border-radius:50%;box-shadow:0 0 0 200vmax rgba(3,4,8,.5);border:1px solid var(--lamp);transition:all .25s ease-out}
#tut .spot.pulse{animation:spot 1.4s ease-in-out infinite}
@keyframes spot{0%,100%{outline:0 solid rgba(255,217,160,.0)}50%{outline:8px solid rgba(255,217,160,.15)}}
#tut svg{position:fixed;inset:0;width:100%;height:100%;overflow:visible}
#tut .panel{position:fixed;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 28px));padding:14px 16px;background:rgba(7,8,12,.92);border-top:1px solid var(--lamp);pointer-events:auto;display:flex;flex-direction:column;gap:10px}
#tut .panel p{margin:0;font-size:16px;line-height:1.5;font-weight:300}
#tut .panel .h{color:var(--accent);font-size:14px}
#tut .panel .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
#tut .panel .skip{color:var(--dim);font-size:13px;min-height:40px}
#tut .panel .go{color:var(--lamp);min-height:44px;font-size:16px;padding:0 6px}
@media (max-width:520px){
  .act{width:64px}.act .o{width:52px;height:52px}.act .n{font-size:11px}
  #hud{font-size:12px} .scr p{font-size:15px}
  .act .k{display:none} #mid .t{display:none} #mid .c{margin-top:0;font-size:16px} #cnt .lab span{display:none} #cnt .lab:before{content:"";width:9px;height:12px;border-radius:5px 5px 2px 2px;background:var(--dim);align-self:center} #right{gap:4px} .bar{width:28vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scr p.hint{font-size:13px;color:var(--dim);line-height:1.45}
.hdesc{font-size:13px;color:var(--dim);line-height:1.45;margin-bottom:2px}
.crew{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--faint);padding-left:12px}
.cm{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:15px}
.cm b{font-weight:500;color:var(--paper);min-width:7ch}
.cm span{color:var(--dim);font-size:14px}
.cm i{font-style:normal;font-weight:500;letter-spacing:.04em}
.scr p.mod{font-size:14px;color:var(--lamp);border:1px solid rgba(255,217,160,.35);padding:8px 12px}
.scr p.mod b{font-weight:600}
.lb{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--dim)}
.lb .me{color:var(--lamp)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--faint);padding:8px;font-size:12px;color:var(--dim);line-height:1.35}
.card canvas{width:100%;height:auto;aspect-ratio:4/3;display:block}
.card b{color:var(--paper);font-weight:500;font-size:14px;line-height:1.25}
.card.on{border-color:rgba(255,217,160,.45)}
.up.lockd .nm{color:var(--dim)}
.ups h3{margin-top:6px}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,1fr)}}

eone who lives in the shadows and guards the house but never hurts anyone. Only scares. A little."]},{ru:["Страница 4. Гроза","Ночью ударила гроза, погас свет, я задел чернильницу. Клякса легла прямо на набросок. Утром лист был пуст. А на полу был след."],en:["Page 4. The storm","A storm hit at night, the lights went out, I knocked the inkwell over. The blot landed right on the sketch. In the morning the page was blank. And there was a trail on the floor."]},{ru:["Страница 5. Вывеска","Миссис Розвуд попросила новую вывеску для гостиницы. Я писал её этими же чернилами. Вечером вывеска мне подмигнула."],en:["Page 5. The sign","Mrs. Rosewood asked me for a new sign for the inn. I painted it with this same ink. That evening the sign winked at me."]},{ru:["Страница 6. Мы","Сегодня на стене было написано «МЫ ЗДЕСЬ». Моим почерком. Оно учится у меня. Я ответил: «Я тоже». «Мы» — хорошее слово."],en:["Page 6. We",'Today the wall said "WE ARE HERE". In my handwriting. It learns from me. I answered: "So am I." We is a good word.']},{ru:["Страница 7. Свет","Оно боится света: тушь сохнет. Я больше не включаю верхний свет. Гас ворчит, что проводка ржавеет без дела. Пусть."],en:["Page 7. Light","It fears light: ink dries. I no longer use the ceiling lights. Gus grumbles that the wiring rusts from disuse. Let it."]},{ru:["Страница 8. Афиши","Нарисовал афиши для «Бижу». Директор смеётся: на премьере у кого-то с афиши шевелились усы. Я тоже смеюсь, но знаю, чьи это шутки."],en:["Page 8. Posters","I drew posters for the Bijou. The manager laughs: at the premiere someone's moustache on the poster twitched. I laugh too, but I know whose joke it is."]},{ru:["Страница 9. Письмо","Пришло письмо от Виктора Глэра. Он скупает весь квартал под торговый центр «Санни-Плаза», где свет не гаснет никогда. Я отказал."],en:["Page 9. A letter","A letter from Victor Glare. He is buying the whole street for the Sunnyside Plaza mall, where the lights never go out. I said no."]},{ru:["Страница 10. Инструкция","Если ты это читаешь, клякса: не обижай людей. Пугай. От страха люди уходят, а от обиды возвращаются с прожекторами."],en:["Page 10. Instructions","If you are reading this, blot: do not hurt people. Scare them. People leave out of fear; out of hurt they come back with floodlights."]},{ru:["Страница 11. Сердце","Руки дрожат, линия не держится. Врач говорит — в «Сансет-Пайнс», на Линден-стрит. Кто будет гасить здесь свет?"],en:["Page 11. Heart","My hands shake; the line won't hold. The doctor says Sunset Pines, on Linden Street. Who will turn off the lights here?"]},{ru:["Страница 12. Последняя","Я вернусь. Дождись. Дом — это не стены. Дом — это тот, кто тебя ждёт."],en:["Page 12. The last one","I will come back. Wait for me. A home is not walls. A home is whoever waits for you."]}],o.NEWS={1:{ru:["СТАЖЁР ВЫБЕЖАЛ ИЗ ДОМА №7","Пит Таннер уверяет, что часы «смотрели на него». Начальство отправит старшего инспектора."],en:["CITY INTERN FLEES HOUSE No. 7",'Pete Tanner insists the clock "was looking at him". His bosses are sending a senior inspector.']},2:{ru:["«ЭТО СКВОЗНЯК», — ЗАЯВИЛА М. ХЕЙЛ","…и покинула дом бегом. Назначена повторная проверка при полном свете."],en:[`"IT'S A DRAFT," SAYS M. HALE`,"…and left the house at a run. A re-inspection with full lighting is ordered."]},3:{ru:["ЛАМПЫ ГАСНУТ САМИ","Инспекторы винят проводку. Застройщик Виктор Глэр обещает «разобраться к зиме»."],en:["LAMPS GO OUT BY THEMSELVES",'Inspectors blame the wiring. Developer Victor Glare promises to "sort it out by winter".']},4:{ru:["НАДПИСЬ НА ЧЕРДАКЕ: «УХОДИТЕ»","Соседи говорят, что почерк похож на почерк хозяина, художника Артура Пенрайта."],en:['WRITING IN THE ATTIC: "GET OUT"',"Neighbours say the handwriting looks like the owner's, the artist Arthur Penwright."]},6:{ru:["ДОМ №7 ОСТАВИЛИ В ПОКОЕ","Глэр переключился на соседей: куплена гостиница «Розвуд». «Там хотя бы нормальная проводка», — сказал он."],en:["HOUSE No. 7 LEFT ALONE",'Glare has turned to the neighbours: he bought the Rosewood Inn. "At least the wiring is normal there," he said.']},7:{ru:["ЭЛЕКТРИК ПРОТИВ ТЬМЫ","Гас Ковальски обещает «дать свет — и призраков не будет»."],en:["ELECTRICIAN VS DARKNESS",'Gus Kowalski promises "give it light and there will be no ghosts".']},8:{ru:["КТО КАПАЕТ НА ФОНАРИ?","Проверяющие выходят с перемазанными руками. Химчистки города в восторге."],en:["WHO DRIPS ON FLASHLIGHTS?","Inspectors leave with ink-stained hands. The town's dry cleaners are delighted."]},10:{ru:["ГОСТИНИЦА, ГДЕ ПОЮТ ТРУБЫ","Сантехники отказываются от вызова. Телешоу «Охота на призраков» уже едет."],en:["THE INN WHERE PIPES SING","Plumbers refuse the call. The TV show Ghost Hunt Live is on its way."]},12:{ru:["«РОЗВУД» ПРИЗНАН ПРИГОДНЫМ","Глэр пообещал «осветить» театр «Бижу» и позвал телевидение."],en:["ROSEWOOD INN DECLARED SOUND",'Glare vowed to "shed light" on the Bijou Theater and called in the TV crew.']},13:{ru:["ЭФИР ПРЕРВАН В ПРЯМОМ ЭФИРЕ","Ведущий Чед Брайт выбежал из кадра. Рейтинги шоу выросли вдвое."],en:["BROADCAST CUT LIVE ON AIR","Host Chad Bright ran out of frame. The show's ratings doubled."]},14:{ru:["ПЁС ПО КЛИЧКЕ БИСКВИТ","Собака шоу вышла из театра одна. Ведущий уверяет, что она «с кем-то подружилась»."],en:["A DOG CALLED BISCUIT",`The show's dog came out of the theater alone. The host claims it "made a friend".`]},16:{ru:["ТЕНЬ ВО ВСЮ СТЕНУ","Кадры из «Бижу» набрали миллион просмотров. Город пригласил учёных."],en:["A SHADOW THE SIZE OF A WALL","Footage from the Bijou got a million views. The town invited scientists."]},18:{ru:["ТЕАТР СПАСЁН ЗРИТЕЛЯМИ","Билеты на «спектакль с привидением» раскуплены на год вперёд. Глэр едет в библиотеку."],en:["THEATER SAVED BY ITS AUDIENCE",'Tickets for "the haunted show" are sold out for a year. Glare is heading to the library.']},19:{ru:["УЧЁНЫЕ: «ЭТО ТУШЬ»","Доктор Ада Люмен подтвердила: в библиотеке живой пигмент."],en:[`SCIENTISTS: "IT'S INDIA INK"`,"Dr. Ada Lumen confirms a living pigment in the library."]},24:{ lone and doesn't run.`},opts:[{v:"show",ru:["Показаться ему","Он знал мастера. Может, знает, где тот."],en:["Show ourselves","He knew the master. Maybe he knows where he is."]},{v:"scare",ru:["Напугать до конца","+30 чернил. Свидетели нам не нужны."],en:["Scare him off for good","+30 ink. We don't need witnesses."]}]},14:{key:"dog",text:{ru:"Бисквит доел сосиску, виляет хвостом и не уходит. Люди убежали без него.",en:"Biscuit finished the sausage, wags his tail and won't leave. The humans ran without him."},opts:[{v:"tame",ru:["Приручить","Он будет лаять на людей, а не на нас."],en:["Befriend him","He'll bark at people, not at us."]},{v:"chase",ru:["Прогнать","+30 чернил. Собаки — к людям."],en:["Chase him off","+30 ink. Dogs belong with people."]}]}},o.CHOICE_RESULT={return:{ru:"Утром Пит нашёл ключи у двери, завёрнутые в лист с улыбающейся кляксой.",en:"In the morning Pete found the keys at his door, wrapped in a sheet with a smiling blot."},keep:{ru:"Ключи растворились в нас. Чернил стало больше.",en:"The keys dissolved in us. We have more ink now."},show:{ru:"Мы вытекли из щитка. Гас не закричал. «Артур в „Сансет-Пайнс“, на Линден-стрит, — сказал он. — Я ему передам». И ушёл, не включив свет.",en:`We oozed out of the fuse box. Gus didn't scream. "Arthur's at Sunset Pines, on Linden Street," he said. "I'll tell him." And he left without turning on the lights.`},scare:{ru:"Гас убежал, бросив инструменты. Чернил стало больше, а в доме — тише.",en:"Gus ran, dropping his tools. More ink for us, more quiet in the house."},tame:{ru:"Бисквит теперь наш. Он лает на чужих.",en:"Biscuit is ours now. He barks at strangers."},chase:{ru:"Бисквит убежал к своим. Чернил стало больше.",en:"Biscuit ran back to his people. More ink for us."}},o.ENDINGS={master:{ru:["Мастер вернулся","Утром у калитки остановилось такси. Гас помог Артуру подняться по скрипучей лестнице. Артур сел за стол и открыл чернильницу. Мы вытекли из-под шкафа и легли на чистый лист. «Ну здравствуй, — сказал он. — Мы дома». Теперь по вечерам на Инкуэлл-лейн гаснет свет, и все знают почему."],en:["The Master Returned",'In the morning a taxi stopped at the gate. Gus helped Arthur up the creaky stairs. Arthur sat at his desk and opened the inkwell. We oozed out from under the bookcase onto a clean sheet. "Hello there," he said. "We are home." Now every evening the lights go out on Inkwell Lane, and everyone knows why.']},apprentice:{ru:["Ученик","Через неделю в дверь постучали. На пороге стоял Артур, а за ним — Пит, без фонаря. «Он принёс мне ключи, — сказал Артур. — И хочет научиться рисовать». Теперь мы живём в двух перьях сразу. Пит не боится. Почти."],en:["The Apprentice",`A week later there was a knock at the door. Arthur stood on the porch with Pete behind him, no flashlight. "He brought me the keys," Arthur said. "And he wants to learn to draw." Now we live in two pens at once. Pete isn't scared. Almost.`]},house:{ru:["Дом дождался","Застройщик уехал. Дом признали «странным, но не аварийным». Однажды вечером скрипнула калитка: Артур вернулся из «Сансет-Пайнс» на выходные. Он не включил свет. Он знал, что мы здесь."],en:["The House Waited",`The developer left. The house was declared "strange but not condemned". One evening the gate creaked: Arthur came home from Sunset Pines for the weekend. He didn't turn on the lights. He knew we were here.`]}},o.MOD_TXT={moon:{ru:["Полнолуние","Все лампы горят."],en:["Full moon","Every lamp is on."]},power:{ru:["Отключение","Почти все лампы погашены."],en:["Power cut","Most lamps are off."]},flashy:{ru:["Фотосессия","Вспышки камер чаще."],en:["Photo shoot","Camera flashes come faster."]},jumpy:{ru:["Кофе на ночь","Все быстрее, но и пугаются сильнее."],en:["Late-night coffee","Everyone moves faster but scares easier."]},fog:{ru:["Туман","Лучи фонарей короче."],en:["Fog","Flashlight beams are shorter."]}},o.GUIDE=[{k:"move",ru:["Течь","Коснись точки — клякса потечёт туда по полу, стенам, потолку и мебели. С потолка можно упасть каплей."],en:["Ooze","Tap a spot and the blot flows there over floors, walls, ceilings and furniture. It can drop from the ceiling."]},{k:"ink",ru:["Чернила","Жизнь и сила кляксы. Капли и чужой страх пополняют их (треть каждого испуга возвращается нам). Свет сушит. Ноль — ночь проиграна."],en:["Ink","The blot's life and power. Ink drops and other people's fear refill it (a third of every scare comes back to us). Light dries it. Zero means the night is lost."]},{k:"light",ru:["Свет","Лампа только сушит. Луч фонаря сушит быстрее и замыкает красное кольцо. Замкнулось — снимок. Первый снимок за ночь смазан (минус треть чернил), второй — ночь проиграна."],en:["Light","A lamp only dries. A flashlight beam dries faster and closes the red ring. When it closes, they get a photo. The first photo of a night is blurred (lose a third of your ink), the second loses the night."]},{k:"fear",ru:["Страх","У каждого шкала страха. 100 — крик и бегство. В тишине страх спадает. Повтор той же пугалки слабее вдвое, третий раз смешит."],en:["Fear","Everyone has a fear bar. At 100 they scream and run. Fear fades in silence. Repeating a scare halves it; a third time makes them laugh."]},{k:"possess",ru:["Вселиться","Внутри предмета луч не страшен. «Пугнуть» — пугалка предмета. Ухо над головой — услышит, глаз — увидит (только если смотрит туда)."],en:["Possess",`Inside an object beams can't hurt us. "Spook" triggers the object. Ear above a head: they'll hear it. Eye: they'll see it (only if looking that way).`]},{k:"combo",ru:["Серия","Разные пугалки в пределах 5 секунд: ×1.3, ×1.6, ×2, ×2.4."],en:["Chain","Different scares within 5 seconds: ×1.3, ×1.6, ×2, ×2.4."]},{k:"stars",ru:["Звёзды","Три звезды за ночь: все сбежали; ни разу не попались в луч фонаря (чистый испуг); задание ночи. Звёзды дают чернила в копилку."],en:["Stars","Three stars per night: everyone ran; never caught in a flashlight beam (a clean haunting); the night's task. Stars add ink to the inkwell."]},{k:"knock",ru:["Стук","3 чернил. Слабый звук: люди идут на него. Им удобно увести человека из комнаты."],en:["Knock","3 ink. A weak sound people walk toward. Good for luring someone out of a room."]},{k:"tr_coward",ru:["Трус","Пугается в полтора раза сильнее, машет фонарём во все стороны и зовёт остальных."],en:["Coward","Scares one and a half times easier, swings the flashlight everywhere and calls the others."]},{k:"tr_skeptic",ru:["Скептик","Почти не боится звуков. Ему нужны видимые чудеса: портрет, занавеска, шкаф."],en:["Skeptic","Barely reacts to sounds. Needs visible wonders: a portrait, a curtain, a wardrobe."]},{k:"tr_tough",ru:["Смельчак","Пугается на треть слабее. Нужны серии и сильные пугалки."],en:["Tough","Scares a third less. Needs chains and strong scares."]},{k:"tr_nosy",ru:["Любопытный","Ходит быстрее и слышит дальше: на любой шорох идёт проверить."],en:["Nosy","Walks faster and hears farther: checks every rustle."]},{k:"tr_superstitious",ru:["Суеверный","Видимые чудеса пугают его сильнее всех."],en:["Superstitious","Visible wonders scare them more than anyone."]},{k:"tr_photographer",ru:["Фотограф","Вместо фонаря камера: каждые 7–8 секунд вспышка на всю комнату перед ним, перед вспышкой три красных сигнала."],en:["Photographer","A camera instead of a flashlight: every 7–8 seconds it flashes the whole room in front, after three red beeps."]},{k:"lamp",ru:["Погасить лампу","5 чернил. Комната темнеет, но все рядом настораживаются."],en:["Snuff a lamp","5 ink. The room goes dark, but everyone nearby gets alert."]},{k:"write",ru:["Надпись","15 чернил. Слово на стене. Кто впервые осветит его фонарём, сильно испугается."],en:["Writing","15 ink. A word on the wall. Whoever first lights it with a flashlight gets a big scare."]},{k:"hide",ru:["Тайник","Пока мы сидим в предмете, чернила понемногу восстанавливаются. Улучшается в мастерской."],en:["Hideaway","While we sit inside an object, ink slowly refills. Upgrade it in the workshop."]},{k:"fixer",ru:["Электрик","Гас чинит погашенные лампы и щиток. Щиток гасит весь дом."],en:["Electrician","Gus fixes snuffed lamps and the fuse box. The fuse box darkens the whole house."]},{k:"grin",ru:["Оскал","20 чернил. Вплотную за спиной в темноте. Очень страшно, но человек тут же обернётся со светом — уходи."],en:["Grin","20 ink. Right behind someone, in the dark. Very scary, but they spin around with the light, so get away."]},{k:"drop",ru:["Капля","10 чернил. С потолка над человеком: фонарь гаснет на 5 секунд. Потом он посветит вверх."],en:["Drip","10 ink. From the ceiling above someone: the flashlight dies for 5 seconds. Then they shine it upward."]},{k:"puddle",ru:["Лужа","8 чернил. Разлей лужу на полу: кто наступит, поскользнётся, уронит фонарь и испугается. Учёная лужу видит и обходит."],en:["Puddle","8 ink. Spill a puddle on the floor: whoever steps in it slips, drops the flashlight and gets scared. The scientist sees puddles and steps around."]},{k:"pipes",ru:["Трубы","Трубы в стенах соединяют комнаты. В трубе нас не видно."],en:["Pipes","Pipes in the walls connect rooms. Nobody can see us inside."]},{k:"camera",ru:["Вспышка","Камера вспыхивает на всю комнату перед собой, перед этим 3 красных сигнала. Во вспышке без укрытия — снимок (первый смазан). Прячься в предмет или за мебель."],en:["Camera flash","A camera flashes the whole room in front of it, after 3 red beeps. Caught in the flash without cover means a photo (the first one is blurred). Hide in an object or behind furniture."]},{k:"brave",ru:["Ведущий","Пока Чеда снимают, он храбрится: страх ×0.5. Пугай, когда камера смотрит в другую сторону."],en:["The host","While on camera Chad acts brave: fear ×0.5. Scare him when the camera looks away."]},{k:"dog",ru:["Пёс","Бисквит не боится чудес, идёт по свежему следу и лаем зовёт людей. Сосиска из холодильника его отвлечёт."],en:["The dog","Biscuit ignores wonders, follows fresh trails and barks to call people. A sausage from the fridge distracts him."]},{k:"wail",ru:["Вой","22 чернил. Громкий вой слышен через стены: пугает всех вокруг, даже из предмета. Но все придут на звук."],en:["Wail","22 ink. A loud wail heard through walls: scares everyone around, even from inside an object. But everyone comes to check."]},{k:"shadow",ru:["Тень-великан","25 чернил. Рядом с горящей лампой: огромная тень пугает всех в комнате. Свет при этом сушит нас."],en:["Giant shadow","25 ink. Next to a lit lamp: a huge shadow scares everyone in the room. The light dries us meanwhile."]},{k:"uv",ru:["Ультрафиолет","Люмен видит следы и надписи в УФ-луче. Обычные пугалки ей почти нипочём: только серия ×3 и больше."],en:["Ultraviolet","Lumen sees trails and writing in her UV beam. Ordinary scares barely work: only a chain of ×3 or more."]},{k:"daily",ru:["Ночь дня","Каждый день новый дом, новая команда и особое условие. Очки: страх + 150 за звезду + секунды до рассвета. Серия дней добавляет награду."],en:["Night of the Day","Every day a new house, a new crew and a special rule. Score: fear + 150 per star + seconds left before dawn. A daily streak adds to the reward."]},{k:"flood",ru:["Прожектор","Прожектор Глэра ходит по дому с улицы. Его луч опасен так же, как фонарь."],en:["Floodlight","Glare's floodlight sweeps the house from outside. Its beam is as dangerous as a flashlight."]},{k:"giant",ru:["Мы — Клякса!","Всё, что мы собрали. Огромная клякса пугает всех рядом и всех, кто нас видит. Один раз за ночь, нужно 60 чернил и хотя бы двое проверяющих в доме. Глэр держится, пока с ним его люди."],en:["We are Blot!","Everything we gathered. A huge blot scares everyone nearby and everyone who sees us. Once per night, needs 60 ink and at least two inspectors inside. Glare holds out while his people are with him."]}],o.SCARE_TXT={clock:{ru:["Полночь не по расписанию","Часы пробили тринадцать."],en:["Midnight off schedule","The clock struck thirteen."]},rocker:{ru:["Пустое кресло","Качается само. Удобно, кстати."],en:["The empty chair","Rocks by itself. Quite comfy, actually."]},piano:{ru:["Ноктюрн для одной кляксы","Фальшиво, зато от души."],en:["Nocturne for one blot","Off-key, but heartfelt."]},portrait:{ru:["Глаза следят","Предок на портрете подмигнул."],en:["The eyes follow you","The ancestor in the portrait winked."]},wardrobe:{ru:["Из шкафа","Классика жанра."],en:["Out of the closet","A genre classic."]},curtain:{ru:["Кто за шторой?","Шторa встала и пошла."],en:["Who's behind the curtain?","The curtain got up and walked."]},gramophone:{ru:["Старая пластинка","Вальс 1932 года, задом наперёд."],en:["An old record","A 1932 waltz, played backwards."]},doll:{ru:["«Мама!»","Кукла позвала не ту маму."],en:['"Mama!"',"The doll called for the wrong mama."]},tv:{ru:["Белый шум","Канал, которого нет."],en:["White noise","A channel that doesn't exist."]},chandelier:{ru:["Звон хрусталя","Люстра качнулась без ветра."],en:["Crystal chime","The chandelier swung with no wind."]},bathtub:{ru:["Буль","Ванна что-то сказала."],en:["Glug","The bathtub said something."]},kettle:{ru:["Свисток","Чайник закипел. Пустой."],en:["The whistle","The kettle boiled. Empty."]},fridge:{ru:["Ночной перекус","Холодильник открылся сам."],en:["Midnight snack","The fridge opened by itself."]},mirror:{ru:["Отражение","В зеркале на одного больше."],en:["Reflection","One too many in the mirror."]},knock:{ru:["Тук-тук","Кто там? Никого."],en:["Knock knock","Who's there? Nobody."]},write:{ru:["Послание","Почерк мастера, орфография наша."],en:["The message","The master's handwriting, our spelling."]},grin:{ru:["За спиной","Не оборачивайся. Поздно."],en:["Behind you","Don't turn around. Too late."]},drop:{ru:["Кап","Фонарь погас от одной капли."],en:["Drip","One drop and the flashlight died."]},puddle:{ru:["Поскользнулся","Мокрый пол, осторожно."],en:["Slip","Caution: wet floor."]},wail:{ru:["Вой в стенах","Слышно было на соседней улице."],en:["Wail in the walls","They heard it on the next street."]},shadow:{ru:["Тень-великан","Тень выросла выше потолка."],en:["The giant shadow","The shadow grew ta
