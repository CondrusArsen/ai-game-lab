:root { --panel: #2a2340; --hi: #4c3f7a; --txt: #fff; --mut: #c8bfe6; --acc: #ffd84a; --ok: #5fd35a; --bad: #ff5a4a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--txt); font-family: 'Rubik', sans-serif; font-weight: 500; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
body { background: linear-gradient(180deg, var(--s0, #7ec8ff), var(--s1, #c8ecff) 60%, var(--s2, #e8f6ff)); transition: background 0.6s; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1.5px); background-size: 46px 46px; opacity: var(--dots, 0); }
#wx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#wx i { position: absolute; top: -20px; background: rgba(255,255,255,0.8); animation: fall linear infinite; }
#wx.rain i { width: 2px; height: 16px; background: rgba(200,220,255,0.55); }
#wx.snow i { width: 6px; height: 6px; }
@keyframes fall { to { transform: translate(-60px, 110vh); } }
canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#hud, #ui { position: fixed; inset: 0; pointer-events: none; }
#hud > *, #ui > * { pointer-events: auto; }
#hud #ring, #hud #tapm, #hud .bub { pointer-events: none; }
#coach { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#coach.block { pointer-events: auto; }
#coach .dim { position: fixed; background: rgba(10,6,24,0.55); pointer-events: auto; }
#coach:not(.block) .dim { pointer-events: none; }
#coach .ring { position: fixed; border: 4px solid var(--acc); box-shadow: 0 0 0 3px #000, 0 0 18px var(--acc); pointer-events: none; animation: pulse 0.8s infinite alternate; }
#coach .arrow { position: fixed; width: 32px; text-align: center; font-size: 34px; color: var(--acc); text-shadow: 0 3px 0 #000, 0 0 8px #000; pointer-events: none; }
