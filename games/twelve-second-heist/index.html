.btn { border: 1px solid var(--line); background: rgba(111,243,255,.06); color: var(--ink); padding: 10px 18px; font-weight: 800; letter-spacing: .03em; min-height: 42px;

.btn.ghost { background: transparent; color: var(--dim); }
.btn.small { padding: 6px 12px; min-height: 34px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.stars { font-size: 38px; letter-spacing: 6px; }
.star { color: #27323c; } .star.on { color: var(--au); text-shadow: 0 0 14px var(--au); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stats div { border: 1px solid rgba(111,243,255,.25); padding: 8px 4px; display: flex; flex-direction: column; gap: 2px; }
.stats b { font-size: 20px; font-variant-numeric: tabular-nums; } .stats span { font-size: 11px; color: var(--dim); } .stats i { font-style: normal; font-size: 11px; color: var(--dim); } .stats i.ok { color: var(--au); }
#card { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(520px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--au); padding: 14px 16px; z-index: 5;

0435\u043C\u044F \u043F\u0435\u0442\u043B\u0438 \u043F\u043E\u0439\u0434\u0451\u0442 \u0441 \u043F\u0435\u0440\u0432\u043E\u0433\u043E \u0448\u0430\u0433\u0430."],["Moving","Move with the arrow keys or WASD, or the d-pad on a phone. The loop clock starts with your first step."]],loot:[["\u0414\u043E\u0431\u044B\u0447\u0430","\u041D\u0430\u0441\u0442\u0443\u043F\u0438 \u043D\u0430 \u0441\u0443\u043C\u043A\u0443 \u0441 \u0434\u0435\u043D\u044C\u0433\u0430\u043C\u0438, \u0438 \u0442\u044B \u0435\u0451 \u0432\u043E\u0437\u044C\u043C\u0451\u0448\u044C. \u0412 \u0440\u0443\u043A\u0430\u0445 \u043F\u043E\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F \u043E\u0434\u043D\u0430 \u0441\u0443\u043C\u043A\u0430. \u0414\u0435\u0439\u0441\u0442\u0432\u0438\u0435\u043C \u0441\u0443\u043C\u043A\u0443 \u043C\u043E\u0436\u043D\u043E \u043F\u043E\u043B\u043E\u0436\u0438\u0442\u044C \u043D\u0430 \u043F\u043E\u043B."],["Loot","Step on a cash bag to pick it up. You can carry one bag. Press Action to put it down."]],van:[["\u0424\u0443\u0440\u0433\u043E\u043D","\u0414\u043E\u043D\u0435\u0441\u0438 \u0434\u043E\u0431\u044B\u0447\u0443 \u0434\u043E \u0444\u0443\u0440\u0433\u043E\u043D\u0430. \u0421\u043A\u043E\u043B\u044C\u043A\u043E \u043D\u0443\u0436\u043D\u043E \u0443\u043D\u0435\u0441\u0442\u0438, \u043D\u0430\u043F\u0438\u0441\u0430\u043D\u043E \u0441\u0432\u0435\u0440\u0445\u0443. \u0414\u043E\u043D\u0451\u0441 \u2014 \u0434\u0435\u043B\u043E \u0441\u0434\u0435\u043B\u0430\u043D\u043E."],["The van","Bring the loot to the getaway van. The goal at the top says how much. Deliver it and the heist is done."]],plate:[["\u041D\u0430\u0436\u0438\u043C\u043D\u0430\u044F \u043F\u043B\u0438\u0442\u0430","\u0414\u0432\u0435\u0440\u044C \u0442\u043E\u0433\u043E \u0436\u0435 \u0446\u0432\u0435\u0442\u0430 \u043E\u0442\u043A\u0440\u044B\u0442\u0430, \u043F\u043E\u043A\u0430 \u043A\u0442\u043E-\u0442\u043E \u0441\u0442\u043E\u0438\u0442 \u043D\u0430 \u043F\u043B\u0438\u0442\u0435. \u0423\u0448\u0451\u043B \u0441 \u043F\u043B\u0438\u0442\u044B \u2014 \u0434\u0432\u0435\u0440\u044C \u0437\u0430\u043A\u0440\u044B\u043B\u0430\u0441\u044C (\u043D\u0430 \u0447\u0435\u043B\u043E\u0432\u0435\u043A\u0435 \u043D\u0435 \u0437\u0430\u0445\u043B\u043E\u043F\u043D\u0435\u0442\u0441\u044F)."],["Pressure plate","The door of the same color stays open while someone stands on the plate. Step off and it shuts (never on someone)."]],loop:[["\u041F\u0435\u0442\u043B\u044F \u0438 \u043A\u043E\u043F\u0438\u0438","\u041F\u0435\u0442\u043B\u044F \u0434\u043B\u0438\u0442\u0441\u044F 12 \u0441\u0435\u043A\u0443\u043D\u0434. \u041A\u043E\u0433\u0434\u0430 \u0432\u0440\u0435\u043C\u044F \u043A\u043E\u043D\u0447\u0438\u0442\u0441\u044F \u0438\u043B\u0438 \u0442\u044B \u043D\u0430\u0436\u043C\u0451\u0448\u044C \xAB\u041A\u043E\u043D\u0435\u0446 \u043F\u0435\u0442\u043B\u0438\xBB, \u0437\u0430\u0431\u0435\u0433 \u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F \u043A\u043E\u043F\u0438\u0435\u0439. \u0412 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0435\u0439 \u043F\u0435\u0442\u043B\u0435 \u043A\u043E\u043F\u0438\u044F \u043F\u043E\u0432\u0442\u043E\u0440\u0438\u0442 \u043A\u0430\u0436\u0434\u044B\u0439 \u0442\u0432\u043E\u0439 \u0448\u0430\u0433, \u0430 \u0442\u044B \u043F\u043E\u0439\u0434\u0451\u0448\u044C \u0437\u0430\u043D\u043E\u0432\u043E."],["Loops and copies","A loop lasts 12 seconds. When time runs out or you press End loop, your run becomes a copy. Next loop the copy repeats every step you took while you go again."]],chain:[["\u0426\u0435\u043F\u043E\u0447\u043A\u0430","\u041A\u0430\u0436\u0434\u0430\u044F \u043A\u043E\u043F\u0438\u044F \u043C\u043E\u0436\u0435\u0442 \u0434\u0435\u0440\u0436\u0430\u0442\u044C \u0441\u0432\u043E\u044E \u043F\u043B\u0438\u0442\u0443. \u041E\u0448\u0438\u0431\u0441\u044F \u2014 \xAB\u0423\u0431\u0440\u0430\u0442\u044C \u043A\u043E\u043F\u0438\u044E\xBB \u0441\u0442\u0438\u0440\u0430\u0435\u0442 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u044E\u044E, \xAB\u041F\u0435\u0442\u043B\u044E \u0437\u0430\u043D\u043E\u0432\u043E\xBB \u043F\u0435\u0440\u0435\u0437\u0430\u043F\u0443\u0441\u043A\u0430\u0435\u0442 \u0442\u0435\u043A\u0443\u0449\u0438\u0439 \u0437\u0430\u0431\u0435\u0433."],["Chains","Each copy can hold its own plate. Made a mistake? Undo copy erases the last one, Retry loop restarts your current run."]],target:[["\u0414\u0432\u0435 \u0441\u0443\u043C\u043A\u0438","\u0417\u0434\u0435\u0441\u044C \u043D\u0430\u0434\u043E \u0432\u044B\u043D\u0435\u0441\u0442\u0438 \u0434\u0432\u0435 \u0441\u0443\u043C\u043A\u0438, \u0430 \u0432 \u0440\u0443\u043A\u0430\u0445 \u043F\u043E\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F \u043E\u0434\u043D\u0430. \u041D\u0435\u0441\u0438 \u043F\u043E \u043E\u0447\u0435\u0440\u0435\u0434\u0438 \u0438\u043B\u0438 \u043F\u043E\u0440\u0443\u0447\u0438 \u0432\u0442\u043E\u0440\u0443\u044E \u043A\u043E\u043F\u0438\u0438. \u041C\u0435\u043D\u044C\u0448\u0435 \u043A\u043E\u043F\u0438\u0439 \u2014 \u0431\u043E\u043B\u044C\u0448\u0435 \u0437\u0432\u0451\u0437\u0434."],["Two bags","You need two bags here, and you carry one at a time. Make two trips or send a copy. Fewer copies earn more stars."]],lever:[["\u0420\u0443\u0431\u0438\u043B\u044C\u043D\u0438\u043A","\u0412\u0441\u0442\u0430\u043D\u044C \u043D\u0430 \u0440\u0443\u0431\u0438\u043B\u044C\u043D\u0438\u043A \u0438 \u043D\u0430\u0436\u043C\u0438 \xAB\u0414\u0435\u0439\u0441\u0442\u0432\u0438\u0435\xBB. \u041E\u043D \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0435\u0442 \u0441\u0432\u043E\u0439 \u0446\u0432\u0435\u0442 \u043D\u0430\u0441\u043E\u0432\u0441\u0435\u043C, \u0434\u043E \u043A\u043E\u043D\u0446\u0430 \u043F\u0435\u0442\u043B\u0438. \u0414\u0432\u0435\u0440\u044C \u0441 \u043F\u043E\u043B\u043E\u0441\u0430\u043C\u0438 \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442 \u043D\u0430\u043E\u0431\u043E\u0440\u043E\u0442: \u043E\u0442\u043A\u0440\u044B\u0442\u0430, \u043F\u043E\u043A\u0430 \u0440\u0443\u0431\u0438\u043B\u044C\u043D\u0438\u043A \u043D\u0435 \u0442\u0440\u043E\u043D\u0443\u0442."],["Lever","Stand on the lever and press Action. It flips its color for the rest of the loop. A door marked the other way is open until the lever is pulled."]],laser:[["\u041B\u0430\u0437\u0435\u0440","\u041A\u0440\u0430\u0441\u043D\u044B\u0439 \u043B\u0443\u0447 \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442 \u0442\u0440\u0435\u0432\u043E\u0433\u0443, \u0435\u0441\u043B\u0438 \u0435\u0433\u043E \u043A\u043E\u0441\u043D\u0451\u0442\u0441\u044F \u043A\u0442\u043E \u0443\u0433\u043E\u0434\u043D\u043E, \u0434\u0430\u0436\u0435 \u043A\u043E\u043F\u0438\u044F. \u0422\u0440\u0435\u0432\u043E\u0433\u0430 \u043E\u0431\u0440\u044B\u0432\u0430\u0435\u0442 \u043F\u0435\u0442\u043B\u044E. \u042D\u0442\u043E\u0442 \u043B\u0430\u0437\u0435\u0440 \u0433\u0430\u0441\u043D\u0435\u0442, \u043F\u043E\u043A\u0430 \u043D\u0430 \u043F\u043B\u0438\u0442\u0435 \u043A\u0442\u043E-\u0442\u043E \u0441\u0442\u043E\u0438\u0442."],["Laser","A red beam raises the alarm if anyone touches it, even a copy. An alarm ends the loop. This laser goes dark while someone stands on its plate."]],laser_timed:[["\u041C\u0438\u0433\u0430\u044E\u0449\u0438\u0439 \u043B\u0430\u0437\u0435\u0440","\u042D\u0442\u043E\u0442 \u043B\u0443\u0447 \u0432\u043A\u043B\u044E\u0447\u0430\u0435\u0442\u0441\u044F \u0438 \u0433\u0430\u0441\u043D\u0435\u0442 \u043F\u043E \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u043D\u0438\u044E, \u043E\u0434\u0438\u043D\u0430\u043A\u043E\u0432\u043E \u0432 \u043A\u0430\u0436\u0434\u043E\u0439 \u043F\u0435\u0442\u043B\u0435. \u0414\u043E\u0436\u0434\u0438\u0441\u044C \u043F\u0430\u0443\u0437\u044B \u0438 \u043F\u0440\u043E\u0441\u043A\u043E\u0447\u0438."],["Blinking laser","This beam switches on and off on a timer, the same way every loop. Wait for the gap and slip through."]],weight:[["\u0422\u044F\u0436\u0451\u043B\u0430\u044F \u043F\u043B\u0438\u0442\u0430","\u0426\u0438\u0444\u0440\u0430 \u043D\u0430 \u043F\u043B\u0438\u0442\u0435 \u2014 \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0447\u0435\u043B\u043E\u0432\u0435\u043A \u0434\u043E\u043B\u0436\u043D\u043E \u043D\u0430 \u043D\u0435\u0439 \u0441\u0442\u043E\u044F\u0442\u044C. \u0414\u0432\u043E\u0435 \u043A\u043E\u043F\u0438\u0439 \u2014 \u0438 \u0434\u0432\u0435\u0440\u044C \u043E\u0442\u043A\u0440\u044B\u0442\u0430."],["Heavy plate","The number says how many people must stand on it. Two copies and the door opens."]],brick:[["\u041A\u0438\u0440\u043F\u0438\u0447","\u0412 \u0431\u0430\u043D\u0434\u0435 \u043D\u043E\u0432\u0435\u043D\u044C\u043A\u0438\u0439. \u041F\u0435\u0440\u0435\u0434 \u043F\u0435\u0442\u043B\u0451\u0439 \u0432\u044B\u0431\u0435\u0440\u0438, \u043A\u0442\u043E \u0438\u0434\u0451\u0442: \u041A\u0438\u0440\u043F\u0438\u0447 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435, \u043D\u043E \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442 \u0437\u043E\u043B\u043E\u0442\u043E \u0438 \u0432\u0435\u0441\u0438\u0442 \u043D\u0430 \u043F\u043B\u0438\u0442\u0435 \u0437\u0430 \u0434\u0432\u043E\u0438\u0445."],["Brick joins","New crew member. Before a loop, pick who runs it. Brick is slower but lifts gold and counts as two on a plate."]],gold:[["\u0417\u043E\u043B\u043E\u0442\u043E\u0439 \u044F\u0449\u0438\u043A","\u042F\u0449\u0438\u043A \u0441\u0442\u043E\u0438\u0442 3 \u0441\u0443\u043C\u043A\u0438. \u041F\u043E\u0434\u043D\u044F\u0442\u044C \u0435\u0433\u043E \u043C\u043E\u0436\u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u041A\u0438\u0440\u043F\u0438\u0447, \u0438 \u0441 \u043D\u0438\u043C \u043E\u043D \u0438\u0434\u0451\u0442 \u0435\u0449\u0451 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435."],["Gold crate","A crate is worth 3 bags. Only Brick can lift it, and he walks even slower with it."]],guard:[["\u041E\u0445\u0440\u0430\u043D\u043D\u0438\u043A","\u0416\u0451\u043B\u0442\u0430\u044F \u0437\u043E\u043D\u0430 \u2014 \u043B\u0443\u0447 \u0444\u043E\u043D\u0430\u0440\u044F. \u041A\u0442\u043E \u0432 \u043D\u0435\u0451 \u043F\u043E\u043F\u0430\u0434\u0451\u0442, \u043F\u043E\u0434\u043D\u0438\u043C\u0435\u0442 \u0442\u0440\u0435\u0432\u043E\u0433\u0443, \u043A\u043E\u043F\u0438\u044F \u0442\u043E\u0436\u0435. \u041E\u0445\u0440\u0430\u043D\u043D\u0438\u043A \u043A\u0430\u0436\u0434\u0443\u044E \u043F\u0435\u0442\u043B\u044E \u0445\u043E\u0434\u0438\u0442 \u043E\u0434\u043D\u0438\u043C \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u043E\u043C: \u0441\u043B\u0435\u0434\u0438 \u0438 \u043F\u0440\u043E\u0445\u043E\u0434\u0438 \u0443 \u043D\u0435\u0433\u043E \u0437\u0430 \u0441\u043F\u0438\u043D\u043E\u0439. \u0421\u043A\u0432\u043E\u0437\u044C \u043E\u0445\u0440\u0430\u043D\u043D\u0438\u043A\u0430 \u043F\u0440\u043E\u0439\u0442\u0438 \u043D\u0435\u043B\u044C\u0437\u044F."],["Guard","The yellow zone is his flashlight. Anyone inside it raises the alarm, copies too. He walks the same route every loop: watch him and pass behind his back. Nobody walks through a guard."]],sleep:[["\u0421\u043F\u044F\u0449\u0438\u0439 \u043E\u0445\u0440\u0430\u043D\u043D\u0438\u043A","\u0421\u043F\u044F\u0449\u0438\u0439 \u043D\u0435 \u0432\u0438\u0434\u0438\u0442 \u043D\u0438\u0447\u0435\u0433\u043E. \u041D\u043E \u0448\u0443\u043C \u0435\u0433\u043E \u0431\u0443\u0434\u0438\u0442: \u043E\u043D \u0432\u0441\u0442\u0430\u0451\u0442, \u0438\u0434\u0451\u0442 \u043A \u043C\u0435\u0441\u0442\u0443 \u0448\u0443\u043C\u0430, \u043E\u0433\u043B\u044F\u0434\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0438 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u043F\u043E\u0441\u0442 \u0443\u0436\u0435 \u0431\u043E\u0434\u0440\u044B\u043C."],["Sleeping guard","A sleeping guard sees nothing. Noise wakes him: he gets up, walks to the noise, looks around and goes back to his post wide awake."]],creak:[["\u0421\u043A\u0440\u0438\u043F\u0443\u0447\u0438\u0439 \u043F\u043E\u043B","\u041F\u043E\u043B\u043E\u0432\u0438\u0446\u0430 \u0441\u043A\u0440\u0438\u043F\u0438\u0442, \u043A\u043E\u0433\u0434\u0430 \u043D\u0430 \u043D\u0435\u0451 \u043D\u0430\u0441\u0442\u0443\u043F\u0430\u044E\u0442. \u041E\u0445\u0440\u0430\u043D\u043D\u0438\u043A \u0440\u044F\u0434\u043E\u043C \u0443\u0441\u043B\u044B\u0448\u0438\u0442. \u0421\u043A\u0440\u0438\u043F \u043C\u043E\u0436\u043D\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u043A\u0430\u043A \u043F\u0440\u0438\u043C\u0430\u043D\u043A\u0443."],["Creaky floor","This board creaks when stepped on. A guard nearby will hear it. You can use it as a lure."]],camera:[["\u041A\u0430\u043C\u0435\u0440\u0430","\u041A\u0430\u043C\u0435\u0440\u0430 \u043A\u0440\u0443\u0442\u0438\u0442\u0441\u044F \u043F\u043E \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u043D\u0438\u044E \u0438 \u0441\u0432\u0435\u0442\u0438\u0442 \u043A\u0440\u0430\u0441\u043D\u044B\u043C \u043B\u0443\u0447\u043E\u043C \u043D\u0430 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043A\u043B\u0435\u0442\u043E\u043A. \u041F\u043E\u043F\u0430\u0434\u0451\u0448\u044C \u0432 \u043B\u0443\u0447 \u2014 \u0442\u0440\u0435\u0432\u043E\u0433\u0430. \u041F\u043B\u0438\u0442\u0430 \u0442\u043E\u0433\u043E \u0436\u0435 \u0446\u0432\u0435\u0442\u0430 \u0435\u0451 \u0432\u044B\u043A\u043B\u044E\u0447\u0430\u0435\u0442."],["Camera","The camera turns on a timer and casts a red beam a few tiles long. Step into it and the alarm goes off. Its plate switches it off."]],echo:[["\u042D\u0445\u043E","\u041D\u043E\u0432\u0435\u043D\u044C\u043A\u0430\u044F \u0432 \u0431\u0430\u043D\u0434\u0435. \u0415\u0451 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435 \u2014 \u0441\u0432\u0438\u0441\u0442\u043E\u043A. \u041E\u0445\u0440\u0430\u043D\u043D\u0438\u043A, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u0441\u043B\u044B\u0448\u0438\u0442, \u0438\u0434\u0451\u0442 \u043A \u043C\u0435\u0441\u0442\u0443 \u0441\u0432\u0438\u0441\u0442\u0430 \u0438 \u043E\u0433\u043B\u044F\u0434\u044B\u0432\u0430\u0435\u0442\u0441\u044F. \u0421\u0432\u0438\u0441\u0442\u043D\u0438 \u0438 \u0441\u0440\u0430\u0437\u0443 \u0443\u0445\u043E\u0434\u0438 \u0438\u0437 \u0432\u0438\u0434\u0443."],["Echo joins","New crew member. Her Action is a whistle. A guard who hears it walks to the spot and looks around. Whistle, then get out of sight."]],dash:[["\u0420\u044B\u0432\u043E\u043A","\u041D\u043E\u0432\u0435\u043D\u044C\u043A\u0438\u0439 \u0432 \u0431\u0430\u043D\u0434\u0435: \u0431\u0435\u0433\u0430\u0435\u0442 \u0431\u044B\u0441\u0442\u0440\u0435\u0435 \u0432\u0441\u0435\u0445. \u041D\u043E\u0432\u0438\u0447\u043A\u0443 \u0437\u0434\u0435\u0441\u044C \u043F\u0440\u043E\u0441\u0442\u043E \u043D\u0435 \u0443\u0441\u043F\u0435\u0442\u044C \u0437\u0430 12 \u0441\u0435\u043A\u0443\u043D\u0434."],["Dash joins","New crew member who runs faster than anyone. A Rookie simply cannot make this in 12 seconds."]],keys:[["\u041A\u043B\u044E\u0447\u0438 \u0445\u0440\u0430\u043D\u0438\u043B\u0438\u0449\u0430","\u0425\u0440\u0430\u043D\u0438\u043B\u0438\u0449\u0435 \u043E\u0442\u043A\u0440\u043E\u0435\u0442\u0441\u044F, \u0442\u043E\u043B\u044C\u043A\u043E \u0435\u0441\u043B\u0438 \u0432\u0441\u0435 \u043A\u043B\u044E\u0447\u0438 \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u044C \u0437\u0430 \u043E\u0434\u043D\u0443 \u0441\u0435\u043A\u0443\u043D\u0434\u0443. \u0412\u0441\u0442\u0430\u043D\u044C \u043D\u0430 \u043A\u043B\u044E\u0447 \u0438 \u043D\u0430\u0436\u043C\u0438 \xAB\u0414\u0435\u0439\u0441\u0442\u0432\u0438\u0435\xBB. \u041E\u0434\u043D\u043E\u043C\u0443 \u043D\u0435 \u0443\u0441\u043F\u0435\u0442\u044C: \u043D\u0443\u0436\u043D\u044B \u043A\u043E\u043F\u0438\u0438 \u0438 \u0442\u043E\u0447\u043D\u043E\u0435 \u0432\u0440\u0435\u043C\u044F."],["Vault keys","The vault opens only if every key is turned within one second. Stand on a key and press Action. Nobody can do it alone: you need copies and timing."]],byte:[["\u0411\u0430\u0439\u0442","\u041D\u043E\u0432\u0435\u043D\u044C\u043A\u0438\u0439 \u0432 \u04
