<style>/* Bubblewreck UI — brass frames on deep-water glass. One family: Podkova (headings), Nunito (UI, numbers). */
:root {
  --brass-hi: #ffe7a3; --brass: #e0a93f; --brass-lo: #8a5716; --brass-deep: #4e2f0b;
  --glass: rgba(10, 34, 52, 0.86); --glass-2: rgba(16, 52, 74, 0.92); --ink: #fff6e2; --muted: #b9d6df; --gold: #ffd77a; --danger: #ff5b4d;
  --head: "BW Display", "Podkova", Georgia, serif; --ui: "BW UI", "Nunito", system-ui, sans-serif;
  --side: 120px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #061226; color: var(--ink); font-family: var(--ui); font-weight: 800; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
#scene { position: fixed; inset: 0; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: none; }
button { font-family: var(--ui); font-weight: 900; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
[hidden] { display: none !important; }
.svg { display: inline-flex; width: 22px; height: 22px; }
.svg svg, .ibtn svg { width: 100%; height: 100%; fill: currentColor; }
.small { font-size: 13px; color: var(--muted); }
.gold { color: var(--gold); }
.center { text-align: center; }
.warn { color: #ffb4a8; }

/* ---------- buttons ---------- */
.btn { pointer-events: auto; min-height: 46px; padding: 8px 16px; border-radius: 14px; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(#1f5a72, #123a4e); border: 2px solid var(--brass-lo); box-shadow: inset 0 2px 0 rgba(255,255,255,.15), 0 3px 0 rgba(0,0,0,.35); color: var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.1), 0 1px 0 rgba(0,0,0,.35); }
.btn.primary { background: linear-gradient(#ffe59a, #e0a93f 55%, #b9791f); color: #3b2208; border-color: var(--brass-deep); text-shadow: 0 1px 0 rgba(255,255,255,.4); }
.btn.big { min-height: 56px; font-size: 19px; width: 100%; }
.btn.ghost { background: transparent; border-color: rgba(224,169,63,.5); }
.btn.small { min-height: 44px; padding: 6px 12px; font-size: 14px; }
.btn.on { background: linear-gradient(#ffe59a, #e0a93f); color: #3b2208; }
.btn[aria-disabled="true"] { opacity: .45; }
.ibtn { pointer-events: auto; width: 48px; height: 48px; border-radius: 14px; padding: 11px; color: var(--brass-hi); background: radial-gradient(circle at 35% 30%, #2b6d86, #10364a); border: 2px solid var(--brass-lo); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; }
.row .btn { flex: 1 1 0; min-width: 0; }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0; pointer-events: none; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(6px + env(safe-area-inset-top)) 8px 4px; display: flex; gap: 6px; align-items: center; justify-content: space-between;
  background: linear-gradient(rgba(6,18,32,.92), rgba(6,18,32,.55)); border-bottom: 2px solid rgba(224,169,63,.45); height: calc(54px + env(safe-area-inset-top)); }
body.embedded .hud-top { padding-right: 64px; }
.gauge { display: flex; align-items: center; gap: 5px; padding: 4px 10px 4px 6px; border-radius: 14px; background: var(--glass); border: 2px solid var(--brass-lo); min-height: 44px; }
.gauge .gcol { display: flex; flex-direction: column; line-height: 1; }
.gauge .lbl { font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.gauge .num { font-size: 24px; color: #fff; font-variant-numeric: tabular-nums; }
.gauge.air { border-color: #4fd2e6; }
.gauge.air.low .num { color: #ffd77a; }
.gauge.air.out .num { color: var(--danger); }
.gauge.flash { animation: flash .5s 2; }
@keyframes flash { 50% { background: rgba(255,90,77,.55); } }
.gauge.coins .num { font-size: 18px; }
.hud-sub { position: absolute; left: 8px; right: 8px; top: calc(56px + env(safe-area-inset-top)); display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.chamber-tag, .mission-chip { padding: 3px 9px; border-radius: 10px; background: rgba(6,18,32,.7); border: 1px solid rgba(224,169,63,.4); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.mission-chip { color: var(--gold); }
.tray { position: absolute; left: 0; right: 0; bottom: 0; height: calc(100px + env(safe-area-inset-bottom)); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 4px;
  background: linear-gradient(rgba(6,18,32,.55), rgba(6,18,32,.95)); border-top: 2px solid rgba(224,169,63,.45); }
.hel-wrap { flex: 0 0 auto; width: 76px; height: 76px; }
.helmut { display: block; }
.say { position: absolute; left: 84px; right: 8px; bottom: calc(102px + env(safe-area-inset-bottom)); padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: #fff6e2; color: #2b1a08; font-size: 15px; line-height: 1.25; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.35); border: 2px solid var(--brass); }
.say.show { opacity: 1; transform: none; }
.say.warn { background: #ffe1d8; border-color: var(--danger); }
.tools { flex: 1 1 auto; display: flex; gap: 4px; justify-content: flex-end; align-items: flex-end; min-width: 0; }
.tool { pointer-events: auto; position: relative; width: 58px; min-width: 50px; height: 80px; flex: 0 1 58px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px;
  background: linear-gradient(#1f5a72, #10364a); border: 2px solid var(--brass-lo); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.tool .tname { font-size: 10px; line-height: 1.05; margin-top: 2px; text-align: center; padding: 0 2px; color: var(--ink); max-height: 22px; overflow: hidden; }
.tool .badge { position: absolute; top: -6px; right: -4px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: #d63a7c; color: #fff; font-size: 13px; line-height: 22px; border: 2px solid #fff3; }
.tool .meter { position: absolute; top: 2px; left: 4px; font-size: 11px; color: var(--gold); letter-spacing: 1px; text-shadow: 0 1px 2px #000; }
.tool.empty { filter: saturate(.3) brightness(.75); }
.tool.empty .badge { background: #555; }
.tool.armed, .tool.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,122,.5), 0 3px 0 rgba(0,0,0,.35); background: linear-gradient(#3b7f92, #1a4d61); }
.banner { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.6); padding: 10px 26px; border-radius: 18px; font: 900 34px var(--ui); color: #3b2208; background: linear-gradient(#ffe59a, #e0a93f); border: 3px solid var(--brass-deep); opacity: 0; transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .2s; white-space: nowrap; }
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.toasts { position: absolute; left: 0; right: 0; top: calc(92px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toasts.global { position: fixed; z-index: 40; }
.toast { padding: 7px 14px; border-radius: 12px; background: rgba(6,18,32,.92); border: 2px solid rgba(224,169,63,.6); font-size: 14px; max-width: 92%; text-align: center; transition: opacity .4s, transform .4s; }
.toast.gold { color: #3b2208; background: linear-gradient(#ffe59a, #e0a93f); }
.toast.out { opacity: 0; transform: translateY(-8px); }

/* landscape (desktop, landscape phone, the platform frames): HUD + Helmut in the left column, tools in the right column,
   the shaft gets the full height in the middle */
body.side .hud-top { right: auto; width: var(--side); height: 100%; flex-direction: column; justify-content: flex-start; align-items: stretch; gap: 8px; padding: 10px; border-bottom: 0; border-right: 2px solid rgba(224,169,63,.45); background: linear-gradient(90deg, rgba(6,18,32,.94), rgba(6,18,32,.8)); }
body.side .hud-top .gauge { width: 100%; min-height: 50px; }
body.side .hud-top .gauge .num { font-size: 30px; }
body.side .hud-sub { left: 10px; right: auto; width: calc(var(--side) - 20px); top: 250px; flex-direction: column; gap: 6px; }
body.side .chamber-tag, body.side .mission-chip { max-width: 100%; font-size: 13px; padding: 6px 10px; }
body.side .tray { left: auto; right: 0; top: 0; width: var(--side); height: 100%; flex-direction: column; align-items: center; justify-content: flex-start; border-top: 0; border-left: 2px solid rgba(224,169,63,.45); padding: 12px 10px; background: linear-gradient(270deg, rgba(6,18,32,.94), rgba(6,18,32,.8)); }
body.side .hel-wrap { position: fixed; left: calc(var(--side) / 2 - 75px); bottom: 18px; width: 150px; height: 150px; }
body.side .hel-wrap canvas { width: 150px !important; height: 150px !important; }
body.side .tools { flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 10px; width: 100%; }
body.side .tool { width: calc(50% - 6px); height: 92px; flex: 0 0 calc(50% - 6px); }
body.side .tool .tname { font-size: 12px; max-height: 30px; }
body.side .say { left: 10px; right: auto; width: calc(var(--side) - 20px); bottom: 180px; font-size: 15px; border-radius: 14px 14px 14px 14px; }
body.side .toasts { top: 10px; }
body.side .banner { left: 50%; }
body.embedded.side .tray { padding-top: 64px; }
body.short .hud-top { gap: 4px; padding: 4px; }
body.short .hud-top .gauge { min-height: 36px; }
body.short .hud-top .gauge .num { font-size: 20px; }
body.short .hud-sub { top: auto; bottom: 6px; }
body.short .hel-wrap { display: none; }
body.short .tool { height: 58px; }
body.short .tool .tname { display: none; }
body.short .say { left: calc(var(--side) + 8px); right: calc(var(--side) + 8px); width: auto; bottom: 8px; font-size: 13px; }

/* ---------- modals ---------- */
.overlays { position: fixed; inset: 0; z-index: 30; }
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2,10,20,.6); pointer-events: auto; padding: 12px; z-index: 31; }
.card { width: min(400px, 100%); max-height: calc(var(--vh, 100vh) - 24px); overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 16px 16px; border-radius: 22px; text-align: center; }
.card.brass { background: linear-gradient(#123a50, #0a2234); border: 3px solid var(--brass); box-shadow: 0 0 0 3px var(--brass-deep), 0 10px 30px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.12); }
.card h2 { margin: 0; font: 800 26px var(--head); color: var(--brass-hi); text-shadow: 0 2px 0 var(--brass-deep); line-height: 1.1; }
.card h3 { margin: 6px 0 2px; font: 800 17px var(--head); color: var(--brass-hi); align-self: flex-start; }
.card p { margin: 0; line-height: 1.3; }
.card-kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.big-icon { margin: 4px 0; }
.deficit { font-size: 22px; color: #ffb4a8; }
.cause { color: var(--muted); font-size: 15px; }
.stars { display: flex; gap: 8px; }
.stars span { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #8fb2c0 60%, #4c6a78); opacity: .35; }
.stars span.on { opacity: 1; background: radial-gradient(circle at 35% 30%, #fff, #ffe59a 45%, #e0a93f); box-shadow: 0 0 10px rgba(255,215,122,.7); }
.coins-earned { display: flex; align-items: center; gap: 6px; font-size: 20px; color: var(--gold); }
.chestbar, .chest-mini { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 13px; color: var(--muted); }
.chestbar .bar, .chest-mini .bar { flex: 1; height: 12px; border-radius: 6px; background: rgba(0,0,0,.45); border: 1px solid var(--brass-lo); overflow: hidden; }
.chestbar .bar i, .chest-mini .bar i { display: block; height: 100%; background: linear-gradient(90deg, #e0a93f, #ffe59a); }
.bubstrip { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; align-items: center; min-height: 52px; max-height: 110px; overflow: hidden; }
.bubstrip .cut { filter: grayscale(1) brightness(.6); transform: rotate(20deg) scale(.8); }
.bubstrip .more { font-size: 14px; color: var(--muted); }
.ptotal { display: flex; gap: 10px; align-items: baseline; }
.ptotal b { font-size: 34px; color: #fff; }
.lanes { display: flex; gap: 8px; width: 100%; }
.lane { pointer-events: auto; flex: 1; min-height: 120px; border-radius: 16px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--brass-lo); color: var(--ink); }
.lane.safe { background: linear-gradient(#1d6a74, #0f3e47); }
.lane.risk { background: linear-gradient(#6a3a5a, #3b1a33); }
.lane .gate { font-size: 30px; color: var(--gold); }
.lane small { font-size: 12px; color: var(--muted); line-height: 1.2; }
.lanes.chosen .lane { opacity: .35; pointer-events: none; }
.lanes.chosen .lane.pick { opacity: 1; border-color: var(--gold); }
.choices { display: flex; gap: 8px; width: 100%; }
.choice { pointer-events: auto; flex: 1; min-height: 110px; padding: 8px 4px; border-radius: 14px; background: var(--glass-2); border: 2px solid var(--brass-lo); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
.choice.pick { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,122,.45); }
.shop { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.shopgrid { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.shopcard, .shapecard { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 14px; background: var(--glass-2); border: 1px solid rgba(224,169,63,.4); text-align: left; }
.shopcard.locked, .shapecard.locked { opacity: .55; }
.shapecard.sel { border: 2px solid var(--gold); }
.sc-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sc-text small { font-size: 12px; color: var(--muted); line-height: 1.2; }
.pips { display: flex; gap: 3px; }
.pips i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
.pips i.on { background: var(--gold); }
.buy { min-width: 76px; }
.buy.poor { opacity: .6; }
.buy.max { opacity: .7; background: #2a3f48; }
.lockedtag { font-size: 12px; color: var(--muted); max-width: 90px; }
.coinline { display: flex; align-items: center; gap: 6px; font-size: 18px; color: var(--gold); pointer-events: auto; }
.order { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border-radius: 12px; background: var(--glass-2); text-align: left; }
.order small { grid-column: 1 / -1; color: var(--muted); }
.order.next { opacity: .55; }
.slider { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; text-align: left; pointer-events: auto; }
.slider input { grid-column: 1 / -1; width: 100%; height: 44px; accent-color: var(--brass); }
.lang { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: flex; gap: 6px; }
.toggle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; pointer-events: auto; }
.toggle input { width: 26px; height: 26px; accent-color: var(--brass); }
.credits { width: 100%; text-align: left; font-size: 12px; color: var(--muted); pointer-events: auto; }
.credits summary { min-height: 40px; line-height: 40px; color: var(--ink); cursor: pointer; }
.credits p { margin: 4px 0; }
.helpline { text-align: left; font-size: 14px; }
.shape-pick { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.shapebtn { pointer-events: auto; width: 76px; min-height: 84px; border-radius: 14px; background: var(--glass-2); border: 2px solid var(--brass-lo); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--ink); }
.shapebtn.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,122,.45); }

/* ---------- home ---------- */
.home { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(6px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)); gap: 4px; }
.home-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; }
.pearlbtn { pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 4px 12px; min-height: 44px; border-radius: 14px; background: var(--glass); border: 2px solid #b9a0e6; color: #efe6ff; animation: glow 1.6s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 14px rgba(200,170,255,.8); } }
.logo { text-align: center; line-height: 1; }
.logo h1 { margin: 0; font: 800 clamp(30px, 9.5vw, 52px) var(--head); color: var(--brass-hi); letter-spacing: .02em; text-shadow: 0 3px 0 var(--brass-deep), 0 0 18px rgba(94,240,255,.35); -webkit-text-stroke: 1px #6b3f0f; }
.logo p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.map-slot { position: relative; flex: 1 1 auto; min-height: 220px; }
.node { pointer-events: auto; position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; opacity: 0; font-size: 0; }
.node.cur { opacity: 0; }
.home-bottom { display: flex; flex-direction: column; gap: 6px; }
.home-menu { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.mbtn { pointer-events: auto; min-height: 64px; border-radius: 14px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; line-height: 1.1;
  background: linear-gradient(#1f5a72, #10364a); border: 2px solid var(--brass-lo); color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.mbtn small { font-size: 10px; color: var(--gold); }
.mbtn.dim { filter: saturate(.25) brightness(.7); }
.dive { font-size: 20px; }
body.wide .home { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 420px); grid-template-rows: auto auto 1fr; column-gap: 18px; padding-left: 24px; padding-right: 24px; }
body.wide .home-top { grid-column: 1 / -1; }
body.wide .logo { grid-column: 2; grid-row: 2; align-self: start; margin-top: 12px; }
body.wide .map-slot { grid-column: 1; grid-row: 2 / 4; }
body.wide .home-bottom { grid-column: 2; grid-row: 3; align-self: end; justify-content: flex-end; padding-bottom: 8px; }
body.wide .home-menu { grid-template-columns: repeat(3, 1fr); }
body.wide .mbtn { min-height: 80px; font-size: 13px; }
body.short .home { grid-template-columns: 1fr 1fr; }
body.short .logo h1 { font-size: 28px; }
body.short .mbtn { min-height: 52px; }
.remix-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
.remixbtn { pointer-events: auto; min-height: 58px; border-radius: 12px; background: var(--glass-2); border: 2px solid var(--brass-lo); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); font-size: 13px; }
.remixbtn small { color: var(--muted); font-size: 11px; }

/* ---------- bonus ---------- */
.bonus { position: fixed; inset: 0; padding: calc(6px + env(safe-area-inset-top)) 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.bonus-top { display: flex; align-items: center; gap: 10px; }
.bonus-top h2 { margin: 0; flex: 1; font: 800 24px var(--head); color: var(--brass-hi); }
.bonus-top .left { font-size: 16px; color: var(--gold); }
.stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.stagebtn { pointer-events: auto; min-height: 72px; border-radius: 14px; background: linear-gradient(#1f5a72, #10364a); border: 2px solid var(--brass-lo); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.stagebtn b { font-size: 24px; }
.stagebtn small { font-size: 10px; color: var(--muted); }
.stagebtn.done { border-color: var(--gold); }
.stagebtn.locked { filter: saturate(.2) brightness(.6); }
.tap-hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; color: var(--muted); font-size: 14px; }

@media (max-width: 380px) {
  .hel-wrap { width: 58px; height: 58px; }
  .hel-wrap canvas { width: 58px !important; height: 58px !important; }
  .tools { gap: 3px; }
  .tool { min-width: 44px; flex-basis: 52px; }
  .say { left: 64px; }
}
@media (max-height: 700px) {
  .card { gap: 7px; padding: 12px 12px; }
  .card h2 { font-size: 22px; }
  .btn.big { min-height: 50px; font-size: 17px; }
  .lane { min-height: 96px; }
  .helmut-card { width: 72px !important; height: 72px !important; }
}
@media (prefers-reduced-motion: reduce) { .banner, .say, .toast { transition: none; } .pearlbtn { animation: none; } }
