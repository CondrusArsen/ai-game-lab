:root { --ink: #1c1712; --panel: rgba(34, 28, 22, 0.94); --edge: #5a3d22; --moss: #4f8a3a; --gold: #ffd36a; --red: #c0392b; --fog: #c9d8cc; --wisp: #b070ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #5a6e5e; overscroll-behavior: none; touch-action: none; }
body { font-family: 'UI', system-ui, sans-serif; font-weight: 500; color: #fff; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button, #ui input, #screen, #coach { pointer-events: auto; }
#touch { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
.hidden { display: none !important; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; font: 20px sans-serif; color: #fff; background: #3e5444; }
.coin { display: inline-block; width: 0.85em; height: 0.85em; margin-right: 0.25em; vertical-align: -0.08em; background: #f2c94c; box-shadow: inset -0.12em -0.12em 0 #c9902a, inset 0.12em 0.12em 0 #fff2b0; border: 0.08em solid #6b4a12; }
.bask { display: inline-block; width: 1em; height: 0.7em; margin-right: 0.3em; background: #b8863a; border: 0.08em solid #5a3a14; box-shadow: inset 0 0.2em 0 #f2a33a; vertical-align: -0.05em; }
.pill { background: rgba(24, 20, 16, 0.75); border: 2px solid rgba(0, 0, 0, 0.5); padding: 4px 10px; font-size: 17px; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
.pill.small { font-size: 13px; padding: 2px 8px; }
.btn { font-family: inherit; font-weight: 700; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55); background: #7a6a58; border: 3px solid #1b1610; box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.28), inset 4px 4px 0 rgba(255, 255, 255, 0.25); padding: 10px 16px; cursor: pointer; min-height: 46px; }
.btn:active { box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.3); transform: translateY(1px); }
