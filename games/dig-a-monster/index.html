:root { --bg: #17122a; --panel: #241c3c; --panel2: #2f2550; --line: #0a0814; --hi: #4a3d78; --txt: #f1ecff; --mut: #b6abd8; --acc: #ffd84a; --ok: #5fd35a; --bad: #ff5a4a; --blue: #5fb6ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a16; color: var(--txt); font-family: 'Rubik', sans-serif; font-weight: 500; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
#hud, #ui { position: fixed; inset: 0; pointer-events: none; }
#hud > *, #ui > * { pointer-events: auto; }
#coach { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#coach.block { pointer-events: auto; }
#coach .dim { position: fixed; background: rgba(0,0,0,0.55); pointer-events: auto; }
#coach:not(.block) .dim { pointer-events: none; }
#coach .ring { position: fixed; border: 3px solid var(--acc); box-shadow: 0 0 0 3px #000, 0 0 18px var(--acc); pointer-events: none; animation: pulse 0.8s infinite alternate; }
#coach .arrow { position: fixed; width: 32px; text-align: center; font-size: 30px; color: var(--acc); text-shadow: 0 3px 0 #000, 0 0 8px #000; pointer-events: none; }
#coach .bubble, .hintpop { position: fixed; background: #fff8dc; color: #1a1430; border: 3px solid #000; box-shadow: 0 5px 0 #000; padding: 12px 14px; font-size: 17px; line-height: 1.3; pointer-events: auto; }
#coach .bubble b, .hintpop b { color: #a0400a; }
.hintpop { left: 50%; top: 20%; transform: translateX(-50%); width: min(380px, calc(100% - 24px)); z-index: 60; }
.hintpop .btn, #coach .bubble .btn { margin-top: 10px; width: 100%; }
@keyframes pulse { from { opacity: 1 } to { opacity: 0.45 } }
.btn { font-family: inherit; font-size: 18px; font-weight: 700; color: #fff; background: #3f7a3a; border: 3px solid #000; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.3), inset 0 3px 0 rgba(255,255,255,0.25), 0 4px 0 #000; padding: 10px 16px; cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,0.5); min-height: 46px; }
.btn:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 1px 0 #000; }
.btn.alt { background: #4a4170; } .btn.gold { background: #b0821c; } .btn.red { background: #9a3030; } .btn.blue { background: #2f6aa8; }
.btn.ad::before { content: '▶ AD '; font-size: 12px; background: #000; padding: 2px 4px; margin-right: 6px; vertical-align: middle; }
.btn[disabled] { filter: grayscale(1) brightness(0.6); }
.panel { background: var(--panel); border: 3px solid #000; box-shadow: inset 0 0 0 3px var(--hi), 0 6px 0 #000; padding: 14px; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; gap: 10px; }
.modal { position: fixed; inset: 0; background: rgba(5,3,12,0.72); display: flex; align-items: center; justify-content: center; padding: 12px; z-index: 20; }
.modal > .panel { width: min(560px, 100%); max-height: calc(100% - 10px); overflow-y: auto; touch-action: pan-y; }
h1, h2, h3 { margin: 0 0 8px; font-family: 'Press Start 2P', monospace; font-weight: 400; line-height: 1.35; }
h2 { font-size: 18px; color: var(--acc); text-shadow: 0 3px 0 #000; } h3 { font-size: 13px; color: var(--acc); }
p { margin: 6px 0; line-height: 1.35; }
.mut { color: var(--mut); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; }
.ic { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; image-rendering: pixelated; background-size: 100% 100%; }
/* menu */
#menu { justify-content: flex-end; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.logo { position: fixed; top: 4%; left: 0; right: 0; text-align: center; pointer-events: none; }
.logo .t1 { font-family: 'Press Start 2P', monospace; font-size: clamp(26px, 6.2vw, 58px); color: #ffd84a; text-shadow: 0 4px 0 #b05a10, 0 8px 0 #000, 0 0 30px rgba(255,180,60,0.4); letter-spacing: 2px; }
.logo .t2 { font-family: 'Press Start 2P', monospace; font-size: clamp(11px, 2.2vw, 18px); color: #9fe0ff; text-shadow: 0 3px 0 #000; margin-top: 10px; }
.menu-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(520px, 100%); }
.menu-btns .wide { grid-column: span 2; font-size: 22px; min-height: 58px; }
.wallet { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; }
.chip { background: rgba(10,8,20,0.8); border: 2px solid #000; padding: 5px 9px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.corner { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; }
.sq { width: 46px; height: 46px; padding: 0; font-size: 20px; }
/* hud */
.htop { position: fixed; left: 0; right: 0; top: 0; padding: 8px; padding-top: max(8px, env(safe-area-inset-top)); display: flex; gap: 6px; align-items: flex-start; pointer-events: none; }
.htop > * { pointer-events: auto; }
.hbox { background: rgba(10,8,20,0.78); border: 2px solid #000; padding: 4px 7px; display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: 15px; flex-wrap: wrap; }
.hearts .ic { width: 20px; height: 20px; }
.slot { width: 30px; height: 30px; border: 2px solid #5a4d88; background: #120e22; display: inline-flex; align-items: center; justify-content: center; }
.slot img { width: 28px; height: 28px; image-rendering: auto; }
.moon { flex: 1; min-width: 80px; height: 14px; border: 2px solid #000; background: #2a2450; position: relative; align-self: center; }
.moon .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #8fa8ff, #ffd0a0); }
.moon .lab { position: absolute; right: 4px; top: -1px; font-size: 11px; }
.ctrl { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
.ctrl > * { pointer-events: auto; }
.pad { width: 156px; height: 156px; position: relative; touch-action: none; }
.pad b { position: absolute; width: 52px; height: 52px; background: rgba(40,32,70,0.45); border: 3px solid #000; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }
.pad b.on { background: rgba(255,216,74,0.85); color: #000; }
.pad b[data-k=u] { left: 52px; top: 0; } .pad b[data-k=d] { left: 52px; bottom: 0; } .pad b[data-k=l] { left: 0; top: 52px; } .pad b[data-k=r] { right: 0; top: 52px; }
.acts { margin-left: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.abtn { min-width: 112px; font-size: 15px; position: relative; overflow: hidden; }
.abtn .cd { position: absolute; left: 0; bottom: 0; height: 100%; background: rgba(0,0,0,0.55); pointer-events: none; }
.abtn small { display: block; font-size: 10px; opacity: 0.8; }
.big-ab { min-width: 130px; min-height: 64px; font-size: 18px; }
.keys { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--mut); background: rgba(0,0,0,0.5); padding: 4px 8px; pointer-events: none; white-space: nowrap; }
.touch .keys { display: none; }
body:not(.touch) .pad { display: none; }
.gatebar { flex: 1; height: 18px; border: 2px solid #000; background: #2a1414; position: relative; min-width: 90px; }
.gatebar .fill { position: absolute; inset: 0; right: auto; background: linear-gradient(90deg, #c8402a, #f08a3a); }
.gatebar span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 14px; text-shadow: 0 1px 0 #000; }
/* cards / lab */
.card { background: var(--panel2); border: 3px solid #000; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; min-width: 76px; }
.card img { width: 54px; height: 54px; }
.card .nm { font-size: 12px; text-align: center; line-height: 1.1; max-width: 86px; }
.card.sel { box-shadow: 0 0 0 3px var(--acc); }
.card .lv { position: absolute; top: 2px; right: 4px; font-size: 11px; color: var(--acc); }
.card .r { position: absolute; top: 2px; left: 4px; width: 9px; height: 9px; border: 1px solid #000; }
.card.new::after { content: 'NEW'; position: absolute; bottom: -6px; right: -4px; background: var(--bad); font-size: 10px; padding: 1px 3px; border: 2px solid #000; }
#lab { align-items: stretch; justify-content: flex-end; padding: 8px; }
#lab .lp { width: 100%; max-height: 60%; overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 8px; }
@media (orientation: landscape) { #lab { justify-content: center; align-items: flex-end; } #lab .lp { width: min(56%, 620px); max-height: 100%; height: 100%; } }
.slots { display: flex; gap: 6px; justify-content: space-between; }
.slots .card { flex: 1; min-width: 0; }
.inv { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; touch-action: pan-x; }
.inv .card { flex: 0 0 82px; }
.detail { background: #1a1430; border: 2px solid #000; padding: 8px; font-size: 15px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; font-weight: 700; }
.setb { font-size: 13px; color: #9fff9f; }
.tag { display: inline-block; padding: 1px 5px; border: 2px solid #000; font-size: 12px; }
/* dex */
.dexset { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 4px; }
.dexset .card { min-width: 0; padding: 4px; cursor: default; }
.dexset .card img { width: 44px; height: 44px; }
.unk { filter: brightness(0) opacity(0.5); }
.upg { display: flex; gap: 10px; align-items: center; background: #1a1430; border: 2px solid #000; padding: 8px; margin-bottom: 6px; }
.pips { display: flex; gap: 3px; } .pips i { width: 12px; height: 12px; border: 2px solid #000; background: #3a3060; } .pips i.on { background: var(--acc); }
.slider { width: 100%; accent-color: #ffd84a; height: 28px; }
.lb li { display: flex; justify-content: space-between; padding: 4px 6px; border-bottom: 1px solid #3a3060; } .lb li.me { background: #3a3060; }
.lb { list-style: none; padding: 0; margin: 0; }
#load { position: fixed; inset: 0; background: #0c0a16; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 100; font-family: monospace; color: #ffd84a; }
#load .lb2 { width: 200px; height: 14px; border: 2px solid #ffd84a; } #load .lb2 i { display: block; height: 100%; width: 10%; background: #ffd84a; transition: width 0.2s; }
.toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: #fff8dc; color: #1a1430; border: 3px solid #000; padding: 8px 14px; font-weight: 700; z-index: 70; box-shadow: 0 4px 0 #000; pointer-events: none; text-align: center; }
.bigtitle { font-family: 'Press Start 2P', monospace; font-size: clamp(20px, 5vw, 34px); color: var(--acc); text-shadow: 0 4px 0 #000; text-align: center; }
.parts-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
