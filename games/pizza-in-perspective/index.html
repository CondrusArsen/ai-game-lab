:root {
  --ink: rgb(28, 44, 138); --ink-soft: rgba(28, 44, 138, .62); --red: rgb(200, 36, 48); --paper: #fbf9f1;
  --grid: rgba(92, 140, 205, .3);
  --frame: none; --frame2: none; --frame3: none; --frame-red: none;
  --mk-yellow: none; --mk-orange: none; --mk-green: none; --mk-pink: none; --mk-blue: none; --mk-red: none; --mk-gray: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); font-family: "Caveat", "Comic Sans MS", cursive; font-weight: 600; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
#view canvas.layer { position: fixed; left: 0; top: 0; }
#overlay { touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
.sheet { background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 25px 25px; background-position: -1px -1px; }
.fr { border: 16px solid transparent; border-image: var(--frame) 34 / 16px round; }
.fr2 { border: 16px solid transparent; border-image: var(--frame2) 34 / 16px round; }
.fr3 { border: 16px solid transparent; border-image: var(--frame3) 34 / 16px round; }

/* ---------------- HUD */
#hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
#hud > * { pointer-events: auto; }
#order { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 10px; max-width: min(400px, 46vw); line-height: 1; pointer-events: none; }
#order .num { font-size: 30px; display: inline-block; padding: 0 6px; background: var(--mk-yellow); background-size: 80px 80px; transform: rotate(-2deg); }
#order b { display: block; font-size: 25px; margin-top: 4px; }
#order em { display: block; font-style: normal; font-size: 20px; color: var(--ink-soft); }
#order i { display: block; font-style: normal; font-size: 20px; color: var(--red); margin-top: 2px; }
#heat { position: absolute; right: calc(max(14px, env(safe-area-inset-right)) + 46px); top: 10px; width: 210px; pointer-events: none; }
.th-h { font-size: 24px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.th-h b { color: var(--red); }
.th-h svg { width: 26px; height: 26px; flex: none; }
.th-bar { position: relative; height: 34px; margin: 0 0 2px; }
.th-bar i { position: absolute; left: 14px; top: 12px; bottom: 12px; width: 0; transition: width .4s cubic-bezier(.3, 1.4, .5, 1); background: var(--mk-red); background-size: 80px 80px; }
.th-bar.h2 i { background-image: var(--mk-orange); } .th-bar.h1 i { background-image: var(--mk-blue); }
.th-bar::before { content: ""; position: absolute; inset: 0; border: 14px solid transparent; border-image: var(--frame2) 34 / 14px round; }
.th-n { font-size: 20px; color: var(--ink-soft); }
.tl-btns { position: absolute; right: calc(max(14px, env(safe-area-inset-right)) + 268px); top: 8px; display: flex; gap: 6px; }
.ib { width: 56px; height: 56px; display: grid; place-items: center; border: 12px solid transparent; border-image: var(--frame) 34 / 12px round; }
.ib svg { width: 32px; height: 32px; }
.ib:active { transform: translateY(2px) rotate(-3deg); }
#hint { position: absolute; left: 50%; top: 12px; max-width: 40vw !important; transform: translate(-50%, 6px) rotate(-1deg); font-size: 27px; text-align: center; padding: 2px 12px; opacity: 0; transition: .35s; pointer-events: none; max-width: 92vw; background: var(--mk-yellow); background-size: 80px 80px; }
#hint.show { opacity: 1; transform: translate(-50%, 0) rotate(-1deg); }

нопку.","Нашёл кнопку, которую сестра не нашла за три года.","Сестра требует такого же курьера. Не дам, я первая нашла."]},l23:{title:"Защита диссертации",clients:["student"],order:{client:"Лёва, аспирант",addr:"корп. 2, крыша, банкет",what:"Пять больших на банкет"},tip:330,script:{start:[I("Лёва","Я защитился! Банкет на крыше. Лифт, Галина и домофон, как в главе 3.","shock"),x("Глава 3, значит. Я её сейчас пройду без научрука."),w("Защитился он! А пол кто защитит?")],key:[x("Таблетка есть. Лёва, вставь её в приложение к диссертации.")],cleaner:[w("Банкет у них. Крошек будет!"),w("Пять коробок несёт, а ноги не вытер."),w("Я ж только лестницу домыла!"),w("Тут не ходи, там тоже не ходи.")]},review:["Пицца остыла к третьему тосту. Научрук сказал, это метафора.","Довёз пять коробок через Галину. Комиссия бы так не смогла.","Отдельное спасибо в автореферате: «курьеру, доказавшему проходимость»."],outro:"Корпус «Утро» доставлен. Лифт поехал, Галина говорит, что из-за Жоры. Жора не спорит."},l24:{title:"Мост на ночь",clients:["babushka"],order:{client:"Нина Фёдоровна и кот",addr:"корп. 3, пентхаус",what:"Маргарита + рыбка коту"},tip:340,script:{start:[I("Нина Фёдоровна","Милок, мост на ночь развели. Кот ушёл гулять, а я голодная."),x("Мост развели. Ничего, сведу. Я всех свожу.")]},review:["Мост свёл, кот вернулся и съел мою пиццу. Ну, хоть кто-то сытый.","Пришёл поздно, но ночью все курьеры поздние.","Мост сводит, кота не пугает, бабушек уважает. Внучку бы ему."]},l25:{title:"Ночная смена",clients:["guard"],order:{client:"Степаныч, охрана ЖК",addr:"корп. 3, ночной пост",what:"Острая, чтобы не уснуть"},tip:350,script:{start:[I("Степаныч","Ночная смена. Таблетка на крыше, мост поднят. Так спроектировали.","worry"),x("Степаныч, у вас всё так спроектировали. Я начинаю уважать проект.")],key:[x("Таблетка. Теперь мост опускаем, и вы снова не спите.")]},review:["Пока нёс, я задремал. Острая не помогла, остыла.","Разбудил вовремя. Чуть не проспал свой же пост.","Острая, горячая, вовремя. Смену отстоял как молодой."]},l26:{title:"Два штурвала",clients:["blogger"],order:{client:"Кристина, блогер",addr:"корп. 3, балкон 12",what:"Две маленькие, для сравнения"},tip:360,script:{start:[I("Кристина","Ночной стрим! Тут два поворотных моста, чат ставит на то, что ты запутаешься."),x("Чат проиграет. Два штурвала, одна голова. Моя хорошая.")]},review:["Чат выиграл. Курьер крутил не тот штурвал девять раз.","Запутался один раз, но красиво. Чат простил.","Чат проиграл и задонатил курьеру. Я в шоке, он в шоке."]},l27:{title:"Ночной жор",clients:["student"],order:{client:"Дима, студент",addr:"корп. 3, кв. 3 (общага друзей)",what:"Самая большая, на всех"},tip:370,script:{start:[I("Дима","Три часа ночи, сессия, мы голодные. Лифт тут есть, но мост поднят.","worry"),x("Лифт до моста, мост до вас. Сессия подождёт, пицца нет.")]},review:["Приехал к четырём утра. Мы уже поели доширак.","Приехал вовремя, один друг уже спал. Ему досталось меньше.","Пицца в три ночи — это любовь. Сдали сессию на её энергии."]},l28:{title:"Ночная уборка",clients:["babushka"],order:{client:"Валентина Петровна",addr:"корп. 3, крыша",what:"С курицей, в звездопад"},tip:380,script:{start:[I("Валентина Петровна","Сынок, звездопад! Я на крыше третьего, мост тут от кнопки."),w("Ночью мою, когда никто не ходит. Ты кто такой?"),x("Я тот, кто ходит, когда никто не ходит.")],cleaner:[w("Ночью-то зачем по мытому?"),w("Фонарь мне не загораживай!"),w("Луна светит, пол блестит, а ты топчешь."),w("Думала, хоть ночью отдохну от тебя.")],autoLine:"Мост не крутится. Ночью все мосты на кнопках, видимо."},review:["Звездопад пропустила, смотрела, как курьер ищет кнопку.","Принёс к последней звезде. Загадала, чтобы пиццу привозили быстрее.","Звёзды падали, курьер не упал. Загадала его в следующий раз."]},l29:{title:"Стрим-квест",clients:["blogger","blogger","blogger"],order:{client:"Кристина, блогер",addr:"корп. 3, балкон 4",what:"Пепперони, три куска на три кадра"},tip:390,script:{start:[I("Кристина","Стрим-квест! Каждый раз, когда ты приходишь, я перехожу. Чат в восторге."),x("Вот как. Ну, бегать за звёздами мне не впервой.","smug")],goal1:[I("Кристина","Чат проголосовал за балкон выше! Бегу!","shock"),x("Я не подписывался на интерактив.","angry")],goal2:[I("Кристина","Последний раз, честно! Чат хочет крышу.","shock"),x("Крыша. Чат знает, что у чата нет ног?","angry")]},review:["Чат гонял его полчаса. Пицца ушла холодной, а лайки горячие.","Догонял меня на трёх балконах. Чат назвал его «босс квеста».","Квест пройден за рекорд. Чат требует, чтобы я больше не бегала."]},l30:{title:"Репетиция приёмки",clients:["guard"],order:{client:"Степаныч, охрана ЖК",addr:"корп. 3, двор",what:"Ассорти для комиссии"},tip:400,script:{start:[I("Степаныч","Завтра приёмка. Сегодня проверяем всё: мост, домофон, Галину.","worry"),x("Галину проверять? Это она нас всех проверяет."),w("Я слышала! Мою с удвоенной силой!")],key:[x("Таблетка нашлась. Комиссия бы её до весны искала.")],cleaner:[w("Комиссия придёт, а тут следы!"),w("Я к приёмке готовлюсь двадцать лет."),w("Ох, кружит, ох, кружит."),w("Если комиссия поскользнётся, это ты.")],autoLine:"Тут штурвал не поможет. Кнопка где-то на крыше, как положено."},review:["Репетиция провалена: пицца остыла, Галина в ярости.","Комиссию бы такой курьер устроил. Галину почти устроил.","Репетиция прошла лучше, чем пройдёт приёмка. Пишу ему благодарность."],outro:"Степаныч: «Завтра архитектор лично заказал. Говорит, на крышу. Готовься, сынок.»"},l31:{title:"Синергия",clients:["businessman"],order:{client:"Олег Палыч, инвестор",addr:"корп. 4, шоурум",what:"Пицца-стартап, без глютена и без смысла"},tip:410,hint:"Бирюзовое ходит парой: крутишь один штурвал — двигаются оба механизма.",script:{start:[I("Олег Палыч","Я вложился в корпус 4. Тут всё синергично: один штурвал, два моста."),x("Синергия. Это когда два моста и ни одного послушного.","angry"),x("Ладно. Бирюзовые ходят парой, значит, думаю за двоих.")]},review:["Курьер не масштабируется. Ходов было больше, чем у меня стартапов.","Средний результат. Как мой третий стартап.","Беру его в совет директоров. Он единственный понял сцепку."]},l32:{title:"Домашка про мосты",clients:["schoolgirl"],order:{client:"Соня, 5 «Б»",addr:"корп. 4, кв. 24",what:"Маленькая сырная, мама разрешила"},tip:415,script:{start:[I("Соня","Мне задали нарисовать мост. Я нарисовала два, они связаны. Как у нас во дворе."),x("Соня, ставлю пять. Сейчас проверю на практике.")]},review:["Пиццу ждала дольше, чем решала задачу. А задача была сложная.","Курьер нормальный. Учительница сказала, мой рисунок слишком реалистичный.","Получила пятёрку за мост! Курьеру тоже пять, только у меня нет журнала."]},l33:{title:"Сам варил",clients:["grandpa"],order:{client:"Михалыч, прораб на пенсии",addr:"корп. 4, лавочка на крыше",what:"Мясная, как в девяностые"},tip:420,script:{start:[I("Михалыч","Я этот корпус строил. Сцепку сам варил, по чертежу. Чертёж был нарисован с похмелья."),x("Михалыч, вы гений. Злой гений, но гений.")]},review:["В наше время курьеры по стенам не ходили. И правильно делали.","Шёл долго, но шов на сцепке не тронул. Уважаю.","Прошёл мою сцепку с первого раза. Я с первого раза её не сварил."]},l34:{title:"Стрим под дождём",clients:["blogger"],order:{client:"Кристина, блогер",addr:"корп. 4, открытая терраса",what:"Пицца под крышкой, чтобы не намокла"},tip:425,script:{start:[I("Кристина","Атмосферный стрим под дождём! Неси быстро, у меня тушь не водостойкая.","worry"),x("Дождь — не повод. Я и в сухую погоду мокрый от бега.")]},review:["Пицца размокла, тушь потекла, стрим залайкали из жалости.","Пришёл под дождём, как в клипе. Только пицца не как в клипе.","Самый атмосферный выпуск! Курьер в кадре мокрый и гордый."]},l35:{title:"У подружки",clients:["schoolgirl","schoolgirl"],order:{client:"Соня, 5 «Б»",addr:"корп. 4, кв. 24",what:"Две маленькие, вторая подружке"},tip:430,script:{start:[I("Соня","Я дома! Наверное. Мама сказала не открывать незнакомым. Ты знакомый?"),x("Соня, я самый знакомый курьер в этом ЖК.")],goal1:[I("Соня","Ой, я уже у Лизы! Она напротив, только выше. И вбок.","shock"),x("«Напротив, выше и вбок». Пятый класс, а маршруты как у Эшерова.","angry")]},review:["Пока он ходил, мы с Лизой поссорились и помирились.","Пицца дошла и до меня, и до Лизы. Лиза съела больше.","Лиза сказала, что такой курьер бывает только в мультиках. Ха, у нас настоящий."]},l36:{title:"Контрольная закупка",clients:["rival"],order:{client:"Вадик, «Самокат-Экспресс»",addr:"корп. 4, крыльцо",what:"Маргарита, на время"},tip:435,script:{start:[I("Вадик","Это я, Вадик. Заказал у вас, чтобы засечь. Секундомер пошёл.","smug"),x("Вадик заказывает в «Вавилоне». Шеф будет счастлив."),x("Засекай, Вадик. Только не моргай.")]},review:["Медленно. В «Самокате» было бы медленнее, но это секрет.","Нормально. Ничего особенного. Я сам почти так же умею. Почти.","Ладно. Быстро. Не говорите моему шефу, что мне понравилось."]},l37:{title:"Зонтик на посту",clients:["guard"],order:{client:"Степаныч, охрана ЖК",addr:"корп. 4, пост под навесом",what:"Горячий кальцоне, греть руки"},tip:440,script:{start:[I("Степаныч","Перевели в корпус 4. Тут мосты по двое ходят, как патруль."),x("Патруль я уважаю. Сейчас разведу их по позициям.")]},review:["Руки не согрел, кальцоне остыл. Пост держал зря.","Пришёл мокрый, но с горячим. Дал ему подержать зонтик.","Сцепку прошёл, как по уставу. Буду рекомендовать в охрану."]},l38:{title:"Питч на крыше",clients:["businessman"],order:{client:"Олег Палыч, инвестор",addr:"корп. 4, крыша-лаунж",what:"Восемь кусков для питча"},tip:450,script:{start:[I("Олег Палыч","У меня питч на крыше. Инвесторы голодные, а голодный инвестор не инвестирует.","worry"),x("Олег Палыч, моя пицца поднимет вам раунд.")]},review:["Инвесторы ушли голодными. Раунд не подняли. Курьера не виню. Виню.","Пришёл к середине презентации. Пицца сработала как слайд с графиком вверх.","Подняли раунд. Инвесторы спросили, можно ли вложиться в курьера."]},l39:{title:"Ухаживание",clients:["grandpa","babushka"],order:{client:"Михалыч, прораб на пенсии",addr:"корп. 4, кв. 40",what:"Две: мне и даме"},tip:455,script:{start:[I("Михалыч","Сынок, одну мне, вторую неси Валентине Петровне. Я ухаживаю. Скажи, от меня."),x("Михалыч, я курьер, а не купидон. Но для вас сделаю исключение.")],goal1:[I("Валентина Петровна","От Михалыча? Ох. Неси на крышу, я там с зонтиком.","shock"),x("Любовь, дождь и крыша. Классический маршрут.")]},review:["Валентина говорит, пицца остыла, как мои чувства. Я обиделся.","Дошло обеим сторонам. Валентина улыбнулась. Это прогресс.","Валентина согласилась на прогулку! Курьеру буду должен до пенсии."]},l40:{title:"Конкурс курьеров",clients:["businessman"],order:{client:"Олег Палыч, инвестор",addr:"корп. 4, крыша, пентхаус",what:"Пицца-тест на эксклюзив"},tip:460,script:{start:[I("Олег Палыч","Сравниваю две службы. Вадик выехал раньше тебя. Сорок минут ездит вокруг."),x("Вокруг Вадик ездит хорошо. Внутрь пока ни разу.")]},review:["Медленнее, чем я ожидал. Но Вадик до сих пор едет.","Хорошо. Вадик, кстати, прислал фото забора.","Победа «Вавилона» в корпусе 4. Вадику дадим утешительный самокат."],outro:"Корпус «Дождь» доставлен. Вадик всё ещё ищет вход и называет сцепку «нечестной»."},l41:{title:"Ничей кот",clients:["babushka"],order:{client:"Нина Фёдоровна",addr:"корп. 5, кв. 5",what:"Маргарита, без сосисок, это не мне"},tip:470,hint:"Рыжий Барсик перебегает при каждом повороте дома и садится на дорожку. Сквозь кота не пройти.",script:{start:[I("Нина Фёдоровна","Милок, рыжий на дорожке не мой. Мой Тимофей дома. Этот Барсик ничей, его все кормят."),x("Ничей кот на моей дорожке. Посмотрим, кто тут чей.")],cat:[w("Мяу. (Это моя дорожка.)","cat"),w("Мрр. (Тут тепло от трубы.)","cat"),w("Мяу? (А что в коробке?)","cat"),w("…(смотрит, не мигая)","cat"),w("Мррмяу. (Повернёшь ещё раз — пересяду.)","cat")]},review:["Барсик сидел на дорожке дольше, чем я жду пенсию.","Пицца дошла. Барсик пытался дойти вместе с ней.","Кота обошёл, Тимофею привет передал. Золотой ма  Значит, у меня два шанса успеть."),x("Валентина Петровна, вы со мной с первого заказа. Не подведу.")],key:[x("Таблетку достал. Валентина Петровна, это, считайте, юбилейная.")],cleaner:[w("Шестидесятый этаж! И сюда натаскали!"),w("Валентина опять загорает на мытом."),w("Иди, иди, к закату не опоздай."),w("Ты молодец. Это я так, не привыкай.")],cat:[w("Мяу. (Я тоже на закат.)","cat"),w("Мрр. (Отсюда видно все дорожки. Сажусь на твою.)","cat"),w("…(смотрит на закат, загораживая проход)","cat"),w("Мяу. (Красиво. Ладно, проходи.)","cat")],autoLine:"Мост на кнопке даже на шестидесятом. Застройщик последователен."},review:["Первый закат пропустил. Второй тоже. Пицца была вкусная.","Успел ко второму закату. Посидели, помолчали. Хорошо.","Как в первый раз: Маргарита, закат, мальчик по воздуху. Только теперь я не удивляюсь."]},l60:{title:"Пентхаус Эшерова",clients:["architect","architect"],order:{client:"Эдуард Эшеров, архитектор",addr:"корп. 6, пентхаус",what:"Кальцоне, сложенная в ленту Мёбиуса"},tip:650,script:{start:[I("Эдуард Эшеров","Мой пентхаус — единственная квартира, в которую нельзя попасть ни с какой точки зрения.","smug"),x("Эдуард, с вашей — нельзя. А у меня своя."),x("Все мосты, все кнопки, Галина и кот. Пицца, держись.")],goal1:[I("Эдуард Эшеров","Вы у двери. Но квартира не за дверью. Она над. Или под. Я сам не уверен.","worry"),x("Вы не уверены, а я уверен. Это и есть разница между нами.")],key:[x("Таблетка от пентхауса. Лежала на крыше. Конечно на крыше. Где ж ещё.")],cleaner:[w("Я и у архитектора мою. Он мне тоже не нравится."),w("Последний этаж! Последняя тряпка!"),w("Жёлтенький, ты дошёл. Я так и знала."),w("Вертят, вертят. Как он его вообще нарисовал?"),w("Иди уже. Пол потом помою.")],cat:[w("Мяу. (Пентхаус мой. Эшеров живёт у меня.)","cat"),w("Мрр. (Отсюда все точки зрения видно.)","cat"),w("…(сидит на последней клетке перед дверью)","cat"),w("Мяу. (Ладно, курьер. Ты прошёл. Уважаю.)","cat")],autoLine:"Последний мост, и тот на кнопке. Эдуард, вы послед у «Самокат-Экспресс». Вадик."},{who:"me",text:"Вадик, ты на самокате по прямой не попадаешь. А тут прямых нет."}]},4:{open:[{who:"boss",text:"Корпус 4 «Дождь». Застройщик сэкономил: один штурвал на два механизма."},{who:"boss",text:"Условие ЖК: кто доставит во все новые корпуса, тот получит эксклюзив. Мы или Вадик."},{who:"me",text:"Шеф, Вадик пусть сначала в лужу перестанет въезжать."},{who:"rival",text:"Уже въехал. Это было тактически."},{who:"boss",text:"Бирюзовые штуки ходят парой. Думай на два хода вперёд, а не на полтора."}],done:[{who:"boss",text:"Олег Палыч доволен. Вадик сорок минут ехал вокруг корпуса."},{who:"rival",text:"Это была разведка."},{who:"me",text:"Разведка, Вадик, это когда потом всё-таки приезжаешь."},{who:"boss",text:"Дальше «Зима». И там кот. Я предупредил."}]},5:{open:[{who:"boss",text:"Корпус 5 «Зима». Отопление включили, но, похоже, только для кота."},{who:"me",text:"Какого кота?"},{who:"boss",text:"Барсик. Ничей, рыжий. Садится ровно туда, куда тебе надо."},{who:"me",text:"Шеф, коты меня любят."},{who:"boss",text:"Этот любит дорожки. Тебя он любит во вторую очередь."}],done:[{who:"boss",text:"«Зима» доставлена. Барсик теперь ждёт тебя у подъезда."},{who:"me",text:"Он ждёт сосиски. Я не обольщаюсь."},{who:"rival",text:"Я его тоже кормил, между прочим. Он меня всё равно не пропускал."},{who:"boss",text:"Остался последний корпус. Башня Эшерова. Пентхаус на самом верху."}]},6:{open:[{who:"boss",text:"Башня Эшерова. Тут всё сразу: мосты, лифты, кнопки, Галина и кот."},{who:"me",text:"Шеф, у меня ощущение, что я всю жизнь сюда шёл."},{who:"boss",text:"Эшеров говорит, в его квартиру нельзя попасть ни с какой точки зрения."},{who:"me",text:"Значит, найду не «какую», а свою."},{who:"rival",text:"Удачи. Я уже на втором этаже. Кажется. Или на минус втором."}],done:[{who:"boss",text:"Жора. Эшеров подписал. Эксклюзив на всю «Перспективу» наш."},{who:"me",text:"Шеф, было несложно. Ну, кроме кота. И Галины. И Вадика."},{who:"rival",text:"Ладно, «Вавилон», признаю. Только скажи честно: как ты вошёл?"},{who:"me",text:"Вадик, я просто посмотрел с правильной стороны. Приходи, научу."},{who:"boss",text:"Эшеров заказал ещё. Говорит, строит «Перспективу-3». На облаках."},{who:"me",text:"Если выглядит как облако — это облако."},{who:"boss",text:"Ты так говорил про мост на МКАДе. Премия на карте. Горячая."}]}},ma=[{id:1,n:"1",title:"Корпус 1 «Закат»",sub:"Сдан. Почти.",need:0},{id:2,n:"2",title:"Корпус 2 «Утро»",sub:"Лифт в IV квартале",need:14},{id:3,n:"3",title:"Корпус 3 «Ночь»",sub:"Тут живёт архитектор",need:34},{id:4,n:"4",title:"Корпус 4 «Дождь»",sub:"Один штурвал на двоих",need:58},{id:5,n:"5",title:"Корпус 5 «Зима»",sub:"Отопление для кота",need:86},{id:6,n:"6",title:"Башня Эшерова",sub:"Входа нет. С любой точки зрения",need:116}],ka=[{name:"Стажёр",need:0,perk:"Знает, где лево. Иногда."},{name:"Курьер",need:20,perk:"Уже не путает подъезд с балконом."},{name:"Старший курьер",need:55,perk:"Галина здоровается первой."},{name:"Навигатор",need:100,perk:"Видит мосты там, где их нет. И они появляются."},{name:"Легенда «Вавилона»",need:150,perk:"Про него рассказывают новичкам. Половина — правда."}],ba=["Жора, ты теперь Курьер. Без «стажёра» в бейдже. Не потеряй бейдж.","Старший курьер! Можешь гонять стажёров. Только не по иллюзиям, они не вернутся.","Навигатор. Даже навигатор в приложении спрашивает у тебя дорогу.","Легенда «Вавилона». Повесим твою кепку в зале. Носи пока запасную."],ya=[{id:"first",name:"Первый кусок",desc:"Первая доставка",reward:{money:100}},{id:"par10",name:"Ни шагу лишнего",desc:"10 доставок ровно в норму",reward:{money:300}},{id:"stars3all1",name:"Закат на отлично",desc:"Все три звезды на каждом уровне корпуса 1",reward:{money:400}},{id:"corp3",name:"Акт подписан",desc:"Пройден корпус 3",reward:{wear:"cap-act"}},{id:"illusion100",name:"Ходок по картинке",desc:"100 переходов по иллюзии",reward:{money:500}},{id:"cleaner5",name:"Почти свой",desc:"5 уровней с уборщицей",reward:{wear:"cap-mop"}},{id:"cat5",name:"Кошачий друг",desc:"5 уровней с котом",reward:{wear:"cap-cat"}},{id:"noHint20",name:"Сам с усам",desc:"20 уровней без подсказок",reward:{money:600}},{id:"daily3",name:"Три дня подряд",desc:"3 заказа дня подряд",reward:{money:300}},{id:"daily10",name:"Постоянный клиент",desc:"10 заказов дня всего",reward:{money:700}},{id:"rich",name:"Чаевой магнат",desc:"Накопить 5000 ₽ за всё время",reward:{money:500}},{id:"legend",name:"Легенда",desc:"Ранг «Легенда»",reward:{wear:"cap-legend"}}],xa=[{kind:"babushka",name:"Валентина Петровна",who:"пенсионерка, корпус 1",quote:"Сынок, я на крыше. Лифта нет и не будет.",fact:"Загорает круглый год. Говорит, на крыше ближе к солнцу, а дома ближе к счётчику."},{kind:"student",name:"Дима",who:"студент, корпус 1",quote:"Ой, я не дома. Сорян))",fact:"Ни разу не принял заказ там, где его оформил. Рекорд — четыре квартиры за вечер."},{kind:"student",name:"Лёва",who:"аспирант, затем кандидат наук, корпус 2",quote:"Курьер только что опроверг мою диссертацию.",fact:"Защитил диссертацию по топологии ЖК. В приложении есть таблетка от домофона."},{kind:"blogger",name:"Кристина",who:"блогер, 2 млн просмотров",quote:"Я в прямом эфире, зайди красиво!",fact:"Снимает всё. Самый популярный ролик — где курьер ходит по стене. Чат до сих пор считает это монтажом."},{kind:"guard",name:"Степаныч",who:"охрана ЖК, все корпуса",quote:"Так спроектировали.",fact:"Двадцать лет на посту. Ни разу не нажал кнопку «Не трогать». Однажды очень хотел."},{kind:"cleaner",name:"Галина",who:"уборщица, все корпуса",quote:"Куда по мытому!",fact:"Её тряпка старше ЖК. Моет даже потолки, потому что знает, кто по ним ходит."},{kind:"babushka",name:"Нина Фёдоровна и кот",who:"пенсионерка с котом Тимофеем, корпус 3",quote:"Милок, мост у нас разводной, как в Питере.",fact:"Кормит всех котов ЖК. Тимофей ревнует, Барсик пользуется."},{kind:"architect",name:"Эдуард Эшеров",who:"главный архитектор «ПерспективСтрой»",quote:"Мой дом нельзя пройти. Его можно только правильно увидеть.",fact:"Чертит без ластика. Говорит, ошибок не бывает, бывают точки зрения."},{kind:"businessman",name:"Олег Палыч",who:"айтишник-инвестор, корпус 4",quote:"Это не баг, это фича. Я сам придумал.",fact:"Вложился в корпус 4 после презентации из одного слайда: «Всё зависит от точки зрения»."},{kind:"schoolgirl",name:"Соня",who:"ученица 5 «Б», корпус 4",quote:"Мама сказала не открывать незнакомым. Ты знакомый?",fact:"Нарисовала сцепку из корпуса 4 раньше, чем её сварили. Получила пять."},{kind:"grandpa",name:"Дед Михалыч",who:"прораб на пенсии, строил корпуса 4–6",quote:"Говорил Эшерову: где низ? А он: смотря как посмотреть.",fact:"Сам варил сцепку и ставил котельную на крышу. Ухаживает за Валентиной Петровной."},{kind:"rival",name:"Вадик",who:"курьер «Самокат-Экспресс»",quote:"Это была разведка.",fact:"Объехал все корпуса по кругу. Внутрь не попал ни разу, зато знает каждый забор."},{kind:"cat",name:"Барсик",who:"кот, ничей, корпус 5 и далее",quote:"Мяу. (Это моя дорожка.)",fact:"Рыжий. Садится ровно на ту клетку, куда тебе надо. Перебегает при каждом повороте дома."},{kind:"boss",name:"Шеф Арам",who:"владелец «Пиццы Вавилон»",quote:"Ты так говорил про мост на МКАДе.",fact:"Ни разу не был в «Перспективе». Говорит, ему хватает чата."}],va=[{id:"nav",name:"Навигатор",desc:"Три подсказки следующего хода. Голос как у шефа, но вежливее.",price:150},{id:"bag",name:"Термосумка",desc:"+25 % чаевых навсегда. Пицца остывает медленнее, клиенты добреют быстрее.",price:800},{id:"scooter",name:"Самокат",desc:"Жора ходит быстрее. Не как у Вадика: этот заезжает внутрь.",price:500}],Ma=[{id:"cap-rain",name:"Дождевик",cap:"#3fa7d6",brim:"#2a6f99",bag:"#9fd8f0",bagDark:"#3fa7d6",price:400},{id:"cap-teal",name:"Бирюзовая сцепка",cap:"#2ec4b6",brim:"#1a8a80",bag:"#2ec4b6",bagDark:"#1a8a80",price:600},{id:"cap-snow",name:"Снегурочка",cap:"#f2f6fa",brim:"#b9c8d8",bag:"#dce8f2",bagDark:"#9fb3c8",price:800},{id:"cap-sunset",name:"Закатный",cap:"#ff8a5b",brim:"#d4573a",bag:"#ffc23d",bagDark:"#e8a21e",price:1e3},{id:"cap-pink",name:"Для стрима",cap:"#ff7eb6",brim:"#d44f8c",bag:"#ffd1e6",bagDark:"#ff7eb6",price:1300},{id:"cap-brick",name:"Прорабский",cap:"#f2b33d",brim:"#8a5a2b",bag:"#c0603a",bagDark:"#8a3f24",price:1800},{id:"cap-tower",name:"Башня Эшерова",cap:"#1d1b2e",brim:"#0e0d18",bag:"#c9a14a",bagDark:"#8f6f2a",price:2500},{id:"cap-act",name:"Акт приёмки",cap:"#e23b3b",brim:"#8e1f2a",bag:"#f4ead2",bagDark:"#cfc2a0",price:null,ach:"corp3"},{id:"cap-mop",name:"Почти свой",cap:"#6b8fd6",brim:"#3f5ea8",bag:"#b8c9ea",bagDark:"#6b8fd6",price:null,ach:"cleaner5"},{id:"cap-cat",name:"Рыжий",cap:"#f28c28",brim:"#c2611a",bag:"#f6b26b",bagDark:"#d9822f",price:null,ach:"cat5"},{id:"cap-legend",name:"Легенда «Вавилона»",cap:"#ffd36b",brim:"#d9a630",bag:"#ffd36b",bagDark:"#b8862a",price:null,ach:"legend"}],Ta={clients:[{kind:"babushka",name:"Валентина Петровна",addr:"корп. 1, крыша"},{kind:"student",name:"Дима",addr:"корп. 1, «где-то у друга»"},{kind:"student",name:"Лёва",addr:"корп. 2, кв. 64"},{kind:"blogger",name:"Кристина",addr:"корп. 3, балкон со светом"},{kind:"guard",name:"Степаныч",addr:"КПП, будка у шлагбаума"},{kind:"babushka",name:"Нина Фёдоровна",addr:"корп. 3, пентхаус"},{kind:"businessman",name:"Олег Палыч",addr:"корп. 4, шоурум"},{kind:"schoolgirl",name:"Соня",addr:"корп. 4, кв. 24"},{kind:"grandpa",name:"Михалыч",addr:"корп. 5, котельная на крыше"},{kind:"rival",name:"Вадик",addr:"у забора, снаружи"},{kind:"babushka",name:"Зоя Ивановна",addr:"корп. 2, кв. 112"},{kind:"architect",name:"Эдуард Эшеров",addr:"Башня, этаж «смотря как посмотреть»"}],dishes:["Маргарита, 30 см","Пепперони, двойная","Четыре сыра, без пятого","Гавайская, ананас под вопросом","Грибная, порезать мелко-мелко","Мясная, как на стройке","Карбонара, с яйцом посередине","Овощная, кабачки отдельно","Кальцоне, сложить правильно","Острая, чтобы проснуться","Сырная маленькая, мама разрешила","Пицца-сердечко, для рилса","С трюфелем, для имиджа","Колбасная, большая, на смену","Две маленьких вместо одной большой","Пицца дня, сюрприз от шефа","Пицца с клюквой, зимняя","Маргарита + сосиски коту","Ассорти, на всех, кто дома","Пицца в форме моста"],start:[x("Заказ дня. Двойные чаевые. Двойная уверенность."),x("Сегодняшний маршрут я вижу с закрытыми глазами. Открою на всякий."),x("Новый день, старый ЖК, тот же я. Поехали."),x("Пицца горячая, я горячее. Посмотрим, кто первый остынет."),x("Заказ дня. Значит, сегодня я тоже звезда дня."),x("Если выглядит как маршрут — это маршрут."),x("Двойные чаевые за одну доставку. Арифметика мне нравится."),x("Шеф сказал «сложный адрес». Шеф всегда так говорит."),x("Сегодня без подсказок. Ну, может, одну."),x("Каждый день новый заказ. А дом тот же упрямый."),x("Кручу, иду, доставляю. Три глагола моей карьеры."),x("Я уже знаю, где ошибусь. Поэтому не ошибусь."),x("Ещё один день, ещё одна точка зрения."),x("Серия — это когда каждый день. Я и так каждый день."),x("Галина, кот, Вадик — кто сегодня? Неважно, пицца едет.")],reviews:[["Ждал так долго, что успел передумать и снова заказать.","Пицца холодная, курьер горячий. Не тот баланс.","Курьер был у моего подъезда. Но в другой перспективе.","Он крутил мой дом, как кубик Рубика. Кубик победил.","Привёз в соседнюю квартиру. Соседи благодарят.","Пицца ехала дольше, чем мне сдают квартиру.","Видел его на стене. Пиццу видел позже.","Сказал «два шага». Шагов было сорок.","Холодно, но вежливо. Как в декабре в корпусе 5.","Отзыв пишу, пока доедаю холодное. Курьер уже улыбается следующему."],["Пришёл не сразу, но пришёл. Для этого ЖК — уже успех.","Пицца тёплая, как отношения с соседями.","Пару раз свернул не туда, зато красиво.","Опоздал немного. Зато рассказал, как шёл. Было интересно.","Нормально. Я бы сам не дошёл, так что нормально.","Тёплая, а курьер бодрый. Пойдёт.","Чуть дольше, чем хотелось, чуть быстрее, чем боялся.","Мост поворачивал лишний раз. Видимо, для эффекта.","Неплохо. Галина ругалась, но несильно.","Средне, но с улыбкой. Улыбка, кстати, лучше среднего."],["Горячая! Курьер пришёл по воздуху, как в рекламе ЖК.","Быстрее, чем застройщик обещает лифт.","Курьер прошёл мой дом лучше, чем я сам его знаю.","Ни одного лишнего шага. Даже кот удивился.","Пицца горячая, курьер скромный. Шучу, курьер не скромный.","Доставка с правильной точки зрения. Пять из пяти.","Пришёл, подмигнул, исчез за иллюзией. Магия.","Буду заказывать каждый день. Ради шоу с поворотами.","Горячо и вовремя. Галина даже не успела крикнуть.","Лучший курьер ЖК. Вадик, извини."]]}});var X=(t,e,a)=>t+","+e+","+a,yt=t=>t.split(",").map(Number);function Ut(t){let e=-t*Math.PI/2,a=Math.round(Math.cos(e)),s=Math.round(Math.sin(e));return[a*1+s*1,1,-s*1+a*1]}function et(t,e){return t.blocks.map(([a,s,n])=>at(t,e,a,s,n))}function at(t,e,a,s,n){if(t.type==="slider")return[a+t.step[0]*e,s+t.step[1]*e,n+t.step[2]*e];let[o,r,c]=t.pivot,l=a-o,p=s-r,h=n-c;for(let i=0;i<(e%4+4)%4;i++)t.axis==="y"?[l,h]=[h,-l]:t.axis==="x"?[p,h]=[-h,p]:[l,p]=[-p,l];return[l+o,p+r,h+c]}function Vt(t){return{r:t.r0||0,g:(t.groups||[]).map(e=>e.k0||0),gd:(t.groups||[]).map(()=>1),at:t.start.slice(),on:t.startGroup??-1,keys:0,open:(t.doors||[]).map(()=>!1),got:(t.keys||[]).map(()=>!1),stage:0,turns:0,clean:0,cat:0,done:!1}}function pa(t,e){let a=new Map;for(let s of t.blocks)a.set(X(s[0],s[1],s[2]),-1);return(t.groups||[]).forEach((s,n)=>{for(let o of et(s,e[n]))a.set(X(...o),n)}),a}function Ht(t,e,a){for(let n=0;n<t.length;n+=3){let o=1e-4,r=1e9,c=!0;for(let l=0;l<3;l++){let p=t[n+l]-.497,h=t[n+l]+.497;if(a[l]===0){if(e[l]<p||e[l]>h){c=!1;break}continue}let i=(p-e[l])/a[l],u=(h-e[l])/a[l];if(i>u&&([i,u]=[u,i]),i>o&&(o=i),u<r&&(r=u),o>r){c=!1;break}}if(c)return!0}return!1}var ha=[[0,0],[.3,.3],[.3,-.3],[-.3,.3],[-.3,-.3]],da=[[1,0],[-1,0],[0,1],[0,-1]];function u1(t,e,a){t._cache??=new Map;let s=e+"|"+a.join(",");if(t._cache.has(s))return t._cache.get(s);let n=pa(t,a),o=Ut(e),r=[];for(let i of n.keys())r.push(...yt(i));let c=new Map;for(let[i,u]of n){let[k,f,g]=yt(i);if(n.has(X(k,f+1,g))||t.noWalk&& ,"smug"),p0("Мостик повёрнут не туда. Видимо, ждёт, пока его покрутят.","smug")]},review:["Зашёл в кадр задом, но пицца в кадре. 3 тыс. просмотров.","Сам открыл мне мост, сам закрыл, сам себе похлопал. Эстетика.","Подписчики спрашивают, где взять такого курьера. Не дам."]},l5:{order:{client:"Лёва, аспирант",addr:"корп. 2, 4 этаж",what:"Карбонара, двойной сыр"},tip:180,hint:"Лифт ездит от штурвала. Встань на него и крути.",script:{start:[fa("Жора, в корпусе 2 лифт обещали в IV квартале.","worry"),p0("Шеф, я и есть лифт.","smug"),P0("Лёва","Лифт работает, но не до конца. Дальше по ощущениям.")]},review:["Лифт поехал впервые с момента сдачи дома. Спасибо курьеру и физике.","Пиццу привезли на лифте, которого официально нет.","Я пишу диссертацию по топологии. Курьер её только что опроверг."]},l6:{order:{client:"Зоя Ивановна",addr:"корп. 2, кв. 112",what:"Грибная, нарезать мелко"},tip:200,script:{start:[a1("Куда по мытому! Только помыла!"),p0("Галина, я по воздуху. Пол даже не узнает.","smug"),p0("Она переходит, когда я кручу дом. Подгадаю.","smug")],cleaner:[a1("Обходи, касатик, обходи."),a1("Я тут с шести утра, между прочим."),a1("Опять кружит! Голова от него кружится."),a1("Следы вижу! По стене ходил!")]},review:["Галина говорит, что следы на потолке — его. Пицца хорошая.","Пришёл не по мытому. Галина довольна, я тоже.","Курьер обошёл уборщицу Галину. Никто никогда не обходил Галину."]},l7:{order:{client:"Степаныч, охрана ЖК",addr:"корп. 2, шлагбаум",what:"Шаурма-пицца (не спрашивайте)"},tip:220,hint:"Наступи на кнопку — мост развернётся.",script:{start:[P0("Степаныч","Мост опускается кнопкой. Кнопка на соседней крыше. Так спроектировали.","shock"),p0("Кнопка от моста на другой крыше. Отлично. Просто отлично.","angry")]},review:["Нажал кнопку, которую я сам не нажимал с 2019 года.","Пиццу принёс, кнопку не сломал. Уважаю.","Шлагбаум ему не нужен. Ему вообще ничего не нужно, он сам себе шлагбаум."]},l8:{order:{client:"Нина Фёдоровна и кот",addr:"корп. 3, пентхаус",what:"Маргарита + сосиски коту"},tip:240,script:{start:[P0("Нина Фёдоровна","Милок, мост у нас разводной, как в Питере. Только ключ от двери на соседней крыше.","shock"),p0("Разводной мост и таблетка на крыше. Комбо.","angry"),p0("Ничего. Сначала таблетка, потом мост.","smug")],key:[p0("Таблетка есть. Теперь мост.","smug")]},review:["Кот съел сосиски, я — пиццу. Мост теперь не закрывается, но это мелочи.","Курьер развёл мост и не свёл меня с ума. Редкость.","Мост развёл, дверь открыл, кота погладил. Пять звёзд и пирожок."]},l9:{order:{client:"Кристина, блогер",addr:"корп. 3, балкон 9",what:"Две пеперони, для стрима"},tip:260,script:{start:[P0("Кристина","Я на стриме на балконе! Галина опять моет. Удачи!"),a1("Мою весь корпус! Обходи!"),p0("Лифт, уборщица и стрим. Я справлялся и не с таким.","smug")],goal1:[P0("Кристина","Ой, тут свет плохой, я перешла на другой балкон, напротив!","shock"),p0("Напротив. Напротив — это где, в этом доме?","angry")],cleaner:[a1("Обходи, обходи!"),a1("Мою, мою, не мешай!"),a1("Тебя на стриме видно, а пол-то мыть мне.")]},review:["В стриме видно, как курьер ходит по стенам. Чат думает, что это монтаж.","Нашёл меня на втором балконе. На первом я его так и не дождалась.","2 млн просмотров. Курьер отказался от коллаборации, сказал «я работаю»."]},l10:{order:{client:"Эдуард Эшеров, архитектор",addr:"корп. 3, крыша",what:"Кальцоне, сложенная правильно"},tip:300,script:{start:[P0("Эдуард Эшеров","Курьер? Мой дом нельзя пройти. Его можно только правильно увидеть.","shock"),p0("Эдуард, я пять лет вижу правильно. Сейчас увидите.","smug")],goal1:[P0("Эдуард Эшеров","Отлично. Но акт приёмки я подписываю только на крыше. С правильной точки зрения.","worry"),p0("Конечно на крыше. Где ж ещё.","angry")]},review:["Принимаю с замечаниями. Курьер смотрел на дом не под тем углом. Но дошёл.","Мой дом задумывался непроходимым. Курьер его прошёл. Задумаюсь.","Подписываю акт. Курьера беру в соавторы проекта."],outro:"ЖК «Перспектива» сдан. Пицца — горячая. Почти."}}
