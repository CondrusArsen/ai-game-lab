/* Walrus Wallop — HUD and cards. Cool navy panels with brass trim over the warm stage (THEME: cool HUD, warm floor). */
:root { --navy: #123049; --navy2: #1b4466; --ink: #10202f; --brass: #f2b636; --brass2: #c28a2a; --ice: #e9f6ff; --red: #e2483d; --green: #3ccf5a; --hud: 118px; --bottom: 214px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1a2c; font-family: Nunito, 'Arial Rounded MT Bold', system-ui, sans-serif; font-weight: 800; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
canvas#g { position: fixed; inset: 0; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button { font-family: inherit; pointer-events: auto; touch-action: manipulation; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #123049; font-size: 64px; }
svg { width: 100%; height: 100%; display: block; }

/* top bar: left buttons, coins centred; the top-right 64 px stay free for the platform */
.top { position: absolute; top: max(6px, env(safe-area-inset-top)); left: 8px; right: 64px; height: 44px; display: flex; gap: 6px; align-items: center; }
.ib { width: 44px; height: 44px; padding: 6px; border-radius: 14px; border: 3px solid var(--ink); background: linear-gradient(#2a5a85, var(--navy)); box-shadow: 0 3px 0 rgba(0,0,0,.35); cursor: pointer; }
.ib:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.coins { position: static; margin-left: 4px; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; background: rgba(13,26,44,.78); border: 2px solid var(--brass2); font-size: 20px; font-weight: 900; }
.coins svg { width: 28px; height: 28px; }
.coins.tick b { color: #ffe680; }
#ui[data-mode="duel"].fighting .top .ib:not(:first-child), #ui[data-mode="bonus"] .top .ib:not(:first-child), #ui[data-mode="show"] .top .ib:not(:first-child) { visibility: hidden; }

/* HP owners */
.hprow { position: absolute; top: calc(max(6px, env(safe-area-inset-top)) + 54px); left: 6px; right: 6px; height: 60px; display: grid; grid-template-columns: 1fr 64px 1fr; gap: 4px; align-items: center; }
#ui[data-mode="map"] .hprow, #ui[data-mode="show"] .hprow { display: none; }
.hp { display: flex; align-items: center; gap: 5px; min-width: 0; }
.hp.foe { flex-direction: row-reverse; text-align: right; }
.ava { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 3px solid var(--ink); background: #cfe9f8; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.hp.me .ava { border-color: #0c5a7a; box-shadow: 0 0 0 2px #39c6e6; }
.hp.foe .ava { border-color: #7a1c1c; box-shadow: 0 0 0 2px #ff6a5a; }
.hpi { flex: 1; min-width: 0; }
.hp .nm, .hp .sub, .vs b, .vs span, .bar .num { --o: 1.5px; text-shadow: calc(var(--o) * -1) calc(var(--o) * -1) 0 #000, var(--o) calc(var(--o) * -1) 0 #000, calc(var(--o) * -1) var(--o) 0 #000, var(--o) var(--o) 0 #000, 0 calc(var(--o) * -1) 0 #000, 0 var(--o) 0 #000, calc(var(--o) * -1) 0 0 #000, var(--o) 0 0 #000, 0 2px 3px rgba(0,0,0,.55); }
.nm { font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .3px; }
.bar { position: relative; height: 18px; border-radius: 9px; background: #0d1a2c; border: 2px solid var(--ink); overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.4); }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; border-radius: 7px; transition: width .25s ease-out; }
.bar i.lag { background: #fff3c4; transition: width .5s ease-in; }
.hp.me .bar i.fill { background: linear-gradient(#5be3ff, #1ea2c9); }
.hp.foe .bar i { left: auto; right: 0; }
.hp.foe .bar i.fill { background: linear-gradient(#ff8a7a, #d7362c); }
.bar .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
.hp.low .bar i.fill { animation: lowpulse .6s ease-in-out infinite alternate; }
@keyframes lowpulse { to { filter: brightness(1.5); } }
.hp.hurt .ava { animation: hurt .35s ease-out; }
@keyframes hurt { 0% { transform: scale(1.2) rotate(-8deg); filter: brightness(1.6) saturate(2); } 100% { transform: none; } }
.sub { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; padding: 0 2px; }
.hp .nm { padding: 1px 2px 0; }
#ui.tiny .hp .nm, #ui.tiny .bar .num { --o: 1px; }
.vs { text-align: center; line-height: 1; }
.vs b { display: block; font-size: 22px; font-weight: 900; color: var(--brass); -webkit-text-stroke: 1px var(--ink); }
.vs span { display: block; font-size: 10px; margin-top: 2px; white-space: nowrap; }
.vs .al { opacity: .85; font-size: 9px; }
#ui:not(.wide) .vs .al { display: none; }
.vs span { overflow: hidden; text-overflow: ellipsis; }

/* green streak (Designed improvement #2) */
.streak { position: absolute; top: calc(var(--hud) + 2px); left: 10px; display: none; padding: 3px 12px; border-radius: 12px; border: 2px solid var(--ink); background: linear-gradient(#7dff8a, #2fb34f); color: var(--ink); font-size: 13px; font-weight: 900; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.streak.on { display: block; }
.streak.bump { animation: bought .45s ease-out; }
#ui[data-mode="map"] .streak, #ui[data-mode="show"] .streak { display: none; }
#ui.tiny .streak { top: 42px; font-size: 10px; padding: 1px 8px; }
/* bonus flipper tokens */
.tokens { position: absolute; left: 0; right: 0; bottom: calc(var(--bottom) - 6px); display: none; justify-content: center; gap: 10px; }
.tokens.on { display: flex; }
.tk { width: 52px; height: 52px; padding: 8px; border-radius: 50%; background: radial-gradient(#5fb6f0, #2a6fb8); border: 3px solid var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: transform .2s, filter .3s; }
.tk.used { filter: grayscale(1) brightness(.7); transform: scale(.85); }

/* bottom panel: upgrade cards, boosters, the slap pad */
.bottom { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bottom); padding: 0 10px max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
.ups { display: none; gap: 8px; }
.ups.on { display: flex; }
.up { flex: 1; min-width: 0; display: grid; grid-template-columns: 36px 1fr; grid-template-rows: auto auto; align-items: center; gap: 0 6px; padding: 6px 8px; border-radius: 16px; border: 3px solid var(--ink); background: linear-gradient(#f7fbff, #cfe2ef); color: var(--ink); text-align: left; box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer; }
.up .ic { grid-row: 1 / span 2; width: 36px; height: 36px; position: relative; }
.up .lvb { position: absolute; right: -6px; bottom: -6px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; background: var(--navy); color: #fff; border: 2px solid #fff; font-size: 11px; font-style: normal; font-weight: 900; line-height: 16px; text-align: center; }
#ui.tiny .up .lvb { min-width: 14px; height: 14px; font-size: 8px; line-height: 10px; right: -4px; bottom: -4px; }
.up .tx { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.up .tt { font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up .ef { font-size: 11px; opacity: .8; white-space: nowrap; }
.up .th { font-size: 11px; color: #2f6f9a; white-space: nowrap; }
.up .th.gain { color: #138a3a; font-weight: 900; }
.up .pr { grid-column: 2; display: flex; align-items: center; gap: 4px; justify-self: start; margin-top: 3px; padding: 1px 9px 1px 3px; border-radius: 12px; background: var(--navy); color: #fff; font-size: 14px; font-weight: 900; }
.up .pr svg { width: 20px; height: 20px; }
.up.poor { background: linear-gradient(#e6edf2, #b9c8d3); }
.up.poor .pr { background: #6b7a88; }
.up.poor .pr b { color: #ffd0c8; }
.up.max .pr { background: #3a8a4a; }
.up.hint { animation: hint 1s ease-in-out infinite; border-color: #138a3a; }
@keyframes hint { 50% { transform: translateY(-4px); box-shadow: 0 8px 0 rgba(0,0,0,.25), 0 0 0 4px rgba(60,207,90,.6); } }
.up.bought { animation: bought .45s ease-out; }
@keyframes bought { 30% { transform: scale(1.08); background: #d8ffd8; } }
.up.nope { animation: nope .35s linear; }
@keyframes nope { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.boost { display: none; gap: 8px; justify-content: center; }
.boost.on { display: flex; }
.chip { display: flex; align-items: center; gap: 4px; height: 44px; padding: 3px 12px 3px 4px; border-radius: 22px; border: 3px solid var(--ink); background: linear-gradient(#2a5a85, var(--navy)); color: #fff; font-size: 15px; font-weight: 900; box-shadow: 0 3px 0 rgba(0,0,0,.35); cursor: pointer; }
.chip svg { width: 34px; height: 34px; }
.chip.sel { background: linear-gradient(#ffd27a, #e8902c); color: var(--ink); box-shadow: 0 0 0 3px #fff3c4, 0 3px 0 rgba(0,0,0,.35); }
.chip.empty { opacity: .5; }
.pad { position: relative; height: 84px; width: 100%; border-radius: 26px; border: 4px solid var(--ink); background: linear-gradient(#ff7a5e, #e2483d 55%, #b72f27); color: #fff; font-size: 36px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 12px; text-shadow: 0 3px 0 rgba(0,0,0,.4); box-shadow: 0 6px 0 #7a1c16, 0 10px 18px rgba(0,0,0,.35); cursor: pointer; }
.pad .pi { width: 54px; height: 54px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.pad:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #7a1c16; }
.pad[data-state="slap"] { animation: padpulse 1.1s ease-in-out infinite; }
@keyframes padpulse { 50% { filter: brightness(1.12); transform: scale(1.02); } }
.pad[data-state="brace"], .pad[data-state="wait"] { background: linear-gradient(#5d7186, #3f5266); box-shadow: 0 6px 0 #232f3b; color: #dfe9f2; }
.pad[data-state="next"], .pad[data-state="bonus"], .pad[data-state="go"] { background: linear-gradient(#6fe08a, #2fb34f 55%, #1f8a3a); box-shadow: 0 6px 0 #135a26, 0 10px 18px rgba(0,0,0,.35); }
.pad[data-state="again"] { background: linear-gradient(#ffd27a, #f2a92c 55%, #c97f12); color: var(--ink); text-shadow: none; box-shadow: 0 6px 0 #7a4a08; }
.pad[data-state="hidden"] { visibility: hidden; }

/* VS banner */
.banner { position: absolute; left: 0; right: 0; top: 34%; display: flex; justify-content: center; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .25s cubic-bezier(.2, 1.6, .4, 1); }
.banner.on { opacity: 1; transform: none; }
.vsb { text-align: center; padding: 10px 22px 12px; border-radius: 20px; background: rgba(13,26,44,.86); border: 3px solid var(--brass2); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.vsb .r1 { font-size: 30px; font-weight: 900; color: #fff; }
.vsb .r2 { font-size: 13px; opacity: .9; }
.chip2 { display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 12px; background: var(--brass); color: var(--ink); font-size: 13px; font-weight: 900; }

/* cards */
.cards { position: absolute; inset: var(--hud) 0 var(--bottom) 0; display: none; align-items: center; justify-content: center; padding: 8px; }
.cards.on { display: flex; }
.cards.modal { inset: 0; background: rgba(8,16,28,.55); pointer-events: auto; }
.card { pointer-events: auto; width: min(360px, 94vw); padding: 14px 16px 16px; border-radius: 22px; border: 4px solid var(--ink); background: linear-gradient(#f7fbff, #d9ebf6); color: var(--ink); text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 16px 40px rgba(0,0,0,.35); transform-origin: center; animation: pop .3s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.card h2 { margin: 2px 0 6px; font-size: 24px; font-weight: 900; }
.card p { margin: 4px 0 10px; font-size: 15px; line-height: 1.3; font-weight: 700; }
.card .small { font-size: 12.5px; opacity: .8; font-weight: 700; }
.card .ic { width: 64px; height: 64px; margin: 0 auto; }
.card .pre { white-space: pre-line; text-align: left; font-size: 13px; }
.card.bottomc { align-self: flex-end; margin-bottom: 6px; }
#ui[data-mode="map"] .cards { bottom: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.card.mid.result { align-self: flex-start; margin-top: 4px; }
.result .big { font-size: 32px; font-weight: 900; letter-spacing: .5px; }
.result.win .big { color: #1f8a3a; }
.result.loss .big { color: #b72f27; }
.reward { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 30px; font-weight: 900; margin: 2px 0; }
.reward svg { width: 38px; height: 38px; }
.diag { margin: 6px 0; padding: 8px 10px; border-radius: 12px; background: #fff3c4; border: 2px solid #e8b13c; font-size: 13.5px; line-height: 1.25; font-weight: 800; text-align: left; }
.gift { margin: 6px 0; font-size: 13px; color: #6a3fc0; font-weight: 900; }
.strip { display: flex; align-items: center; justify-content: center; gap: 0; margin: 8px 0 4px; }
.strip .nd { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 900; padding: 3px; }
.strip .nd.d { background: #3ccf5a; padding: 0; border: 0; }
.strip .nd.cur { box-shadow: 0 0 0 3px #f2b636; }
.strip .nd.bonus, .strip .nd.champ { background: #fff3c4; }
.strip .ln { width: 22px; height: 4px; background: #9fb3c4; }
.strip .ln.d { background: #3ccf5a; }
.row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 6px 16px; border-radius: 16px; border: 3px solid var(--ink); font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.btn svg { width: 26px; height: 26px; }
.btn.primary { background: linear-gradient(#6fe08a, #2fb34f); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.btn.ghost { background: linear-gradient(#ffffff, #d6e4ee); color: var(--ink); }
.btn.seg { min-height: 40px; padding: 4px 14px; background: #fff; color: var(--ink); }
.btn.seg.on { background: var(--navy); color: #fff; }
.btn.x { position: absolute; right: 8px; top: 8px; min-height: 40px; width: 40px; padding: 6px; border-radius: 12px; background: #fff; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.unlock .big { font-size: 26px; font-weight: 900; color: #6a3fc0; }
.unlock .nm { font-size: 20px; text-shadow: none; }
.card.low { align-self: flex-end; }
.settings .sl, .settings .lang { display: flex; align-items: center; gap: 8px; margin: 8px 0; text-align: left; font-size: 15px; }
.settings .ic { width: 32px; height: 32px; margin: 0; flex: none; }
.settings .lb { flex: 1; }
.settings input[type=range] { flex: 1.4; height: 44px; accent-color: #2a6fb8; pointer-events: auto; touch-action: none; }
.settings .sl b { width: 44px; text-align: right; }
.mapc .mt b { display: block; font-size: 20px; }
.mapc .mt span { font-size: 13px; opacity: .8; }
.finale h2 { color: #c4841c; }
/* wardrobe: preview + 4×4 grid, never scrolls (the card scales to fit) */
.cards.on:has(.full) { inset: 0; background: rgba(8,16,28,.6); pointer-events: auto; }
.ward { position: relative; width: min(420px, 96vw); padding: 10px 12px 12px; }
.ward .wh { display: flex; align-items: baseline; gap: 8px; }
.ward .wh h2 { margin: 0; }
.wprev { display: block; width: 100%; height: 150px; border-radius: 16px; border: 3px solid var(--ink); margin: 6px 0; background: #cfe9f8; }
.wnm { font-size: 15px; margin-bottom: 6px; }
.wnm span { opacity: .75; font-size: 13px; }
.wgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.wt.sel { box-shadow: 0 0 0 3px #f2b636; }

.wt .badge { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; }
.wt small { position: absolute; left: 2px; top: 1px; font-size: 10px; color: #fff; text-shadow: 0 1px 0 #000; }
.wt.locked canvas { opacity: .55; }

.coach { position: absolute; inset: 0; display: none; pointer-events: none; }
.coach.on { display: block; }
.cards.modal.on ~ .coach { display: none; }
.coach .bub { position: absolute; left: 50%; transform: translateX(-50%); max-width: min(330px, 90vw); padding: 8px 14px; border-radius: 16px; background: #fff; color: var(--ink); border: 3px solid var(--ink); font-size: 16px; font-weight: 900; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.25); animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { margin-top: -5px; } }
.coach.c-pad .bub { bottom: calc(var(--bottom) + 2px); }
.coach.c-pad .hand { position: absolute; left: 50%; bottom: 26px; font-size: 46px; transform: translateX(30px); animation: tap .9s ease-in-out infinite; }
@keyframes tap { 50% { transform: translate(30px, -12px) scale(.9); } }
.coach.c-hp .bub { top: calc(var(--hud) + 6px); left: 8px; transform: none; }
.coach.c-ups .bub { bottom: calc(var(--bottom) + 8px); }
.coach.c-meter .bub { bottom: calc(var(--bottom) + 8px); background: #fff6cf; border-color: #8a5a00; box-shadow: 0 0 0 3px #ffd23f, 0 6px 0 rgba(0,0,0,.25); }
.toast { position: absolute; left: 50%; top: calc(var(--hud) + 8px); transform: translate(-50%, -12px); max-width: 92vw; padding: 8px 16px; border-radius: 14px; background: rgba(13,26,44,.92); border: 2px solid var(--brass2); font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* short portrait phones */
#ui.short .pad { height: 70px; font-size: 30px; }
#ui.short .up { padding: 4px 6px; }
#ui.short .up .ef { display: none; }

/* wide: HUD across the top, pad bottom-centre, upgrade cards in the corners */
#ui.wide .hprow { left: max(256px, calc(50% - 380px)); right: max(64px, calc(50% - 380px)); top: 6px; }
#ui.wide .top { right: auto; }
#ui.wide .coins { position: static; transform: none; margin-left: 4px; }
#ui.wide .bottom { height: auto; padding-bottom: max(10px, env(safe-area-inset-bottom)); align-items: center; }
#ui.wide .pad { width: min(380px, 40vw); }
/* the cards flank the pad (near the thumb/mouse and inside the central gallery crop) */
#ui.wide .ups { position: absolute; left: 50%; transform: translateX(-50%); width: min(980px, 96vw); bottom: max(10px, env(safe-area-inset-bottom)); justify-content: space-between; pointer-events: none; }
#ui.wide .up { flex: none; width: min(270px, calc((96vw - min(380px, 40vw)) / 2 - 16px)); pointer-events: auto; }
#ui.wide .boost { margin-bottom: 2px; }
#ui.wide .cards { inset: var(--hud) 0 calc(var(--bottom) + 4px) 0; }
#ui.wide .tokens { bottom: calc(var(--bottom) + 20px); }
#ui.wide .banner { top: 30%; }
@media (max-height: 520px) { #ui.wide .pad { height: 58px; font-size: 26px; } #ui.wide .pad .pi { width: 40px; height: 40px; } #ui.wide .ava { width: 38px; height: 38px; } #ui.wide .hprow { height: 50px; } #ui.wide .sub { display: none; } #ui.wide .up { width: min(220px, 27vw); padding: 3px 6px; } #ui.wide .up .ef { display: none; } #ui.wide .card { padding: 8px 12px 10px; } }
/* the 390×219 the platform card: the essentials only */
#ui.tiny .top { height: 34px; top: 4px; }

#ui.tiny .coins svg { width: 22px; height: 22px; }
#ui.tiny .hprow { top: 4px; height: 36px; left: 128px; right: 60px; transform: none; grid-template-columns: 1fr 30px 1fr; }
#ui.tiny .top .ib:not(:first-child) { display: none; }
#ui.tiny .ava { width: 26px; height: 26px; border-width: 2px; }
#ui.tiny .nm { font-size: 9px; }
#ui.tiny .bar { height: 12px; }
#ui.tiny .bar .num { font-size: 9px; }
#ui.tiny .vs b { font-size: 14px; }
#ui.tiny .vs span { display: none; }

#ui.tiny .pad .pi { width: 28px; height: 28px; }
#ui.tiny .up { width: 108px; grid-template-columns: 22px 1fr; padding: 2px 4px; border-radius: 10px; }
#ui.tiny .up .ic { width: 22px; height: 22px; }

#ui.tiny .up .tt { font-size: 10px; }
#ui.tiny .up .pr { font-size: 11px; }

#ui.tiny .card { transform-origin: center; }
