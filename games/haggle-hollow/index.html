<style>/* Haggle Hollow — painted wood, warm paper and felt. One family: chunky rounded buttons with a carved bottom edge,
   paper cards with a stitched border, toy-bright colours only where the player acts. */
:root { --ink: #3a2414; --paper: #fff5df; --paper2: #f3e0bb; --wood: #a8693a; --woodD: #6b3f1f; --leaf: #3f9a63;

#stage, #gl { position: fixed; inset: 0; }

/* ---- HUD ------------------------------------------------------------------------------------------------------------ */

.mico { width: calc(46px * var(--s)); height: calc(46px * var(--s)); }

.bubble { position: absolute; left: 0; top: 0; max-width: min(64vw, 280px); padding: 8px 14px; border-radius: 18px; background: #fffdf6; box-shadow: 0 4px 0 #d9c39a, 0 8px 18px rgba(40, 20, 6, .25); font-weight: 800; font-size: .92em; opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }

.bubble.love { color: #c0305a; } .bubble.meh { color: #5a5a66; } .bubble.demand { color: #6b4bd8; }

/* ---- action buttons ------------------------------------------------------------------------------------------------- */
.actions { position: absolute; left: 0; right: 0; bottom: calc(var(--bottom) - 92px * var(--s)); height: calc(88px * var(--s)); display: flex; justify-content: center; align-items: flex-start; gap: calc(26px * var(--s)); }

/* ---- drawer ------------------------------------------------------------------------------------------------------------ */
.drawer { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--bottom) - 96px * var(--s)); display: flex; align-items: center; gap: 4px; padding: calc(8px * var(--s)) calc(6px * var(--s)) calc(8px * var(--s) + env(safe-area-inset-bottom)); background: linear-gradient(#b8794a, #8a5530); border-top: 4px solid #6b3f1f; box-shadow: inset 0 4px 0 rgba(255, 220, 170, .35), 0 -6px 18px rgba(30, 14, 4, .35); }

/* ---- info chip + hint --------------------------------------------------------------------------------------------- */
.info { position: absolute; left: 50%; bottom: calc(var(--bottom) + 4px); transform: translate(-50%, 20px); width: min(96vw, calc(380px * var(--s))); min-height: calc(86px * var(--s)); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 10px; background: var(--paper); border-radius: 18px; padding: 8px 10px; box-shadow: 0 4px 0 #c9a46c, 0 12px 26px rgba(40, 20, 6, .3); opacity: 0; transition: .18s; pointer-events: none; z-index: 6; }

/* item card: picture · text column (name, rarity, one row per line) · buttons */

.ib { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
