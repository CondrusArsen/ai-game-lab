<style>/* Molten Mole — mine signage UI: soot-black iron plates with brass trim and rivets, stamped display type,
   ember-orange primary actions, gold = coins, cyan = frost opals. No scrolling anywhere: cards scale to fit. */
:root {
  --soot: #1c1016; --plate: #2c1b22; --plate2: #3a242c; --brass: #e8b04a; --brass2: #9a6a22; --ember: #ff7a2a; --ember2: #c8401a;
  --cream: #fff1d6; --ink: #2a140c; --gold: #ffd24a; --gem: #5fe6ff; --bad: #ff5a3a;
  --ui: "MM UI", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --disp: "MM Display", "MM UI", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #120a10; color: var(--cream); font-family: var(--ui); font-weight: 800; }
body { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#app { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: var(--ui); font-weight: 900; color: inherit; cursor: pointer; touch-action: manipulation; }
svg { display: block; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: 0; bottom: 0; left: var(--ui-l, 0px); right: var(--ui-r, 0px); pointer-events: none; }
.ibtn { position: absolute; pointer-events: auto; width: 48px; height: 48px; padding: 7px; border-radius: 14px; border: 3px solid var(--ink);
  background: linear-gradient(#f2c66a, #c8862e); box-shadow: 0 3px 0 #5a3410, inset 0 2px 0 rgba(255,255,255,.45); }
.ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5a3410; }
#pauseBtn { left: calc(10px + var(--sal)); top: calc(10px + var(--sat)); }
#banks { position: absolute; left: calc(10px + var(--sal)); top: calc(66px + var(--sat)); display: flex; flex-direction: column; gap: 5px; }
.bank { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 3px; border-radius: 14px; background: rgba(28,16,22,.82); border: 2px solid var(--brass2); font: 900 16px/1 var(--ui); min-width: 70px; }
.bank svg { width: 24px; height: 24px; }
.bank.gold b { color: var(--gold); } .bank.gem b { color: var(--gem); }
.bank.pulse { animation: pulse .3s ease-out; }
@keyframes pulse { 50% { transform: scale(1.18); } }
#top { position: absolute; left: 50%; top: calc(6px + var(--sat)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(62vw, 300px); }
#score { font: 400 clamp(28px, 9vw, 42px)/1 var(--disp); color: var(--cream); text-shadow: 0 3px 0 var(--ink), 0 0 2px var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
#lvl, .prog { display: flex; align-items: center; gap: 5px; width: 100%; }
.lv { flex: 0 0 auto; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--ember2); border: 3px solid var(--ink); font: 900 14px/1 var(--ui); color: var(--cream); }
.lv svg { width: 20px; height: 20px; } .lv.boss { background: #6a2a8a; }
.track { flex: 1; height: 12px; border-radius: 6px; background: rgba(28,16,22,.8); border: 2px solid var(--ink); overflow: hidden; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffd24a, #ff7a2a); border-radius: 4px; transition: width .15s; }
#bossBar { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; }
#bossBar .bname { font: 400 12px/1 var(--disp); color: #ffb0a0; text-shadow: 0 2px 0 var(--ink); }
#bossBar[hidden] { display: none; } #bossBar .track { flex: 0 0 auto; width: 100%; height: 14px; } #bossBar .fill { background: linear-gradient(90deg, #ff4a5a, #ff9a3a); }
#buffs { position: absolute; right: calc(10px + var(--sar)); top: calc(70px + var(--sat)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.buff { display: grid; grid-template-columns: 30px auto auto; align-items: center; gap: 5px; padding: 3px 9px 6px 4px; border-radius: 12px; background: rgba(28,16,22,.85); border: 2px solid var(--brass); position: relative; font: 900 13px/1 var(--ui); }
.buff svg { width: 28px; height: 28px; } .buff b { color: var(--gold); min-width: 24px; text-align: right; }
.buff .ring { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
.buff .ring i { display: block; height: 100%; background: var(--gold); }
.buff.frost { border-color: #9fe8ff; } .buff.frost b { color: #bff4ff; } .buff.frost .ring i { background: #9fe8ff; }
.buff.shield { border-color: #9fe8ff; } .buff.shield .ring i { background: #9fe8ff; }
#app[data-state="ready"] #pauseBtn, #app[data-state="ready"] #top, #app[data-state="ready"] #buffs { display: none; }
#app[data-state="ready"] #banks { top: calc(10px + var(--sat)); }

/* ---------- cue / banners / toast ---------- */
#cue { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 4; }
#cue.on { opacity: 1; }
#cue span { display: block; transform: translate(-50%, -100%); padding: 8px 12px; border-radius: 14px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink);
  font: 900 15px/1.15 var(--ui); white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.3); animation: bob 1s ease-in-out infinite; }
#cue span::after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -9px; border: 9px solid transparent; border-top-color: var(--ink); }
@keyframes bob { 50% { margin-top: -5px; } }
#banner { position: absolute; left: var(--ui-c, 50%); top: 34%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; text-align: center; z-index: 3; width: 92vw; }
#banner.on { animation: ban 1.6s ease-out forwards; }
#banner b { display: block; font: 400 clamp(26px, 8vw, 44px)/1.05 var(--disp); color: var(--cream); text-shadow: 0 4px 0 var(--ink), 0 0 3px var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink); }
#banner small { display: block; margin-top: 6px; font: 900 clamp(14px, 4vw, 18px)/1.2 var(--ui); color: var(--gold); text-shadow: 0 2px 0 var(--ink); }
#banner.final b { color: #ffb05a; } #banner.boss b { color: #ffb0f0; }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 20% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1); } }
#toast { position: absolute; left: var(--ui-c, 50%); bottom: calc(30% + var(--sab)); transform: translate(-50%, 20px); max-width: 88vw; padding: 10px 16px; border-radius: 14px; background: rgba(28,16,22,.95);
  border: 2px solid var(--brass); font: 900 15px/1.25 var(--ui); text-align: center; opacity: 0; pointer-events: none; transition: .25s; z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); } #toast.warn { border-color: var(--bad); } #toast.gold { border-color: var(--gold); color: var(--gold); }
#resumeTip { position: absolute; left: var(--ui-c, 50%); bottom: calc(18% + var(--sab)); transform: translateX(-50%); pointer-events: none; opacity: 0; z-index: 3; }
#resumeTip.on { opacity: 1; animation: blink 1.1s ease-in-out infinite; }
#resumeTip b { display: block; padding: 10px 18px; border-radius: 16px; background: rgba(28,16,22,.88); border: 3px solid var(--brass); font: 900 18px/1.2 var(--ui); white-space: nowrap; }
#resumeTip.shield b { border-color: #9fe8ff; color: #dffaff; } #resumeTip.geode b { border-color: var(--gem); color: #dffaff; }
@keyframes blink { 50% { opacity: .55; } }
#fly { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
.fly { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; transition: transform .5s cubic-bezier(.5,-0.2,.8,.6), opacity .5s; }
.fly svg { width: 100%; height: 100%; }

/* ---------- camp (ready) ---------- */
#ready { position: absolute; top: 0; bottom: 0; left: var(--ui-l, 0px); right: var(--ui-r, 0px); pointer-events: none; display: none; }
#app[data-state="ready"] #ready { display: block; }
#logo { position: absolute; left: 50%; top: calc(9% + var(--sat)); transform: translateX(-50%); text-align: center; width: 94vw; }
#logo .title { margin: 0; font: 400 clamp(30px, 10.5vw, 58px)/1 var(--disp); color: #ffd780; letter-spacing: .02em;
  text-shadow: 0 5px 0 #8a2a10, 0 0 3px var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 0 8px 18px rgba(255,90,20,.55); }
#logo .lvline { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 10px; padding: 6px 14px; border-radius: 14px; background: rgba(28,16,22,.8); border: 2px solid var(--brass2); font: 900 15px/1.2 var(--ui); }
#logo .lvline b { color: var(--gold); } #logo .lvline em { font-style: normal; color: #ffb0f0; display: inline-flex; align-items: center; gap: 3px; } #logo .lvline svg { width: 18px; height: 18px; }
#intro { position: absolute; left: 50%; top: calc(25% + var(--sat)); transform: translateX(-50%); width: min(88vw, 380px); padding: 9px 14px; border-radius: 14px; text-align: center;
  background: rgba(255,241,214,.95); color: var(--ink); border: 3px solid var(--ink); font: 900 15px/1.25 var(--ui); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
#intro[hidden] { display: none; }
#hint { position: absolute; left: 50%; top: 52%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
#hint span { padding: 6px 14px; border-radius: 12px; background: rgba(28,16,22,.72); font: 900 clamp(15px, 4.4vw, 19px)/1.2 var(--ui); text-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
#hint .hand { width: 64px; height: 64px; animation: swipe 1.6s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
#hint .hand svg { width: 100%; height: 100%; }
@keyframes swipe { 0%, 100% { transform: translateX(-70px); } 50% { transform: translateX(70px); } }
#ready:not(.first) #hint .hand { width: 44px; height: 44px; }
#side { position: absolute; left: calc(10px + var(--sal)); top: 38%; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
.sbtn { display: flex; align-items: center; gap: 6px; height: 48px; width: 48px; justify-content: center; padding: 0; border-radius: 13px; border: 3px solid var(--ink); background: linear-gradient(#4a2e36, #2c1b22); box-shadow: 0 3px 0 #120a0e; font: 900 14px/1 var(--ui); }
.sbtn svg { width: 32px; height: 32px; } .sbtn span { display: none; } .sbtn:active { transform: translateY(2px); box-shadow: none; }
#tray { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--sab)); width: min(98vw, 600px); height: min(158px, 36vh); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; pointer-events: auto; }
.up { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 3px 6px; border-radius: 16px; border: 3px solid var(--ink);
  background: linear-gradient(#3e2830, #24161c); box-shadow: inset 0 2px 0 rgba(255,220,180,.15), 0 4px 0 #0e080a; overflow: hidden; }
.up .ic svg { width: clamp(26px, 9vh, 40px); height: clamp(26px, 9vh, 40px); }
.up .nm { font: 900 clamp(10px, 3.1vw, 13px)/1.05 var(--ui); color: #f2d8b0; text-align: center; min-height: 2.1em; display: flex; align-items: center; }
.up .val { font: 900 clamp(13px, 4.2vw, 18px)/1 var(--ui); color: var(--cream); white-space: nowrap; }
.up .cost { display: flex; align-items: center; justify-content: center; gap: 2px; width: 92%; height: clamp(24px, 8vh, 34px); border-radius: 10px; border: 2px solid var(--ink);
  background: linear-gradient(#ffd96a, #e89a2a); color: var(--ink); font: 900 clamp(13px, 4vw, 17px)/1 var(--ui); box-shadow: inset 0 2px 0 rgba(255,255,255,.5); }
.up .cost svg { width: 20px; height: 20px; }
.up.poor .cost { background: linear-gradient(#6a5a5a, #4a3c3e); color: #d8c8c0; }
.up:active { transform: translateY(2px); }
.up.bought { animation: bought .45s ease-out; } @keyframes bought { 30% { transform: scale(1.08); background: linear-gradient(#7a5a20, #3a2410); } }
.up.shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
#ready.pointSpeed .up[data-k="speed"] { box-shadow: 0 0 0 4px var(--gold), 0 0 22px rgba(255,210,74,.8); animation: glow 1s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px var(--gold), 0 0 4px rgba(255,210,74,.3); } }

/* wide / short screens (landscape, the platform card) */
#app.wide #logo, #app.wide #intro, #app.wide #hint { left: 38%; }
#app.wide #logo { top: calc(5% + var(--sat)); width: 58vw; } #app.wide #logo .title { font-size: clamp(20px, 5.4vw, 52px); }
#app.wide #intro { width: min(56vw, 380px); }
#app.wide #side { top: auto; bottom: calc(10px + var(--sab)); }
#app.wide #tray { left: auto; right: calc(8px + var(--sar)); transform: none; bottom: auto; top: 50%; translate: 0 -50%; width: min(36vw, 300px); height: min(88vh, 300px); grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
#app.wide:not(.framed) #toast { left: 38%; }
/* wide desktop: camp and HUD inside the arena columns, logo and hint centred on the arena */
#app.framed #logo, #app.framed #intro, #app.framed #hint { left: 50%; }
#app.framed #logo { width: min(60%, 760px); }
#app.framed #side { top: 50%; bottom: auto; transform: translateY(-50%); }
#app.framed #tray { right: 12px; width: min(28%, 320px); }
#app.short #logo .title { font-size: clamp(20px, 7vh, 40px); }
#app.short #logo .lvline { margin-top: 4px; padding: 3px 10px; font-size: 12px; }
#app.short #intro { top: 30%; font-size: 12px; padding: 4px 10px; width: min(60vw, 360px); }
#app.short #hint { top: 46%; } #app.short #hint span { font-size: 13px; } #app.short #hint .hand { width: 30px; height: 30px; }
#app.short:not(.wide) #tray { height: 34vh; } #app.short #tray { gap: 4px; } #app.short .up { border-radius: 10px; padding: 2px; border-width: 2px; }
#app.short .up .nm { font-size: 9px; min-height: 0; } #app.short .up .val { font-size: 11px; } #app.short .up .cost { font-size: 11px; height: 10vh; } #app.short .up .ic svg { width: 9vh; height: 9vh; }
#app.short .sbtn { height: 34px; width: 34px; border-radius: 10px; } #app.short .sbtn svg { width: 24px; height: 24px; }

.mbg { position: absolute; inset: 0; background: rgba(12,4,10,.62); }

  background: linear-gradient(#3a242c, #22141a); border: 4px solid var(--brass); box-shadow: 0 0 0 3px var(--ink), 0 10px 30px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,220,170,.2);

.tabs { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }

.item { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 5px; border-radius: 12px; border: 3px solid var(--ink); background: #3e2830; min-height: 116px; position: relative; }

.tag svg { width: 14px; height: 14px; } .tag.on { background: #3a6a2a; } .tag.price { background: #1c4a5a; color: #bff4ff; } .tag.price.poor { background: #3a2a30; color: #9a8a90; }
.tag.lock { background: transparent; flex-direction: column; } .tag.lock small { font: 800 9px/1.1 var(--ui); color: #d8b8a8; }
.card.map { width: 360px; }
.regs { display: flex; flex-direction: column; gap: 6px; }
.reg { position: relative; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-items: center; padding: 6px 8px; border-radius: 12px; border: 3px solid var(--ink); background-size: cover; background-position: center 70%; text-align: left; min-height: 64px; }
.reg::before { content: ''; position: absolute; inset: 0; border-radius: 9px; background: linear-gradient(90deg, rgba(20,8,14,.85), rgba(20,8,14,.35)); }
.reg > * { position: relative; }
.reg.here { border-color: var(--gold); } .reg.dim { filter: grayscale(.8) brightness(.7); }
.reg .rt b { display: block; font: 400 13px/1.1 var(--disp); color: var(--cream); } .reg .rt small { font: 800 11px/1.2 var(--ui); color: #d8c0b0; }
.reg .dots { grid-column: 1; display: flex; gap: 5px; margin-top: 5px; }
.reg .dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.18); border: 2px solid var(--ink); display: grid; place-items: center; }
.reg .dots i.done { background: var(--gold); } .reg .dots i.here { background: var(--ember); box-shadow: 0 0 8px var(--ember); } .reg .dots i.boss { width: 20px; height: 20px; } .reg .dots i svg { width: 14px; height: 14px; }
.reg .tro { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 74px; }
.reg .tro svg { width: 28px; height: 28px; } .reg .tro small { font: 800 9.5px/1.1 var(--ui); text-align: center; color: #d8c0b0; } .reg .tro.won small { color: var(--gold); }

.recs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }

.recs small { font: 800 9.5px/1.1 var(--ui); color: #c8b0a8; min-height: 2.2em; } .recs b { font: 900 15px/1 var(--ui); color: var(--gold); }
.card.unlock img.unl { width: 150px; height: 150px; object-fit: contain; display: block; margin: 0 auto; } .card.unlock img.unl.wide { width: 260px; height: auto; border-radius: 10px; }
.card.credits p { text-align: left; font-size: 13.5px; }

.shotmode #pauseBtn { display: none !important; } .shotmode #banks { top: calc(10px + var(--sat)) !important; }
