:root { --ink: #15121c; --paper: #f3ead2; --yel: #ffd93a; --red: #e2302a; --blue: #2f6fd0; --green: #23946a; --purp: #2b2a4e; --ok: #5fd35a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--purp); color: var(--ink); font-family: 'Shantell', 'Comic Sans MS', sans-serif; font-weight: 700; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
#hud, #ui { position: fixed; inset: 0; pointer-events: none; }
#hud > *, #ui > * { pointer-events: auto; }
#hud > #hBanner, #hud > #hChips, #hud > .bal, #hud > #adBox, #hud > #hComp { pointer-events: none; }
.num, #hV, .rv { font-family: 'Rubik', 'Arial Black', sans-serif; font-style: italic; font-weight: 900; }
/* ---------------- buttons */
.btn { font-family: inherit; font-size: 18px; font-weight: 800; color: var(--ink); background: var(--yel); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 8px 14px; cursor: pointer; min-height: 48px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; text-transform: uppercase; }
.btn small { font-size: 12px; font-weight: 700; text-transform: none; margin-top: 2px; opacity: 0.85; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.big { font-size: 24px; min-height: 60px; background: var(--red); color: #fff; text-shadow: 2px 2px 0 var(--ink); }
.btn.alt { background: var(--paper); } .btn.gold { background: #ffb21e; } .btn.red { background: var(--red); color: #fff; } .btn.blue { background: #8ab8ff; } .btn.sel { background: var(--yel); outline: 3px solid var(--red); }
.btn.thin { min-height: 40px; font-size: 15px; padding: 6px 10px; }
.btn.ad::before { content: '▶ AD'; font-size: 10px; background: var(--ink); color: #fff; padding: 1px 5px; margin-bottom: 2px; border-radius: 2px; }
.btn[disabled] { filter: grayscale(0.9); opacity: 0.6; }
.btn:focus-visible, .hbtn:focus-visible, .acard:focus-visible { outline: 3px solid var(--blue); }
/* ---------------- menus */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 56px max(14px, env(safe-area-inset-right)) 16px max(14px, env(safe-area-inset-left)); gap: 10px; }
.list { overflow-y: auto; touch-action: pan-y; background: linear-gradient(rgba(43,42,78,0.55), rgba(43,42,78,0.85)); }
.list > * { flex-shrink: 0; }
.menu { justify-content: flex-start; }
.coinbar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; pointer-events: none; z-index: 5; }
.coinbar span { background: var(--paper); border: 3px solid var(--ink); padding: 3px 10px; font-weight: 800; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); border-radius: 3px; }
.coinbar .cash { background: #b8f0a0; } .coinbar .fame { background: var(--yel); }
.logo { text-align: center; line-height: 0.88; margin-top: 2vh; }
.logo .l0 { display: inline-block; background: var(--red); color: #fff; border: 3px solid var(--ink); padding: 2px 10px; font-size: 14px; letter-spacing: 2px; transform: rotate(-3deg); }
.logo .l1, .logo .l2 { font-family: 'Rubik', sans-serif; font-style: italic; font-weight: 900; font-size: clamp(46px, 13vw, 92px); color: var(--yel); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--ink); letter-spacing: -1px; }
.logo .l2 { color: #fff; font-size: clamp(50px, 14vw, 104px); }
.logo .l3 { display: inline-block; margin-top: 10px; background: var(--paper); border: 3px solid var(--ink); padding: 4px 12px; font-size: clamp(14px, 3.6vw, 18px); box-shadow: 3px 3px 0 var(--ink); }
.mbtns { display: flex; flex-direction: column; gap: 9px; width: min(380px, 100%); margin-top: auto; margin-bottom: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.col { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.rankbar { background: var(--paper); border: 3px solid var(--ink); padding: 6px 10px; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }
.dbar { height: 10px; background: #d8ccb0; border: 2px solid var(--ink); margin-top: 4px; } .dbar i { display: block; height: 100%; background: var(--red); }
@media (min-aspect-ratio: 5/4) { .menu { align-items: flex-start; padding-left: 6vw; justify-content: center; } .mbtns { margin-top: 18px; } .logo { text-align: left; } }
h2 { margin: 0; font-family: 'Rubik', sans-serif; font-style: italic; font-weight: 900; font-size: 30px; color: var(--yel); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); text-align: center; text-transform: uppercase; }
h3 { margin: 6px 0 0; color: #fff; text-shadow: 2px 2px 0 var(--ink); font-size: 18px; text-transform: uppercase; width: min(640px, 100%); }
p { margin: 4px 0; line-height: 1.32; } .mut { color: #e8e0f8; font-size: 14px; font-weight: 600; text-shadow: 1px 1px 0 var(--ink); } .c { text-align: center; max-width: 560px; }
.modal .mut { color: #5a5070; text-shadow: none; }
.dim { opacity: 0.25; }
.cards { display: grid; gap: 12px; width: min(640px, 100%); }
@media (min-width: 900px) { .cards { grid-template-columns: repeat(3, 1fr); width: min(980px, 100%); } }
.acard { font-family: inherit; text-align: left; background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 0 0 10px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 6px; border-radius: 4px; overflow: hidden; }
.acard:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.ah { display: flex; justify-content: space-between; align-items: center; background: var(--dc); padding: 8px 12px; border-bottom: 3px solid var(--ink); }
.adis { font-family: 'Rubik', sans-serif; font-style: italic; font-weight: 900; font-size: 22px; color: #fff; -webkit-text-stroke: 1px var(--ink); text-shadow: 2px 2px 0 var(--ink); text-transform: uppercase; }
.adiff { font-size: 18px; filter: drop-shadow(1px 1px 0 var(--ink)); }
.atown { padding: 0 12px; font-size: 18px; } .amod { padding: 0 12px; font-size: 13px; font-weight: 600; min-height: 34px; } .amod b { color: var(--red); }
.afoot { display: flex; justify-content: space-between; gap: 6px; padding: 0 12px; font-size: 12px; flex-wrap: wrap; } .afoot span:nth-child(2) { color: #d89a00; font-size: 16px; }
.seg .btn { min-width: 120px; }
.locks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; } .lock { background: rgba(0,0,0,0.35); color: #e8e0f8; padding: 3px 8px; font-size: 12px; border-radius: 3px; }
.ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; width: min(640px, 100%); }
.ucard { background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 10px; display: flex; flex-direction: column; gap: 6px; border-radius: 4px; }
.ucard.own { background: #fff6d0; } .un { font-weight: 800; font-size: 16px; display: flex; justify-content: space-between; } .ud { font-size: 13px; font-weight: 600; flex: 1; }
.pips i { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--ink); margin-left: 3px; background: #fff; } .pips i.on { background: var(--red); }
.umax { text-align: center; color: var(--green); font-weight: 800; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: min(640px, 100%); }
.tab { font-family: inherit; font-weight: 800; border: 3px solid var(--ink); background: var(--paper); padding: 5px 9px; cursor: pointer; border-radius: 3px; font-size: 13px; color: var(--ink); } .tab.on { background: var(--dc); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: min(640px, 100%); }
.vcard { background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 6px; border-radius: 3px; }
.vcard img, .vph { width: 100%; aspect-ratio: 16/9; display: block; border: 2px solid var(--ink); object-fit: cover; }
.vph { display: flex; align-items: center; justify-content: center; font-size: 34px; background: var(--yel); } .vph.q { background: #c8c0d8; color: #6a6080; }
.vn { font-weight: 800; font-size: 14px; margin-top: 4px; } .vt { font-size: 12px; font-weight: 600; color: #5a5070; }
.lb { width: min(460px, 100%); background: var(--paper); border: 3px solid var(--ink); padding: 12px; box-shadow: 4px 4px 0 var(--ink); }
.lbr { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; padding: 4px 0; border-bottom: 2px dashed #c8bca0; } .lbr.me { background: #fff6b0; }
/* ---------------- modals */
.modal { position: fixed; inset: 0; background: rgba(21,18,28,0.6); display: flex; align-items: center; justify-content: center; padding: 12px; z-index: 30; }
.modal > .panel { width: min(470px, 100%); max-height: calc(100% - 8px); overflow-y: auto; touch-action: pan-y; background: var(--paper); border: 4px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); padding: 16px; border-radius: 4px; }
.modal.wide > .panel { width: min(760px, 100%); }
.modal h2 { margin-bottom: 10px; }
.set { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 180px; height: 14px; background: #fff; border: 3px solid var(--ink); border-radius: 8px; touch-action: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); }
/* results newspaper */
.paper { background: #f6f0de; border: 3px solid var(--ink); padding: 10px; margin-bottom: 12px; }
.mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 4px double var(--ink); padding-bottom: 4px; flex-wrap: wrap; gap: 4px; }
.mast span { font-family: Georgia, 'Times New Roman', serif; font-weight: 900; font-size: 26px; letter-spacing: 1px; } .mast em { font-size: 12px; font-weight: 600; }
.hl { font-family: 'Rubik', sans-serif; font-style: italic; font-weight: 900; font-size: clamp(22px, 5vw, 34px); line-height: 1; margin: 8px 0; text-transform: uppercase; }
.panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .panels.n1 { grid-template-columns: 1fr; } .panels.n2 { grid-template-columns: 1fr 1fr; }
.pn { position: relative; border: 3px solid var(--ink); background: #ccc; } .pn img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.pn span { position: absolute; left: 4px; top: 4px; background: var(--yel); border: 2px solid var(--ink); font-size: 11px; padding: 0 4px; }
.pn.empty { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
.res { margin-top: 8px; display: grid; gap: 3px; }
.rs { font-size: 34px; color: #e8a800; text-align: center; -webkit-text-stroke: 1px var(--ink); letter-spacing: 4px; } .rs .dim { color: #bbb; opacity: 1; }
.rv { text-align: center; font-size: 34px; } .rv small { font-size: 15px; font-family: 'Shantell', sans-serif; font-style: normal; }
.rl { display: flex; justify-content: space-between; border-bottom: 2px dashed #c8bca0; font-size: 15px; } .rl.tot { font-size: 19px; border: 0; }
.newv { background: var(--yel); border: 2px solid var(--ink); padding: 3px 8px; font-size: 14px; } .newv.gold { background: #ffb21e; }
@media (max-width: 520px) { .panels { grid-template-columns: 1fr 1fr; } .panels .pn:first-child { grid-column: span 2; } .panels.n1 .pn:first-child { grid-column: auto; } }
.toast { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 4px; z-index: 60; font-size: 15px; }
/* ---------------- HUD */
#hTop { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
#hTop > * { pointer-events: auto; }
.live { background: rgba(21,18,28,0.75); color: #fff; padding: 4px 9px; font-size: 14px; border-radius: 3px; display: flex; flex-direction: column; gap: 1px; white-space: nowrap; }
.live > div { display: flex; align-items: center; gap: 5px; }
.live i { width: 11px; height: 11px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; } .live b { color: var(--yel); } #hTc { font-variant-numeric: tabular-nums; font-family: monospace; font-size: 13px; }
@keyframes blink { 50% { opacity: 0.2; } }
#hViewers { background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 2px 12px 6px; text-align: center; min-width: 150px; border-radius: 3px; }
.vl { font-size: 11px; letter-spacing: 1px; } #hV { font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; transition: color 0.2s; } #hV.up { color: #1a8a3a; } #hV.down { color: var(--red); }
#hGoal { position: relative; height: 8px; background: #d8ccb0; border: 2px solid var(--ink); margin-top: 3px; } #hGoal i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--red); }
#hGoal s { position: absolute; top: -9px; width: 0; text-decoration: none; } #hGoal s::after { content: '★'; position: absolute; left: -7px; font-size: 14px; color: #fff; -webkit-text-stroke: 1px var(--ink); } #hGoal s.on::after { color: var(--yel); }
.ibtn { width: 48px; height: 48px; font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 18px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 4px; cursor: pointer; color: var(--ink); }
#hComp { position: fixed; left: 10px; top: calc(max(8px, env(safe-area-inset-top)) + 52px); display: flex; gap: 3px; align-items: center; background: rgba(21,18,28,0.6); padding: 3px 7px; border-radius: 3px; color: #fff; font-size: 11px; }
#hComp i { width: 11px; height: 18px; background: #6a6070; border: 2px solid var(--ink); border-radius: 3px 3px 1px 1px; } #hComp i.on { background: #ff9ac8; }
#hTask { position: fixed; left: 10px; top: calc(max(8px, env(safe-area-inset-top)) + 88px); width: min(250px, 46vw); background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 6px 8px; font-size: 12px; border-radius: 3px; }
.tn { font-weight: 800; font-size: 15px; color: var(--red); display: flex; justify-content: space-between; } .tn em { color: var(--ink); font-style: normal; } .td { font-weight: 600; }
.tp { height: 8px; border: 2px solid var(--ink); background: #fff; margin: 4px 0; } .tp i { display: block; height: 100%; background: var(--ok); }
.tc { font-weight: 700; color: #a03030; } .tc.ok { color: #1a8a3a; }
#hBanner { position: fixed; left: 0; right: 0; top: calc(max(8px, env(safe-area-inset-top)) + 70px); display: flex; justify-content: center; }
.bn { background: var(--yel); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 5px 12px; font-size: 17px; font-weight: 800; max-width: 86vw; text-align: center; animation: pop 0.25s; transform: rotate(-1.5deg); }
.bn.good { background: #b8f0a0; } .bn.bad { background: #ffb0a0; } .bn.viral { background: var(--yel); font-size: 19px; } .bn.warn { background: #ff8a6a; }
@keyframes pop { from { transform: scale(0.6) rotate(-1.5deg); } }
#hChips { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 62px); display: flex; gap: 5px; align-items: center; white-space: nowrap; }
#hChips span { background: rgba(21,18,28,0.65); color: #a8a0b8; border: 2px solid var(--ink); padding: 2px 7px; font-size: 12px; border-radius: 3px; }
#hChips span.on { background: var(--ok); color: var(--ink); }
#cM { font-family: 'Rubik', sans-serif; font-style: italic; font-weight: 900; font-size: 18px; color: #fff; -webkit-text-stroke: 1px var(--ink); text-shadow: 2px 2px 0 var(--ink); min-width: 10px; }
#cM.golden { color: var(--yel); font-size: 22px; } #cM.dead { color: #ff7a6a; }
#zoomBox { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; background: rgba(21,18,28,0.55); padding: 6px 4px; border-radius: 6px; color: #fff; font-size: 12px; }
#zoomBox input { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 150px; }
#zv { font-family: monospace; }
#cmds { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); display: flex; gap: 6px; }
.hbtn { font-family: inherit; font-weight: 800; font-size: 14px; min-height: 48px; padding: 4px 10px; background: var(--yel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 4px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hbtn.blue { background: #8ab8ff; } .hbtn.gold { background: #ffb21e; } .hbtn.red { background: var(--red); color: #fff; } .hbtn.on { outline: 3px solid #fff; } .hbtn[disabled] { opacity: 0.45; } .hbtn small { font-size: 10px; }
#cams { position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); display: flex; gap: 5px; }
.cbtn { font-family: inherit; font-weight: 800; font-size: 11px; width: 58px; min-height: 48px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); padding: 2px; }
.cbtn b { font-size: 16px; } .cbtn.on { background: var(--red); color: #fff; } .cbtn.drv { background: #b8f0a0; width: 72px; } .cbtn[disabled] { opacity: 0.45; } .cbtn em { font-style: normal; }
#joy { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: 110px; height: 110px; border-radius: 50%; background: rgba(21,18,28,0.35); border: 3px solid var(--ink); touch-action: none; }
#joy i { position: absolute; left: 30px; top: 30px; width: 44px; height: 44px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); }
#bTalk { position: fixed; left: calc(max(14px, env(safe-area-inset-left)) + 124px); bottom: max(14px, env(safe-area-inset-bottom)); min-width: 86px; }
#adBox { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); background: var(--yel); border: 3px solid var(--ink); padding: 2px 10px; font-size: 14px; } #adBox.in { background: var(--ok); }
.bal { position: fixed; left: 0; top: 0; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 4px 10px; font-size: 14px; max-width: 200px; text-align: center; white-space: normal; box-shadow: 2px 2px 0 var(--ink); }
.bal::after { content: ''; position: absolute; left: 50%; bottom: -12px; border: 7px solid transparent; border-top: 10px solid var(--ink); transform: translateX(-50%); }
@media (max-aspect-ratio: 1/1) {
  #hViewers { min-width: 120px; padding: 2px 8px 5px; } #hV { font-size: 22px; } .live { font-size: 11px; padding: 3px 6px; } #hTc { font-size: 11px; }
  #cmds { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 56px); left: 8px; right: 8px; justify-content: center; } #cmds .hbtn { flex: 1; font-size: 13px; }
  #cams { left: 8px; right: 8px; justify-content: center; } #hChips { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 112px); }
  #hChips { flex-wrap: wrap; justify-content: center; width: 96vw; row-gap: 2px; } #cM { width: 100%; text-align: center; order: -1; font-size: 16px; } #cM.golden { font-size: 18px; }
  #zoomBox input { height: 120px; } #hTask { width: min(220px, 58vw); }
  #hud.duo #hChips { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 178px); }
  #joy { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 60px); } #bTalk { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 60px); }
}
/* ---------------- coach */
#coach { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#coach.block { pointer-events: auto; }
#coach .dim { position: fixed; background: rgba(21,18,28,0.6); pointer-events: auto; }
#coach:not(.block) .dim { pointer-events: none; }
#coach .ring { position: fixed; border: 4px solid var(--yel); box-shadow: 0 0 0 3px var(--ink), 0 0 18px var(--yel); pointer-events: none; animation: pulse 0.8s infinite alternate; border-radius: 6px; }
#coach .arrow { position: fixed; width: 32px; text-align: center; font-size: 34px; color: var(--yel); text-shadow: 0 3px 0 var(--ink), 0 0 6px var(--ink); pointer-events: none; }
#coach .bubble { position: fixed; background: #fff; color: var(--ink); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 10px 13px; font-size: 16px; line-height: 1.3; pointer-events: auto; border-radius: 14px; font-weight: 600; }
#coach .bubble b { color: var(--red); font-weight: 800; }
#coach .bubble .btn { margin-top: 8px; width: 100%; }
.hintpop { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); width: min(380px, 92vw); background: #fff; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 12px; z-index: 55; border-radius: 12px; font-weight: 600; }
.hintpop .btn { margin-top: 8px; width: 100%; } .hintpop b { color: var(--red); }
@keyframes pulse { from { opacity: 1 } to { opacity: 0.45 } }
#load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--purp); color: var(--yel); font: 900 28px sans-serif; gap: 12px; z-index: 99; }
@media (prefers-reduced-motion: reduce) { .live i, #coach .ring, .bn { animation: none; } }
.modal.wide > .panel > .row2:last-child { position: sticky; bottom: -16px; background: var(--paper); padding-block: 8px; margin-bottom: -8px; border-top: 3px solid var(--ink); z-index: 2; }
@media (max-width: 700px) { #hChips { max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center; } #cM { white-space: normal; } }
