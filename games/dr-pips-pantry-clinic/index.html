<style>/* Dr. Pip's Pantry Clinic — UI in the world's materials: sewn fabric labels (dashed stitch inside the edge), button
   badges on a ribbon, paper price tags, candle-warm plum night. Fonts: Pip Display = renamed Lobster subset (titles), Nunito 800/900 (UI). */
:root {
  --ink: #2a1626; --cream: #fff6e6; --mint: #7fd6c0; --mint-d: #3fae8f; --yellow: #ffc83a; --yellow-d: #e8a21a; --pink: #ff5c8d;
  --purple: #8b4dff; --green: #38c46a; --night: #2c1a24; --wood: #6b3f2a;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --title: 'PipDisplay', 'Nunito', Georgia, serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--ui); font-weight: 800; color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button, #ui .start-tap, #ui .sheet, #ui .clinic-ui, #ui input, #ui details, #ui summary { pointer-events: auto; }
button { font-family: var(--ui); font-weight: 900; cursor: pointer; color: var(--ink); }
[hidden] { display: none !important; }

/* ---- HUD -------------------------------------------------------------------------------------------------------- */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 8px) 10px 4px; }
.hud-left { display: flex; align-items: center; gap: 6px; height: 50px; }
.hud-btn { width: 48px; height: 48px; border-radius: 16px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 4px 0 rgba(20,8,16,.55), inset 0 0 0 3px var(--cream), inset 0 0 0 4.5px rgba(42,22,38,.25); position: relative; display: grid; place-items: center; padding: 0; }
.hud-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(20,8,16,.55); }
.hud-btn.back { width: auto; padding: 0 14px; font-size: 17px; background: var(--mint); }
.ico-pause { width: 16px; height: 18px; border-left: 6px solid var(--ink); border-right: 6px solid var(--ink); }
.ico-home { width: 24px; height: 22px; background: var(--ink); clip-path: polygon(50% 0, 100% 45%, 86% 45%, 86% 100%, 60% 100%, 60% 66%, 40% 66%, 40% 100%, 14% 100%, 14% 45%, 0 45%); }
.ico-gear { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle, var(--cream) 0 4px, var(--ink) 4.5px 8.5px, transparent 9px), conic-gradient(var(--ink) 0 8%, transparent 8% 17%, var(--ink) 17% 25%, transparent 25% 33%, var(--ink) 33% 42%, transparent 42% 50%, var(--ink) 50% 58%, transparent 58% 67%, var(--ink) 67% 75%, transparent 75% 83%, var(--ink) 83% 92%, transparent 92%); }
.up-badge { position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--pink); border: 2.5px solid var(--ink); animation: bob 1s ease-in-out infinite; }
.up-badge::after { content: ''; position: absolute; left: 4.5px; top: 3.5px; border: 5px solid transparent; border-bottom: 8px solid #fff; border-top: 0; }
#wallet { height: 40px; min-width: 72px; padding: 0 12px 0 5px; display: flex; align-items: center; gap: 6px; background: rgba(42,22,38,.82); border: 2.5px solid rgba(255,214,140,.55); border-radius: 22px; color: #fff3c4; font-weight: 900; font-size: 19px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
#wallet img { width: 30px; height: 30px; }
#lvl-pill { position: absolute; right: 58px; top: calc(var(--safe-t) + 12px); height: 36px; line-height: 30px; padding: 0 12px; border-radius: 20px; background: var(--cream); border: 3px solid var(--ink); font-size: 18px; white-space: nowrap; box-shadow: 0 3px 0 rgba(20,8,16,.5); }
#lvl-pill.vip { background: linear-gradient(#ffe08a, #ffc83a); }

#ribbon { display: flex; align-items: center; justify-content: center; margin-top: 8px; gap: 0; }
.badge { position: relative; width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; background: #cbbfcc; box-shadow: 0 3px 0 rgba(20,8,16,.5); }
.badge img { width: 34px; height: 34px; filter: grayscale(.85) brightness(1.05) opacity(.75); }
.badge.live { width: 58px; height: 58px; background: var(--purple); --p: 0; }
.badge.live::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; background: conic-gradient(#ffe08a calc(var(--p) * 1%), rgba(255,255,255,.18) 0); -webkit-mask: radial-gradient(circle, transparent 30px, #000 31px); mask: radial-gradient(circle, transparent 30px, #000 31px); }
.badge.live img { width: 42px; height: 42px; filter: none; }
.badge.live::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.6); }
.badge.done { background: var(--green); }
.badge.done img { opacity: 0; }
.badge .chk { display: none; }
.badge.done .chk { display: block; position: absolute; width: 22px; height: 12px; border-left: 6px solid #fff; border-bottom: 6px solid #fff; transform: translateY(-3px) rotate(-45deg); filter: drop-shadow(0 0 1px var(--ink)); }
.stitch { width: 12px; height: 0; border-top: 3px dashed rgba(255,230,190,.8); }

#caption { position: absolute; left: 12px; right: 12px; margin: 0 auto; width: fit-content; top: calc(var(--safe-t) + 134px); display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 8px; max-width: calc(100vw - 24px); border-radius: 22px; background: rgba(255,246,230,.95); border: 3px solid var(--ink); font-size: 17px; line-height: 1.15; box-shadow: 0 4px 0 rgba(20,8,16,.45); animation: popin .35s cubic-bezier(.2,1.6,.4,1); }
#caption img { width: 34px; height: 34px; flex: none; }

/* ---- shared buttons ------------------------------------------------------------------------------------------------------ */
.big-btn { min-height: 56px; min-width: 150px; padding: 0 22px; border-radius: 20px; border: 3.5px solid var(--ink); font-size: 21px; position: relative; box-shadow: 0 6px 0 rgba(20,8,16,.55), inset 0 0 0 4px rgba(255,255,255,.0); background: var(--yellow); }
.big-btn::after { content: ''; position: absolute; inset: 5px; border-radius: 14px; border: 2px dashed rgba(42,22,38,.35); pointer-events: none; }
.big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(20,8,16,.55); }
.big-btn.yellow { background: linear-gradient(#ffe08a, #ffc83a); }
.big-btn.mint { background: linear-gradient(#b8f0dc, #7fd6c0); }
.big-btn.plain { background: var(--cream); }
.big-btn .count { position: absolute; top: -12px; right: -10px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; background: var(--pink); color: #fff; border: 3px solid var(--ink); font-style: normal; font-size: 15px; line-height: 22px; }

/* ---- start --------------------------------------------------------------------------------------------------------------------- */
#screen { position: absolute; inset: 0; }
.start-tap { position: absolute; left: 0; right: 0; top: 30%; bottom: 0; }
.tap-label { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 7%); transform: translateX(-50%); font-family: var(--title); font-weight: 400; font-size: 30px; color: #fff; white-space: nowrap; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; animation: pulse 1.2s ease-in-out infinite; }
.patient-name { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 136px); padding: 3px 14px; border-radius: 12px; background: rgba(42,22,38,.75); color: #fff3c4; font-size: 15px; white-space: nowrap; }
.title-tag { position: absolute; left: 50%; transform: translateX(-50%) rotate(-3deg); top: calc(var(--safe-t) + 196px); display: flex; flex-direction: column; align-items: center; padding: 8px 22px 10px; background: var(--cream); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 rgba(20,8,16,.5), inset 0 0 0 4px var(--cream), inset 0 0 0 6px rgba(255,92,141,.5); white-space: nowrap; animation: popin .5s cubic-bezier(.2,1.6,.4,1); }
.title-tag b { font-family: var(--title); font-weight: 400; font-size: 30px; color: var(--pink); -webkit-text-stroke: 1px var(--ink); }
.title-tag span { font-size: 14px; color: #6b4a5a; }

/* ---- VIP ------------------------------------------------------------------------------------------------------------------------ */
.vip-banner { position: absolute; left: 50%; top: calc(var(--safe-t) + 130px); transform: translateX(-50%) rotate(-4deg); padding: 8px 30px 10px; background: linear-gradient(#a06bff, #6b2fe0); border: 3.5px solid var(--ink); border-radius: 14px; color: #fff; text-align: center; box-shadow: 0 6px 0 rgba(20,8,16,.5); animation: popin .5s cubic-bezier(.2,1.6,.4,1); }
.vip-banner b { font-family: var(--title); font-weight: 400; font-size: 34px; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; white-space: nowrap; }
.vip-banner .crown { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); width: 50px; height: 34px; background: linear-gradient(#ffe08a, #ffc83a); clip-path: polygon(0 100%, 4% 18%, 28% 58%, 50% 0, 72% 58%, 96% 18%, 100% 100%); filter: drop-shadow(0 0 0 var(--ink)); }
.vip-panel { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 6%); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.bonus-pill { display: flex; align-items: center; gap: 8px; padding: 6px 18px; border-radius: 22px; background: rgba(42,22,38,.85); color: #fff; font-size: 20px; border: 2.5px solid rgba(255,214,140,.6); }
.bonus-pill img { width: 30px; height: 30px; }
.bonus-pill b { color: #ffe08a; font-size: 24px; }

/* ---- result ---------------------------------------------------------------------------------------------------------------------- */
.result-banner { position: absolute; left: -10px; right: -10px; top: calc(var(--safe-t) + 126px); transform: rotate(-4deg); padding: 10px 0 12px; background: linear-gradient(#ff7fa6, #ff4f80); border-top: 3.5px solid var(--ink); border-bottom: 3.5px solid var(--ink); text-align: center; box-shadow: 0 6px 0 rgba(20,8,16,.4); animation: slidein .45s cubic-bezier(.2,1.4,.4,1); }
.result-banner::before, .result-banner::after { content: ''; position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed rgba(255,255,255,.7); }
.result-banner::before { top: 5px; } .result-banner::after { bottom: 5px; }
.result-banner b { font-family: var(--title); font-weight: 400; font-size: 34px; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; white-space: nowrap; }
.reward-pill { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 22px 6px 10px; border-radius: 26px; background: rgba(42,22,38,.88); border: 3px solid #ffd68c; animation: popin .5s .2s both cubic-bezier(.2,1.6,.4,1); }
.reward-pill img { width: 38px; height: 38px; }
.reward-pill b { color: #ffe08a; font-size: 30px; white-space: nowrap; }
.result-panel { position: absolute; left: 10px; right: 10px; bottom: calc(var(--safe-b) + 12px); padding: 30px 12px 12px; border-radius: 22px; background: rgba(255,246,230,.96); border: 3.5px solid var(--ink); box-shadow: 0 6px 0 rgba(20,8,16,.5); animation: rise .45s .1s both cubic-bezier(.2,1.2,.4,1); max-width: 520px; margin: 0 auto; }
.teasers { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
.teaser { position: relative; display: flex; flex-direction: column; align-items: center; width: 132px; padding: 4px; border-radius: 14px; background: #f3e6cf; border: 2px dashed rgba(42,22,38,.35); font-size: 13px; text-align: center; line-height: 1.1; }
.teaser canvas { width: 76px; height: 76px; }
.teaser .teaser-tool { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--purple); border: 2.5px solid var(--ink); padding: 3px; }
.fill { width: 90%; height: 10px; border-radius: 5px; background: rgba(42,22,38,.2); overflow: hidden; margin: 3px 0; border: 1.5px solid var(--ink); }
.fill i { display: block; height: 100%; background: linear-gradient(90deg, #ffe08a, #ffc83a); }
.row { display: flex; gap: 10px; justify-content: center; }
.row .big-btn { flex: 1; min-width: 0; font-size: 19px; padding: 0 10px; }

/* ---- new tool card ----------------------------------------------------------------------------------------------------------------- */
.card-velvet { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: auto; background: radial-gradient(circle at 50% 42%, #7a3a8a 0, #4a1f5a 55%, #2a1030 100%); }
.card-velvet::before { content: ''; position: absolute; inset: 14px; border: 3px dashed rgba(255,214,140,.5); border-radius: 26px; pointer-events: none; }
.card-title { font-family: var(--title); font-weight: 400; font-size: 40px; color: #ffe08a; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; transform: rotate(-3deg); animation: popin .5s cubic-bezier(.2,1.6,.4,1); }
.card-name { font-size: 24px; color: #fff; text-shadow: 0 3px 0 var(--ink); }
.cushion { width: 230px; height: 200px; border-radius: 50% / 40%; background: radial-gradient(ellipse at 40% 30%, #ff8fb0, #e8407a 60%, #b02a5a); border: 4px solid var(--ink); display: grid; place-items: center; box-shadow: 0 10px 0 rgba(0,0,0,.35); animation: popin .6s .1s both cubic-bezier(.2,1.6,.4,1); }
.card-tool { width: 170px; height: 170px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); animation: bob 2s ease-in-out infinite; }
.card-hint { color: #ffe9c4; font-size: 17px; max-width: 300px; text-align: center; }

/* ---- clinic ------------------------------------------------------------------------------------------------------------------------- */
.clinic-ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(var(--safe-b) + 10px); background: linear-gradient(rgba(42,22,38,0), rgba(42,22,38,.92) 22%); }
.cards { display: flex; gap: 7px; justify-content: center; max-width: 560px; margin: 0 auto; }
.shop-card { flex: 1; min-width: 0; max-width: 180px; height: 192px; padding: 14px 4px 8px; border-radius: 18px; border: 3.5px solid var(--ink); position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--cream); box-shadow: 0 6px 0 rgba(0,0,0,.45); }
.shop-card > * { flex: none; }
.shop-card::after { content: ''; position: absolute; inset: 4px; border-radius: 13px; border: 2px dashed rgba(42,22,38,.3); pointer-events: none; }
.shop-card.station { background: linear-gradient(#c9f4e6, #8fdcc4); }
.shop-card.furniture { background: linear-gradient(#ffd9b0, #ffb47a); }
.shop-card.decor { background: linear-gradient(#e2cfff, #b996f2); }
.shop-card.can { animation: glowpulse 1.4s ease-in-out infinite; }
.shop-card.is-max { filter: saturate(.5); opacity: .85; }
.shop-card .lvl { position: absolute; right: -8px; top: -10px; padding: 2px 7px; border-radius: 10px; background: #fff; border: 2.5px solid var(--ink); font-size: 12px; }
.shop-card .track { font-size: 12px; text-transform: uppercase; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.shop-card .prev { width: 72px; height: 72px; }
.shop-card .iname { font-size: 12px; line-height: 1.05; height: 26px; overflow: hidden; text-align: center; color: #4a2c48; }
.price { display: flex; align-items: center; gap: 4px; padding: 2px 10px 2px 3px; border-radius: 12px; background: #fff; border: 2.5px solid var(--ink); font-size: 16px; }
.price img { width: 22px; height: 22px; }
.price.no { opacity: .8; }
.price.max { padding: 3px 10px; background: var(--green); color: #fff; }
.done-star { width: 60px; height: 60px; background: var(--yellow); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.shake { animation: shake .35s; }
.guide-paw { position: fixed; width: 48px; height: 60px; pointer-events: none; animation: tapme 1s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); z-index: 3; }
.styles { max-width: 560px; margin: 0 auto 8px; }
.styles-title { color: #ffe08a; font-family: var(--title); font-weight: 400; font-size: 22px; text-align: center; }
.style-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; touch-action: pan-x; }
.style-chip { flex: none; width: 84px; padding: 4px; border-radius: 14px; border: 3px solid var(--ink); background: var(--cream); display: flex; flex-direction: column; align-items: center; font-size: 12px; gap: 1px; }
.style-chip canvas { width: 48px; height: 48px; border-radius: 8px; }
.style-chip b { display: flex; align-items: center; gap: 2px; font-size: 12px; }
.style-chip b img { width: 14px; height: 14px; }
.style-chip.use { background: var(--mint); }
.style-chip.can { animation: glowpulse 1.4s ease-in-out infinite; }

/* ---- ceremony / modal / toast / boot --------------------------------------------------------------------------------------------- */
.ceremony { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: 420px; margin: 0 auto; padding: 22px 18px; border-radius: 26px; background: var(--cream); border: 4px solid var(--ink); text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.45), inset 0 0 0 6px var(--cream), inset 0 0 0 8.5px rgba(255,92,141,.55); animation: popin .5s cubic-bezier(.2,1.6,.4,1); pointer-events: auto; }
.cer-title { font-family: var(--title); font-weight: 400; font-size: 38px; color: var(--pink); -webkit-text-stroke: 1.5px var(--ink); }
.ceremony p { font-size: 18px; margin: 10px 0; }
.ceremony p.small, .note, .small { font-size: 14px; color: #6b4a5a; font-weight: 800; }
#modal { position: absolute; inset: 0; background: rgba(20,8,16,.62); display: grid; place-items: center; pointer-events: auto; }
