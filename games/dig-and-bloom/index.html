/* Dig & Bloom — cream garden paper, brown ink, leaf-green buttons. Nunito 700/800/900 (embedded). */
:root { --cream: #FFF6E3; --paper: #FBEFD5; --ink: #3B2A20; --ink2: #6E5440; --leaf: #5BAE4C; --leafD: #3E7F33; --berry: #E5484D; --gold: #F7C948; --goldD: #C88A1E; --soil: #5E3B22; --shadow: 0 6px 0 rgba(59,42,32,.18), 0 10px 26px rgba(30,15,5,.28); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2E1C12; color: var(--ink); font-family: Nunito, system-ui, sans-serif; font-weight: 800; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
canvas#g { position: fixed; inset: 0; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 900; color: var(--cream); background: radial-gradient(circle at 50% 40%, #8A5A36, #2E1C12); }
.ic { display: inline-grid; width: 24px; height: 24px; flex: none; }
.ic svg { width: 100%; height: 100%; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 18px; border: 0; border-radius: 16px; font: 900 18px Nunito, sans-serif; cursor: pointer; color: var(--ink); background: var(--cream); box-shadow: 0 4px 0 rgba(59,42,32,.25); transition: transform .08s, filter .15s; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(59,42,32,.25); }
.btn:disabled { filter: grayscale(.8) opacity(.55); cursor: default; }
.btn.primary { background: linear-gradient(#6CC05A, var(--leaf)); color: #fff; box-shadow: 0 4px 0 var(--leafD); text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.cream { background: var(--cream); border: 2px solid rgba(59,42,32,.15); }
.btn.gold { background: linear-gradient(#FFDB6E, var(--gold)); box-shadow: 0 4px 0 var(--goldD); }
.btn.ghost { background: transparent; border: 2px solid rgba(59,42,32,.35); box-shadow: none; }
.btn.big { min-height: 58px; font-size: 21px; padding: 10px 26px; }
.btn.small { min-height: 44px; font-size: 15px; padding: 6px 12px; border-radius: 12px; }
.btn .ic { width: 22px; height: 22px; }
.ibtn { width: 48px; height: 48px; border-radius: 14px; border: 0; display: grid; place-items: center; background: var(--cream); color: var(--soil); box-shadow: 0 4px 0 rgba(59,42,32,.3); cursor: pointer; padding: 0; }
.ibtn .ic { width: 26px; height: 26px; }
.ibtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(59,42,32,.3); }

/* HUD */
.hud-top, .hud-bot { position: fixed; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: auto; }
.hud-top { z-index: 3; }
.hud-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
.hud-title { font-size: 14px; font-weight: 900; color: var(--cream); text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goalbar { position: relative; height: 26px; border-radius: 13px; background: rgba(46,28,18,.78); border: 2px solid rgba(255,246,227,.85); overflow: visible; }
.goal-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 11px; background: linear-gradient(90deg, #6CC05A, #9BD66A); transition: width .25s; }
.goal-text { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 12px; color: #fff; font-size: 15px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.goal-ticks { position: absolute; inset: 0; }
.tick { position: absolute; top: -9px; width: 22px; height: 22px; margin-left: -11px; display: grid; }
.tick svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
.tick.pop { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.4); } 100% { transform: scale(1); } }
[data-mode="wide"] .hud-top { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "mid mid" "pause retry"; gap: 12px 10px; padding: 14px; background: rgba(255,246,227,.94); border-radius: 20px; box-shadow: var(--shadow); justify-items: center; }
[data-mode="wide"] .hud-top .hud-mid { grid-area: mid; width: 100%; gap: 10px; }
[data-mode="wide"] .hb-pause { grid-area: pause; } [data-mode="wide"] .hb-retry { grid-area: retry; }
[data-mode="wide"] .hud-top .hud-title { white-space: normal; color: var(--ink); text-shadow: none; font-size: 18px; }
[data-mode="wide"] .goalbar { height: 34px; border-radius: 17px; margin-top: 8px; }
[data-mode="wide"] .goal-text { font-size: 18px; }
[data-mode="wide"] .hud-bot { flex-wrap: wrap; justify-content: center; align-content: flex-start; padding: 12px; background: rgba(255,246,227,.94); border-radius: 20px; box-shadow: var(--shadow); }
[data-mode="wide"] .hud-bot:empty { display: none; }
[data-mode="wide"] .hud-hint { background: transparent; color: var(--ink); }
[data-mode="wide"][data-tiny="1"] .hud-top { padding: 6px; gap: 4px 6px; border-radius: 12px; }
[data-mode="wide"][data-tiny="1"] .hud-top .hud-title { font-size: 11px; }
[data-mode="wide"][data-tiny="1"] .goalbar { height: 24px; margin-top: 6px; }
[data-mode="wide"][data-tiny="1"] .goal-text { font-size: 13px; }
[data-mode="wide"][data-tiny="1"] .ibtn { width: 44px; height: 44px; }
[data-mode="wide"][data-tiny="1"] .hud-bot { padding: 4px; gap: 4px; border-radius: 12px; }
[data-mode="wide"][data-tiny="1"] .abtn { width: 44px; height: 44px; }
[data-mode="wide"][data-tiny="1"] .abtn .ic { width: 28px; height: 28px; }
[data-mode="wide"][data-tiny="1"] .hud-hint { font-size: 10px; padding: 2px; }
.hud-bot { justify-content: center; gap: 10px; }
.hud-hint { color: var(--cream); font-size: 14px; text-align: center; background: rgba(46,28,18,.82); border-radius: 12px; padding: 6px 12px; line-height: 1.25; }
.abtn { position: relative; width: 54px; height: 54px; border-radius: 16px; border: 0; background: var(--cream); box-shadow: 0 4px 0 rgba(59,42,32,.3); display: grid; place-items: center; cursor: pointer; padding: 0; }
.abtn .ic { width: 34px; height: 34px; }
.abtn .acount { position: absolute; right: -4px; bottom: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--soil); color: #fff; font-size: 13px; display: grid; place-items: center; padding: 0 5px; }
.abtn.empty { filter: grayscale(.9) opacity(.6); }
.abtn.active { box-shadow: 0 0 0 3px #FFF6E3, 0 0 18px 4px rgba(255,220,120,.9); }
.abtn .aring { position: absolute; inset: -4px; border-radius: 19px; background: conic-gradient(rgba(255,210,90,.9) calc(var(--k, 0) * 360deg), transparent 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0); pointer-events: none; }
.finish { position: fixed; transform: translate(-50%, -50%); z-index: 4; animation: bob 1.2s ease-in-out infinite; }
.finish.hidden { display: none; }
@keyframes bob { 50% { transform: translate(-50%, -58%); } }
.stallbar { position: fixed; transform: translateX(-50%); z-index: 4; background: rgba(255,246,227,.96); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-size: 14px; color: var(--ink2); }
.stallbar b { color: var(--ink); font-size: 16px; }

/* home */
.home { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); pointer-events: none; }
#ui > .home { pointer-events: none; }   /* empty parts of the home layer let touches through to the valley */
.home > * { pointer-events: auto; }
.stats { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.stats.inline { justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,246,227,.95); box-shadow: 0 3px 0 rgba(59,42,32,.2); font-size: 16px; font-weight: 900; }
.chip .ic { width: 22px; height: 22px; }
.brand { text-align: center; pointer-events: none; }
.brand h1 { margin: 6px 0 0; font-size: clamp(34px, 7vw, 64px); font-weight: 900; color: #FFF6E3; letter-spacing: .5px; text-shadow: 0 3px 0 #5E3B22, 0 6px 16px rgba(0,0,0,.35); }
.brand p { margin: 0; font-size: clamp(15px, 2.4vw, 22px); color: #5E3B22; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.homebot { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: auto; pointer-events: none; }
.homebot > * { pointer-events: auto; }
.vnote { background: rgba(255,246,227,.92); border: 0; border-radius: 12px; padding: 6px 12px; font: 800 14px Nunito, sans-serif; color: var(--ink2); max-width: min(94vw, 560px); text-align: center; box-shadow: 0 3px 0 rgba(59,42,32,.18); }
button.vnote { cursor: pointer; }
.btn.restore { max-width: min(94vw, 560px); padding-left: 14px; padding-right: 10px; }
.restore .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.restore .cost { flex: none; display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px 2px 4px; border-radius: 999px; background: rgba(255,255,255,.55); font-size: 16px; }
.restore .cost .ic { width: 20px; height: 20px; }
.vscroll { position: fixed; top: 42%; width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255,246,227,.88); color: var(--soil); box-shadow: 0 4px 0 rgba(59,42,32,.25); cursor: pointer; padding: 0; transition: opacity .2s; }
.vscroll .ic { width: 26px; height: 26px; }
.vscroll.l { left: max(8px, env(safe-area-inset-left)); } .vscroll.r { right: max(8px, env(safe-area-inset-right)); }
.vscroll.off { opacity: 0; pointer-events: none; }
.vscroll:active { transform: translateY(2px); }
.nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
.nav .btn { min-height: 48px; font-size: 15px; padding: 6px 12px; }
.restore { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 4px 0 var(--goldD), 0 0 22px 6px rgba(255,220,120,.9); } }

/* cards */
.overlay { position: fixed; inset: 0; z-index: 10; }
.overlay > .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.overlay.dim { background: rgba(30,15,5,.45); }
.card { width: min(92vw, 460px); background: var(--paper); border-radius: 24px; padding: 18px 18px 16px; box-shadow: var(--shadow); border: 3px solid rgba(255,255,255,.7); display: flex; flex-direction: column; gap: 12px; align-items: stretch; transform-origin: 50% 50%; position: relative; }
.card::before { content: ''; position: absolute; left: 22px; right: 22px; top: -10px; height: 18px; border-radius: 9px; background: repeating-linear-gradient(90deg, #6CC05A 0 14px, #5BAE4C 14px 28px); box-shadow: 0 2px 0 var(--leafD); }
.card.boards, .card.collection, .card.mastery { width: min(94vw, 600px); }
.chead { text-align: center; }
.chead h2 { margin: 4px 0 2px; font-size: 26px; font-weight: 900; }
.chead p { margin: 0; color: var(--ink2); font-size: 16px; font-weight: 700; }
.note { margin: 0; text-align: center; color: var(--ink2); font-size: 14px; font-weight: 700; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.big { text-align: center; font-size: 34px; font-weight: 900; }
.daisies { display: flex; justify-content: center; gap: 6px; }
.dz { width: 58px; height: 58px; display: grid; }
.dz svg { width: 100%; height: 100%; }
.dz.on { animation: pop .5s ease-out both; animation-delay: var(--d); }
.rewards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rewards li { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.6); border-radius: 12px; padding: 6px 10px; font-size: 15px; }
.rewards li.muted { color: var(--ink2); font-weight: 700; font-size: 13px; }
.result.lose .chead h2 { color: #9E2A2E; }
.overlay:not(.dim) .card.result { margin-top: 0; }
.introart { width: 100%; height: auto; border-radius: 16px; border: 3px solid rgba(59,42,32,.15); background: #9A6236; }
.bigicon { width: 96px; height: 96px; margin: 0 auto; display: grid; }
.bigicon.sm { width: 54px; height: 54px; }
.bigicon svg { width: 100%; height: 100%; }
.tabs, .seg { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.tab { min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 2px solid rgba(59,42,32,.18); background: var(--cream); font: 900 14px Nunito, sans-serif; color: var(--ink2); cursor: pointer; }
.tab.on { background: var(--soil); color: #fff; border-color: var(--soil); }
.lgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.lvl { min-height: 64px; border-radius: 14px; border: 0; background: var(--cream); box-shadow: 0 4px 0 rgba(59,42,32,.22); font: 900 20px Nunito, sans-serif; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.lvl.next { background: linear-gradient(#6CC05A, var(--leaf)); color: #fff; }
.lvl.locked { opacity: .55; cursor: default; }
.lvl .ic { width: 18px; height: 18px; }
.lvl.bonus { flex-direction: row; gap: 8px; font-size: 15px; min-height: 52px; width: 100%; }
.mini { display: flex; gap: 2px; }
.mini i { width: 9px; height: 9px; border-radius: 50%; background: rgba(59,42,32,.2); }
.mini i.on { background: #F2C230; box-shadow: 0 0 0 1px #B9871A; }
/* collection tiles: as many columns as fit (never wider than the card), every child may shrink and wrap */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(120px, 100%), 1fr)); gap: 8px; }
.citem { min-width: 0; background: rgba(255,255,255,.65); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 12.5px; overflow: hidden; }
.citem > * { max-width: 100%; }
.citem b { overflow-wrap: anywhere; }
.citem small { font-weight: 700; color: var(--ink2); font-size: 11px; }
.citem .btn, .citem .chip { white-space: normal; text-align: center; line-height: 1.15; }
.citem .chip { font-size: 13px; padding: 4px 9px; }
.citem.locked .prev { filter: grayscale(.6) opacity(.75); }
.prev { width: 96px; max-width: 100%; height: auto; aspect-ratio: 4 / 3; }
.card.site { width: min(92vw, 420px); }
.siteart { width: 100%; height: auto; border-radius: 16px; border: 3px solid rgba(59,42,32,.15); }
.chests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chestbtn { min-height: 74px; border: 0; border-radius: 14px; background: #6E4522; box-shadow: 0 4px 0 #3A2414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: #fff; font: 800 11px Nunito, sans-serif; }
.chestbtn .chestic { width: 44px; height: 44px; }
.chestbtn.opened { background: #E9D8B8; color: var(--ink); box-shadow: 0 4px 0 #B9A27C; }
.keys { display: flex; justify-content: center; gap: 10px; }
.kk { width: 42px; height: 42px; display: grid; opacity: .3; }
.kk.on { opacity: 1; }
.kk svg { width: 100%; height: 100%; }
.slider { display: grid; grid-template-columns: 28px 1fr 2fr 48px; align-items: center; gap: 8px; font-size: 15px; }
.slider input { width: 100%; height: 44px; accent-color: var(--leaf); }
.sval { text-align: right; font-size: 14px; color: var(--ink2); }
.setrow { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; font-size: 15px; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 44px; }
.toggle input { width: 26px; height: 26px; accent-color: var(--leaf); }
.credits { white-space: pre-wrap; font: 700 13px/1.45 Nunito, sans-serif; background: rgba(255,255,255,.6); border-radius: 12px; padding: 10px; margin: 0; color: var(--ink2); }
.toast { position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); background: rgba(46,28,18,.92); color: var(--cream); padding: 10px 16px; border-radius: 14px; font-size: 15px; z-index: 20; max-width: 86vw; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.35); pointer-events: none; }
@media (max-height: 520px) { .brand h1 { font-size: 30px; } .nav .btn { min-height: 44px; } .chead h2 { font-size: 21px; } }
@media (max-width: 420px) { .lgrid { grid-template-columns: repeat(4, 1fr); } }

/* very short frames (the platform inline card 390×219): compact valley — title hidden, icon-only navigation */
@media (max-height: 330px) {
  .home { padding: 6px 8px; }
  .brand { display: none; }
  .chip { padding: 3px 8px; font-size: 13px; } .chip .ic { width: 18px; height: 18px; }
  .stats .ibtn { width: 44px; height: 44px; }
  .homebot { gap: 6px; flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .homebot .btn.big { min-height: 44px; font-size: 15px; padding: 4px 14px; }
  .homebot .restore { min-height: 44px; font-size: 13px; padding: 4px 10px; }
  .vnote { display: none; }
  .vscroll { top: 36%; width: 40px; height: 40px; }
  .restore .cost { font-size: 13px; }
  .nav { gap: 6px; } .nav .btn { min-width: 44px; min-height: 44px; padding: 4px 8px; } .nav .btn .lbl { display: none; }
}

/* embedded on the platform: the host's buttons sit in the top-right corner */
[data-embedded="1"] .stats { padding-right: 58px; }
