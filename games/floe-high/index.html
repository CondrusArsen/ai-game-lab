<style>/* Floe High — UI. Frosted ice panels, rounded "FH Display" (Unbounded) numerals, "FH UI" (Nunito) text.
   No scrolling anywhere: cards scale to fit (--fit). The canvas under everything is the play field. */
:root {
  --ink: #12305a; --ink2: #3a5a80; --ice: #f4fbff; --ice2: #dff1fb; --aqua: #2fbfbe; --aqua-d: #1d8f97;
  --coral: #ff6b5e; --gold: #ffcf55; --gold-d: #d99a12; --night: #0e1f3a;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --disp: 'FH Display', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --ui: 'FH UI', 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #77b2d6; overscroll-behavior: none; }
body { font-family: var(--ui); color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; position: fixed; inset: 0; }
#bg, #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bg { z-index: 0; } #gl { z-index: 1; touch-action: none; }
#ui { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
#ui button, #ui .card, #ui .slider, #ui .chip { pointer-events: auto; }
.hidden { display: none !important; }
button { font-family: var(--ui); font-weight: 900; color: var(--ink); border: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
svg { width: 22px; height: 22px; flex: none; }

/* ---- HUD ------------------------------------------------------------------------------------------------------ */
.hud { position: absolute; inset: 0; }
.icon-btn { position: absolute; left: 10px; top: calc(10px + var(--safe-t)); width: 46px; height: 46px; border-radius: 15px;
  display: grid; place-items: center; background: rgba(244, 251, 255, .82); box-shadow: 0 3px 0 rgba(18, 48, 90, .22), 0 6px 14px rgba(18, 48, 90, .18); }
.icon-btn.small { position: static; width: 44px; height: 44px; }
.chip.crystals { position: absolute; left: 64px; top: calc(14px + var(--safe-t)); height: 38px; padding: 0 12px 0 8px; border-radius: 19px;
  display: flex; align-items: center; gap: 4px; background: rgba(14, 31, 58, .55); color: #fff; font-weight: 900; font-size: 18px; }
.chip.crystals i svg { color: #9ff3ff; width: 20px; height: 20px; }
.chip.crystals.in-card { position: static; background: var(--night); }
.score-wrap { position: absolute; left: 50%; top: calc(18px + var(--safe-t)); transform: translateX(-50%); text-align: center; width: 60%; }
.score { font-family: var(--disp); font-weight: 800; font-size: clamp(46px, 8.5vh, 76px); line-height: 1; color: #fff;
  text-shadow: 0 3px 0 rgba(18, 48, 90, .35), 0 0 18px rgba(18, 48, 90, .25); }
.score.pop { animation: pop .22s ease-out; }
@keyframes pop { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
.streak { height: 18px; margin-top: 6px; display: flex; gap: 6px; justify-content: center; align-items: center; }
.streak i { width: 14px; height: 14px; border-radius: 4px; transform: rotate(45deg); background: rgba(255, 255, 255, .28); border: 2px solid rgba(255, 255, 255, .7); }
.streak i.on { background: #fff; box-shadow: 0 0 10px #bff6ff; }
.streak.hot i { background: #9ff3ff; border-color: #fff; }
.streak em { font-style: normal; font-family: var(--disp); color: #fff; font-size: 15px; margin-left: 4px; text-shadow: 0 2px 0 rgba(18, 48, 90, .35); }
.label { margin-top: 6px; height: 28px; font-weight: 900; font-size: 20px; color: #fff; opacity: 0; transform: translateY(6px);
  text-shadow: 0 2px 0 rgba(18, 48, 90, .4); transition: opacity .12s, transform .12s; white-space: nowrap; }
.label.show { opacity: 1; transform: none; }
.label.grow { color: #c9fbff; font-size: 23px; }
.label.best { color: var(--gold); }

/* ---- toasts / banner -------------------------------------------------------------------------------------------- */
.toasts { position: absolute; left: 50%; top: calc(196px + var(--safe-t)); transform: translateX(-50%); width: min(92vw, 420px);
  display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 3; }
.toast { background: rgba(14, 31, 58, .78); color: #fff; font-weight: 800; font-size: 15px; padding: 8px 14px; border-radius: 14px; text-align: center;
  animation: tin .25s ease-out; transition: opacity .35s, transform .35s; }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
.banner { position: absolute; left: 50%; top: 63%; transform: translate(-50%, 0); text-align: center; color: #fff; z-index: 3; background: rgba(14, 31, 58, .62); padding: 8px 20px 10px; border-radius: 18px; white-space: nowrap; }
.banner.show { animation: ban 2.2s ease-out forwards; }
.banner small { display: block; font-weight: 900; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.banner b { display: block; font-family: var(--disp); font-size: clamp(24px, 4.2vh, 36px); text-shadow: 0 3px 0 rgba(18, 48, 90, .4), 0 0 24px rgba(160, 240, 255, .6); }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -8px); } }

/* ---- title ------------------------------------------------------------------------------------------------------ */
.title { position: absolute; inset: 0; }
.logo { position: absolute; left: 50%; top: max(62px, calc(6vh + var(--safe-t))); transform: translateX(-50%); text-align: center; width: 94%; }
.logo-word { font-family: var(--disp); font-weight: 800; font-size: clamp(40px, 7.2vh, 70px); line-height: .95; color: #fff; letter-spacing: -.01em;
  text-shadow: 0 4px 0 #2a6f9a, 0 7px 0 rgba(18, 48, 90, .35), 0 0 30px rgba(255, 255, 255, .45); }
.tagline { margin-top: 10px; font-weight: 900; font-size: clamp(14px, 2.1vh, 18px); color: #fff; text-shadow: 0 2px 0 rgba(18, 48, 90, .45); }
.best-line { margin-top: 6px; font-family: var(--disp); font-size: 16px; color: var(--gold); text-shadow: 0 2px 0 rgba(60, 40, 0, .45); min-height: 20px; }
.hint { position: absolute; left: 50%; bottom: calc(132px + var(--safe-b)); transform: translateX(-50%); text-align: center; width: 92%; }
.hint-main { display: inline-block; background: rgba(244, 251, 255, .92); color: var(--ink); font-weight: 900; font-size: clamp(17px, 2.5vh, 21px);
  padding: 10px 18px; border-radius: 18px; box-shadow: 0 4px 0 rgba(18, 48, 90, .2); }
.hint-sub { margin-top: 8px; font-weight: 800; font-size: 13px; color: #fff; text-shadow: 0 1px 0 rgba(18, 48, 90, .6); }
.finger { width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 0 rgba(255, 255, 255, .7);
  animation: tap 1.3s ease-out infinite; }
@keyframes tap { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, .7); } 30% { transform: scale(.8); } 100% { transform: scale(1); box-shadow: 0 0 0 22px rgba(255, 255, 255, 0); } }
.title.no-hint .hint { display: none; }
.title.no-menu .menu-row { display: none; }
.menu-row { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 10px; }
.round-btn { min-width: 96px; height: 70px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: rgba(244, 251, 255, .9); box-shadow: 0 4px 0 rgba(18, 48, 90, .25); font-size: 12px; padding: 4px 8px; }
.round-btn svg { width: 26px; height: 26px; color: var(--aqua-d); }

/* ---- receipt ---------------------------------------------------------------------------------------------------- */
.receipt { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; background: rgba(14, 31, 58, .88); color: #fff;
  border-radius: 14px; padding: 8px 12px; text-align: center; z-index: 3; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
.r-title { font-family: var(--disp); font-size: 16px; color: #ffd0c8; }
.r-why { font-weight: 800; font-size: 13px; margin-top: 2px; }
.r-arrow { position: absolute; left: calc(50% + var(--ax, 0px)); bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-bottom: 0; border-top-color: rgba(14, 31, 58, .88); }

/* ---- cards ------------------------------------------------------------------------------------------------------ */
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 24, 46, .38); pointer-events: auto; z-index: 4; }
.card { transform: scale(var(--fit, 1)); transform-origin: center; background: linear-gradient(180deg, #ffffff 0%, var(--ice) 55%, var(--ice2) 100%);
  border-radius: 26px; padding: 18px; box-shadow: 0 6px 0 rgba(18, 48, 90, .18), 0 18px 40px rgba(10, 24, 46, .35); width: min(92vw, 420px); }
.card.narrow { width: min(90vw, 360px); }
.card.wide-card { width: min(94vw, 560px); }
.card h2 { margin: 0 0 12px; font-family: var(--disp); font-weight: 800; font-size: 24px; text-align: center; color: var(--ink); }
.big-btn { width: 100%; min-height: 60px; border-radius: 20px; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 22px; color: #fff; background: linear-gradient(180deg, #45d3cf, #22a5ad); box-shadow: 0 5px 0 #157a83, 0 10px 18px rgba(21, 122, 131, .35); }
.big-btn svg { width: 26px; height: 26px; }
.big-btn.slim { min-height: 52px; font-size: 19px; }
.big-btn.gold { background: linear-gradient(180deg, #ffe08a, #f7b733); color: #5a3a00; box-shadow: 0 5px 0 #c98a10; }
.big-btn:disabled { background: #d4e3ee; color: #6a83a0; box-shadow: 0 4px 0 #b7c9d8; cursor: default; }
.big-btn:active:not(:disabled), .pill:active, .round-btn:active, .icon-btn:active { transform: translateY(3px); }
.pill { min-height: 46px; padding: 0 14px; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 rgba(18, 48, 90, .18); display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
.pill svg { color: var(--aqua-d); }
.pill.wide { width: 100%; justify-content: center; margin-top: 10px; }

/* ---- result ----------------------------------------------------------------------------------------------------- */
.result { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 10px calc(12px + var(--safe-b)); z-index: 4; }
.result .card { transform-origin: bottom center; padding: 14px 16px 12px; }
.result.enter .card { animation: rise .32s ease-out; }
.result.behind, .title.behind { visibility: hidden; }
@keyframes rise { from { transform: translateY(40px) scale(var(--fit, 1)); opacity: 0; } }
.res-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.res-score b { font-family: var(--disp); font-size: 56px; line-height: .9; color: var(--ink); }
.res-score span { margin-left: 6px; font-weight: 900; color: var(--ink2); font-size: 16px; }
.res-best { font-family: var(--disp); font-size: 17px; color: var(--ink2); text-align: right; }
.new-best { color: #b77900; background: #fff2c4; padding: 6px 10px; border-radius: 12px; display: inline-block; animation: pop .3s ease-out; }
.res-row { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; margin-top: 12px; }
.res-cell { background: #fff; border-radius: 14px; padding: 7px 8px; text-align: center; box-shadow: inset 0 0 0 2px #e3eff7; }
.res-cell small { display: block; font-size: 11px; font-weight: 800; color: var(--ink2); }
.res-cell b { font-family: var(--disp); font-size: 17px; }
.crystals-cell { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center; column-gap: 4px; }
.crystals-cell i svg { color: #2fbfd8; }
.crystals-cell small { grid-column: 1 / -1; }
.hud.over .icon-btn, .hud.over .score-wrap { display: none; }
.res-why { margin-top: 10px; font-weight: 900; font-size: 14px; color: #b5462f; text-align: center; }
.res-why:empty { display: none; }
.res-tip { margin-top: 6px; font-weight: 800; font-size: 13.5px; color: var(--ink2); text-align: center; min-height: 18px; }
.res-menu { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.res-menu .icon-btn { flex: none; }
.res-menu .pill { flex: 1 1 auto; min-width: 0; justify-content: center; }
.unsaved { margin-top: 8px; font-size: 12px; font-weight: 800; color: #b5462f; text-align: center; }

/* ---- settings --------------------------------------------------------------------------------------------------- */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; font-weight: 900; font-size: 16px; }
.seg { display: flex; background: #e3eff7; border-radius: 14px; padding: 3px; }
.seg button { min-width: 58px; min-height: 44px; border-radius: 11px; background: transparent; font-size: 15px; color: var(--ink2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 0 rgba(18, 48, 90, .15); }
.slider-row span { width: 96px; }
.slider { position: relative; flex: 1; height: 44px; touch-action: none; cursor: pointer; }
.slider .track { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: #d3e4ef; overflow: hidden; }
.slider .fill { height: 100%; background: linear-gradient(90deg, #45d3cf, #22a5ad); }
.slider .knob { position: absolute; top: 9px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(18, 48, 90, .35); border: 3px solid var(--aqua); }
.pct { width: 46px; text-align: right; font-family: var(--disp); font-size: 14px; }
.credits p { margin: 0 0 8px; font-weight: 700; font-size: 13.5px; line-height: 1.35; color: var(--ink2); }

/* ---- collection ------------------------------------------------------------------------------------------------- */
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.sheet-head h2 { flex: 1; margin: 0; text-align: left; font-size: 21px; }
.fams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fam { background: #fff; border-radius: 16px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: inset 0 0 0 2px #e3eff7; min-height: 44px; }
.fam.sel { box-shadow: inset 0 0 0 3px var(--aqua), 0 4px 10px rgba(47, 191, 190, .25); }
.fam-thumb { width: 100%; max-width: 104px; aspect-ratio: 1; border-radius: 12px; }
.fam b { font-size: 13.5px; }
.fam small { display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--ink2); min-height: 18px; }
.fam small svg { width: 14px; height: 14px; }
.fam.locked .fam-thumb { filter: saturate(.55) brightness(.92); }
.fam-desc { margin-top: 10px; text-align: center; font-weight: 800; font-size: 14px; color: var(--ink2); min-height: 20px; }
.fam-rule { margin-top: 8px; text-align: center; font-weight: 800; font-size: 12.5px; color: var(--ink2); opacity: .85; }
#sheet:has(.sheet-bottom) { align-items: flex-end; padding-bottom: calc(8px + var(--safe-b)); background: rgba(10, 24, 46, .12); }
.sheet-bottom { transform-origin: bottom center; }

/* ---- atlas ------------------------------------------------------------------------------------------------------ */
.atlas { display: grid; grid-template-columns: 1fr; gap: 10px; }
.atlas-strip { display: flex; flex-direction: column; gap: 6px; }
.z-row { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 14px; padding: 5px; box-shadow: inset 0 0 0 2px #e3eff7; }
.z-card { width: 168px; height: 70px; display: block; border-radius: 10px; flex: none; }
.z-row.locked .z-card { filter: grayscale(.85) brightness(.75) blur(1px); }
.z-info { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.z-info b { font-size: 15px; } .z-info small { font-size: 12px; color: var(--ink2); font-weight: 800; }
.z-info em { font-style: normal; font-size: 12px; font-weight: 900; color: #6a83a0; }
.z-info .flag { font-size: 12px; font-weight: 900; color: #8a5a00; background: #fff2c4; padding: 2px 8px; border-radius: 8px; }
.atlas-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.atlas-stats div { background: #fff; border-radius: 12px; padding: 6px 4px; text-align: center; box-shadow: inset 0 0 0 2px #e3eff7; }
.atlas-stats small { display: block; font-size: 10.5px; font-weight: 800; color: var(--ink2); }
.atlas-stats b { font-family: var(--disp); font-size: 16px; }

/* ---- wide screens: result card beside the tower, toasts away from the top -------------------------------------- */
@media (min-aspect-ratio: 23/20) {
  .result { left: auto; right: 0; top: 0; bottom: 0; align-items: center; padding: 10px 16px; width: min(48vw, 460px); }
  .result .card { transform-origin: right center; width: 100%; max-width: 440px; }
  .atlas { grid-template-columns: 1.6fr 1fr; }
  .atlas-stats { grid-template-columns: 1fr 1fr; align-content: start; }
  .hint { bottom: calc(110px + var(--safe-b)); }
}
@media (max-height: 560px) {
  .toasts { top: auto; bottom: calc(14px + var(--safe-b)); }
  .logo { top: 60px; } .logo-word { font-size: clamp(24px, 9vh, 48px); }
  .tagline { margin-top: 4px; } .hint { bottom: 92px; } .finger { display: none; }
  .round-btn { height: 56px; min-width: 80px; }
  .menu-row { bottom: 10px; }
  .score { font-size: clamp(34px, 10vh, 56px); }
  .banner { top: 58%; }
}
@media (max-height: 300px) {
  .tagline, .hint-sub, .best-line { display: none; }
  .hint { bottom: 64px; } .hint-main { font-size: 14px; padding: 6px 12px; }

.evtag { display: inline-block; margin-top: 4px; padding: 5px 12px; border-radius: 14px; font-weight: 900; font-size: 14px; color: #fff;
  background: rgba(14, 31, 58, .7); box-shadow: 0 0 0 2px rgba(255, 255, 255, .25); animation: tin .25s ease-out; white-space: nowrap; }
.evtag.ev-gem { background: linear-gradient(90deg, #1d8fb0, #34c7e0); }
.evtag.ev-stray { background: linear-gradient(90deg, #c35a8a, #ff8fb1); }
.evtag.ev-gust { background: linear-gradient(90deg, #4a5f86, #7e98c4); }
.evtag.ev-golden { background: linear-gradient(90deg, #d68a10, #ffc843); color: #4a2a00; }
.label.gem { color: #b9fbff; } .label.gold { color: #ffd76a; } .label.lost { color: #ffc2c2; font-size: 17px; }
.res-extra { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.res-extra:empty { display: none; }
.res-extra span { display: inline-flex; align-items: center; gap: 4px; background: #eaf7ff; border-radius: 12px; padding: 4px 10px; font-weight: 900; font-size: 13.5px; color: var(--ink); }
.res-extra svg { width: 18px; height: 18px; color: #2fbfd8; }
.chip.pengs { position: static; height: 38px; padding: 0 12px 0 8px; border-radius: 19px; display: flex; align-items: center; gap: 4px; background: var(--night); color: #fff; font-weight: 900; font-size: 18px; }
.chip.pengs i svg { color: #24335a; width: 22px; height: 22px; }
.harbour-card { width: min(94vw, 560px); }

.bld { background: #fff; border-radius: 14px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; box-shadow: inset 0 0 0 2px #e3eff7; min-height: 112px; text-align: center; }
.bld-pic svg { width: 40px; height: 40px; }
.bld b { font-size: 11.5px; line-height: 1.1; min-height: 26px; display: flex; align-items: center; }
.bld.done { box-shadow: inset 0 0 0 2px #7ad8a0; background: #f1fff6; }
.bld.locked .bld-pic { filter: grayscale(1) opacity(.55); }
.bld-btn { min-height: 44px; min-width: 60px; border-radius: 12px; background: #d4e3ee; color: #6a83a0; display: inline-flex; align-items: center; justify-content: center; gap: 2px; font-size: 14px; padding: 0 6px; }
.bld-btn.gold { background: linear-gradient(180deg, #ffe08a, #f7b733); color: #5a3a00; box-shadow: 0 3px 0 #c98a10; }
.bld-btn svg, .bld small svg { width: 15px; height: 15px; }
.bld small { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 900; min-height: 44px; }
.bld-ok { color: #1f8a4c; } .bld-need { color: #6a83a0; }
.atlas-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.z-row { padding: 4px; gap: 8px; }
.z-card { width: 150px; height: 62px; }
.z-info b { font-size: 13.5px; } .z-info small, .z-info em, .z-info .flag { font-size: 11px; }
.atlas-stats { grid-template-columns: repeat(6, 1fr); }
.menu-row { gap: 8px; }
.round-btn { min-width: 84px; }
@media (max-width: 420px) { .z-card { width: 92px; height: 56px; } .round-btn { min-width: 78px; font-size: 11px; } .blds { grid-template-columns: repeat(5, 1fr); } }
@media (min-aspect-ratio: 23/20) { .atlas { grid-template-columns: 1fr; } .atlas-stats { grid-template-columns: repeat(6, 1fr); } .atlas-strip { grid-template-columns: 1fr 1fr 1fr; } }</style>
