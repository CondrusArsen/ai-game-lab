:root{
  --void:#07080c; --gloom:#121a2b; --gloom2:#2a3654; --cold:#4a6a9a; --lamp:#ffd9a0; --spot:#fff0d6;
  --accent:#e0412f; --paper:#f1ece0; --dim:rgba(241,236,224,.55); --faint:rgba(241,236,224,.22);
  --f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif; --fd:'Yeseva One','Jost',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--void);color:var(--paper);font-family:var(--f);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:1px solid var(--lamp);outline-offset:3px}
.hidden{display:none!important}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;font-size:13px;letter-spacing:.04em}
#hud > *{pointer-events:auto}
.meter{min-width:0}
.meter .lab{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.meter .lab b{color:var(--paper);font-weight:500;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.bar{position:relative;height:3px;width:min(150px,32vw);margin-top:6px}
.bar:before{content:"";position:absolute;left:0;right:0;top:1px;height:1px;background:var(--faint)}
.bar i{position:absolute;left:0;top:0;height:3px;background:var(--paper);transition:width .15s}
#ink .bar i{background:var(--cold)} #ink.low .bar i{background:var(--accent)}
#mid{text-align:center}
#mid .t{font-size:11px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
#mid .c{font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
#right{justify-self:end;display:flex;gap:12px;align-items:start}
#right .cnt{text-align:right}
.ib{width:44px;height:44px;display:grid;place-items:center;margin-top:-8px}
.ib svg{width:22px;height:22px;stroke:var(--paper);fill:none;stroke-width:1.4}
#combo{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:15px;letter-spacing:.2em;color:var(--lamp);pointer-events:none;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:14px;color:var(--paper);pointer-events:none;text-align:center;max-width:90vw;opacity:0;transition:opacity .3s;background:rgba(7,8,12,.6);padding:4px 10px}
#toast.on{opacity:1}

/* ---------- кнопки действий ---------- */
#actions{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:10px;flex-wrap:wrap;pointer-events:none}
.act{pointer-events:auto;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);transition:color .15s,transform .1s}
.act .o{width:58px;height:58px;border-radius:50%;border:1px solid var(--faint);display:grid;place-items:center;position:relative;background:rgba(7,8,12,.55)}
.act svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.act .n{font-size:12px;letter-spacing:.06em;text-align:center;line-height:1.1}
.act .k{position:absolute;right:-2px;top:-4px;font-size:10px;color:var(--dim)}
.act .cost{position:absolute;left:-4px;bottom:-2px;font-size:11px;color:var(--cold);font-variant-numeric:tabular-nums}
.act.ready{color:var(--lamp)} .act.ready .o{border-color:var(--lamp)}
.act.ready.pulse .o{animation:pulse 1.2s ease-in-out infinite}
.act.low .cost{color:var(--accent)}
.act.none{color:var(--dim)} .act.none .o{border-color:var(--faint);border-style:dashed}
.act:active{transform:scale(.94)}
.act .cd{position:absolute;inset:-1px;border-radius:50%}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,217,160,.0)}50%{box-shadow:0 0 0 6px rgba(255,217,160,.18)}}

/* ---------- экраны ---------- */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:rgba(7,8,12,.78);overflow-y:auto;touch-action:pan-y;z-index:10}
.scr.solid{background:var(--void)}
.scr .inner{width:min(560px,100%);margin-block:auto;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
.scr h1{font-family:var(--fd);font-weight:400;font-size:clamp(48px,13vw,92px);margin:0;letter-spacing:.02em;line-height:1}
.scr h2{font-family:var(--fd);font-weight:400;font-size:clamp(26px,6vw,36px);margin:0;line-height:1.1;text-wrap:balance}
.scr h3{font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0}
.scr p{margin:0;font-size:16px;line-height:1.55;font-weight:300;max-width:62ch}
.sub{color:var(--dim);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:12px;min-height:46px;font-size:18px;font-weight:300;text-align:left;color:var(--paper);padding:0 2px}
.li .num{width:22px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.li:hover,.li:focus-visible{color:var(--lamp)}
.li:hover span:last-child:before,.li:focus-visible span:last-child:before{content:"— "}
.li.dis{color:var(--faint);pointer-events:none}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:0 18px;border:1px solid var(--faint);font-size:16px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px}
.btn.main{border-color:var(--lamp);color:var(--lamp)}
.btn:hover{border-color:var(--paper)}
.line{height:1px;background:var(--faint)}
.night{display:flex;flex-direction:column;gap:6px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.lv{min-height:64px;text-align:left;padding:8px 10px;border-left:1px solid var(--faint);display:flex;flex-direction:column;gap:3px}
.lv .a{font-size:11px;color:var(--dim);letter-spacing:.12em}
.lv .b{font-size:16px}
.lv .s{font-size:12px;color:var(--lamp);letter-spacing:.2em}
.lv:hover{border-color:var(--lamp)} .lv.lock{opacity:.35;pointer-events:none}
.lv.cur{border-color:var(--lamp)}
.set{display:grid;grid-template-columns:120px 1fr;gap:14px 16px;align-items:center}
.set label{color:var(--dim);font-size:14px}
.seg{display:flex;gap:16px}
.seg button{min-height:44px;font-size:16px;color:var(--dim)} .seg button.on{color:var(--lamp)}
.seg button.on:before{content:"— "}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--faint)}
input[type=range]::-moz-range-track{height:1px;background:var(--faint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--lamp);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--lamp);border:0}
.confirm{border-left:1px solid var(--accent);padding:8px 12px;display:flex;flex-direction:column;gap:10px}
.ups{display:flex;flex-direction:column;gap:14px}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.up .nm{font-size:17px} .up .ds{grid-column:1;color:var(--dim);font-size:13px}
.up .pips{display:flex;gap:4px;margin-top:4px} .up .pips i{width:18px;height:3px;background:var(--faint)} .up .pips i.on{background:var(--lamp)}
.up .bt{grid-row:1/4;grid-column:2}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pg{min-height:96px;text-align:left;padding:10px;border:1px solid var(--faint);font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.pg b{color:var(--paper);font-weight:500;font-size:14px}
.pg.on:hover{border-color:var(--lamp)}
.stars{display:flex;flex-direction:column;gap:8px}
.st{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--dim)} .st i{width:14px;height:14px;border:1px solid var(--faint);transform:rotate(45deg)} .st.on{color:var(--paper)} .st.on i{background:var(--lamp);border-color:var(--lamp)}
.paper{background:#e8dfc8;color:#1a1410;padding:18px 18px 16px;font-family:var(--fd);display:flex;flex-direction:column;gap:8px;transform:rotate(-1deg)}
.paper .mast{font-size:13px;letter-spacing:.3em;text-transform:uppercase;border-bottom:2px solid #1a1410;padding-bottom:6px;text-align:center}
.paper .hl{font-size:clamp(20px,5vw,28px);line-height:1.05}
.paper .bd{font-family:var(--f);font-size:14px;line-height:1.45}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--faint);display:flex;flex-direction:column;gap:4px}
.opt b{font-weight:500;font-size:17px} .opt span{color:var(--dim);font-size:14px}
.opt:hover{border-color:var(--lamp)} .opt:hover b{color:var(--lamp)}
.guide{display:flex;flex-direction:column;gap:12px}
.gi b{display:block;font-weight:500;font-size:16px;margin-bottom:2px} .gi span{color:var(--dim);font-size:14px;line-height:1.45}
.plan{border-left:1px solid var(--faint);padding-left:12px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--dim)}
.plan b{color:var(--paper);font-weight:400}
.hintc{color:var(--dim);font-size:13px;letter-spacing:.06em}

/* ---------- обучение ---------- */
#tut{position:fixed;inset:0;pointer-events:none;z-index:8}
#tut .spot{position:fixed;border-radius:50%;box-shadow:0 0 0 200vmax rgba(3,4,8,.5);border:1px solid var(--lamp);transition:all .25s ease-out}
#tut .spot.pulse{animation:spot 1.4s ease-in-out infinite}
@keyframes spot{0%,100%{outline:0 solid rgba(255,217,160,.0)}50%{outline:8px solid rgba(255,217,160,.15)}}
#tut svg{position:fixed;inset:0;width:100%;height:100%;overflow:visible}
#tut .panel{position:fixed;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 28px));padding:14px 16px;background:rgba(7,8,12,.92);border-top:1px solid var(--lamp);pointer-events:auto;display:flex;flex-direction:column;gap:10px}
#tut .panel p{margin:0;font-size:16px;line-height:1.5;font-weight:300}
#tut .panel .h{color:var(--accent);font-size:14px}
#tut .panel .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
#tut .panel .skip{color:var(--dim);font-size:13px;min-height:40px}
#tut .panel .go{color:var(--lamp);min-height:44px;font-size:16px;padding:0 6px}
@media (max-width:520px){
  .act{width:64px}.act .o{width:52px;height:52px}.act .n{font-size:11px}
  #hud{font-size:12px} .scr p{font-size:15px}
  .act .k{display:none} #mid .t{display:none} #mid .c{margin-top:0;font-size:16px} #cnt .lab span{display:none} #cnt .lab:before{content:"";width:9px;height:12px;border-radius:5px 5px 2px 2px;background:var(--dim);align-self:center} #right{gap:4px} .bar{width:28vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scr p.hint{font-size:13px;color:var(--dim);line-height:1.45}

......*............#","...................................#","E.................................K#","####################################"]})),d(Object.assign({id:11,night:4,time:390,tut:"L11",title:{ru:"Ультрафиолет",en:"Ultraviolet"},intro:{ru:"Застройщик Глыбов нанял учёного. Доктор Люминова светит ультрафиолетом: в нём видно всё, что мы оставили на стенах.",en:"The developer Glybov hired a scientist. Dr. Luminova carries an ultraviolet lamp: it shows everything we left on the walls."},people:[{who:"lumi",enter:2,route:[[8,17,2],[20,17,3],[24,11,3],[10,11,3],[4,5,3],[24,5,3],[30,17,2]]},{who:"petya",enter:8,route:[[14,17,2],[31,11,2],[16,11,2],[30,5,2],[12,5,2],[26,17,2]]},{who:"tamara",enter:20,route:[[17,17,3],[20,11,3],[16,5,3],[4,11,3]]}],goal:{k:"ink",n:50},objects:[{k:"coatstand",x:2,y:15},{k:"mirror",x:6,y:14},{k:"clock",x:11,y:14},{k:"sofa",x:13,y:16},{k:"tv",x:18,y:16},{k:"table",x:31,y:16},{k:"bed",x:1,y:11},{k:"wardrobe",x:17,y:8},{k:"portrait",x:20,y:7},{k:"bathtub",x:31,y:10},{k:"easel",x:2,y:3},{k:"doll",x:12,y:5},{k:"boxes",x:14,y:4},{k:"curtain",x:20,y:1},{k:"chest",x:26,y:5},{k:"gramophone",x:32,y:4}],lamps:[{x:15,y:13},{x:31,y:13},{x:20,y:7,on:!1},{x:30,y:7},{x:10,y:1,on:!1},{x:28,y:1}],stairs:[{x0:24,y0:17,x1:30,y1:11},{x0:12,y0:11,x1:6,y1:5}]},{map:["####################################","#P..............*.#..............*.#","#.................#................#","#..................................#","#..................................#","#..................................#","#######....#########################","#..*..........#...........#........#","#.............#...........#........%","#.......................*..........%","#..................................%","#..................................%","##########################....#####%","#....*...#............#..........*.%","#........#............#............%","....................*..............%","...................................%","E.................................K#","####################################"]})),d(Object.assign({id:12,night:4,time:420,tut:"L12",title:{ru:"«Солнечный»",en:'"Sunny"'},flood:{side:1,y0:2,y1:16,period:11,cutAt:70},intro:{ru:"Последняя ночь. Глыбов приехал сам, привёз прожектор и всех, кто остался. Утром здесь начнут строить ЖК «Солнечный». Если они не сбегут.",en:`The last night. Glybov came in person, with a floodlight and everyone who's left. In the morning they start building the "Sunny" estate here. Unless they run.`},people:[{who:"glybov",enter:3,route:[[8,17,3],[22,17,3],[12,11,3],[30,11,3],[6,5,3],[24,5,3],[18,17,3]]},{who:"lumi",enter:10,route:[[16,17,3],[6,11,3],[24,5,3],[34,11,3],[30,17,2]]},{who:"vadim",enter:20,route:[[12,17,2],[33,17,3],[22,11,3],[14,5,3],[4,11,2]]},{who:"zhanna",enter:21,flashEvery:8,route:[[10,17,2],[31,17,3],[20,11,3],[12,5,3],[3,11,2]]},{who:"bublik",enter:22,route:[[24,17,2],[10,11,2],[33,5,2]]},{who:"semyon",enter:35,ifChoice:["semyon","scare"],route:[[27,17,4],[20,17,3],[8,11,3],[26,17,3]]}],goal:{k:"combo",n:5},objects:[{k:"coatstand",x:2,y:15},{k:"window",x:5,y:13},{k:"clock",x:12,y:14},{k:"piano",x:21,y:16},{k:"fusebox",x:27,y:14},{k:"fridge",x:30,y:14},{k:"stove",x:33,y:16},{k:"kettle",x:33,y:15},{k:"bed",x:2,y:11},{k:"wardrobe",x:8,y:8},{k:"mirror",x:13,y:8},{k:"portrait",x:21,y:7},{k:"chandelier",x:22,y:7},{k:"tv",x:30,y:10},{k:"rocker",x:34,y:10},{k:"easel",x:3,y:3},{k:"doll",x:9,y:5},{k:"chest",x:12,y:5},{k:"curtain",x:23,y:1},{k:"boxes",x:32,y:4},{k:"gramophone",x:35,y:4}],lamps:[{x:18,y:13},{x:31,y:13},{x:6,y:7},{x:24,y:7},{x:8,y:1},{x:31,y:1}],stairs:[{x0:14,y0:17,x1:20,y1:11},{x0:32,y0:11,x1:26,y1:5}]},{map:["######################################","#.............*.....#......*........P#","#...................#................w","#....................................w","#....................................#","#K...................................#","###########################....#######","#...*...........#...........#........#","#...............#...........#.......*w","#..................*.................w","#....................................#","#....................................#","################....##################","#......*..#..............#.........*.#","#.........#..............#...........w",".......................*.............w",".....................................#","E....................................#","######################################"]}))}(),function(){const r=window.K;r.PAGES=[{ru:["Страница 1. Чернильница","Чернила мне подарила бабушка-переплётчица. «Они помнят руку, — сказала она. — Пиши ими только то, что любишь». Я рисую ими сказки уже сорок лет."],en:["Page 1. The inkwell",'My grandmother, a bookbinder, gave me this ink. "It remembers the hand," she said. "Only write what you love with it." I have drawn fairy tales with it for forty years.']},{ru:["Страница 2. Ночная работа","Днём в доме шумно, а ночью стены слушают. Я гашу весь свет, кроме одной лампы над столом. Темнота — хорошая бумага."],en:["Page 2. Night work","By day the house is loud; at night the walls listen. I turn off every light but the lamp above my desk. Darkness is good paper."]},{ru:["Страница 3. Набросок","Придумываю героя для новой книги. Кто-то, кто живёт в тени и охраняет дом, но никого не обижает. Только пугает. Чуть-чуть."],en:["Page 3. A sketch","Inventing a hero for a new book. Someone who lives in the shadows and guards the house but never hurts anyone. Only scares. A little."]},{ru:["Страница 4. Гроза","Ночью ударила гроза, погас свет, я задел чернильницу. Клякса легла прямо на набросок. Утром на листе было пусто. А на полу — след."],en:["Page 4. The storm","A storm hit at night, the lights went out, I knocked the inkwell over. The blot landed right on the sketch. In the morning the page was blank. And on the floor there was a trail."]},{ru:["Страница 5. Кто-то в доме","Часы теперь бьют, когда я забываю поужинать. Кресло качается, когда я грущу. Я поставил на полку блюдце с тушью. К утру оно пустое."],en:["Page 5. Someone in the house","The clock now chimes when I forget to eat. The rocking chair rocks when I am sad. I left a saucer of ink on the shelf. By morning it is empty."]},{ru:["Страница 6. Мы","Сегодня на стене было написано: «МЫ ЗДЕСЬ». Моим почерком. Оно учится у меня. Я ответил: «Я тоже». Мы — это хорошее слово."],en:["Page 6. We",'Today the wall said "WE ARE HERE". In my handwriting. It learns from me. I answered: "So am I." We is a good word.']},{ru:["Страница 7. Свет","Оно боится света: тушь сохнет. Я больше не включаю верхний свет. Семёныч ругается, что проводка гниёт без дела. Пусть."],en:["Page 7. Light","It fears light: ink dries. I no longer use the ceiling lights. Semyonych grumbles that the wiring rots unused. Let it."]},{ru:["Страница 8. Письмо","Пришло письмо от застройщика Глыбова. Предлагает купить дом под торговый центр «Солнечный». Свет там будет гореть круглые сутки. Я отказал."],en:["Page 8. A letter",'A letter from the developer Glybov. He offers to buy the house for the "Sunny" shopping mall. Lights there will burn around the clock. I said no.']},{ru:["Страница 9. Сердце","Руки стали дрожать, линия не держится. Врач говорит — в «Закат», это дом для таких, как я, на Липовой. Кто будет гасить свет здесь?"],en:["Page 9. Heart",`My hands shake now; the line won't hold. The doctor says: "Sunset", a home for people like me, on Linden Street. Who will turn off the lights here?`]},{ru:["Страница 10. Инструкция","Если ты это читаешь, клякса: не трогай людей. Пугай. Люди уходят от страха, а от обиды возвращаются с прожекторами."],en:["Page 10. Instructions","If you are reading this, blot: do not hurt people. Scare them. People leave out of fear; out of hurt they come back with floodlights."]},{ru:["Страница 11. Ученик","Мне нужен ученик. Кто-то, кто не побоится темноты и не обидит её. Найти бы такого."],en:["Page 11. An apprentice","I need an apprentice. Someone not afraid of the dark who would not hurt it. If only I could find one."]},{ru:["Страница 12. Последняя","Я вернусь. Дождись. Дом — это не стены. Дом — это кто тебя ждёт."],en:["Page 12. The last one","I will come back. Wait for me. A home is not walls. A home is who waits for you."]}],r.NEWS={1:{ru:["СТАЖЁР КОМИССИИ ВЫБЕЖАЛ ИЗ ДОМА №7","Пётр Ушков уверяет, что часы «смотрели на него». Начальство отправит старшего инспектора."],en:["CITY INTERN FLEES HOUSE No. 7",'Pyotr Ushkov insists the clock "was looking at him". His superiors are sending a senior inspector.']},2:{ru:["«ЭТО СКВОЗНЯК», — ЗАЯВИЛА Т. П. ГВОЗДЬ","…и покинула дом бегом. Комиссия назначила повторную проверку при полном освещении."],en:[`"IT'S A DRAFT," SAYS T. P. GVOZD`,"…and left the house at a run. The commission orders a re-inspection with full lighting."]},3:{ru:["ЛАМПЫ В ДОМЕ ГАСНУТ САМИ","Инспекторы жалуются на проводку. Застройщик Глыбов обещает «разобраться к зиме»."],en:["LAMPS IN THE HOUSE GO OUT BY THEMSELVES",'Inspectors blame the wiring. Developer Glybov promises to "sort it out by winter".']},4:{ru:["НАДПИСЬ НА ЧЕРДАКЕ: «УХОДИТЕ»","Почерк, по словам соседей, похож на почерк хозяина дома, художника А. П. Пёрышкина."],en:['WRITING IN THE ATTIC: "GET OUT"',"Neighbours say the handwriting resembles the owner's, the artist A. P. Peryshkin."]},5:{ru:["ЭЛЕКТРИК ПРОТИВ ТЬМЫ","Опытный электрик Семёныч обещает «дать свет — и призраков не будет»."],en:["ELECTRICIAN VS DARKNESS",'Veteran electrician Semyonych promises "give it light and there will be no ghosts".']},6:{ru:["КТО КАПАЕТ НА ФОНАРИ?","Проверяющие выходят из дома с перемазанными руками. Химчистки города в восторге."],en:["WHO DRIPS ON FLASHLIGHTS?","Inspectors leave the house with ink-stained hands. The city's dry cleaners are delighted."]},7:{ru:["ДОМ, ГДЕ ПОЮТ ТРУБЫ","Сантехники отказываются от вызова. Телешоу «Паранормальщики» уже едет."],en:["THE HOUSE WHERE PIPES SING",'Plumbers refuse the call. The TV show "Paranormalists" is on its way.']},8:{ru:["«ПАРАНОРМАЛЬЩИКИ»: ЭФИР ПРЕРВАН","Ведущий Вадим Блеск выбежал из кадра. Рейтинги шоу выросли вдвое."],en:['"PARANORMALISTS": BROADCAST CUT',"Host Vadim Blesk ran out of frame. The show's ratings doubled."]},9:{ru:["ПЁС ПО КЛИЧКЕ БУБЛИК","Собака шоу вернулась из дома одна. Ведущий утверждает, что она «с кем-то дружила»."],en:["A DOG CALLED BUBLIK",`The show's dog came out of the house alone. The host claims it "made a friend".`]},10:{ru:["ТЕНЬ ВО ВСЮ СТЕНУ","Кадры из дома №7 набрали миллион просмотров. Город пригласил учёных."],en:["A SHADOW THE SIZE OF A WALL","Footage from house No. 7 got a million views. The city invited scientists."]},11:{ru:["УЧЁНЫЕ: «ЭТО ТУШЬ»","Доктор Люминова подтвердила: в доме живой пигмент. Глыбов приедет сам — с прожектором."],en:[`SCIENTISTS: "IT'S INDIA INK"`,"Dr. Luminova confirms a living pigment in the house. Glybov is coming himself, with a floodlight."]},12:{ru:["«СОЛНЕЧНОГО» НЕ БУДЕТ","Застройщик отказался от участка. Дом №7 внесён в список «памятников городского фольклора»."],en:['NO "SUNNY" MALL AFTER ALL','The developer gave up the plot. House No. 7 is now listed as a "landmark of city folklore".']}},r.CHOICES={4:{key:"keys",text:{ru:"Убегая, Петя обронил связку ключей от дома. Без них его отругают и, может, уволят.",en:"Running away, Petya dropped the house keys. Without them he'll be scolded and maybe fired."},opts:[{v:"return",ru:["Подкинуть ключи к его двери","Петя запомнит. Он не злой, просто стажёр."],en:["Leave the keys at his door","Petya will remember. He's not bad, just an intern."]},{v:"keep",ru:["Оставить себе и растворить","+30 чернил сейчас. Медь — хорошая тушь."],en:["Keep and dissolve them","+30 ink now. Copper makes good ink."]}]},7:{key:"semyon",text:{ru:"Семёныч стоит у надписи на стене и шепчет: «Это же почерк Аркадия…» Он один в доме и не убегает.",en:`Semyonych stands by the writing and whispers: "That's Arkady's handwriting…" He is alone and doesn't run.`},opts:[{v:"show",ru:["Показаться ему","Он знал мастера. Может, знает, где тот."],en:["Show ourselves","He knew the master. Maybe he knows where he is."]},{v:"scare",ru:["Напугать до конца","+30 чернил. Свидетели нам не нужны."],en:["Scare him off for good","+30 ink. We don't need witnesses."]}]},9:{key:"dog",text:{ru:"Бублик доел колбасу, виляет хвостом и не уходит. Люди убежали без него.",en:"Bublik finished the sausage, wags his tail and won't leave. The humans ran without him."},opts:[{v:"tame",ru:["Приручить","Он будет лаять на людей, а не на нас."],en:["Befriend him","He'll bark at people, not at us."]},{v:"chase",ru:["Прогнать","+30 чернил. Собаки — к людям."],en:["Chase him off","+30 ink. Dogs belong with people."]}]}},r.CHOICE_RESULT={return:{ru:"Утром Петя нашёл ключи у двери, завёрнутые в лист с кляксой-улыбкой.",en:"In the morning Petya found the keys at his door, wrapped in a sheet with a smiling blot."},keep:{ru:"Ключи растворились в нас. Чернил стало больше.",en:"The keys dissolved in us. We have more ink now."},show:{ru:"Мы вытекли из щитка. Семёныч не закричал. «Аркадий в „Закате“, на Липовой, — сказал он. — Я ему передам». И ушёл, не включив свет.",en:`We oozed out of the fuse box. Semyonych didn't scream. "Arkady's at Sunset, on Linden Street," he said. "I'll tell him." And he left without turning on the lights.`},scare:{ru:"Семёныч убежал, бросив инструменты. Чернил стало больше, а в доме — тише.",en:"Semyonych ran, dropping his tools. More ink for us, more quiet in the house."},tame:{ru:"Бублик теперь наш. Он лает на чужих.",en:"Bublik is ours now. He barks at strangers."},chase:{ru:"Бублик убежал к своим. Чернил стало больше.",en:"Bublik ran back to his people. More ink for us."}},r.ENDINGS={master:{ru:["Мастер вернулся","Утром у калитки остановилось такси. Аркадий Петрович поднялся по скрипучей лестнице, сел за стол и открыл чернильницу. Мы вытекли из-под шкафа и легли на чистый лист. «Ну здравствуй, — сказал он. — Мы дома»."],en:["The master returned",'In the morning a taxi stopped at the gate. Arkady Petrovich climbed the creaky stairs, sat at his desk and opened the inkwell. We oozed out from under the bookcase onto a clean sheet. "Hello there," he said. "We are home."']},apprentice:{ru:["Мы","Через неделю в дверь постучал Петя. Без фонаря. «Я принёс ключи, — сказал он темноте. — И я хочу научиться рисовать». Теперь мы живём в его пере. Петя не боится. Почти."],en:["We",`A week later Petya knocked on the door. No flashlight. "I brought the keys," he told the dark. "And I want to learn to draw." Now we live in his pen. Petya isn't scared. Almost.`]},house:{ru:["Дом остался","Застройщик уехал. Дом признали «странным, но не аварийным». Мы гасим свет по вечерам и ждём. Кто-нибудь обязательно придёт. Мы умеем ждать."],en:["The house remained",'The developer left. The house was declared "strange but not condemned". We turn off the lights every evening and wait. Someone will come. We know how to wait.']}},r.GUIDE=[{k:"move",ru:["Течь","Коснись точки — клякса потечёт туда по полу, стенам, потолку и мебели. С потолка можно упасть каплей."],en:["Ooze","Tap a spot and the blot flows there over floors, walls, ceilings and furniture. It can drop from the ceiling."]},{k:"ink",ru:["Чернила","Это жизнь и сила кляксы. Капли на уровне и чужой страх пополняют их (треть каждого испуга возвращается нам). Свет сушит. Ноль — ночь проиграна."],en:["Ink","The blot's life and power. Ink drops and other people's fear refill it (a third of every scare comes back to us). Light dries it. Zero means the night is lost."]},{k:"light",ru:["Свет","Лампа только сушит. Луч фонаря сушит быстрее и замыкает красное кольцо. Замкнулось — снимок. Первый снимок за ночь смазан (минус треть чернил), второй — ночь проиграна. Короткое касание только настораживает."],en:["Light","A lamp only dries. A flashlight beam dries faster and closes the red ring. When it closes, they get a photo. The first photo of a night is blurred (lose a third of your ink), the second loses the night. A brief touch only alerts them."]},{k:"fear",ru:["Страх","У каждого шкала страха. 100 — крик и бегство. В тишине страх спадает. Повтор той же пугалки слабее вдвое, третий раз смешит."],en:["Fear","Everyone has a fear bar. At 100 they scream and run. Fear fades in silence. Repeating a scare halves it; a third time makes them laugh."]},{k:"possess",ru:["Вселиться","Внутри предмета луч не страшен. «Пугнуть» — пугалка предмета. Ухо над головой — услышит, глаз — увидит (только если смотрит туда)."],en:["Possess",`Inside an object beams can't hurt us. "Spook" triggers the object. Ear above a head: they'll hear it. Eye: they'll see it (only if looking that way).`]},{k:"combo",ru:["Серия","Разные пугалки в пределах 5 секунд: ×1.3, ×1.6, ×2, ×2.4."],en:["Chain","Different scares within 5 seconds: ×1.3, ×1.6, ×2, ×2.4."]},{k:"knock",ru:["Стук","3 чернил. Слабый звук: люди идут на него. Им удобно увести человека из комнаты."],en:["Knock","3 ink. A weak sound people walk toward. Good for luring someone out of a room."]},{k:"skeptic",ru:["Скептик","Тамара Павловна почти не боится звуков. Ей нужны видимые чудеса."],en:["Skeptic","Tamara Pavlovna barely reacts to sounds. She needs visible wonders."]},{k:"lamp",ru:["Погасить лампу","5 чернил. Комната темнеет, но все рядом настораживаются."],en:["Snuff a lamp","5 ink. The room goes dark, but everyone nearby gets alert."]},{k:"write",ru:["Надпись","15 чернил. Слово на стене. Кто впервые осветит его фонарём, сильно испугается."],en:["Writing","15 ink. A word on the wall. Whoever first lights it with a flashlight gets a big scare."]},{k:"fixer",ru:["Электрик","Семёныч чинит погашенные лампы и щиток. Щиток гасит весь дом."],en:["Electrician","Semyonych fixes snuffed lamps and the fuse box. The fuse box darkens the whole house."]},{k:"grin",ru:["Оскал","20 чернил. Вплотную за спиной в темноте. Очень страшно, но человек тут же обернётся со светом — уходи."],en:["Grin","20 ink. Right behind someone, in the dark. Very scary, but they spin around with the light, so get away."]},{k:"drop",ru:["Капля","10 чернил. С потолка над человеком: фонарь гаснет на 5 секунд. Потом он посветит вверх."],en:["Drip","10 ink. From the ceiling above someone: the flashlight dies for 5 seconds. Then they shine it upward."]},{k:"pipes",ru:["Трубы","Трубы в стенах соединяют комнаты. В трубе нас не видно."],en:["Pipes","Pipes in the walls connect rooms. Nobody can see us inside."]},{k:"camera",ru:["Вспышка","Камера Жанны вспыхивает каждые 7 секунд, перед этим 3 красных сигнала. Во вспышке без укрытия — снимок (первый смазан). Прячься в предмет или за непрозрачную мебель."],en:["Camera flash","Zhanna's camera flashes every 7 seconds, after 3 red beeps. Caught in the flash without cover means a photo (the first one is blurred). Hide in an object or behind solid furniture."]},{k:"brave",ru:["Ведущий","Пока Вадима снимают, он храбрится: страх ×0.5. Пугай, когда камера смотрит в другую сторону."],en:["The host","While on camera Vadim acts brave: fear ×0.5. Scare him when the camera looks away."]},{k:"dog",ru:["Пёс","Бублик не боится чудес, идёт по свежему следу и лаем зовёт людей. Колбаса из холодильника его отвлечёт."],en:["The dog","Bublik ignores wonders, follows fresh trails and barks to call people. A sausage from the fridge distracts him."]},{k:"shadow",ru:["Тень-великан","25 чернил. Рядом с горящей лампой: огромная тень пугает всех в комнате. Свет при этом сушит нас."],en:["Giant shadow","25 ink. Next to a lit lamp: a huge shadow scares everyone in the room. The light dries us meanwhile."]},{k:"uv",ru:["Ультрафиолет","Люминова видит следы и надписи в УФ-луче. Обычные пугалки ей почти нипочём: только серия ×3 и больше."],en:["Ultraviolet","Luminova sees trails and writing in her UV beam. Ordinary scares barely work: only a chain of ×3 or more."]},{k:"flood",ru:["Прожектор","Прожектор Глыбова ходит по дому с улицы. Его луч смертелен так же, как фонарь."],en:["Floodlight","Glybov's floodlight sweeps the house from outside. Its beam is as deadly as a flashlight."]},{k:"giant",ru:["Мы — Клякса!","Всё, что мы собрали. Огромная клякса пугает всех рядом и всех, кто нас видит. Один раз за ночь, нужно 60 чернил и хотя бы двое проверяющих в доме. Глыбов держится, пока с ним его люди."],en:["We are Blot!","Everything we gathered. A huge blot scares everyone nearby and everyone who sees us. Once per night, needs 60 ink and at least two inspectors inside. Glybov holds out while his people are with him."]}]}(),function(){const r=window.K,d=(h,s,n=1.2)=>({w:[h,s],r:n}),t=h=>({el:h}),o=(h,s)=>h.people.find(n=>n.id===s),e=(h,s)=>h.world.objects.find(n=>n.k===s),a=(h,s)=>{const n=e(h,s);return n?d(n.x+n.w/2,n.y+n.h/2,Math.max(n.w,n.h)*.75):null};r.TUTS={L1:h=>[{ok:1,hold:1,target:s=>d(s.blot.x,s.blot.y,1.1),focus:1,text:{ru:"Это мы, Клякса: ожившие чернила художника Пёрышкина. Сегодня ночью в дом придёт проверка. Если они не испугаются, дом признают пустым и снесут.",en:"This is us, Blot: the living ink of the artist Peryshkin. Tonight inspectors will come. If they aren't scared, the house will be declared empty and torn down."}},{hold:1,target:s=>d(23.5,1.5),until:{ev:"inkdrop"},allow:["move"],text:{ru:"Коснись капли под потолком. Мы потечём к ней по стене и потолку. Капли пополняют чернила: это наша жизнь и сила.",en:"Tap the drop under the ceiling. We'll flow to it over the wall and ceiling. Drops refill our ink: our life and power."}},{hold:1,target:s=>d(16.5,3.3,1.4),check:(s,n)=>(s.blot.lampLit>0&&(n.acc=(n.acc||0)+1/30),n.acc>2),allow:["move"],extraEl:"#ink .bar",text:{ru:"Свет сушит чернила. Заберись на стол под лампой и посмотри на шкалу «Чернила» слева вверху.",en:"Light dries ink. Climb onto the table under the lamp and watch the Ink bar at the top left."}},{ok:1,hold:1,target:s=>t("#ink .bar"),text:{ru:"Видишь, шкала тает. Лампа только сушит. Фонарь опаснее: пока луч на нас, вокруг замыкается красное кольцо. Замкнётся — щёлк, у них снимок. Первый снимок за ночь выйдет смазанным, это минус треть чернил. Второй — ночь проиграна. Короткое касание лучом только сушит и настораживает.",en:"See the bar shrink. A lamp only dries us. A flashlight is worse: while its beam is on us, a red ring closes. If it closes, click, they get a photo. The first photo of the night comes out blurred and costs a third of our ink. The second loses the night. A brief touch only dries and alerts them."}},{hold:1,target:s=>d(16.5,5.5),check:s=>s.blot.cy===5&&s.blot.cx>=15&&s.blot.cx<=17&&!s.blot.lampLit,allow:["move"],text:{ru:"Под столом тень и капля чернил. Спрячься туда.",en:"There's shadow and an ink drop under the table. Hide there."}},{ok:1,focus:"petya",start:s=>{const n=o(s,"petya");n.state="patrol",n.route=[[3,5,2.5],[8,5,3]],s.sfx("door"),n.say("enter",3,!0)},target:s=>{const n=o(s,"petya");return d(n.x,n.feet-1.4,1.8)},text:{ru:"Это Петя, стажёр комиссии. Красная линия над ним — страх. Дойдёт до конца — он с криком убежит. Нам нужно, чтобы убежали все.",en:"This is Petya, a city intern. The red line above him is fear. When it fills, he runs away screaming. We need everyone to run."}},{target:s=>a(s,"clock"),until:{ev:"possess",test:s=>s.k==="clock"},allow:["move","possess"],text:{ru:"Коснись напольных часов: мы в них вселимся. Внутри предмета луч нам не страшен.",en:"Tap the grandfather clock to possess it. Inside an object, beams can't hurt us."}},{focus:"petya",target:s=>t("#act-scare"),until:{ev:"objscare",test:s=>s.k==="clock"},allow:["scare"],text:{ru:"Над Петей значок уха: он услышит. Цифра — сколько страха получит. Нажми «Пугнуть». Страх кормит нас: каждая удачная пугалка возвращает немного чернил.",en:`The ear icon above Petya means he'll hear it. The number is how much fear he'll get. Press "Spook". Fear feeds us: every good scare gives back a little ink.`}},{start:s=>{const n=o(s,"petya");n.route=[[17,5,3],[22,5,3],[13,5,2]]},target:s=>a(s,"rocker"),until:{ev:"possess",test:s=>s.k==="rocker"},allow:["move","possess"],text:{ru:"Петя идёт на шум с фонарём: так бывает всегда. Пока он у часов, по потолку переберись в кресло-качалку.",en:"Petya walks toward the noise with his flashlight: that always happens. While he's at the clock, cross the ceiling into the rocking chair."}},{focus:"petya",target:s=>t("#act-scare"),until:{ev:"scare",test:s=>s.type==="rocker"&&s.any},allow:["scare","move","possess"],hint:(s,n)=>s==="scare"&&n.type==="rocker"&&!n.any?{ru:"Не увидел: глаза над ним не было. Повтор той же пугалки слабее, лучше дождаться взгляда.",en:"He didn't see it: there was no eye above him. A repeat is weaker, so wait until he looks."}:null,text:{ru:"Кресло — видимая пугалка. Сработает, только если Петя смотрит в эту сторону: тогда над ним загорится глаз. Дождись глаза и пугни.",en:"The chair is a visible scare. It works only if Petya looks this way: an eye appears above him. Wait for the eye, then spook."}},{focus:"petya",start:s=>{const n=o(s,"petya");n.route=[[13,5,2.5],[22,5,2]]},target:s=>s.blot.inside&&s.blot.inside.k==="portrait"?t("#act-scare"):a(s,"portrait"),until:{ev:"scare",test:s=>s.type==="portrait"&&s.any},check:s=>{const n=o(s,"petya");return n.state==="flee"||n.gone},allow:["move","possess","scare","end"],hint:(s,n)=>s==="scare"&&n.type==="portrait"&&!n.any?{ru:"Портрет действует только на глаза: дождись, когда над Петей загорится глаз.",en:"The portrait only works on sight: wait for the eye above Petya."}:null,text:{ru:"Разные пугалки подряд, в пределах 5 секунд, дают серию: ×1.3, ×1.6, ×2. Переберись в портрет над диваном. Петя пойдёт мимо: когда над ним загорится глаз, пугни. Пока кнопка пишет «Никто не заметит», жди.",en:"Different scares within 5 seconds make a chain: ×1.3, ×1.6, ×2. Move into the portrait above the sofa. Petya will walk past: when the eye appears above him, spook. While the button says Nobody will notice, wait."}},{target:s=>{const n=o(s,"petya");return n&&!n.gone?d(n.x,n.feet-1.4,1.8):null},until:{ev:"flee"},check:s=>{const n=o(s,"petya");return n.state==="flee"||n.gone},text:{ru:"Добей его чем угодно. Третий повтор одного и того же уже смешит, а не пугает. Страх в тишине понемногу спадает.",en:"Finish him with anything. A third repeat of the same scare makes people laugh instead. Fear slowly fades in silence."}},{skipIf:s=>!s.world.page||s.world.page.taken,target:s=>d(s.world.page.x,s.world.page.y),until:{ev:"page"},allow:["move","possess","scare","end"],text:{ru:"Убежал! Когда сбегут все, дом наш до рассвета. На каждой ночи спрятана страница альбома мастера Пёрышкина: эта лежит на вешалке в прихожей. Забери её. Если искать не хочется, есть кнопка «Закончить ночь».",en:"He ran! When everyone runs, the house is ours till dawn. Every night hides a page from master Peryshkin's album: this one is on the coat stand in the hall. Take it. If you don't feel like searching, there is an End the night button."}},{ok:1,target:null,text:{ru:"Страницы складываются в альбом и рассказывают, кем был мастер и откуда взялись мы. За каждую ночь дают чернила в копилку: на них в меню покупают улучшения.",en:"Pages fill the album and tell who the master was and where we came from. Every night pays ink into the bank: spend it on upgrades in the menu."}}],L2:h=>[{ok:1,hold:1,target:s=>t("#act-knock"),text:{ru:"Новое умение: Стук. Стоит 3 чернил, пугает слабо, зато люди идут на звук. Так уводят человека туда, где ему приготовлена ловушка.",en:"New ability: Knock. Costs 3 ink, a weak scare, but people walk toward the sound. Use it to lure someone into a trap."}},{target:s=>t("#act-knock"),until:{ev:"knock"},allow:["knock","move"],text:{ru:"Постучи.",en:"Knock."}},{ok:1,focus:"tamara",waitEv:"enter",waitTest:s=>s.id==="tamara",hold:1,target:s=>{const n=o(s,"tamara");return d(n.x,n.feet-1.4,1.8)},text:{ru:"Тамара Павловна, старший инспектор. Скептик: звуки ей почти безразличны (цифра у уха маленькая). Пугают её только видимые чудеса: портрет, занавеска, шкаф.",en:"Tamara Pavlovna, senior inspector. A skeptic: sounds barely touch her (small number by the ear). Only visible wonders scare her: portrait, curtain, wardrobe."}},{target:s=>{const n=o(s,"tamara")
