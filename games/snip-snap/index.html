:root{
  --ink:#3b2737; --paper:#fff4df; --paper2:#ffe9c4; --tomato:#e2574c; --mustard:#f2b134; --teal:#2f9d93; --lav:#a37ce2; --mint:#bfe8d6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --disp:'Rubik Bubbles','Nunito',system-ui,sans-serif; --text:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2737;color:var(--ink);font-family:var(--text);font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{background:
  radial-gradient(circle at 20% 15%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/22px 22px,
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px),
  repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 14px),#3b2737}
#app{position:fixed;inset:0}
#board{position:absolute;left:0;top:0;touch-action:none;display:block}
button{font-family:var(--text);font-weight:900;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}

/* ---- felt buttons ---------------------------------------------------------------------------------------- */
.btn{position:relative;min-height:52px;min-width:120px;padding:10px 22px;border:3px solid var(--ink);border-radius:18px;
  background:var(--mustard);font-size:20px;letter-spacing:.3px;box-shadow:0 5px 0 rgba(59,39,55,.85),0 9px 16px rgba(0,0,0,.25);
  transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn::after{content:'';position:absolute;inset:5px;border:2px dashed rgba(255,255,255,.75);border-radius:12px;pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,39,55,.85),0 3px 8px rgba(0,0,0,.25)}
.btn.red{background:var(--tomato);color:#fff8ec}.btn.teal{background:var(--teal);color:#fff8ec}.btn.cream{background:var(--paper)}.btn.lav{background:var(--lav);color:#fff8ec}
.btn.small{min-height:46px;min-width:0;font-size:16px;padding:8px 14px;border-radius:15px}
.btn.huge{font-size:28px;min-height:66px;padding:12px 34px;border-radius:22px}
.btn[disabled]{filter:grayscale(.7) brightness(.95);opacity:.75}
.rbtn{width:50px;height:50px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;padding:0;
  box-shadow:0 4px 0 rgba(59,39,55,.85);position:relative;touch-action:manipulation}
.rbtn::after{content:'';position:absolute;inset:4px;border:2px dashed rgba(59,39,55,.35);border-radius:50%;pointer-events:none}
.rbtn svg{width:24px;height:24px;fill:var(--ink);stroke:var(--ink)}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,39,55,.85)}
.rbtn.big{width:58px;height:58px;background:var(--mustard)}
.rbtn.big svg{width:28px;height:28px}

/* ---- patches (cards) --------------------------------------------------------------------------------------- */
.patch{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:18px;
  box-shadow:0 8px 0 rgba(59,39,55,.6),0 18px 40px rgba(0,0,0,.35);
  background-image:radial-gradient(rgba(150,100,60,.07) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.5px);
  background-size:7px 7px,11px 11px}
.patch::before{content:'';position:absolute;inset:7px;border:2.5px dashed rgba(226,87,76,.55);border-radius:15px;pointer-events:none}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:400;letter-spacing:.5px}
.disp{font-family:var(--disp);font-weight:400}
.outline{color:#fff8ec;-webkit-text-stroke:0;text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 6px 0 rgba(59,39,55,.6)}

/* ---- HUD ------------------------------------------------------------------------------------------------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud button,#hud .chip{pointer-events:auto}
#hud-top{position:absolute;left:0;right:0;top:calc(var(--sat) + 6px);height:84px;padding:0 10px}
#b-pause{position:absolute;left:calc(var(--sal) + 10px);top:0}
#hud-title{position:absolute;left:68px;right:68px;top:2px;text-align:center;color:#fff8ec;line-height:1.05}
#hud-title small{display:block;font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
#hud-title b{display:block;font-family:var(--disp);font-weight:400;font-size:24px;color:#fff8ec;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#hud-chips{position:absolute;left:0;right:0;top:52px;display:flex;justify-content:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 4px;border-radius:16px;background:var(--paper);border:2.5px solid var(--ink);font-size:17px}
.chip .ico{width:26px;height:26px}
.chip#chip-par{padding-left:10px;font-size:14px}
.chip .sc{width:16px;height:16px;color:var(--tomato);margin-left:2px}
.chip.warn{background:#ffd9df}
.chip.done{background:var(--mint)}
#hud-bottom{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 6px);height:88px}
#cuts{position:absolute;left:96px;right:76px;bottom:12px;height:46px;display:flex;align-items:center;justify-content:center;gap:6px}
#cuts .cut{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;transition:transform .2s}
#cuts .cut svg{width:28px;height:28px;color:var(--tomato)}
#cuts .cut.used{background:rgba(255,244,223,.25);border-style:dashed}
#cuts .cut.used svg{color:rgba(59,39,55,.35)}
#cuts .cut.pop{transform:scale(.6) rotate(-20deg)}
#status{position:absolute;left:96px;right:76px;bottom:62px;text-align:center;color:#fff8ec;font-size:14px;opacity:.9;height:20px}
#status.wait{color:#ffd65a;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
#b-retry{position:absolute;right:calc(var(--sar) + 12px);bottom:12px}
#app.wide #hud-top{left:auto;right:auto;width:var(--panelW);top:8px;height:auto}
#app.wide #hud-title{position:static;margin:56px 0 6px;text-align:left}
#app.wide #hud-chips{position:static;flex-direction:column;align-items:flex-start}
#app.wide #b-pause{left:0}
#app.wide #hud-bottom{left:auto;right:8px;width:var(--panelW);height:auto;top:8px;bottom:auto}
#app.wide #cuts{position:static;justify-content:flex-start;flex-wrap:wrap;margin-top:8px}
#app.wide #status{position:static;text-align:left;margin-top:66px;height:auto}
#app.wide #b-retry{position:absolute;right:56px;top:0;bottom:auto}

/* tutorial hand */
#tut{position:absolute;inset:0;pointer-events:none}
#tut .hand{position:absolute;width:64px;height:72px;left:0;top:0;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));transition:opacity .2s}
#tut .tut-text{position:absolute;left:0;right:0;text-align:center;font-family:var(--disp);font-size:26px}

/* ---- screens & overlays ------------------------------------------------------------------------------------------- */
#screen,#overlay{position:absolute;inset:0;pointer-events:none}
#screen>*,#overlay>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(40,20,32,.55);display:grid;place-items:center;padding:16px;animation:fadeIn .2s}
.scrim.light{background:rgba(40,20,32,.25)}
.scrim.bottom{place-items:end center;background:linear-gradient(transparent 45%,rgba(40,20,32,.55));padding-bottom:calc(var(--sab) + 18px)}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{transform:scale(.7) translateY(30px);opacity:0}}
.card{width:min(360px,100%);text-align:center;animation:popIn .28s cubic-bezier(.2,1.6,.4,1)}
.card h2{font-size:34px;margin:2px 0 8px}
.card p{margin:8px 0;font-size:17px;line-height:1.3}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.stars svg{width:56px;height:56px;fill:#e9dcc6;stroke:var(--ink);stroke-width:1.4}
.stars svg.on{fill:#ffcf3f;animation:starIn .45s cubic-bezier(.2,1.8,.4,1) backwards}
.stars svg:nth-child(2){transform:translateY(-10px)}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.reward{display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;margin:6px 0}
.reward svg{width:30px;height:30px;fill:var(--mustard);stroke:var(--ink);stroke-width:1.2}
.meter{height:16px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--teal) 0 8px,#3bb3a7 8px 16px);transition:width .8s}
.sub{font-size:14px;opacity:.8}
.cause{font-size:19px;margin:6px 0 4px}
.tipimg{display:block;margin:0 auto 6px;width:120px;height:96px}
.toast{position:absolute}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 100px);transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}

/* title */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 18px)}
.title .logo{font-family:var(--disp);font-size:clamp(46px,15vw,78px);line-height:.95;text-align:center;margin-top:4px}
.title .tag{color:#fff8ec;font-size:17px;text-align:center;margin-top:8px;opacity:.95}
.title .menu{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,100%)}
.title .menu .btn{width:100%}
.title .corner{position:absolute;top:calc(var(--sat) + 12px);left:12px;display:flex;gap:8px}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper)}
.lang button{min-width:52px;min-height:44px;border:0;background:transparent;font-size:16px}
.lang button[aria-pressed=true]{background:var(--teal);color:#fff}
#heroCv{width:min(380px,96vw);height:clamp(170px,calc(100vh - 470px),430px);display:block}
.title .menu{gap:10px}
/* short frames (the platform 390×219 card, phone landscape): live demo on the left, logo and buttons on the right */
@media (max-height:460px){
  .title{display:grid;grid-template-columns:minmax(0,1fr) minmax(176px,210px);grid-template-rows:auto 1fr;column-gap:10px;row-gap:6px;align-items:center;justify-items:center;padding:calc(var(--sat) + 8px) 10px calc(var(--sab) + 8px)}
  .title .head{grid-column:2;grid-row:1;margin-top:0!important}
  .title .logo{font-size:32px;margin-top:0}
  .title .tag{display:none}
  #heroCv{grid-column:1;grid-row:1/3;width:100%;height:calc(100vh - 16px)}
  .title .menu{grid-column:2;grid-row:2;gap:6px;align-self:start;width:100%}
  .title .menu .btn{min-height:44px;padding:4px 10px;font-size:19px}
  .title .menu .row{gap:6px}
  .title .menu .row .btn{font-size:14px;min-width:0;padding:4px 6px;flex:1 1 0}
}

/* map */
.full{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) 12px calc(var(--sab) + 10px)}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px}
.topbar h2{flex:1;color:#fff8ec;font-size:22px;line-height:1.05;text-align:center}
.topbar .stat{display:inline-flex;align-items:center;gap:4px;color:#fff8ec;font-size:16px}
.topbar .stat svg{width:20px;height:20px;fill:#ffcf3f}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:46px;padding:6px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-size:14px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tab small{font-size:11px;opacity:.75}
.tab[aria-pressed=true]{background:var(--mustard)}
.tab.locked{opacity:.55}
@keyframes bob{50%{transform:translateY(-4px)}}
.topbar h2 small{display:block;font-family:var(--text);font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.topbar .stat{background:none;border:0;padding:4px 2px;min-height:44px;position:relative;font-weight:900}
.topbar .stat b{font-size:17px}
.dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--tomato);border:2.5px solid #fff8ec;box-shadow:0 0 0 2px var(--ink);animation:pulse 1.2s ease-in-out infinite}
/* round chapter / region chips (one row, no scroll) */
.rchips{display:flex;justify-content:center;gap:6px;padding:6px 0 8px}
.rchip{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);padding:0;font-size:17px;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,var(--paper) 0 56%,transparent 57%),conic-gradient(var(--c) calc(var(--k)*1%),rgba(255,244,223,.35) 0)}
.rchip[aria-pressed=true]{transform:scale(1.14);box-shadow:0 0 0 3px #fff8ec}
.rchip.full{background:radial-gradient(circle,#ffcf3f 0 56%,transparent 57%),conic-gradient(var(--c) 100%,transparent 0)}
.rchip.locked{background:rgba(255,244,223,.35);opacity:.7}
.rchip svg{width:16px;height:16px;fill:var(--ink)}
/* map: saga ribbon over the chapter quilt */
.realm-strip{display:flex;align-items:center;gap:8px;min-height:46px;margin:0 2px 6px;padding:4px 12px;border:3px solid var(--ink);border-radius:23px;background:var(--paper);font-size:15px;position:relative;text-align:left}
.realm-strip svg{width:26px;height:26px;flex:0 0 auto}
.realm-strip b{font-size:18px}
.realm-strip span{flex:1;line-height:1.1}
.realm-strip i{font-style:normal;background:var(--lav);color:#fff8ec;border:2.5px solid var(--ink);border-radius:14px;padding:3px 10px}
.saga-wrap{flex:1;position:relative;margin:0 -12px calc(-10px - var(--sab));min-height:0;border-top:3px solid var(--ink);overflow:hidden}
.saga-bg{position:absolute;left:0;top:0;display:block;pointer-events:none}
.saga{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.saga-inner{position:relative;width:100%}
.node{position:absolute;border-radius:50%;border:3.5px solid var(--ink);padding:0;display:grid;place-items:center;font-size:19px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%),var(--paper);box-shadow:0 5px 0 rgba(59,39,55,.75),0 9px 14px rgba(0,0,0,.25)}
.node::after{content:'';position:absolute;inset:5px;border:2px dashed rgba(59,39,55,.3);border-radius:50%;pointer-events:none}
.node b{position:relative;z-index:1;font-weight:900}
.node.done{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 45%),var(--c,#e2574c);color:#fff8ec;text-shadow:0 2px 0 rgba(59,39,55,.6)}
.node.done::after{border-color:rgba(255,255,255,.7)}
.node.cur{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),transparent 45%),var(--mustard);animation:bob 1.1s ease-in-out infinite;box-shadow:0 5px 0 rgba(59,39,55,.75),0 0 0 6px rgba(255,248,236,.85),0 10px 20px rgba(0,0,0,.3)}
.node.locked{background:#cfc4b6;color:rgba(59,39,55,.45);box-shadow:0 4px 0 rgba(59,39,55,.45);border-color:rgba(59,39,55,.6)}
.node.locked b{font-size:14px;transform:translateY(-6px)}
.node.locked svg.lk{position:absolute;bottom:6px;width:15px;height:15px;fill:rgba(59,39,55,.5)}
.node.fin{font-size:22px;border-width:4.5px;box-shadow:0 5px 0 rgba(59,39,55,.75),0 0 0 5px #ffcf3f,0 10px 18px rgba(0,0,0,.3)}
.node .st{position:absolute;top:-17px;left:50%;transform:translateX(-50%);display:flex;gap:0;z-index:2}
.node .st svg{width:17px;height:17px;fill:#e9dcc6;stroke:var(--ink);stroke-width:2}
.node .st svg:nth-child(2){transform:translateY(-4px)}
.node .st svg.on{fill:#ffcf3f}
.node .badge{position:absolute;right:-12px;top:-10px;width:30px;height:30px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);z-index:2}
.node .badge svg{width:22px;height:22px;margin:1.5px}
.snipmark{position:absolute;z-index:3;width:68px;height:84px;pointer-events:none;animation:bob 1.1s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.gate{position:absolute;transform:translateX(-50%);min-height:44px;padding:6px 16px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);font-size:15px;white-space:nowrap;box-shadow:0 4px 0 rgba(59,39,55,.75)}
.gate.locked{opacity:.75;background:#cfc4b6}
.lmk-map{position:absolute;background:none;border:0;padding:0;border-radius:24px}
.lmk-map:focus-visible{outline:3px solid #fff}
.mtag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:3px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:1px 8px 1px 4px;font-size:14px;white-space:nowrap}
.mtag svg{width:18px;height:18px}
/* the realm */
.realm .rhead{display:flex;align-items:center;gap:8px;color:#fff8ec;font-size:15px;padding:0 4px 6px;flex-wrap:wrap;justify-content:center}
.realm .rhead b{font-family:var(--disp);font-weight:400;font-size:20px}
.meter.small{width:80px;height:12px;margin:0;border-width:2px}
.rew{display:inline-flex;align-items:center;gap:4px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:2px 10px 2px 2px;font-size:13px}
.rew.got{background:var(--mint)}
.rewcv{width:30px;height:30px}
.realm-stage{flex:1;position:relative;margin:0 -12px;min-height:0;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);overflow:hidden}
.realm-stage>canvas{position:absolute;left:0;top:0;display:block}
.lmks{position:absolute;inset:0}
.lmk{position:absolute;background:none;border:0;padding:0;border-radius:22px}
.lmk:focus-visible{outline:3px solid #fff}
.ltag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:3px 10px 3px 5px;font-size:16px;white-space:nowrap;box-shadow:0 4px 0 rgba(59,39,55,.75)}
.ltag svg{width:22px;height:22px}
.ltag i{font-style:normal;font-size:13px;background:var(--lav);color:#fff8ec;border-radius:10px;padding:1px 7px;border:2px solid var(--ink)}
.lmk.can .ltag{background:#d9f5df;animation:bob 1.1s ease-in-out infinite}
.lmk.can .ltag i{background:#2f9d93}
.lmk.cant .ltag{opacity:.88}
.lmk.cant .ltag i{background:#9a8fa6}
.lmk.sewing .ltag{display:none}
.lname{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:12px;color:#fff8ec;background:rgba(59,39,55,.55);border-radius:9px;padding:1px 7px;white-space:nowrap;opacity:0;transition:opacity .2s}
.lmk.ok:hover .lname,.lmk.ok:focus-visible .lname,.lmk.ok.show .lname{opacity:1}
.rlock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px 18px;font-size:17px;display:flex;align-items:center;gap:8px;max-width:90%}
.rlock svg{width:22px;height:22px;fill:var(--ink);flex:0 0 auto}
.realm-foot{display:flex;justify-content:center;padding:10px 0 0}
.realm-foot .btn{width:min(360px,100%)}
.coach{position:absolute;z-index:5;display:flex;align-items:center;gap:6px;max-width:min(330px,92%);background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 12px 6px 4px;font-size:15px;line-height:1.25;box-shadow:0 6px 0 rgba(59,39,55,.6);pointer-events:none;animation:popIn .28s cubic-bezier(.2,1.6,.4,1)}
.coach canvas{width:46px;height:52px;flex:0 0 auto}
.coach p{margin:0}
.coach-hand{position:absolute;z-index:6;width:48px;height:54px;pointer-events:none;animation:tap 1s ease-in-out infinite}
.coach-hand svg{width:48px;height:54px}
@keyframes tap{50%{transform:translate(4px,8px) scale(.94)}}
/* short frames (the platform 390×219 card, phone landscape): compact headers so the map and the realm keep a stage */
@media (max-height:460px){
  .full{padding-top:calc(var(--sat) + 4px);padding-bottom:calc(var(--sab) + 4px)}
  .topbar{min-height:40px;gap:6px}
  .topbar .rbtn{width:40px;height:40px}
  .topbar h2{font-size:17px}
  .topbar h2 small{display:none}
  .rchips{padding:2px 0 4px;gap:4px}
  .rchip{width:32px;height:32px;font-size:14px;border-width:2.5px}
  .rchip[aria-pressed=true]{transform:scale(1.08)}
  .realm-strip{min-height:34px;font-size:13px;padding:2px 8px;margin-bottom:4px}
  .realm-strip svg{width:20px;height:20px}
  .realm .rhead{display:none}
  .realm-foot{padding-top:4px}
  .realm-foot .btn.huge{min-height:42px;font-size:19px;padding:4px 12px}
  .ltag{font-size:12px;padding:1px 6px 1px 3px;border-width:2px}
  .ltag svg{width:15px;height:15px}
  .ltag i{display:none}
}
/* title realm button & result pills */
.btn.realm-b{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.huge.realm-b{font-size:21px;padding:10px 12px}
.btn.realm-b svg{width:28px;height:28px}
.reward{flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:2px 12px 2px 6px;font-size:22px;animation:popIn .4s .5s cubic-bezier(.2,1.6,.4,1) backwards}
.pill.thr{animation-delay:.9s;background:#f3e9ff}
.pill svg{width:28px;height:28px}

/* wardrobe */
.wgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 2px 12px;touch-action:pan-y}
.item{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.item canvas{width:100%;max-width:140px;aspect-ratio:1.2;background:linear-gradient(#ffe9c4,#f6d29a);border-radius:12px;border:2px solid rgba(59,39,55,.3)}
.item .nm{font-size:15px;line-height:1.1;min-height:34px;display:flex;align-items:center}
.item.on{background:var(--mint)}
.item .new{position:absolute;top:-8px;right:-6px;background:var(--tomato);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 7px;font-size:12px}
.item .btn{width:100%}
.note{color:#fff8ec;font-size:13px;text-align:center;opacity:.85;margin:4px 8px}

/* settings */
.set{width:min(380px,100%);text-align:left}
.set h2{text-align:center;font-size:30px;margin-bottom:6px}
.srow{display:flex;align-items:center;gap:10px;min-height:52px}
.srow>label,.srow>span{flex:0 0 120px;font-size:16px}
.srow input[type=range]{flex:1;height:44px;accent-color:var(--tomato)}
.srow b{width:48px;text-align:right}
.tog{min-width:84px;min-height:44px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-size:15px}
.tog[aria-pressed=true]{background:var(--teal);color:#fff}
.creds{font-size:13px;font-weight:700;line-height:1.35;max-height:170px;overflow:auto;background:rgba(255,255,255,.6);border-radius:12px;padding:8px 10px;margin-top:8px}
.savewarn{font-size:13px;color:#a33;margin:6px 0}
</style>
<script type="application/json" id="gt-assets">{}</script>

<body>
<div id="app">
  <canvas id="board" aria-label="Puzzle board" data-i18n-aria="aBoard"></canvas>
  <div id="hud" hidden>
    <div id="hud-top">
      <button class="rbtn" id="b-pause" data-i18n-aria="aPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
      <div id="hud-title"><small id="hud-ch"></small><b id="hud-board"></b></div>
      <div id="hud-chips">
        <span class="chip" id="chip-moth" data-i18n-aria="aTargets"><canvas class="ico" data-ico="moth" width="44" height="44"></canvas><b id="n-moth">0</b></span>
        <span class="chip" id="chip-lamb" data-i18n-aria="aLambs"><canvas class="ico" data-ico="lamb" width="44" height="44"></canvas><b id="n-lamb">0</b></span>
        <span class="chip" id="chip-par"><span data-i18n="par">Par</span>&nbsp;<b id="n-par">1</b><svg class="sc" viewBox="0 0 24 24"><use href="#i-sc"/></svg></span>
      </div>
    </div>
    <div id="hud-bottom">
      <div id="status" aria-live="polite"></div>
      <div id="cuts" data-i18n-aria="aCuts"></div>
      <button class="rbtn big" id="b-retry" data-i18n-aria="aRetry" aria-label="Retry"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke-width="2.8" stroke-linecap="round"/><path d="M3.2 4.2l2.4 5.8 5.6-2.6z"/></svg></button>
    </div>
    <div id="tut" hidden><div class="hand"><svg viewBox="0 0 64 72" width="64" height="72"><g fill="#fff4df" stroke="#3b2737" stroke-width="3.2" stroke-linejoin="round"><path d="M14 6c0-4 7-4 7 0v26c3-2 7-1 8 2 3-2 7-1 8 2 3-2 7 0 7 3v14c0 9-6 16-16 16h-4c-7 0-11-4-14-9L4 46c-2-3 1-7 5-5l5 4z"/><path d="M29 34v8M37 36v7M44 39v6" fill="none" stroke-width="2.6" stroke-linecap="round"/></g><circle cx="17.5" cy="6" r="3.6" fill="#e2574c" opacity=".55"/></svg></div><div class="tut-text" data-i18n="dragToCut"></div></div>
  </div>
  <div id="screen"></div>
  <div id="overlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sc" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="6" cy="18" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8.6 7.6L21 17M8.6 16.4L21 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
