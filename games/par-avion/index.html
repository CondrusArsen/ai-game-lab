<style>/* Par Avion — airmail & travel-poster interface. Cream paper, airmail red/navy chevrons, perforated stamps, rubber
   postmarks. One stylesheet for phone portrait, landscape, the the platform frames and desktop. */
:root {
  --red: #d4483b; --navy: #1e3557; --cream: #f7ecd4; --paper: #efe0c0; --gold: #f2b632; --ink: #22202a; --green: #4f9a54;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --u: clamp(9px, min(2.6vw, 1.9vh), 15px);
  --fd: 'PA Display', 'Trebuchet MS', system-ui, sans-serif; --fu: 'PA UI', 'Trebuchet MS', system-ui, sans-serif; --fn: 'PA Num', 'Arial Narrow', system-ui, sans-serif; --fl: 'PA Logo', Georgia, serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1e3557; touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
body { font-family: var(--fu); color: var(--ink); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; font-size: var(--u); }
#ui > * { pointer-events: none; }
#ui button, #ui .hit { pointer-events: auto; }
.ic { display: inline-flex; width: 1.6em; height: 1.6em; }
.ic svg { width: 100%; height: 100%; fill: currentColor; stroke: currentColor; }
.hidden { display: none !important; }

/* buttons */
.btn { font: inherit; font-family: var(--fd); font-weight: 800; border: 0; cursor: pointer; color: var(--cream); background: var(--navy); border-radius: 0.7em; padding: 0.7em 1.1em; min-height: 44px; min-width: 44px; letter-spacing: 0.02em; box-shadow: 0 0.25em 0 #0f1d33; transition: transform 0.06s; display: inline-flex; align-items: center; justify-content: center; gap: 0.4em; }
.btn.pressed { transform: translateY(0.2em); box-shadow: 0 0.05em 0 #0f1d33; }
.btn.red { background: var(--red); box-shadow: 0 0.25em 0 #8f2a22; }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 0.25em 0 #a8730d; }
.btn.ghost { background: rgba(247,236,212,0.92); color: var(--navy); box-shadow: 0 0.2em 0 rgba(15,29,51,0.35); }
.btn.round { border-radius: 50%; padding: 0; width: 3.4em; height: 3.4em; }
.btn.disabled, .btn:disabled { filter: grayscale(0.7) brightness(0.9); opacity: 0.7; }

/* top bar */
.top { position: absolute; left: 0; right: 0; top: calc(var(--safe-t) + 0.6em); display: flex; align-items: center; gap: 0.5em; padding: 0 0.8em; }
.top .btn.round { width: 3em; height: 3em; }
.wallet { pointer-events: none; display: inline-flex; align-items: center; gap: 0.35em; background: rgba(30,53,87,0.88); color: var(--cream); border-radius: 2em; padding: 0.3em 0.9em 0.3em 0.35em; font-family: var(--fn); font-weight: 600; font-size: 1.45em; min-width: 4.5em; box-shadow: 0 0.15em 0 rgba(0,0,0,0.25); }
.wallet .ic { width: 1.3em; height: 1.3em; }
.wallet.bump { animation: bump 0.35s ease-out; }
.wallet.short { animation: shake 0.35s; background: var(--red); }
@keyframes bump { 40% { transform: scale(1.18); } }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* tour ladder (every stop of this planet → the next planet) + the live bar towards the current stop. Portrait: below
   the host's corner buttons (top-right 60×60 on the platform); wide: centred in the top row. */
:root { --route-top: max(64px, calc(var(--u) * 4.4)); }
.route { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + var(--route-top)); width: min(92%, 34em); display: flex; flex-direction: column; align-items: stretch; gap: 0.15em; }
.ladder { position: relative; display: flex; justify-content: space-between; align-items: center; width: 100%; height: 3em; padding: 0; margin: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.ladder .line { position: absolute; left: 1.3em; right: 1.3em; top: 50%; height: 0.3em; margin-top: -0.15em; border-radius: 0.2em; background: repeating-linear-gradient(90deg, var(--navy) 0 0.55em, rgba(247,236,212,0.95) 0.55em 0.95em); box-shadow: 0 0 0 0.08em rgba(30,53,87,0.5); }
.ladder .reach { position: absolute; left: 1.3em; top: 50%; height: 0.46em; margin-top: -0.23em; border-radius: 0.23em; background: var(--gold); box-shadow: 0 0 0 0.12em var(--navy); }
.stop { position: relative; z-index: 1; flex: 0 0 auto; width: 2.6em; height: 2.6em; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--cream); border: 0.16em solid var(--navy); color: var(--navy); box-shadow: 0 0.12em 0 rgba(15,29,51,0.35); }
.stop b { font: 600 0.98em var(--fn); letter-spacing: -0.02em; line-height: 1; }
.stop .ic { width: 1.45em; height: 1.45em; }
.stop.done { background: var(--green); color: var(--cream); }
.stop.cur { background: var(--gold); transform: scale(1.22); animation: stopPulse 1.3s ease-in-out infinite; }
.stop.todo b { opacity: 0.8; }
.stop .tk { position: absolute; right: -0.6em; top: -0.62em; width: 1.5em; height: 1.5em; filter: drop-shadow(0 0.08em 0 rgba(15,29,51,0.45)); }
.stop .tk .ic { width: 100%; height: 100%; }
.stop.goal { background: var(--navy); border-color: var(--cream); transform: scale(1.12); }
.stop.goal canvas { width: 100%; height: 100%; border-radius: 50%; }
.stop.goal.album { background: var(--cream); border-color: var(--navy); }
.stop.goal.armed { border-color: var(--gold); animation: stopPulse 0.8s ease-in-out infinite; }
@keyframes stopPulse { 50% { box-shadow: 0 0 0 0.38em rgba(242,182,50,0.5), 0 0.12em 0 rgba(15,29,51,0.35); } }
.route .track { position: relative; height: 0.95em; margin-top: 0.15em; border-radius: 1em; background: rgba(247,236,212,0.9); box-shadow: inset 0 0 0 0.16em var(--navy); overflow: visible; }
.route .fill { position: absolute; left: 0.2em; top: 0.2em; bottom: 0.2em; border-radius: 1em; background: repeating-linear-gradient(-45deg, var(--red) 0 0.5em, var(--cream) 0.5em 0.75em, var(--navy) 0.75em 1.25em, var(--cream) 1.25em 1.5em); width: 0; transition: width 0.15s linear; }
.route .mk { position: absolute; top: -0.5em; width: 0; height: 0; }
.route .mk i { position: absolute; left: -0.45em; width: 0.9em; height: 0.9em; border-radius: 50%; border: 0.18em solid var(--navy); background: var(--gold); }
.route .mk.last i { background: var(--cream); }
.route .mk b { position: absolute; top: 1.7em; left: -2em; width: 4em; text-align: center; font: 600 0.8em var(--fn); color: var(--navy); text-shadow: 0 0 3px var(--cream), 0 0 3px var(--cream); white-space: nowrap; }
.route .flag { position: absolute; right: -0.45em; top: -1.05em; color: var(--red); }
.route .flag .ic { width: 1.5em; height: 1.5em; filter: drop-shadow(0 0.1em 0 rgba(0,0,0,0.2)); }
.route .lab { display: flex; justify-content: space-between; font: 600 0.95em var(--fn); color: var(--navy); text-shadow: 0 0 4px var(--cream), 0 0 4px var(--cream); letter-spacing: 0.02em; }
.route .lab .tgt { color: var(--red); font-size: 1.15em; }

.dist { position: absolute; left: 0; right: 0; top: calc(var(--safe-t) + var(--route-top) + var(--u) * 5.8); text-align: center; font: 600 4.2em var(--fn); color: var(--cream); text-shadow: 0 0.06em 0 var(--navy), 0 0 0.3em rgba(30,53,87,0.5); letter-spacing: 0.01em; }
.dist small { font-size: 0.42em; margin-left: 0.15em; }

.side { position: absolute; right: 0.8em; top: calc(var(--safe-t) + var(--route-top) + 6.2em); display: flex; flex-direction: column; gap: 0.6em; align-items: flex-end; }
.chip { font: inherit; font-family: var(--fd); font-weight: 800; border: 0; display: flex; align-items: center; gap: 0.4em; background: rgba(247,236,212,0.95); color: var(--navy); border-radius: 0.8em; padding: 0.35em 0.7em 0.35em 0.4em; min-height: 44px; box-shadow: 0 0.2em 0 rgba(15,29,51,0.35); cursor: pointer; }
.chip .ic { width: 2.1em; height: 2.1em; }
.chip .dot { width: 1.9em; height: 1.9em; border-radius: 50%; border: 0.16em solid var(--navy); }
.chip span { font-size: 1.05em; }
.chip.pressed { transform: translateY(0.15em); }
.chip .badge { background: var(--red); color: var(--cream); border-radius: 1em; padding: 0 0.45em; font-size: 0.85em; }

.tip { position: absolute; left: 50%; transform: translateX(-50%); top: 31%; width: fit-content; max-width: min(88%, 30em); background: rgba(30,53,87,0.55); border-radius: 0.8em; padding: 0.35em 0.8em; text-align: center; font: 800 1.3em var(--fd); color: var(--cream); text-shadow: 0 0.08em 0 var(--navy), 0 0 0.5em rgba(30,53,87,0.6); line-height: 1.25; }
.tip em { font-style: normal; color: var(--gold); }
.tip small { display: block; font: 600 0.7em var(--fu); margin-top: 0.2em; letter-spacing: 0.01em; }
.tip.armed { color: var(--gold); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }

/* the big rubber stamp */
.stampfx { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) rotate(-8deg); font: 800 3em var(--fd); letter-spacing: 0.04em; padding: 0.15em 0.5em; border: 0.14em solid currentColor; border-radius: 0.3em; color: var(--red); opacity: 0; white-space: nowrap; mix-blend-mode: multiply; }
.stampfx.on { animation: stamp 1.2s ease-out forwards; }
.stampfx.navy { color: var(--navy); } .stampfx.green { color: #2e7d3a; } .stampfx.gold { color: #b8820f; }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(2.2); } 12% { opacity: 0.95; transform: translate(-50%, -50%) rotate(-8deg) scale(0.95); } 20% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); } 75% { opacity: 0.9; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(1); } }

/* bottom: upgrades + swing */
.bottom { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 0.8em); display: flex; flex-direction: column; align-items: center; gap: 0.7em; padding: 0 0.7em; }
.ups { display: flex; gap: 0.5em; width: min(100%, 34em); }
.up { flex: 1; font: inherit; border: 0; cursor: pointer; padding: 0.32em; min-height: 44px; background: radial-gradient(circle at 0.32em 0.32em, transparent 0.2em, var(--cream) 0.22em) -0.32em -0.32em / 0.64em 0.64em; filter: drop-shadow(0 0.18em 0 rgba(15,29,51,0.35)); transition: transform 0.06s; text-align: left; }
.up .in { background: var(--c); color: var(--cream); padding: 0.4em 0.5em 0.45em; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: 0.35em; align-items: center; min-height: 5.6em; position: relative; }
.up .in .ic { grid-row: 1 / span 2; width: 2em; height: 2em; }
.up .nm { font: 800 1.02em var(--fd); text-transform: uppercase; letter-spacing: 0.03em; line-height: 1; }
.up .pc { font: 600 1.2em var(--fn); line-height: 1.05; }
.up .pr { grid-column: 1 / span 2; display: flex; align-items: center; justify-content: space-between; gap: 0.2em; margin-top: 0.25em; background: rgba(0,0,0,0.22); border-radius: 0.4em; padding: 0.1em 0.35em; font: 600 1.1em var(--fn); }
.up .pr .ic { width: 1.2em; height: 1.2em; grid-row: auto; }
.up .pv { position: absolute; right: 0.4em; top: 1.75em; font: 600 0.95em var(--fn); color: var(--gold); }
.up.poor .in { filter: saturate(0.45) brightness(0.85); }
.up.poor .pr { color: #ffd2c8; }
.up.pressed { transform: translateY(0.18em); }
.up.hint { animation: hint 1s infinite; }
@keyframes hint { 50% { transform: translateY(-0.35em); filter: drop-shadow(0 0.5em 0 rgba(242,182,50,0.8)); } }
.up.flash .in { animation: flash 0.4s; }
@keyframes flash { 30% { filter: brightness(1.5); } }
.swing { font: 800 2.1em var(--fd); letter-spacing: 0.08em; width: min(86%, 15em); min-height: 2.4em; border-radius: 1.2em; background: var(--red); color: var(--cream); box-shadow: 0 0.18em 0 #8f2a22, 0 0 0 0.12em var(--cream) inset; }
.swing .ic { width: 1.25em; height: 1.25em; }
.swing.armed { background: var(--gold); color: var(--navy); box-shadow: 0 0.18em 0 #a8730d, 0 0 0 0.12em var(--cream) inset; animation: glow 0.9s infinite; }
@keyframes glow { 50% { filter: brightness(1.15); } }
.keyhint { font: 600 0.9em var(--fu); color: var(--cream); opacity: 0.8; text-shadow: 0 1px 0 var(--navy); margin-top: -0.4em; }

/* short game */
.greenui { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 0.8em); display: flex; flex-direction: column; align-items: center; gap: 0.5em; padding: 0 0.8em; }
.greenui .gtip { font: 800 1.15em var(--fd); color: var(--cream); text-shadow: 0 0.08em 0 var(--navy), 0 0 0.4em rgba(30,53,87,0.7); text-align: center; }
.greenui .gtip small { display: block; font: 600 0.75em var(--fu); opacity: 0.9; }
.greenui .row { display: flex; gap: 0.6em; align-items: center; }
.greenui .strokes { font: 600 1.25em var(--fn); color: var(--navy); background: rgba(247,236,212,0.92); border-radius: 0.6em; padding: 0.25em 0.7em; }
.pausebtn { position: absolute; left: 0.8em; top: calc(var(--safe-t) + 0.6em); }

/* cards: postcards with an airmail border */
.layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1em; background: rgba(20,24,40,0.45); pointer-events: auto !important; }
.layer.clear { background: transparent; pointer-events: none !important; }
.card { pointer-events: auto; width: min(94vw, 27em); max-height: 94vh; display: flex; flex-direction: column; padding: 0.6em; border-radius: 0.8em; background: repeating-linear-gradient(-45deg, var(--red) 0 1em, var(--cream) 1em 1.4em, var(--navy) 1.4em 2.4em, var(--cream) 2.4em 2.8em); box-shadow: 0 0.6em 1.5em rgba(0,0,0,0.35); animation: cardIn 0.28s cubic-bezier(.2,1.4,.5,1); }
@keyframes cardIn { from { transform: translateY(1.5em) scale(0.92); opacity: 0; } }
.card .in { background: var(--cream); border-radius: 0.4em; padding: 1em 1.1em 1.1em; display: flex; flex-direction: column; gap: 0.55em; align-items: center; text-align: center; position: relative; overflow: hidden; }
.card h2 { margin: 0; font: 800 1.9em var(--fd); color: var(--navy); line-height: 1.05; letter-spacing: 0.01em; }
.card h3 { margin: 0; font: 800 1.2em var(--fd); color: var(--red); }
.card p { margin: 0; font: 600 1.05em var(--fu); color: #3a3446; line-height: 1.3; }
.card .big { font: 600 3em var(--fn); color: var(--navy); line-height: 1; }
.card .big small { font-size: 0.4em; }
.card .row { display: flex; gap: 0.6em; flex-wrap: wrap; justify-content: center; width: 100%; }
.card .row .btn { flex: 1; min-width: 7em; }
.card .math { font: 600 1.05em var(--fn); color: #4a4458; display: flex; flex-direction: column; gap: 0.1em; }
.card .pay { display: inline-flex; align-items: center; gap: 0.3em; font: 600 2.4em var(--fn); color: #a8730d; }
.card .pay .ic { width: 1.1em; height: 1.1em; }
.card .note { font: 600 0.95em var(--fu); color: #6a6276; }
.card .gate { font: 800 1em var(--fd); padding: 0.35em 0.7em; border-radius: 0.5em; background: #e3efd8; color: #2e6b36; }
.card .gate.miss { background: #f6ddd6; color: #9a3328; }
.card ul { margin: 0; padding: 0 0 0 1.1em; text-align: left; font: 600 1em var(--fu); color: #3a3446; display: flex; flex-direction: column; gap: 0.25em; }
.postmark { position: absolute; right: -0.6em; top: -0.6em; width: 5.4em; height: 5.4em; border-radius: 50%; border: 0.2em solid currentColor; display: flex; align-items: center; justify-content: center; text-align: center; font: 800 0.75em var(--fd); transform: rotate(14deg); opacity: 0.35; color: var(--red); line-height: 1.05; padding: 0.4em; pointer-events: none; }
.card .in > *:not(.postmark) { position: relative; }
.postmark::after { content: ''; position: absolute; left: -2.8em; right: 4.4em; top: 45%; height: 0.9em; background: repeating-linear-gradient(180deg, currentColor 0 0.16em, transparent 0.16em 0.32em); }
.title-stamp { display: inline-block; font: 800 2.2em var(--fd); color: var(--red); border: 0.12em solid currentColor; border-radius: 0.25em; padding: 0.05em 0.4em; transform: rotate(-4deg); letter-spacing: 0.04em; mix-blend-mode: multiply; }
.title-stamp.navy { color: var(--navy); } .title-stamp.green { color: #2e7d3a; }
.portrait { width: 8em; height: 9.6em; }
.trailpic { width: 100%; height: 8.5em; border-radius: 0.4em; }
.card.wide { width: min(96vw, 32em); }
.card .ladder { font-size: 0.92em; margin: 0.5em 0 0.1em; pointer-events: none; cursor: default; }
.card ol.tour { margin: 0; padding: 0 0 0 1.3em; text-align: left; font: 600 1em var(--fu); color: #3a3446; display: flex; flex-direction: column; gap: 0.3em; line-height: 1.3; }
.planetpic { width: 100%; height: 9em; border-radius: 0.4em; }

/* full screens (album, route map, settings) */
.screen { pointer-events: auto; position: absolute; inset: 0; background: var(--paper); display: flex; flex-direction: column; animation: cardIn 0.22s; }
.screen .hd { display: flex; align-items: center; gap: 0.6em; padding: calc(var(--safe-t) + 0.6em) 0.8em 0.5em; background: repeating-linear-gradient(-45deg, var(--red) 0 0.8em, var(--cream) 0.8em 1.1em, var(--navy) 1.1em 1.9em, var(--cream) 1.9em 2.2em); }
.screen .hd h2 { margin: 0; flex: 1; font: 800 1.8em var(--fd); color: var(--navy); background: var(--cream); padding: 0.15em 0.5em; border-radius: 0.3em; }
.screen .bd { flex: 1; min-height: 0; display: flex; padding: 0.8em; gap: 0.8em; }
.tabs { display: flex; gap: 0.4em; }
.tab { font: 800 1.05em var(--fd); border: 0; padding: 0.4em 0.9em; border-radius: 0.5em; background: rgba(30,53,87,0.12); color: var(--navy); min-height: 44px; cursor: pointer; }
.tab.on { background: var(--navy); color: var(--cream); }
.grid { flex: 1; min-height: 0; display: grid; gap: 0.5em; align-content: start; }
.tile { font: inherit; border: 0; padding: 0.22em; background: radial-gradient(circle at 0.25em 0.25em, transparent 0.15em, #fffaf0 0.17em) -0.25em -0.25em / 0.5em 0.5em; cursor: pointer; position: relative; min-height: 44px; filter: drop-shadow(0 0.12em 0 rgba(15,29,51,0.25)); }
.tile .in { background: var(--bg, #dfe9e0); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; overflow: hidden; position: relative; }
.tile canvas { width: 100%; flex: 1; min-height: 0; }
.tile .cap { font: 800 0.72em var(--fd); color: var(--navy); background: rgba(255,250,240,0.85); width: 100%; text-align: center; padding: 0.15em 0.1em; line-height: 1.1; }
.tile.locked .in { filter: grayscale(1) brightness(0.75); }
.tile .lk { position: absolute; right: 0.3em; top: 0.3em; color: var(--navy); background: var(--cream); border-radius: 50%; width: 1.7em; height: 1.7em; display: flex; align-items: center; justify-content: center; }
.tile .lk .ic { width: 1.1em; height: 1.1em; }
.tile.on { outline: 0.2em solid var(--red); outline-offset: 0.1em; }
.tile.pressed { transform: translateY(0.12em); }
.detail { width: 38%; min-width: 12em; display: flex; flex-direction: column; gap: 0.5em; align-items: center; text-align: center; background: var(--cream); border-radius: 0.6em; padding: 0.8em; }
.detail h3 { margin: 0; font: 800 1.35em var(--fd); color: var(--navy); }
.detail p { margin: 0; font: 600 1em var(--fu); color: #4a4458; }
.detail canvas { width: 100%; flex: 1; min-height: 6em; max-height: 18em; }
.counter { font: 600 1.4em var(--fn); color: var(--navy); }
.planets { flex: 1; display: grid; gap: 0.7em; grid-template-columns: repeat(3, 1fr); }
.pcard { font: inherit; border: 0; padding: 0.5em; border-radius: 0.6em; background: var(--cream); display: flex; flex-direction: column; gap: 0.35em; align-items: center; text-align: center; cursor: pointer; min-height: 44px; box-shadow: 0 0.2em 0 rgba(15,29,51,0.25); }
.pcard canvas { width: 100%; aspect-ratio: 1; max-height: 40vh; }
.pcard h3 { margin: 0; font: 800 1.3em var(--fd); color: var(--navy); }
.pcard p { margin: 0; font: 600 0.88em var(--fu); color: #4a4458; }
.pcard .st { font: 600 1em var(--fn); color: var(--navy); }
.pcard.cur { outline: 0.2em solid var(--red); }
.pcard.lock canvas { filter: grayscale(1) brightness(0.6); }
.pcard .btn { width: 100%; }
.planets { align-content: start; }
.pcard.row { display: grid; grid-template-columns: 7em 1fr; column-gap: 0.8em; row-gap: 0.25em; text-align: left; align-items: start; }
.pcard.row canvas { grid-row: 1 / span 4; width: 7em; height: 7em; aspect-ratio: auto; }
.pcard.row h3, .pcard.row p, .pcard.row .st, .pcard.row .btn { grid-column: 2; }
.set { width: min(100%, 28em); margin: 0 auto; display: flex; flex-direction: column; gap: 0.9em; overflow-y: auto; }
.set label { font: 800 1.1em var(--fd); color: var(--navy); display: flex; align-items: center; gap: 0.5em; }
.set .sl { display: flex; align-items: center; gap: 0.6em; }
.set input[type=range] { flex: 1; height: 44px; accent-color: var(--red); pointer-events: auto; }
.set .val { font: 600 1.1em var(--fn); width: 3em; text-align: right; color: var(--navy); }
.seg { display: flex; gap: 0.4em; }
.seg .btn { flex: 1; }
.set .credits { font: 600 0.9em var(--fu); color: #4a4458; background: var(--cream); padding: 0.7em; border-radius: 0.5em; line-height: 1.35; }

/* coach bubble */
.coach { position: absolute; max-width: min(80vw, 20em); background: var(--cream); color: var(--navy); border: 0.16em solid var(--navy); border-radius: 0.8em; padding: 0.6em 0.8em; font: 800 1.05em var(--fd); line-height: 1.25; box-shadow: 0 0.3em 0 rgba(15,29,51,0.3); animation: cardIn 0.3s; }
.coach::after { content: ''; position: absolute; left: var(--ax, 50%); bottom: -0.75em; width: 1.2em; height: 1.2em; background: var(--cream); border-right: 0.16em solid var(--navy); border-bottom: 0.16em solid var(--navy); transform: translateX(-50%) rotate(45deg); }
.coach.up::after { bottom: auto; top: -0.75em; transform: translateX(-50%) rotate(225deg); }
.coach small { display: block; font: 600 0.82em var(--fu); color: #4a4458; margin-top: 0.2em; }
.hand { position: absolute; width: 3em; height: 3em; font-size: var(--u); pointer-events: none; }
.hand svg { width: 100%; height: 100%; }
.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: var(--navy); color: var(--cream); font: 800 1.1em var(--fd); padding: 0.45em 0.9em; border-radius: 0.6em; animation: toast 2.2s forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 0.6em); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
.loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4em; background: var(--navy); color: var(--cream); pointer-events: auto; }
.loader .logo { font: 400 3.4em var(--fl); letter-spacing: 0.06em; color: var(--cream); }
.loader .sub { font: 800 1.1em var(--fd); color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; }

/* wide / short screens: upgrades become a left column, swing at the bottom right */
@media (min-aspect-ratio: 5/4) {
  :root { --u: clamp(8px, min(1.15vw, 2.1vh), 15px); --route-top: calc(var(--u) * 0.6); }
  .bottom { left: 0.8em; right: 0.8em; flex-direction: row; align-items: flex-end; justify-content: space-between; }
  .ups { flex-direction: column; width: 15em; }
  .up .in { min-height: 4.6em; }
  .swing { width: 13em; }
  .side { top: calc(var(--safe-t) + max(64px, 4.2em)); }
  .route { width: min(46%, 34em); }
  .tip { top: 24%; }
  .planets { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bd.album .grid { grid-template-columns: repeat(7, 1fr) !important; }
}
@media (max-height: 300px) {
  :root { --u: 7.5px; --route-top: calc(var(--u) * 0.6); }
  .route { width: 40%; }
  .route .lab { display: none; }
  .dist { top: calc(var(--route-top) + var(--u) * 4.6); font-size: 3em; }
  .side { top: 64px; gap: 0.3em; }
  .side .chip { min-height: 40px; padding: 0.25em 0.6em 0.25em 0.35em; }
  .tip { top: 30%; font-size: 1.1em; }
  .ups { width: 12em; gap: 0.3em; }
  .up .in { min-height: 3.6em; padding: 0.25em 0.35em; }
  .up .pv { display: none; }
  .keyhint { display: none; }
  .swing { font-size: 1.7em; width: 10em; min-height: 1.9em; }
  .top .btn.round { width: 2.6em; height: 2.6em; }
}
