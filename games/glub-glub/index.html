<style>/* Glub Glub — UI in the cove's materials: sea-glass buttons, cream shell cards, wet-wood accents, one plum outline. */
:root {
  --out: #2b1d4e; --cream: #fff6e6; --cream2: #ffe9c7; --glass: #4fd1c5; --glass2: #2bb3a8; --coral: #ff7a8a; --gold: #ffd23f;
  --ink: #2a1a4a; --sky: #5fc4f2; --sat: 0px; --sab: 0px;
  --ui: "GlubUI", "Trebuchet MS", system-ui, sans-serif; --title: "GlubTitle", "GlubUI", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd6ec; overscroll-behavior: none; }
body { font: 700 16px/1.25 var(--ui); color: var(--out); user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
button { font: inherit; color: inherit; }
.btn { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
.btn svg { width: 24px; height: 24px; flex: none; }
.btn.down { transform: translateY(2px) scale(.97); }

/* ---- HUD ---- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud .top { position: absolute; left: 0; right: 0; top: calc(var(--sat) + 6px); height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
#hud .bottom { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 8px); height: 52px; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
#hud .btn { pointer-events: auto; }
.btn.icon { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 30%, #8ff0e6, var(--glass) 45%, var(--glass2)); border: 2.5px solid var(--out); box-shadow: 0 3px 0 var(--out), inset 0 -3px 0 rgba(0,0,0,.12); }
.btn.icon svg { stroke: #fff; filter: drop-shadow(0 1px 0 rgba(43,29,78,.6)); }
.lvtitle { pointer-events: none; text-align: center; background: var(--cream); border: 2.5px solid var(--out); border-radius: 16px; padding: 2px 14px 3px; box-shadow: 0 3px 0 var(--out); min-width: 130px; }
.lvtitle b { display: block; font: 800 20px/1.05 var(--ui); }
.lvtitle span { display: block; font-size: 11px; opacity: .75; letter-spacing: .02em; }
.drops { display: flex; gap: 6px; padding: 4px 12px; background: rgba(255,246,230,.88); border: 2.5px solid var(--out); border-radius: 22px; box-shadow: 0 3px 0 var(--out); pointer-events: none; }
.drops svg { width: 22px; height: 28px; }
.drops path { stroke: var(--out); stroke-width: 2; }
.drops .full { fill: #5b3fc4; }
.drops .empty { fill: rgba(255,255,255,.4); stroke-dasharray: 3 3; }
.inkybtn { position: absolute; left: 8px; bottom: -4px; width: 64px; height: 68px; pointer-events: auto; }
.inkybtn img { width: 64px; height: 74px; display: block; filter: drop-shadow(0 3px 0 rgba(43,29,78,.35)); }
.inkybtn .q { position: absolute; right: -2px; top: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); border: 2px solid var(--out); font: 800 15px/20px var(--ui); font-style: normal; text-align: center; }
.inkybtn.glow .q { animation: pulse 1s ease-in-out infinite; background: #fff27a; }
@keyframes pulse { 50% { transform: scale(1.25); } }
.pour { position: absolute; right: 10px; bottom: 2px; min-width: 96px; height: 48px; padding: 0 16px; border-radius: 24px; border: 2.5px solid var(--out); box-shadow: 0 4px 0 var(--out);
  background: linear-gradient(#ffe27a, var(--gold)); font: 800 19px/1 var(--ui); opacity: 0; transform: translateY(12px); transition: .2s; pointer-events: none !important; }
.pour.on { opacity: 1; transform: none; pointer-events: auto !important; }
.unsaved { position: absolute; top: calc(var(--sat) + 54px); left: 50%; transform: translateX(-50%); font-size: 11px; background: rgba(255,255,255,.8); padding: 1px 8px; border-radius: 8px; }
.unsaved:empty { display: none; }

/* Inky's speech bubble (over the beach, above the help button) */
.bubble { position: absolute; left: 66px; right: 14px; bottom: calc(var(--sab) + 64px); pointer-events: none; opacity: 0; transform: translateY(10px); transition: .25s; }
.bubble.on { opacity: 1; transform: none; }
.bubble p { margin: 0; display: inline-block; max-width: 320px; background: var(--cream); border: 2.5px solid var(--out); border-radius: 18px 18px 18px 4px; padding: 9px 14px; box-shadow: 0 3px 0 var(--out); font-size: 16px; }
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 58px); transform: translate(-50%, -8px); max-width: min(92vw, 360px); background: var(--out); color: #fff; padding: 8px 14px; border-radius: 14px; font-size: 14px; text-align: center; opacity: 0; transition: .2s; pointer-events: none; z-index: 12; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.intro { position: absolute; left: 0; right: 0; top: calc(var(--boardTop) + 14px); text-align: center; pointer-events: none; transition: opacity .5s, transform .5s; }
.intro.off { opacity: 0; transform: translateY(-20px); }
.intro h1 { margin: 0; font: 400 52px/1 var(--title); color: #fff; -webkit-text-stroke: 2px var(--out); paint-order: stroke fill; text-shadow: 0 4px 0 var(--out); letter-spacing: .02em; }
.intro p { margin: 4px 0 0; font-size: 17px; color: var(--out); }

/* ---- overlays & cards ---- */
#layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#layer.on { pointer-events: auto; }
.ov { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; padding: calc(var(--sat) + 12px) 12px calc(var(--sab) + 12px); }
.ov.mid, .ov.full { background: rgba(28,16,60,.45); }
.ov.top { align-items: flex-start; padding-top: calc(var(--sat) + 58px); pointer-events: none; }
.ov.top .card { pointer-events: auto; animation: drop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
.card { background: linear-gradient(var(--cream), var(--cream2)); border: 3px solid var(--out); border-radius: 22px; box-shadow: 0 5px 0 var(--out); padding: 14px 16px; width: min(94vw, 380px); max-height: 100%; overflow: auto; }
.card h2 { margin: 0; font: 800 22px/1.15 var(--ui); }
.card p { margin: 4px 0 0; font-size: 15px; font-weight: 700; opacity: .9; }
.cardhead { display: flex; align-items: center; gap: 10px; }
.cardhead img { width: 54px; height: 62px; flex: none; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.btn.primary, .btn.ghost { min-height: 50px; padding: 0 18px; border-radius: 25px; border: 2.5px solid var(--out); box-shadow: 0 4px 0 var(--out); display: inline-flex; align-items: center; gap: 8px; justify-content: center; font: 800 18px/1 var(--ui); }
.btn.primary { background: radial-gradient(circle at 35% 25%, #9ff5ec, var(--glass) 50%, var(--glass2)); color: #fff; text-shadow: 0 1.5px 0 var(--out); }
.btn.primary svg, .btn.ghost svg { stroke: currentColor; }
.btn.ghost { background: #fff; }
.btn.wide { width: 100%; margin-top: 10px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.stats span { background: rgba(255,255,255,.7); border: 2px solid var(--out); border-radius: 12px; padding: 3px 9px; font-size: 14px; }
.stats .gold { background: var(--gold); }
.chdone { color: #b4421f; font-size: 17px !important; }
.strip { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.strip i { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--out); background: #fff; }
.strip i.done { background: var(--glass); }
.strip i.cur { box-shadow: 0 0 0 3px var(--gold); }
.card.fail h2 { font-size: 20px; }
.card.help .opts { display: grid; gap: 8px; margin-top: 10px; }
.btn.opt { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 6px 12px; border-radius: 16px; border: 2.5px solid var(--out); background: #fff; box-shadow: 0 3px 0 var(--out); text-align: left; font-size: 16px; }
.btn.opt b { width: 30px; height: 30px; border-radius: 50%; background: #ff8fc0; border: 2px solid var(--out); display: grid; place-items: center; flex: none; }
.btn.opt.used { background: #eafbf8; }
.card.menu { text-align: center; }
.logo { font: 400 38px/1.05 var(--title) !important; color: #fff; -webkit-text-stroke: 1.6px var(--out); paint-order: stroke fill; text-shadow: 0 3px 0 var(--out); margin-bottom: 4px !important; }
.card.settings .srow { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.srow > span { flex: 0 0 104px; }
.srow input[type=range] { flex: 1; height: 44px; accent-color: var(--glass2); }
.srow b { width: 46px; text-align: right; }
.srow.chk input { width: 26px; height: 26px; accent-color: var(--glass2); }
.srow.chk span { flex: 1; }
.segs { display: flex; gap: 6px; }
.btn.seg { min-width: 58px; min-height: 44px; border-radius: 14px; border: 2.5px solid var(--out); background: #fff; font-weight: 800; }
.btn.seg.on { background: var(--glass); color: #fff; }
.note { font-size: 13px !important; opacity: .8; }
.card.credits pre { white-space: pre-wrap; font: 11px/1.35 ui-monospace, Consolas, monospace; background: rgba(255,255,255,.6); padding: 8px; border-radius: 10px; max-height: 40vh; overflow: auto; }
.ov.full .card { width: min(96vw, 520px); max-height: calc(100vh - var(--sat) - var(--sab) - 24px); }
.chhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.chhead span { font-size: 13px; }
.chlist { display: grid; gap: 10px; margin-top: 10px; }
.chcard { border: 2.5px solid var(--out); border-radius: 16px; background: #fff; padding: 8px; }
.chcard.done { background: #eafbf8; }
.charts { display: flex; gap: 10px; align-items: center; }
.charts canvas { width: 80px; height: 60px; border-radius: 10px; border: 2px solid var(--out); flex: none; }
.charts small { font-size: 12px; opacity: .7; }
.charts h3 { margin: 0; font: 800 18px/1.1 var(--ui); }
.pzrow { display: flex; gap: 6px; margin-top: 8px; }
.btn.pz { flex: 1; min-height: 48px; border-radius: 12px; border: 2.5px solid var(--out); background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.btn.pz b { font-size: 18px; }
.btn.pz small { font-size: 10px; opacity: .7; margin-top: 2px; }
.btn.pz.ok { background: var(--glass); color: #fff; }
.btn.pz.locked { opacity: .45; }
.btn.pz.locked svg { stroke: var(--out); }
.card.reveal { text-align: center; }
.card.reveal em { display: inline-block; font-style: normal; background: var(--coral); color: #fff; border: 2.5px solid var(--out); border-radius: 12px; padding: 2px 12px; font-weight: 800; }
.card.reveal canvas { width: 240px; height: 150px; display: block; margin: 6px auto 0; }
.card.ending { text-align: center; }
.card.ending canvas { width: 100%; height: auto; border-radius: 14px; border: 2.5px solid var(--out); }

/* wide frames (landscape, the platform embed): HUD in side columns */
body.wide #hud .top { top: 6px; left: 6px; right: auto; width: 80px; height: auto; flex-direction: column; gap: 8px; padding: 0; }
body.wide .lvtitle { min-width: 0; padding: 2px 6px; }
body.wide .lvtitle span { display: none; }
body.wide #hud .bottom { left: auto; right: 6px; bottom: 6px; width: 84px; height: auto; flex-direction: column-reverse; gap: 8px; padding: 0; }
body.wide .drops { flex-direction: column; padding: 6px; }
body.wide .inkybtn { position: relative; left: auto; bottom: auto; }
body.wide .pour { position: static; }
body.wide .pour { min-width: 76px; font-size: 16px; padding: 0 8px; }
body.wide .bubble { left: auto; right: 96px; bottom: 8px; width: 46%; }
body.wide .bubble p { font-size: 13px; padding: 6px 10px; }
body.wide .toast { top: 6px; }
body.wide .intro { top: 8px; }
body.wide .intro h1 { font-size: 34px; }
body.wide .ov.top { padding-top: 6px; }
body.wide .card { padding: 10px 12px; }
body.wide .card h2 { font-size: 18px; }
body.wide .btn.primary, body.wide .btn.ghost { min-height: 44px; font-size: 16px; }
@media (max-height: 300px) {
  body.wide .card { transform: scale(.82); transform-origin: top center; }
  body.wide .btn.icon { width: 44px; height: 44px; }
  body.wide #hud .top { gap: 5px; }
  body.wide .pour { height: 44px; min-width: 64px; font-size: 14px; }
  body.wide .inkybtn img { width: 48px; height: 56px; }
  body.wide .drops svg { width: 16px; height: 20px; }
}
.mark { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; line-height: 1.2; color: #5a4a78; }
.mark .shell { width: 26px; height: 26px; flex: none; color: #d8cfe6; }
.mark .shell svg { width: 26px; height: 26px; }
.mark.got { color: var(--out); font-size: 15px; }
.mark.got .shell { color: var(--gold); animation: pulse 1.2s ease-in-out 2; }
.btn.pz.shell { box-shadow: inset 0 -5px 0 var(--gold); }
.bubble.top { top: calc(var(--boardTop) + 6px); bottom: auto; left: 14px; }
.bubble.top p { border-radius: 18px; }
body.wide .bubble.top { top: 6px; right: 96px; left: auto; }
/* ---- v2: metagame, coach, demos ---- */
#hud .tl { display: flex; gap: 8px; }
.btn.icon.mapbtn svg { width: 22px; height: 22px; }
.badge { position: relative; }
.badge::after { content: ''; position: absolute; right: -2px; top: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--coral); border: 2px solid var(--out); animation: pulse 1.2s ease-in-out infinite; }
body.wide .mapbtn { display: none; }
.shellic { width: 20px; height: 20px; color: #ffb0c4; flex: none; vertical-align: -4px; }
.staric { width: 20px; height: 20px; fill: #fff; flex: none; vertical-align: -4px; }
.staric.on { fill: var(--gold); }
.pill { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,246,230,.95); border: 2.5px solid var(--out); border-radius: 16px; padding: 2px 10px 2px 6px; box-shadow: 0 3px 0 var(--out); font-size: 16px; }
.wallet { display: flex; gap: 6px; }
.wallet.center { justify-content: center; margin: 2px 0 2px; }
/* full screens (map, lagoon): no card frame, header + art + footer, never scroll */
.ov.screen { padding: 0; background: #2f8fc2; }
.mapscreen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(var(--sat) + 6px) 8px calc(var(--sab) + 8px); gap: 6px; }
.mapbar { display: flex; align-items: center; gap: 8px; flex: none; }
.mapbar.top { justify-content: space-between; }
.mapbar.top h2 { flex: 1; margin: 0; font: 800 21px/1.1 var(--ui); color: #fff; -webkit-text-stroke: 1px var(--out); paint-order: stroke fill; text-shadow: 0 2px 0 var(--out); }
.mapbar.bottom { justify-content: space-between; }
.mapbar.bottom .btn.primary { flex: 1; max-width: 220px; margin-left: auto; }
.maparea { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; border: 3px solid var(--out); box-shadow: 0 4px 0 var(--out); }
.mapcv { position: absolute; left: 0; top: 0; display: block; }
.mapnodes { position: absolute; inset: 0; pointer-events: none; }
.btn.mapnode { position: absolute; border-radius: 50%; pointer-events: auto; }
.btn.mapnode:focus-visible, .btn.lgslot:focus-visible { outline: 3px solid var(--gold); }
.btn.lgslot { position: absolute; pointer-events: auto; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; color: var(--out); font-size: 13px; }
.btn.lgslot .shellic { width: 18px; height: 18px; }
.btn.lgslot b { background: rgba(255,246,230,.92); border: 2px solid var(--out); border-radius: 9px; padding: 0 5px; line-height: 16px; }
.btn.lgslot.can { animation: bob 1.6s ease-in-out infinite; }
.btn.lgslot.can b { background: var(--gold); }
.lgbanner { position: absolute; left: 50%; top: 18%; transform: translate(-50%, -10px) scale(.9); opacity: 0; transition: .35s; pointer-events: none; background: var(--gold); border: 3px solid var(--out); border-radius: 18px; box-shadow: 0 4px 0 var(--out); padding: 8px 16px; font: 800 20px/1.1 var(--ui); white-space: nowrap; }
.lgbanner.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
.lgfoot { display: flex; flex-direction: column; line-height: 1.15; color: #fff; text-shadow: 0 1.5px 0 var(--out); font-size: 13px; min-width: 0; }
.lgfoot b { font-size: 16px; }
.card.decor { text-align: center; }
.decorpv { width: 220px; height: 150px; border-radius: 14px; border: 2.5px solid var(--out); display: block; margin: 0 auto 8px; }
.btn.off { opacity: .5; filter: grayscale(.6); }
.card.chapter .chart { width: 100%; height: auto; aspect-ratio: 300 / 96; border-radius: 14px; border: 2.5px solid var(--out); display: block; margin-bottom: 8px; }
.card.chapter .chhead { align-items: center; }
.card.chapter .chhead small { font-size: 12px; opacity: .7; }
.pzgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.pzgrid .btn.pz { min-height: 54px; padding: 3px 0; }
.pzstars { display: flex; gap: 0; margin-top: 3px; }
.pzstars .staric { width: 13px; height: 13px; }
.btn.pz.ok .pzstars .staric { fill: rgba(255,255,255,.55); }
.btn.pz.ok .pzstars .staric.on { fill: var(--gold); }
.winstars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 2px; }
.winstars .ws svg { width: 46px; height: 46px; fill: #f1e9f8; }
.winstars .ws.on svg { fill: var(--gold); animation: starpop .5s cubic-bezier(.2,1.6,.4,1) both; animation-delay: var(--d); }
.winstars .ws:nth-child(2) svg { width: 56px; height: 56px; margin-top: -8px; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
.card .mark { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px; margin-top: 6px; font-size: 13px; color: #5a4a78; }
.card .mark .staric { width: 14px; height: 14px; }
.shellgain { display: inline-flex; align-items: center; gap: 4px; }
.note.hot { color: #b4421f; font-weight: 800; }
.row.small { margin-top: 8px; }
.btn.ghost.small { min-height: 44px; font-size: 15px; padding: 0 14px; }
.card.chdonecard { text-align: center; }
.card.chdonecard canvas { width: 100%; height: auto; border-radius: 14px; border: 2.5px solid var(--out); margin: 6px 0; }
.tag { display: inline-block; font-style: normal; background: var(--gold); border: 2.5px solid var(--out); border-radius: 12px; padding: 2px 12px; font-weight: 800; }
.card.reveal canvas.demo, .card.howto canvas.demo { display: block; margin: 8px auto 0; border-radius: 14px; border: 2.5px solid var(--out); }
.card.howto ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.card.howto li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.card.howto li b { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #ff8fc0; border: 2px solid var(--out); display: grid; place-items: center; font-size: 13px; }
/* a card over a full screen (chapter card on the map, purchase card in the lagoon) */
.scrmodal { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(28,16,60,.45); animation: fadein .2s; }
.scrmodal .card { animation: drop .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes fadein { from { opacity: 0; } }
/* the coach: dim + spotlight canvas and Inky's words, between the HUD and the cards */
.coach { position: absolute; inset: 0; z-index: 6; pointer-events: none; display: none; }
.coach.on { display: block; }
.coachcv { position: absolute; left: 0; top: 0; pointer-events: none; }
.coachbub { position: absolute; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none; }
.coachbub.on { opacity: 1; transform: none; }
.coachbub.top { top: calc(var(--sat) + 58px); }
.coachbub.bottom { bottom: calc(var(--sab) + 70px); }
.coachbub img { width: 54px; height: 62px; flex: none; filter: drop-shadow(0 3px 0 rgba(43,29,78,.35)); }
.coachbub > div { background: var(--cream); border: 3px solid var(--out); border-radius: 18px; box-shadow: 0 4px 0 var(--out); padding: 8px 14px; max-width: 330px; }
.coachbub p { margin: 0; font-size: 17px; line-height: 1.25; }
.coachbub small { display: block; font-size: 12px; opacity: .65; margin-top: 2px; }
.coachbub small:empty { display: none; }
body.wide .coachbub.top { top: 6px; left: 96px; right: 96px; }
body.wide .coachbub p { font-size: 14px; }
body.wide .mapscreen { flex-direction: column; padding: 4px 8px; }
body.wide .mapbar.top h2 { font-size: 17px; }
.inkybtn img { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) { .inkybtn img { animation: none; } }
</style>

ope and let your line rest on both stepping stones.",tip_wall:"Lay a chute from the ledge over the top of the wall.",tip_long:"One long ramp can rest on the middle stone and reach the far jar.",tip_catch:"Catch the falling stream with a scoop that rests on the stones.",say_8_1:"The buoy floats! Water under it lifts it up.",say_8_5:"Grandpa Grouper and Pip are waiting. The whole cove is watching!",tip_8_1:"Lead the stream into the rock basin \u2014 the water will float the buoy out of the drain.",tip_8_2:"Topple the bottle gently with a tall shape beside it, and put a wall or roof against the pearl.",tip_8_3:"Sling a hammock across the gap under the jar, and hook the beach ball before it rolls off.",tip_8_4:"Drop a heavy loop on the plank\u2019s outer end, then bridge the gap to the second jar.",tip_8_5:"A tall line beside the bottle tips it softly. A heavy loop on the plank\u2019s end opens Grandpa\u2019s jar."},ru:{say_1_1:"\u041D\u0430\u0440\u0438\u0441\u0443\u0439 \u043B\u0438\u043D\u0438\u044E \u2014 \u043F\u0443\u0441\u0442\u044C \u0432\u043E\u0434\u0430 \u0434\u043E\u0442\u0435\u0447\u0451\u0442 \u0434\u043E \u0411\u0443\u043B\u044F!",say_1_2:"\u041B\u0438\u043D\u0438\u044F \u0442\u0432\u0451\u0440\u0434\u0430\u044F: \u043E\u043D\u0430 \u043F\u0430\u0434\u0430\u0435\u0442, \u043F\u043E\u043A\u0430 \u043D\u0435 \u0443\u043F\u0440\u0451\u0442\u0441\u044F \u0432\u043E \u0447\u0442\u043E-\u043D\u0438\u0431\u0443\u0434\u044C.",tip_bridge:"\u0421\u0434\u0435\u043B\u0430\u0439 \u043C\u043E\u0441\u0442\u0438\u043A \u043D\u0430\u0434 \u0449\u0435\u043B\u044C\u044E \u2014 \u043E\u0442 \u0443\u0441\u0442\u0443\u043F\u0430 \u0434\u043E \u0443\u0441\u0442\u0443\u043F\u0430.",tip_rest:"\u041F\u043E\u0439\u043C\u0430\u0439 \u0432\u043E\u0434\u0443 \u043F\u043E\u0434 \u043A\u0440\u0430\u0435\u043C \u0441\u043A\u043B\u043E\u043D\u0430 \u0438 \u043F\u043E\u043B\u043E\u0436\u0438 \u043B\u0438\u043D\u0438\u044E \u043D\u0430 \u043E\u0431\u0430 \u043A\u0430\u043C\u043D\u044F-\u0441\u0442\u0443\u043F\u0435\u043D\u044C\u043A\u0438.",tip_wall:"\u041F\u0440\u043E\u043B\u043E\u0436\u0438 \u0436\u0451\u043B\u043E\u0431 \u043E\u0442 \u0443\u0441\u0442\u0443\u043F\u0430 \u043F\u043E\u0432\u0435\u0440\u0445 \u0441\u0442\u0435\u043D\u044B.",tip_long:"\u0414\u043B\u0438\u043D\u043D\u044B\u0439 \u0441\u043A\u0430\u0442 \u043C\u043E\u0436\u0435\u0442 \u043E\u043F\u0435\u0440\u0435\u0442\u044C\u0441\u044F \u043D\u0430 \u0441\u0440\u0435\u0434\u043D\u0438\u0439 \u043A\u0430\u043C\u0435\u043D\u044C \u0438 \u0434\u043E\u0442\u044F\u043D\u0443\u0442\u044C\u0441\u044F \u0434\u043E \u0434\u0430\u043B\u044C\u043D\u0435\u0439 \u0431\u0430\u043D\u043A\u0438.",tip_catch:"\u041F\u043E\u0434\u0441\u0442\u0430\u0432\u044C \u0447\u0435\u0440\u043F\u0430\u043A \u043F\u043E\u0434 \u043F\u0430\u0434\u0430\u044E\u0449\u0443\u044E \u0441\u0442\u0440\u0443\u044E \u2014 \u043F\u0443\u0441\u0442\u044C \u043E\u043D \u043B\u0435\u0436\u0438\u0442 \u043D\u0430 \u043A\u0430\u043C\u043D\u044F\u0445.",say_8_1:"\u0411\u0443\u0439 \u043F\u043B\u0430\u0432\u0430\u0435\u0442! \u0412\u043E\u0434\u0430 \u043F\u043E\u0434 \u043D\u0438\u043C \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442 \u0435\u0433\u043E \u0432\u0432\u0435\u0440\u0445.",say_8_5:"\u0414\u0435\u0434\u0443\u0448\u043A\u0430 \u0413\u0440\u0443\u043F\u0435\u0440 \u0438 \u041F\u0438\u043F \u0436\u0434\u0443\u0442. \u041D\u0430 \u0442\u0435\u0431\u044F \u0441\u043C\u043E\u0442\u0440\u0438\u0442 \u0432\u0441\u044F \u0431\u0443\u0445\u0442\u0430!",tip_8_1:"\u041D\u0430\u043F\u0440\u0430\u0432\u044C \u0441\u0442\u0440\u0443\u044E \u0432 \u043A\u0430\u043C\u0435\u043D\u043D\u0443\u044E \u0447\u0430\u0448\u0443 \u2014 \u0432\u043E\u0434\u0430 \u043F\u043E\u0434\u043D\u0438\u043C\u0435\u0442 \u0431\u0443\u0439 \u0438 \u043E\u0442\u043A\u0440\u043E\u0435\u0442 \u0441\u043B\u0438\u0432.",tip_8_2:"\u041C\u044F\u0433\u043A\u043E \u043E\u043F\u0440\u043E\u043A\u0438\u043D\u044C \u0431\u0443\u0442\u044B\u043B\u043A\u0443 \u0432\u044B\u0441\u043E\u043A\u043E\u0439 \u0444\u0438\u0433\u0443\u0440\u043E\u0439 \u0440\u044F\u0434\u043E\u043C, \u0430 \u043E\u0442 \u0436\u0435\u043C\u0447\u0443\u0436\u0438\u043D\u044B \u043F\u043E\u0441\u0442\u0430\u0432\u044C \u0441\u0442\u0435\u043D\u043A\u0443 \u0438\u043B\u0438 \u043A\u0440\u044B\u0448\u0443.",tip_8_3:"\u041D\u0430\u0442\u044F\u043D\u0438 \u0433\u0430\u043C\u0430\u043A \u043D\u0430\u0434 \u043F\u0440\u043E\u043F\u0430\u0441\u0442\u044C\u044E \u043F\u043E\u0434 \u0431\u0430\u043D\u043A\u043E\u0439 \u0438 \u0437\u0430\u0446\u0435\u043F\u0438 \u043C\u044F\u0447, \u043F\u043E\u043A\u0430 \u043E\u043D \u043D\u0435 \u0441\u043A\u0430\u0442\u0438\u043B\u0441\u044F.",tip_8_4:"\u0423\u0440\u043E\u043D\u0438 \u0442\u044F\u0436\u0451\u043B\u0443\u044E \u043F\u0435\u0442\u043B\u044E \u043D\u0430 \u0434\u0430\u043B\u044C\u043D\u0438\u0439 \u043A\u0440\u0430\u0439 \u0434\u043E\u0441\u043A\u0438, \u043F\u043E\u0442\u043E\u043C \u043F\u0435\u0440\u0435\u043A\u0438\u043D\u044C \u043C\u043E\u0441\u0442\u0438\u043A \u043A\u043E \u0432\u0442\u043E\u0440\u043E\u0439 \u0431\u0430\u043D\u043A\u0435.",tip_8_5:"\u0412\u044B\u0441\u043E\u043A\u0430\u044F \u043B\u0438\u043D\u0438\u044F \u0440\u044F\u0434\u043E\u043C \u0441 \u0431\u0443\u0442\u044B\u043B\u043A\u043E\u0439 \u043C\u044F\u0433\u043A\u043E \u0435\u0451 \u043E\u043F\u0440\u043E\u043A\u0438\u043D\u0435\u0442. \u0422\u044F\u0436\u0451\u043B\u0430\u044F \u043F\u0435\u0442\u043B\u044F \u043D\u0430 \u043A\u0440\u0430\u0439 \u0434\u043E\u0441\u043A\u0438 \u043E\u0442\u043A\u0440\u043E\u0435\u0442 \u0431\u0430\u043D\u043A\u0443 \u0434\u0435\u0434\u0443\u0448\u043A\u0438."}};var Ql={en:{say_2_1:"Careful: this jar isn't fixed. It drops as soon as the water starts!",tip_2_1:"Lay a shelf across the crack, resting on both rocks, right under the jar.",tip_2_2:"Hang a hook over the bamboo spout and cradle the jar under it.",tip_2_3:"Brace the jar: lay a stick on the ice between it and the little lip.",tip_2_4:"One stroke is a shelf across the crack, the other a chute from the ledge over the knob.",tip_2_5:"Hook the jar over the end of the bamboo pole, then lay a chute from the ledge over the knob into it.",say_3_1:"A coconut! If it lands in the jar, the fish has no room left.",say_3_2:"A beach ball is light and bouncy, but it still blocks a jar.",say_3_3:"A log rolls downhill and won't stop by itself.",tip_3_1:"Put a stopper on the shelf so the coconut never reaches the edge.",tip_3_2:"Lay a slanted roof above the jar, from the knob down to the pillar: the ball bounces off, the water slips in below.",tip_3_3:"Build a sturdy stop on the flat before the pit. A thin stick is not enough.",tip_3_4:"Cover only the coconut's half of the mouth and leave the stream's half open.",tip_3_5:"One stroke stops the log on the flat, the other shelves the coconut over half of the mouth.",say_4_1:"Two jars now: it only counts when every fish has its share!",tip_4_1:"The rock already splits the stream: carry the wasted half to Pop with a chute over the knobs.",tip_4_2:"Lay a flat bridge on both rims under the stream so it splits both ways.",tip_4_3:"Let Pip's jar overflow and catch the spill with a chute from the shelf edge down to Pop.",tip_4_4:"Keep the streams apart: one chute down each side of the peak, each to its own jar.",tip_4_5:"Shelve Pip's jar on the two knobs, then hang a slide from the shelf end down to Pop.",say_5_1:"The clam spits pearls \u2014 protect the jar!",tip_5_1:"Stand a tent or a wall in the dotted path of the pearl, between the clam and the jar.",tip_5_2:"Nothing can stand over the gap \u2014 block the pearl right in front of the clam's mouth.",tip_5_3:"Don't put a lid on the jar: lay a roof from the post to the bamboo pipe, above the stream.",tip_5_4:"The pearl aims at the log, not the jar. Stop the pearl before it reaches the log, or catch the log on the slope.",tip_5_5:"Two threats from two sides: one stroke corks the clam, the other stops the rolling log.",say_6_1:"A message bottle! Tip it over so it pours into the jar.",tip_6_1:"Stand a tall stick a little to the left of the bottle, leaning toward it, so it topples onto it. Not too close, or the bottle flies off.",tip_6_2:"No room for a stick beside it \u2014 drop a heavy ball on the bottle's shoulder.",tip_6_3:"Press down the arm of the lever that points at the jar.",tip_6_4:"Tip the bottle, then lay a chute from the little step on the cliff to the stone post.",tip_6_5:"Weigh down the lever arm on the jar's side, and bridge the gap in the rock chute.",say_7_1:"This plank is just balanced. Once the jar gets heavy, it will tip!",tip_7_1:"Prop up the jar's end of the plank from below so it can't tip down.",tip_7_2:"Drop a weight on one end of the plank, not in the middle, so it tips off the jar.",tip_7_3:"Lay a weight on the short arm of the beam so it tips toward the jar.",tip_7_4:"Knock one of the thin stakes over and the plank will slide off.",tip_7_5:"Drop the weight on the end that sticks out past the stake: it levers the plank off.",tip_1_6:"Catch the stream below the rock roof and slide it under the roof into the cave.",tip_1_7:"Neither pipe has enough water on its own: run one long chute under both streams.",tip_1_8:"Make a ramp from the step and let it stick out past the ledge: fast water flies across the gap.",tip_1_9:"One bent line: across the pillar, down the gap, then under the cave roof.",tip_1_10:"One long chute under both streams, resting on the pillar and the stone and sticking out past the stone, so the water jumps to Bub.",r_trio:"Three jars! A puzzle counts only when all three fish have their water at the same time.",say_10_1:"Three jars now! Two full ones aren't enough - every fish needs its share.",tip_10_1:"The top jar spills over both rims: carry the right-hand spill on to Pop with a chute on the coral bumps.",tip_10_2:"Split the stream to the two high jars with a roof on the bumps - their overflow will fill the middle one.",tip_10_3:"Lead the stream into the funnel: the buoy floats up and lets the water down into the top jar.",tip_10_4:"Cork the clam with a little tent in front of its mouth, against the coral lip - keep the stream and the spills free.",tip_10_5:"Lay a bridge across the inner rims of the two jars: the falling jar lands on top and shares its overflow.",tip_10_6:"On ice a stopper slides too: lay a stick between the jar and the coral bump so the jar stops under the spill.",tip_10_7:"One shelf, two jobs: hold the jar on the posts, reach over Betta's mouth and bend the other end down into Jelly's jar.",tip_10_8:"Stop the coconut on its shelf, and drop a weight on the plank's free end to tip the lid off.",tip_10_9:"Lay a heavy stroke flat on the short arm of the see-saw so the stream runs into the funnel, and cork the clam.",say_10_10:"Grand finale! One bottle for three fish - and Grandpa Grouper is waiting too.",tip_10_10:"Topple the bottle from the left, and shelve the hanging jar across the posts right under its pour.",tip_2_6:"The jar hangs lower than the cliffs: draw a sagging basket with its ends resting on both cliff tops.",tip_2_7:"Tuck one end of a board under the rock lip; then the other end can hold the jar out over the edge.",tip_2_8:"A board alone tips over. Ink is heavy: pile a scribble on the board's back end as a counterweight.",tip_2_9:"One line can do both jobs: a chute from under the stream that dips into a basket under the jar.",tip_2_10:"First a basket that dips under the jar, its back end on the cliff under the rock lip; then a chute from the ledge over the pillar.",say_3_6:"A pebble! Small and heavy, and running water rolls it straight into the jar.",tip_3_6:"Keep the water off the pebble: lay a chute from the step over it and past the end of the ledge.",tip_3_7:"Here the water comes in from the side, so one lid over the pit keeps out both the log and the ball.",tip_3_8:"Cover most of the hole with a board on the far shelf, but leave a slit narrower than the coconut for the water.",tip_3_9:"A basket from cliff to cliff holds the jar; a slanted roof on the hanging stone sends the coconut back onto the cliff.",tip_3_10:"Lead the water over the pebble with a chute and build a sturdy stop for the log on the flat. No lid: this water falls from above.",say_4_6:"This rock tray shares: water poured in spills over both lips.",tip_4_6:"Don't feed Pop alone: lead the stream into the tray and it spills into both jars.",tip_4_7:"Fill Pop's high jar first \u2014 its overflow will fall back into Pip's.",say_4_8:"This funnel leaks \u2014 every drop runs out of the hole at the bottom.",tip_4_8:"The coconut fits the funnel's hole: slide it in there instead of into Pop's jar.",tip_4_9:"Plug the funnel's hole with a ball of ink, then lead the stream into the funnel.",tip_4_10:"Fill high Pop first so his overflow drops into the funnel, then plug the funnel so it spills over to Pip.",tip_5_6:"Don't let the jar drop into the line of fire \u2014 catch it high, on a shelf over the two knobs.",tip_5_7:"The pearl will roll down your chute \u2014 give the chute a dip to trap it, and the water flows on.",tip_5_8:"The clam fires late: lay a lid over the rock pool so the water reaches the jar in time.",tip_5_9:"You can't stop this pearl \u2014 prop the jar from behind so it can't fall.",tip_5_10:"Two clams: give the chute a dip for the falling pearl, and prop the jar against the other shot.",say_6_6:"A running stream can push a bottle over!",tip_6_6:"The little spout can't fill the jar, but its stream can knock the bottle over.",tip_6_7:"Weigh down the lever arm that ends over the tray \u2014 the tray shares the pour between both jars.",tip_6_8:"The clam will smash the bottle into the jar \u2014 tip it over first, gently, toward the jar.",tip_6_9:"One ball can do both jobs: tip the lever, then roll into the funnel's hole and plug it.",tip_6_10:"Wash the bottle over with the little spout, and plug the funnel under its neck.",tip_7_6:"Weigh down the end of the high lid that sticks out: it will fall on the low lid and knock that one off too.",tip_7_7:"The lid rests on a lever. Drop a weight on the lever's raised end and it will pry the lid up.",tip_7_8:"Pry the lid off with the lever, then knock the bottle over so it pours into the jar.",tip_7_9:"Tip the high lid off so it lands on the lever: one weight opens both jars.",tip_7_10:"Two strokes, three jobs: knock the bottle over, and let the falling lid press the lever for you.",tip_8_6:"Plug the leak so the basin fills up: the buoy will float and open the drain.",tip_8_7:"Knock the bottle over toward the basin, not away from it.",tip_8_8:"Tip Pip's lid off: it falls right across the leak and plugs it.",tip_8_9:"The bottle is the only water: knock it over into the basin and plug the leak.",tip_8_10:"Two strokes, three jobs: tip the bottle, tip Pip's lid, and let that lid be the plug.",r_ice:"Ice \u2014 slippery! Jars, bottles and even your ink slide down icy slopes. Rock holds them still.",say_9_1:"Ice! Jars and ink slide on it \u2014 only rock holds still.",tip_9_1:"Lay a long pole on the ice from the rock wall up to the jar \u2014 it will hold the jar where it stands.",tip_9_2:"Ink slides off ice: rest your chute on the rock knob, not on the icy ledge.",tip_9_3:"On gentle ice a little push is enough \u2014 let a line slide down the steep ice and bump the jar.",tip_9_4:"Two jobs: brace the jar against the rock post, and lay a chute from the ledge over the rock knob.",tip_9_5:"Nothing to lean on? Dip the end of your line into the crack in the ice, then run it up to the jar.",tip_9_6:"Push the back jar \u2014 it shoves the front one, and both glide down to the streams.",tip_9_7:"On ice a push doesn't tip the bottle over \u2014 it slides. Send it gliding down to the rock curb.",tip_9_8:"Nothing standing on the ice can stop the pearl \u2014 cork the clam right on its rock ledge.",tip_9_9:"Two strokes: brace the jar against the rock wall, and stop the coconut on its shelf.",tip_9_10:"Push the bottle so it slides down to the curb, and cork the clam on its rock ledge."},ru:{say_2_1:"\u041E\u0441\u0442\u043E\u0440\u043E\u0436\u043D\u043E: \u0431\u0430\u043D\u043A\u0430 \u043D\u0435 \u0437\u0430\u043A\u0440\u0435\u043F\u043B\u0435\u043D\u0430. \u041E\u043D\u0430 \u0443\u043F\u0430\u0434\u0451\u0442, \u043A\u0430\u043A \u0442\u043E\u043B\u044C\u043A\u043E \u043F\u043E\u0439\u0434\u0451\u0442 \u0432\u043E\u0434\u0430!",tip_2_1:"\u041F\u043E\u043B\u043E\u0436\u0438 \u043F\u043E\u043B\u043A\u0443 \u043F\u043E\u043F\u0435\u0440\u0451\u043A \u0449\u0435\u043B\u0438 \u043D\u0430 \u043E\u0431\u0430 \u043A\u0430\u043C\u043D\u044F, \u043F\u0440\u044F\u043C\u043E \u043F\u043E\u0434 \u0431\u0430\u043D\u043A\u0443.",tip_2_2:"\u041F\u043E\u0432\u0435\u0441\u044C \u043A\u0440\u044E\u043A \u043D\u0430 \u0431\u0430\u043C\u0431\u0443\u043A\u043E\u0432\u044B\u0439 \u043D\u043E\u0441\u0438\u043A \u0438 \u043F\u043E\u0434\u0445\u0432\u0430\u0442\u0438 \u0431\u0430\u043D\u043A\u0443 \u0441\u043D\u0438\u0437\u0443.",tip_2_3:"\u041F\u043E\u0434\u043E\u043F\u0440\u0438 \u0431\u0430\u043D\u043A\u0443: \u043F\u043E\u043B\u043E\u0436\u0438 \u043F\u0430\u043B\u043A\u0443 \u043D\u0430 \u043B\u0451\u0434 \u043C\u0435\u0436\u0434\u0443 \u043D\u0435\u0439 \u0438 \u0431\u043E\u0440\u0442\u0438\u043A\u043E\u043C.",tip_2_4:"\u041E\u0434\u043D\u0430 \u043B\u0438\u043D\u0438\u044F \u2014 \u043F\u043E\u043B\u043A\u0430 \u043D\u0430\u0434 \u0449\u0435\u043B\u044C\u044E, \u0434\u0440\u0443\u0433\u0430\u044F \u2014 \u0436\u0451\u043B\u043E\u0431 \u0441 \u0443\u0441\u0442\u0443\u043F\u0430 \u0447\u0435\u0440\u0435\u0437 \u043A\u0430\u043C\u0435\u0448\u0435\u043A.",tip_2_5:"\u041F\u043E\u0434\u0432\u0435\u0441\u044C \u0431\u0430\u043D\u043A\u0443 \u043A\u0440\u044E\u043A\u043E\u043C \u043D\u0430 \u043A\u043E\u043D\u0435\u0446 \u0431\u0430\u043C\u0431\u0443\u043A\u043E\u0432\u043E\u0439 \u0436\u0435\u0440\u0434\u0438, \u0430 \u043F\u043E\u0442\u043E\u043C \u043F\u0440\u043E\u043B\u043E\u0436\u0438 \u043A \u043D\u0435\u0439 \u0436\u0451\u043B\u043E\u0431 \u0441 \u0443\u0441\u0442\u0443\u043F\u0430 \u0447\u0435\u0440\u0435\u0437 \u043A\u0430\u043C\u0435\u0448\u0435\u043A.",say_3_1:"\u041A\u043E\u043A\u043E\u0441! \u0415\u0441\u043B\u0438 \u043E\u043D \u0443\u043F\u0430\u0434\u0451\u0442 \u0432 \u0431\u0430\u043D\u043A\u0443, \u0440\u044B\u0431\u043A\u0435 \u043D\u0435 \u043E\u0441\u0442\u0430\u043D\u0435\u0442\u0441\u044F \u043C\u0435\u0441\u0442\u0430.",say_3_2:"\u041F\u043B\u044F\u0436\u043D\u044B\u0439 \u043C\u044F\u0447 \u043B\u0451\u0433\u043A\u0438\u0439 \u0438 \u043F\u0440\u044B\u0433\u0443\u0447\u0438\u0439, \u043D\u043E \u0431\u0430\u043D\u043A\u0443 \u0442\u043E\u0436\u0435 \u0437\u0430\u043A\u0440\u043E\u0435\u0442.",say_3_3:"\u0411\u0440\u0435\u0432\u043D\u043E \u043A\u0430\u0442\u0438\u0442\u0441\u044F \u043F\u043E\u0434 \u0433\u043E\u0440\u043A\u0443 \u0438 \u0441\u0430\u043C\u043E \u043D\u0435 \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F.",tip_3_1:"\u041F\u043E\u0441\u0442\u0430\u0432\u044C \u0443\u043F\u043E\u0440 \u043D\u0430 \u043F\u043E\u043B\u043A\u0443, \u0447\u0442\u043E\u0431\u044B \u043A\u043E\u043A\u043E\u0441 \u043D\u0435 \u0434\u043E\u043A\u0430\u0442\u0438\u043B\u0441\u044F \u0434\u043E \u043A\u0440\u0430\u044F.",tip_3_2:"\u041F\u043E\u043B\u043E\u0436\u0438 \u043D\u0430\u043A\u043B\u043E\u043D\u043D\u0443\u044E \u043A\u0440\u044B\u0448\u0443 \u043D\u0430\u0434 \u0431\u0430\u043D\u043A\u043E\u0439, \u043E\u0442 \u043A\u0430\u043C\u0435\u0448\u043A\u0430 \u043A \u0441\u0442\u043E\u043B\u0431\u0438\u043A\u0443: \u043C\u044F\u0447 \u043E\u0442\u0441\u043A\u043E\u0447\u0438\u0442, \u0430 \u0432\u043E\u0434\u0430 \u0437\u0430\u0442\u0435\u0447\u0451\u0442 \u0441\u043D\u0438\u0437\u0443.",tip_3_3:"\u041F\u043E\u0441\u0442\u0430\u0432\u044C \u043A\u0440\u0435\u043F\u043A\u0438\u0439 \u0443\u043F\u043E\u0440 \u043D\u0430 \u0440\u043E\u0432\u043D\u043E\u043C \u043C\u0435\u0441\u0442\u0435 \u043F\u0435\u0440\u0435\u0434 \u044F\u043C\u043E
