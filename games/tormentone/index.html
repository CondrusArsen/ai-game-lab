<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1820">
<title>TORMENTONE</title>
<script type="module">
  if (window.parent !== window) window.__bp = import('/sdk/hostsdk.js').then(m => m.hostsdk).catch(() => null);
</script>

<style>
@font-face{font-family:'Shrikhand';src:url('fonts/shrikhand-latin-400-normal.woff2') format('woff2');font-display:block}
@font-face{font-family:'Righteous';src:url('fonts/righteous-latin-400-normal.woff2') format('woff2');font-display:block}
@font-face{font-family:'Yeseva One';src:url('fonts/yeseva-one-cyrillic-400-normal.woff2') format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;font-display:block}
@font-face{font-family:'Yeseva One';src:url('fonts/yeseva-one-latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:block}
@font-face{font-family:'PT Mono';src:url('fonts/pt-mono-cyrillic-400-normal.woff2') format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'PT Mono';src:url('fonts/pt-mono-latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--ink:#2b2220;--paper:#fbf6ea;--red:#d9342b;--pink:#ff5a8a;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#1d1820;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;font-family:'Yeseva One',serif;color:var(--ink)}
/* the jukebox title card */
.card{position:absolute;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%) rotate(-0.8deg);width:min(86vw,420px);display:flex;align-items:stretch;background:var(--paper);border:2px solid var(--red);outline:3px solid var(--paper);box-shadow:0 5px 0 rgba(43,34,32,.55);font-size:15px}
.card .slot{background:var(--red);color:var(--paper);font:400 13px/1 'Righteous',sans-serif;padding:0 7px;display:flex;align-items:center;letter-spacing:.05em}
.card .title{flex:1;min-width:0;padding:6px 8px 5px;border-left:2px solid var(--red);border-right:2px solid var(--red);white-space:nowrap;overflow:hidden;font:400 19px/1.1 'Shrikhand',serif;color:var(--ink);text-align:center}
.card .title.grow #song{display:inline-block;animation:grow .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes grow{0%{transform:scale(1.35);color:var(--pink)}100%{transform:scale(1)}}
.card .chart{display:flex;align-items:center;gap:2px;padding:0 7px;font:400 14px/1 'Righteous',sans-serif;color:var(--red)}
.card .chart b{font-weight:400}.card .chart b.jump{animation:jump .45s ease-out}.card .chart i{font-style:normal;font-size:10px}
@keyframes jump{0%{transform:translateY(-6px) scale(1.3)}100%{transform:none}}
.btns{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(62px + var(--sat));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.btns button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:400 16px/1 'Righteous',sans-serif;box-shadow:0 3px 0 rgba(43,34,32,.55);cursor:pointer;padding:0}
.btns button.off{background:#d8cfc0;text-decoration:line-through}
.btns button:focus-visible{outline:3px solid var(--pink)}
/* the manicule demonstrates the pull */
.hand{position:absolute;left:-12px;top:-26px;opacity:0;transform:translate(var(--x0),var(--y0)) rotate(200deg);filter:drop-shadow(3px 3px 0 rgba(43,34,32,.6))}
.hand.on{animation:pull 1.75s ease-in-out infinite}
@keyframes pull{0%{opacity:0;transform:translate(var(--x0),var(--y0)) rotate(200deg) scale(1.2)}15%{opacity:1;transform:translate(var(--x0),var(--y0)) rotate(200deg) scale(1)}70%{opacity:1;transform:translate(var(--x1),var(--y1)) rotate(200deg)}85%,100%{opacity:0;transform:translate(var(--x1),var(--y1)) rotate(200deg) scale(.8)}}
/* stamped words */
.words{position:absolute;inset:0}
.word{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));font:400 44px/1 'Shrikhand',serif;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);white-space:nowrap;animation:stamp var(--life) cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.3)}18%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.12)}30%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) rotate(var(--r)) scale(1)}}
@media (prefers-reduced-motion: reduce){.word{animation:fade var(--life) linear forwards}@keyframes fade{0%,80%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}100%{opacity:0}}.hand.on{animation-duration:3s}}
.chorus{position:absolute;bottom:calc(18px + var(--sab));left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:center;background:var(--paper);border:2px solid var(--ink);padding:3px 8px;font:400 12px/1 'PT Mono',monospace;box-shadow:0 3px 0 rgba(43,34,32,.55)}.chorus[hidden]{display:none}
.chorus i{font-style:normal;font-size:16px;color:#c9bfae}.chorus i.on{color:var(--pink);animation:jump .4s ease-out}.chorus span:last-child{color:#2a62c4}
.quota{position:absolute;bottom:calc(18px + var(--sab));left:50%;transform:translateX(-50%) rotate(-.5deg);display:flex;gap:2px;align-items:center;background:var(--paper);border:2px solid var(--ink);padding:4px 10px;font:400 13px/1 'PT Mono',monospace;box-shadow:0 3px 0 rgba(43,34,32,.55);white-space:nowrap}.quota[hidden]{display:none}
.quota span{margin-right:6px}.quota i{font-style:normal;font-size:18px;color:#c9bfae}.quota i.on{color:var(--pink)}.quota b{color:var(--pink);margin-left:4px}.quota em{font-style:normal;color:#3a6cf0;margin-left:8px;font-size:16px}
.quota.pulse{animation:jump .4s ease-out}
.hum{position:absolute;left:0;top:0;display:flex;gap:1px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:1px 4px;pointer-events:none;box-shadow:0 2px 0 rgba(43,34,32,.5)}
.hum[hidden]{display:none}.hum i{width:6px;height:9px;border-radius:3px;background:#d8cfc0}.hum i.on{background:var(--pink)}.hum.disco i.on{background:#3a6cf0}
/* captions */
.cap{position:absolute;left:50%;top:calc(66px + var(--sat));transform:translateX(-50%) rotate(.6deg);max-width:min(88vw,440px);background:var(--paper);border:2px solid var(--ink);box-shadow:0 4px 0 rgba(43,34,32,.6);padding:8px 12px 7px;font-size:16px;line-height:1.25;text-align:center}
.cap.in{animation:capin .35s cubic-bezier(.2,1.5,.4,1)}@keyframes capin{0%{transform:translateX(-50%) translateY(-20px) rotate(.6deg);opacity:0}100%{opacity:1}}
/* pause sheet + end card */
.sheet{position:absolute;inset:0;background:rgba(29,24,32,.55);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.sheet[hidden],#end[hidden],.cap[hidden]{display:none}
.paper{background:var(--paper);border:2px solid var(--ink);box-shadow:0 6px 0 rgba(43,34,32,.6);padding:18px 22px;text-align:center;transform:rotate(-1deg);max-width:80vw}
.paper h2{font:400 34px/1 'Shrikhand',serif;margin:0 0 8px;color:var(--red)}
.paper p{margin:0 0 14px;font-size:16px}
.paper button,#end button{font:400 18px/1 'Righteous',sans-serif;background:var(--red);color:var(--paper);border:2px solid var(--ink);padding:10px 18px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,24,32,.6);z-index:5}
#end .paper .name{font:400 26px/1.15 'Shrikhand',serif;color:var(--ink);word-break:break-word;margin:6px 0 10px}
#end .paper .stats{font:400 13px/1.4 'PT Mono',monospace;margin-bottom:14px}
#title{position:fixed;left:4%;top:7%;z-index:4;transform:rotate(-4deg)}#title[hidden]{display:none}
#title .t1{font:400 clamp(60px,9vw,150px)/0.95 'Shrikhand',serif;color:#ff5a8a;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink)}
#title .t2{display:inline-block;margin-top:10px;font:400 clamp(16px,2.2vw,34px)/1 'Righteous',sans-serif;background:var(--paper);color:var(--red);border:3px solid var(--ink);padding:6px 12px;box-shadow:4px 4px 0 var(--ink)}
/* boot */
#boot{position:fixed;inset:0;background:#f3e6cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;transition:opacity .5s .1s;color:var(--ink)}
#boot.ready{opacity:0;pointer-events:none}
#boot h1{font:400 clamp(40px,12vw,72px)/1 'Shrikhand',serif;margin:0;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg)}
#boot .sub{font:400 15px/1.3 'Yeseva One',serif;text-align:center;max-width:80vw}
#boot .track{width:min(70vw,320px);height:10px;border:2px solid var(--ink);background:var(--paper)}
#boot #bootbar{height:100%;background:var(--pink);transform-origin:0 50%;transform:scaleX(0);transition:transform .2s}
#boot #bootlab{font:400 12px/1 'PT Mono',monospace;opacity:.75}
#boot .err{font:400 13px/1.3 'PT Mono',monospace;color:var(--red);max-width:80vw;text-align:center}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="boot"><h1>Tormentone</h1><div class="sub">Риччоне, 14 августа 1977 года.<br>Хит лета ещё не выбран.</div><div class="track"><div id="bootbar"></div></div><div id="bootlab">…</div><div class="err"></div></div>
<div id="title" hidden><div class="t1">Tormentone</div><div class="t2">Riccione · Ferragosto 1977</div></div>
<div id="end" hidden><div class="paper"><h2>N.1</h2><div>Имя песни:</div><div class="name"></div><div class="stats"></div><button>Ещё раз</button></div></div>
<script type="module" src="./game.js"></script>
</body></html>
