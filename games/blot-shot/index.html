<style>/* Blot Shot — sketchbook UI: paper panels, ink borders, a printed offset shadow, hand-lettered fonts. No scrolling
   anywhere: every panel scales to fit (owner's rule). */
:root { --ink: #26223a; --paper: #f6eedb; --paper2: #fbf6ea; --red: #e8483b; --gold: #f5b82e; --green: #3fae5a; --blue: #3b82e0;
  --violet: #8b5cc8; --mint: #3fbf9a; --pad: 110px; --shadow: 3px 4px 0 rgba(38, 34, 58, 0.85); --grain: none; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #e9dcc0; overflow: hidden; overscroll-behavior: none; }
body { font-family: 'BS UI', 'Balsamiq Sans', 'Comic Sans MS', system-ui, sans-serif; font-weight: 700; color: var(--ink); }
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#world { position: absolute; inset: 0; display: block; }
.hidden { display: none !important; }
.ic { display: inline-flex; width: 1.25em; height: 1.25em; vertical-align: -0.28em; }
.ic svg { width: 100%; height: 100%; }
.ic.big { width: 34px; height: 34px; }
.ic.huge { width: 64px; height: 64px; flex: none; }
.paper { background: var(--paper) var(--grain); }

/* ---- HUD ------------------------------------------------------------------------------------------------------- */
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px 0;
  pointer-events: none; z-index: 5; }

.ibtn { width: 46px; height: 46px; border-radius: 50% 46% 50% 44%; border: 3px solid var(--ink); background: var(--paper2) var(--grain);
  box-shadow: var(--shadow); display: grid; place-items: center; padding: 7px; cursor: pointer; flex: none; color: var(--ink); }
.ibtn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 rgba(38, 34, 58, 0.85); }
.ibtn .ic, .ibtn svg { width: 100%; height: 100%; }
.ammo { display: flex; align-items: center; gap: 2px; padding: 3px 9px 3px 5px; border-radius: 14px 18px 12px 16px; background: rgba(251, 246, 234, 0.92);
  border: 3px solid var(--ink); box-shadow: var(--shadow); flex: none; }
.ammo .ic.drop { width: 26px; height: 26px; }

@keyframes bump { 40% { transform: scale(1.18); } }

.prog { flex: 1; display: flex; align-items: center; min-width: 0; position: relative; max-width: 620px; margin: 0 auto; }
.prog .bar { flex: 1; height: 24px; border: 3px solid var(--ink); border-radius: 13px 10px 13px 11px; background: rgba(251, 246, 234, 0.92);
  position: relative; overflow: hidden; box-shadow: var(--shadow); min-width: 40px; }
.prog .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--red); transition: width 0.2s; }
.prog .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 2px #fff; white-space: nowrap; }
.nexticon { width: 50px; height: 29px; margin-left: -6px; flex: none; filter: drop-shadow(1px 2px 0 rgba(38, 34, 58, 0.3)); }
.dist { display: flex; flex-direction: column; align-items: flex-end; flex: none; line-height: 1; padding: 3px 9px; border-radius: 14px 12px 16px 12px;
  background: rgba(251, 246, 234, 0.92); border: 3px solid var(--ink); box-shadow: var(--shadow); }
.dist b { font: 400 21px/1 'BS Display', 'BS UI', sans-serif; }
.dist small { font-size: 11px; opacity: 0.75; margin-top: 2px; }
.wallet { display: none; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; border-radius: 14px 12px 16px 12px; background: rgba(251, 246, 234, 0.95);
  border: 3px solid var(--ink); box-shadow: var(--shadow); flex: none; }

/* ---- fire pad (portrait) --------------------------------------------------------------------------------------------- */
#pad { position: absolute; left: 0; right: 0; bottom: 0; height: var(--pad); display: grid; place-items: center; z-index: 4;
  background: linear-gradient(#e2cfa7, #d8c296); border-top: 3px solid var(--ink); box-shadow: 0 -3px 0 rgba(255, 250, 236, 0.6) inset; }

.firebtn { width: min(78%, 360px); height: min(70%, 86px); border-radius: 46px 40px 44px 42px; border: 4px solid var(--ink); background: var(--red);

.logo small { display: inline-block; margin-top: 6px; font-size: 14px; background: rgba(251, 246, 234, 0.9); padding: 3px 10px; border-radius: 10px; border: 2px solid var(--ink); }
.landscape .logo { top: 62px; }

.card { font: inherit; color: var(--ink); cursor: pointer; }

.side { position: absolute; right: 10px; top: 36%; display: flex; flex-direction: column; gap: 12px; }
.framed .side { top: 38%; }
.landscape .side { top: auto; bottom: 14px; right: 14px; flex-direction: row; }
.sbtn { font: inherit; color: var(--ink); width: 76px; height: 76px; border: 3px solid var(--ink); border-radius: 18px 14px 20px 15px; background: var(--paper2) var(--grain);
  box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; position: relative; cursor: pointer; }
.sbtn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 rgba(38, 34, 58, 0.85); }
.dotnew { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); }

.portrait .tapfire { display: none; }

/* ---- coach, banner, toast, chip ----------------------------------------------------------------------------------- */
.coach { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); width: min(360px, 92%); z-index: 8; padding: 10px 12px; display: flex; gap: 10px; align-items: center;
  background: #fffbe9 var(--grain); border: 3px solid var(--ink); border-radius: 16px 14px 18px 12px; box-shadow: var(--shadow); animation: drop 0.3s ease-out; }

.chip { position: absolute; right: 10px; top: 66px; z-index: 6; font: inherit; font-size: 15px; color: var(--ink); background: var(--gold); border: 3px solid var(--ink);
  border-radius: 14px; padding: 8px 14px; box-shadow: var(--shadow); cursor: pointer; }

/* ---- modals ---------------------------------------------------------------------------------------------------------- */

.modal-card h2 { margin: 0; font: 400 26px/1.1 'BS Display', 'BS UI', sans-serif; display: flex; align-items: center; gap: 8px; padding-right: 48px; }
.modal-card h2 .count { font: 700 14px 'BS UI', sans-serif; margin-left: auto; opacity: 0.8; }
.closebtn { position: absolute; top: 10px; right: 10px; width: 42px; height: 42px; z-index: 2; }
.btn { font: inherit; font-size: 17px; color: var(--ink); background: var(--paper2); border: 3px solid var(--ink); border-radius: 16px 13px 17px 14px; padding: 10px 16px; min-height: 48px;
  box-shadow: var(--shadow); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 rgba(38, 34, 58, 0.85); }

.pausecard { align-items: stretch; width: min(340px, 100%); }

/* upgrade sheet */
.upcard { width: min(440px, 100%); }
.uphead { display: flex; gap: 12px; align-items: center; padding-right: 40px; }

.upcard.up-count .pips i.on { background: var(--gold); } .upcard.up-power .pips i.on { background: var(--red); } .upcard.up-first .pips i.on { background: var(--mint); } .upcard.up-boxes .pips i.on { background: var(--violet); }

.earn small { font-size: 12px; font-family: 'BS UI', sans-serif; }
.cause { margin: 2px 0 0; font-size: 14px; font-weight: 400; }
.cause2 { margin: 0; font-size: 13px; font-weight: 400; opacity: 0.85; }
.rprog { display: flex; align-items: center; gap: 6px; width: 100%; }
.rprog canvas { width: 66px; height: 35px; flex: none; }
.rbar { flex: 1; height: 22px; border: 3px solid var(--ink); border-radius: 12px; position: relative; overflow: hidden; background: var(--paper2); }
.rbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); }
.rbar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; }
.rnew { display: flex; align-items: center; gap: 8px; text-align: left; background: #e1f5d6; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 8px; width: 100%; }
.rnew canvas { width: 92px; height: 52px; flex: none; }
.rnew p { margin: 2px 0 4px; font-size: 12px; font-weight: 400; }
.complete { background: #fff1b8; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 10px; width: 100%; }
.complete p { margin: 2px 0 0; font-size: 12px; font-weight: 400; }
.again { width: 100%; margin-top: 4px; }

/* ---- small frames: game.js zooms the whole page (document zoom) so layouts below stay unchanged ---------------------- */
.tiny .logo { display: none; }
/* gallery / cover capture */
.shotmode .pausebtn { visibility: hidden; }
.covermode #hud, .covermode #ready, .covermode #pad, .covermode #coach, .covermode #banner, .covermode #toast, .covermode #finishChip { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01s !important; } }
