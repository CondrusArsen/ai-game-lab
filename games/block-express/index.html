:root { --ink: #1b1410; --panel: rgba(28, 22, 18, 0.92); --edge: #5a3d22; --grass: #5fae3e; --gold: #f2b134; --red: #d33a2c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; overscroll-behavior: none; touch-action: none; }
body { font-family: 'Pixel', system-ui, sans-serif; letter-spacing: 0.02em; color: #fff; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button, #ui input, #screen, #coach, #actbtn { pointer-events: auto; }
#touch { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
.hidden { display: none !important; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; font: 20px sans-serif; color: #fff; background: #3a6f2a; }
.coin { display: inline-block; width: 0.9em; height: 0.9em; margin-right: 0.25em; vertical-align: -0.08em; background: #f2c94c; box-shadow: inset -0.12em -0.12em 0 #c9902a, inset 0.12em 0.12em 0 #fff2b0; border: 0.08em solid #6b4a12; }
.pill { background: rgba(20, 16, 12, 0.72); border: 2px solid rgba(0, 0, 0, 0.5); padding: 4px 10px; font-size: 18px; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
.pill.small { font-size: 14px; padding: 2px 8px; }
.btn { font-family: inherit; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6); background: #7a7c80; border: 3px solid #1b1b1b; box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.3), inset 4px 4px 0 rgba(255, 255, 255, 0.3); padding: 10px 16px; cursor: pointer; min-height: 46px; }
.btn:active { box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.3); transform: translateY(1px); }
