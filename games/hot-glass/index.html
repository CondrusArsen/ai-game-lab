<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<title>Горячее стекло</title>
<link rel="stylesheet" href="style.css">
<script type="module">
  // the platform (hostsdk) SDK, fetched early only when embedded on the platform; see src/platform.js
  if (window.parent !== window && !/[?&]standalone/.test(location.search))
    window.__bp = import('/sdk/hostsdk.js').then((m) => m.hostsdk).catch(() => null);
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div id="hud" class="hidden">
  <div class="order">
    <div class="order-name" id="orderName">Ёлочный шар</div>
    <div class="order-who" id="orderWho">для соседки</div>
    <div class="wait" aria-label="Терпение заказчика"><i id="waitBar"></i></div>
  </div>
  <div class="match"><b id="matchPct">0%</b><span>совпадение</span></div>
  <div class="top-buttons">
    <button id="btnSound" class="icon" aria-label="Звук"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16 9l5 6M21 9l-5 6"/></svg></button>
    <button id="btnPause" class="icon" aria-label="Пауза"><svg viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg></button>
  </div>
  <div class="temp"><i id="tempBar"></i><span id="tempLabel">жар</span></div>
</div>

<div id="controls" class="hidden">
  <button id="btnHeat" class="ctl heat" aria-label="В печь"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.4 2.2-4.3.1 1.6.9 2.8 2.1 3.3C11 9 11.3 5 12 2z"/></svg><span>в печь</span><kbd>F</kbd></button>
  <button id="btnBlow" class="ctl blow" aria-label="Дуть"><span class="ring"></span><span>дуть</span><kbd>пробел</kbd></button>
  <button id="btnDone" class="ctl done" aria-label="Готово"><span>готово</span><kbd>Enter</kbd></button>
</div>

<div id="hint" class="hint hidden"></div>
<div id="toast" class="toast"></div>

<section id="title" class="screen">
  <p class="kicker">мастерская у реки · один рабочий день</p>
  <h1>Горячее<br>стекло</h1>
  <p class="lede">Дуй, крути и грей. Пока стекло горячее, оно живое — успей придать ему форму заказа.</p>
  <button id="btnStart" class="big">Открыть мастерскую</button>
  <p class="best" id="bestLine"></p>
</section>

<section id="pause" class="screen hidden">
  <h2>Пауза</h2>
  <button id="btnResume" class="big">Продолжить</button>
  <button id="btnRestart" class="ghost">Начать день заново</button>
</section>

<section id="verdict" class="card hidden">
  <div class="card-head"><div class="stars" id="vStars"></div><h3 id="vTitle">Хорошая работа</h3></div>
  <p id="vLine"></p>
  <button id="btnNext" class="big small">Следующий заказ</button>
</section>

<section id="result" class="screen hidden">
  <h2 id="resTitle">Вечер</h2>
  <p id="resLine" class="lede"></p>
  <ul id="resList" class="pieces"></ul>
  <button id="btnAgain" class="big">Новый день</button>
</section>

<script type="module" src="src/main.js"></script>
</body>
</html>
