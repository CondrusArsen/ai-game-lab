<style>/* Gulp & Boom — desert bazaar UI: sandstone panels, indigo ink outlines, turquoise and gold, chunky type. */
:root {
  --ink: #2a2140; --sand: #f6e3c0; --sand2: #e9c994; --terra: #d9744a; --terra2: #a8502e; --turq: #19b7be; --turq2: #0f8f98;
  --gold: #ffc940; --gold2: #d99a1e; --chili: #e8453c; --cream: #fff6e2; --purple: #7b4bd8;
  --disp: 'GB Display', 'Arial Black', system-ui, sans-serif; --ui: 'GB UI', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #f2d7a4; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; font-family: var(--ui); font-weight: 800; color: var(--ink); overflow: hidden; }
#ui button { pointer-events: auto; font-family: var(--ui); font-weight: 900; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ic { display: inline-block; width: 1.2em; height: 1.2em; vertical-align: middle; }
.ic svg, .rbtn svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* vignette + title plate (first screen) */
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 58%, rgba(0,0,0,0) 55%, rgba(80,40,20,.28) 100%); }
.logo { position: absolute; left: 50%; top: calc(128px + var(--sat)); transform: translateX(-50%) rotate(-4deg); text-align: center; display: none; white-space: nowrap; animation: logoin .7s cubic-bezier(.3,1.6,.6,1); }
.logo b { font-family: var(--disp); font-size: clamp(30px, 10.5vw, 50px); line-height: .9; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); display: inline-block; }
.logo .l1 { color: #5ff0dc; display: block; } .logo .l2 { color: var(--gold); font-size: clamp(26px, 9vw, 40px); margin: 0 6px; transform: translateY(-6px); } .logo .l3 { color: #ff9a5c; }
.logo small { display: block; margin-top: 8px; font-size: 14px; color: var(--cream); text-shadow: 0 0 4px var(--ink), 0 2px 0 var(--ink); transform: rotate(4deg); }
#ui.first[data-mode=lobby] .logo { display: block; }
#ui.cover .hud, #ui.cover .lobby, #ui.cover .fight, #ui.cover .timer-pill, #ui.cover .next-food { display: none !important; }
#ui.cover .logo { display: block; left: 4.5%; top: 6%; transform: rotate(-5deg); animation: none; text-align: left; }
#ui.cover .logo b { font-size: 6.9vw; -webkit-text-stroke: 0.45vw var(--ink); text-shadow: 0 0.6vw 0 var(--ink); }
#ui.cover .logo .l2 { font-size: 4.4vw; } #ui.cover .logo small { font-size: 2.3vw; transform: none; margin-top: 1.4vw; }
#ui.cover .vignette { background: radial-gradient(ellipse 75% 75% at 60% 55%, rgba(0,0,0,0) 50%, rgba(80,40,20,.35) 100%); }
@keyframes logoin { from { transform: translateX(-50%) rotate(-4deg) scale(.4); opacity: 0; } }
@media (max-height: 520px) { .logo { top: 50px; } .logo b { font-size: 34px; } .logo small { display: none; } }
/* ---- HUD ---- */
.hud { position: absolute; left: 0; right: 0; top: 0; }
.tl { position: absolute; left: 10px; top: calc(10px + var(--sat)); display: flex; gap: 8px; align-items: center; }
.rbtn { width: 48px; height: 48px; padding: 7px; border-radius: 16px; border: 3px solid var(--ink); background: linear-gradient(#fff6e2, #f0d39f); box-shadow: 0 4px 0 var(--ink); position: relative; }
.rbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.rbtn .lbl { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; color: var(--cream); text-shadow: 0 0 3px var(--ink), 0 2px 0 var(--ink), 1px 1px 0 var(--ink), -1px -1px 0 var(--ink); }
.wallet { height: 38px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 6px; border-radius: 20px; border: 3px solid var(--ink); background: linear-gradient(#fff6e2, #f3d9a8); box-shadow: 0 3px 0 var(--ink); font-family: var(--disp); font-size: 17px; }
.wallet .ic { width: 28px; height: 28px; }
.wallet.bump { animation: bump .45s ease-out; }
@keyframes bump { 30% { transform: scale(1.18); } 100% { transform: scale(1); } }
.topbar { position: absolute; left: 50%; top: calc(66px + var(--sat)); transform: translateX(-50%); width: min(300px, 78vw); height: 40px; }
.topbar.no-bar .bar, .topbar.no-bar .bar-pow { visibility: hidden; }
.lvl-bubble { position: absolute; left: -12px; top: -4px; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 60%, var(--gold2)); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; z-index: 2; font-family: var(--disp); font-size: 19px; }
.bar { position: absolute; left: 22px; right: 0; top: 6px; height: 28px; border-radius: 15px; border: 3px solid var(--ink); background: #4a3a5e; overflow: visible; box-shadow: 0 3px 0 var(--ink); }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 12px; background: linear-gradient(#5ff0dc, var(--turq) 55%, var(--turq2)); transition: width .15s linear; }
.bar.is-ready .bar-fill { background: linear-gradient(#ffe68a, var(--gold) 55%, var(--gold2)); animation: glow 0.8s ease-in-out infinite alternate; }
@keyframes glow { to { filter: brightness(1.2); } }
.bar-text { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; letter-spacing: .06em; color: #fff; text-shadow: 0 1px 0 var(--ink), 0 0 3px var(--ink); }
.bar-best { position: absolute; top: -17px; width: 22px; height: 22px; margin-left: -11px; }
.bar-best .ic { width: 22px; height: 22px; }
.bar-end { position: absolute; right: -16px; top: -10px; width: 42px; height: 42px; display: grid; place-items: center; }
.bar-end .ic { width: 38px; height: 38px; filter: drop-shadow(0 2px 0 var(--ink)); }
.bar:not(.is-ready) .ready-txt { display: none; }
.ready-txt { position: absolute; top: 36px; font-size: 10px; color: var(--cream); text-shadow: 0 0 3px var(--ink), 0 1px 0 var(--ink); }
.bar-pow { position: absolute; right: 22px; top: 37px; height: 22px; padding: 0 8px 0 3px; border-radius: 11px; border: 2.5px solid var(--ink); background: var(--cream); display: flex; align-items: center; gap: 2px; font-family: var(--disp); font-size: 13px; }
.bar-pow .ic { width: 18px; height: 18px; }

.timer-pill { position: absolute; left: 0; top: 0; padding: 3px 12px; border-radius: 16px; border: 3px solid var(--ink); background: #2a2140; color: #fff; font-family: var(--disp); font-size: 18px; box-shadow: 0 3px 0 rgba(42,33,64,.5); will-change: transform; }
.timer-pill.urgent { background: var(--chili); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { filter: brightness(1.25); } }

/* I1: next food badge beside the growth ring */
.next-food { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 40% 35%, #fff6e2, #e3c48a); box-shadow: 0 3px 0 rgba(42,33,64,.55); display: none; will-change: transform; }
.next-food img { width: 100%; height: 100%; filter: grayscale(.75) brightness(1.05); }
.next-food b { position: absolute; right: -9px; top: -9px; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 10px; background: var(--turq); border: 2.5px solid var(--ink); color: #fff; font-size: 11px; display: grid; place-items: center; }
.next-food.pop { animation: bump .5s; }
#ui[data-mode=lobby] .next-food.on, #ui[data-mode=gather] .next-food.on { display: block; }
/* I2: act map on the win card */
.actmap { display: flex; justify-content: space-between; align-items: center; margin: 8px 2px 2px; position: relative; }
.actmap::before { content: ''; position: absolute; left: 8px; right: 8px; top: 50%; height: 4px; background: rgba(42,33,64,.25); border-radius: 2px; }
.actmap i { position: relative; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--cream); display: grid; place-items: center; font-style: normal; }
.actmap i.done { background: var(--turq); } .actmap i.now { background: var(--gold); transform: scale(1.25); }
.actmap i img, .actmap i .ic { width: 18px; height: 18px; } .actmap i.boss { width: 30px; height: 30px; background: #f0b98a; }
.nextline { font-size: 13px; margin: 6px 0 0; }
/* ---- lobby ---- */
.lobby, .fight { position: absolute; inset: 0; display: none; }
#ui[data-mode=lobby] .lobby, #ui[data-mode=fight] .fight { display: block; }
#ui[data-mode=lobby] .timer-pill, #ui[data-mode=gather] .timer-pill { display: block; }
#ui:not([data-mode=lobby]):not([data-mode=gather]) .timer-pill { display: none; }
#ui[data-mode=fight] .topbar, #ui[data-mode=card] .topbar { display: none; }
#ui[data-mode=lobby] .btn-pause, #ui[data-mode=card] .btn-pause, #ui[data-mode=transition] .btn-pause { display: none; }
.boosters { position: absolute; left: 10px; top: 46%; display: flex; flex-direction: column; gap: 22px; transform: translateY(-50%); }
.boost { width: 56px; height: 56px; padding: 7px; border-radius: 18px; border: 3px solid var(--ink); background: linear-gradient(#fff6e2, #eed3a2); box-shadow: 0 4px 0 var(--ink); position: relative; }
.boost.empty { filter: grayscale(.9) opacity(.6); }
.boost.armed { background: linear-gradient(#bff7f0, #5fe2d6); box-shadow: 0 4px 0 var(--ink), 0 0 0 4px #fff6e2, 0 0 16px 6px rgba(25,211,200,.8); }
.boost .n { position: absolute; right: -8px; top: -8px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--chili); color: #fff; border: 2.5px solid var(--ink); font-size: 12px; display: grid; place-items: center; padding: 0 4px; }
.boost .lbl { position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; color: var(--cream); text-shadow: 0 0 3px var(--ink), 0 1px 0 var(--ink); }
.side { position: absolute; right: 10px; top: calc(128px + var(--sat)); display: flex; flex-direction: column; gap: 30px; }
.side .rbtn { width: 52px; height: 52px; }
.drag-hint { position: absolute; left: 0; top: 0; width: 220px; text-align: center; transform: translate(-50%, 0); color: var(--cream); text-shadow: 0 0 4px var(--ink), 0 2px 0 var(--ink); display: none; }
.drag-hint .hint-joy { position: relative; width: 96px; height: 56px; margin: 0 auto 0; }
.hint-joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px; border-radius: 50%; border: 3px solid rgba(255,246,226,.92); background: rgba(42,33,64,.28); box-shadow: 0 0 0 2px rgba(42,33,64,.45); }
.hint-joy .hand { position: absolute; left: 50%; top: 52%; width: 40px; height: 44px; margin: -8px 0 0 -12px; animation: joyhand 2.4s ease-in-out infinite; filter: drop-shadow(0 3px 0 rgba(42,33,64,.5)); }
@keyframes joyhand { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(24px, -14px); } 50% { transform: translate(-2px, -26px); } 75% { transform: translate(-24px, -10px); } }
#ui:not(.teach) .hint-joy { display: none; }
.drag-hint.compact small { display: none; }
.drag-hint.compact .hint-joy { height: 46px; }
.drag-hint.compact .hint-joy i { width: 40px; height: 40px; margin: -20px; }
.drag-hint b { display: block; font-family: var(--disp); font-size: 18px; white-space: nowrap; }
.drag-hint small { display: block; font-size: 12px; margin-top: 1px; }
@keyframes dragx { 0%,100% { transform: translate(-34px, 0) rotate(-8deg); } 50% { transform: translate(34px, -8px) rotate(8deg); } }
.lobby-bottom { position: absolute; left: 0; right: 0; bottom: calc(12px + var(--sab)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rented { font-size: 12px; color: var(--cream); text-shadow: 0 0 3px var(--ink), 0 1px 0 var(--ink); min-height: 15px; }
.cards { display: flex; gap: 10px; }
.card { width: 104px; padding: 6px 4px 6px; border-radius: 18px; border: 3px solid var(--ink); background: linear-gradient(#3fd0d4, var(--turq) 50%, var(--turq2)); box-shadow: 0 5px 0 var(--ink); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.card .ic { width: 50px; height: 50px; filter: drop-shadow(0 3px 0 rgba(42,33,64,.45)); }
.card .ttl { font-size: 13px; color: #fff; text-shadow: 0 1px 0 var(--ink), 0 0 3px var(--ink); letter-spacing: .04em; }
.card .lv { font-size: 11px; color: #e8fffb; text-shadow: 0 1px 0 var(--ink); white-space: nowrap; }
.card.hint { animation: hint 1s ease-in-out infinite; box-shadow: 0 5px 0 var(--ink), 0 0 0 4px #fff6e2, 0 0 18px 6px rgba(255,201,64,.85); }
@keyframes hint { 50% { transform: translateY(-6px); } }
.card .price { margin-top: 3px; width: 92%; height: 30px; border-radius: 12px; border: 2.5px solid var(--ink); background: linear-gradient(#fff3a6, var(--gold)); display: flex; align-items: center; justify-content: center; gap: 3px; font-family: var(--disp); font-size: 15px; }
.card .price .ic { width: 20px; height: 20px; filter: none; }
.card.poor .price { background: linear-gradient(#e6dccd, #c9b9a3); color: #6d5f72; }
.card.maxed .price { background: #c9b9a3; }
.card.shake { animation: shake .4s; }
.card.bought { animation: bought .45s; }
.card .up { position: absolute; top: -14px; right: -8px; width: 30px; height: 30px; border-radius: 50%; background: #5dbb63; border: 2.5px solid var(--ink); color: #fff; display: grid; place-items: center; font-size: 18px; line-height: 1; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@keyframes bought { 40% { transform: translateY(-10px) scale(1.06); } }
.card .need { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: #fff; background: var(--chili); border: 2px solid var(--ink); border-radius: 10px; padding: 1px 6px; opacity: 0; transition: opacity .2s; }
.card.shake .need { opacity: 1; }

/* ---- fight ---- */
.gbar { position: absolute; left: 0; top: 0; width: 170px; transform: translate(-50%, -100%); text-align: center; will-change: transform; }
.gname { display: block; font-size: 12px; color: var(--cream); text-shadow: 0 0 3px var(--ink), 0 1px 0 var(--ink); margin-bottom: 2px; white-space: nowrap; }
.gbar-hp, .gbar-shell { height: 14px; border-radius: 8px; border: 2.5px solid var(--ink); background: #4a3a5e; overflow: hidden; position: relative; }
.gbar-hp i, .gbar-shell i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#8ef08a, #45b94a); transition: width .12s; }
.gbar-shell { height: 10px; margin-bottom: 3px; display: none; }
.gbar-shell i { background: linear-gradient(#ffe68a, var(--gold2)); }
.gbar.titan .gbar-shell { display: block; }
.gbar-hp .armor { position: absolute; left: 0; top: 0; bottom: 0; width: 33.3%; background: repeating-linear-gradient(135deg, rgba(207,139,62,.95) 0 6px, rgba(154,95,34,.95) 6px 12px); display: none; }
.gbar.guard .gbar-hp .armor { display: block; }
.track { position: absolute; right: 12px; top: calc(140px + var(--sat)); height: 34%; width: 34px; }
.track-line { position: absolute; left: 14px; top: 10px; bottom: 10px; width: 6px; border-radius: 3px; background: rgba(42,33,64,.55); box-shadow: 0 0 0 2px rgba(255,246,226,.7); }
.track-giant { position: absolute; left: 0; top: 0; width: 34px; height: 34px; transform: translateY(-50%); filter: drop-shadow(0 2px 0 var(--ink)); }
.track-pit { position: absolute; left: 0; bottom: -17px; width: 34px; height: 34px; }
.tray { position: absolute; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); display: flex; flex-wrap: wrap-reverse; justify-content: center; gap: 8px; width: min(380px, 96vw); }
.slot { width: 58px; height: 58px; border-radius: 16px; border: 3px solid var(--ink); background: linear-gradient(#fff3a6, var(--gold) 60%, var(--gold2)); box-shadow: 0 4px 0 var(--ink); position: relative; padding: 3px; touch-action: none; pointer-events: auto; }
.slot img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.slot b { position: absolute; right: 3px; bottom: 1px; font-family: var(--disp); font-size: 14px; color: #fff; text-shadow: 0 0 3px var(--ink), 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); pointer-events: none; }
.slot.held { transform: translateY(4px) scale(.95); box-shadow: 0 0 0 var(--ink), 0 0 0 4px #fff, 0 0 18px 6px rgba(255,201,64,.9); background: linear-gradient(#ffd25a, #f0a52a); }
.slot.empty { background: #b9ad9c; filter: grayscale(1); opacity: .65; box-shadow: 0 2px 0 var(--ink); }
.fire-hint { position: absolute; left: 0; top: 0; display: none; text-align: center; color: #fff; pointer-events: none; }
.fire-hint.show { display: block; }
.fire-hint .hand { width: 52px; height: 56px; animation: press 1s ease-in-out infinite; margin: 0 auto; }
.fire-hint b { position: absolute; left: 26px; top: 0; font-family: var(--disp); font-size: 20px; text-shadow: 0 0 4px var(--ink), 0 2px 0 var(--ink); white-space: nowrap; transform: translate(-50%, -96px); }
@keyframes press { 50% { transform: translateY(8px) scale(.92); } }

/* ---- banners, pops, toast ---- */
.banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .25s cubic-bezier(.3,1.6,.6,1); }
.banner.show { opacity: 1; transform: scale(1); }
.banner b { display: inline-block; font-family: var(--disp); font-size: clamp(30px, 10vw, 46px); color: #fff; padding: 4px 22px 8px; border-radius: 22px; border: 4px solid var(--ink); background: linear-gradient(#5ff0dc, var(--turq)); box-shadow: 0 6px 0 var(--ink); text-shadow: 0 3px 0 var(--ink); max-width: 88vw; }
.banner.bad b { background: linear-gradient(#ff8a6a, var(--chili)); }
.banner.gold b { background: linear-gradient(#ffe68a, var(--gold2)); }
.banner.boss b { background: linear-gradient(#ffb36b, var(--terra)); }
.banner.small b { font-size: clamp(20px, 6.4vw, 30px); }
.toast { position: absolute; left: 50%; top: calc(122px + var(--sat)); transform: translateX(-50%) translateY(-10px); max-width: 84vw; padding: 7px 14px; border-radius: 14px; border: 3px solid var(--ink); background: var(--cream); font-size: 14px; text-align: center; opacity: 0; transition: opacity .2s, transform .2s; box-shadow: 0 3px 0 var(--ink); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.pops { position: absolute; inset: 0; }
.pop { position: absolute; left: 0; top: 0; font-family: var(--disp); font-size: calc(17px * var(--s, 1)); color: #fff; white-space: nowrap; text-shadow: 0 0 3px var(--ink), 0 2px 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink); will-change: transform, opacity; }
.pop .ic { width: 1em; height: 1em; }
.pop.big { color: #fff3a6; }
.pop.coin { color: #ffe27a; }
.pop.sizeup { font-size: calc(26px * var(--s, 1)); color: #bff7f0; }
.pop.hit { font-size: 15px; color: #ffe0b8; }
.countdown { position: absolute; inset: 0; display: none; place-items: center; font-family: var(--disp); font-size: 120px; color: #fff; text-shadow: 0 6px 0 var(--ink), 0 0 10px var(--ink); }
.countdown.show { display: grid; animation: cd 1s ease-out infinite; }
@keyframes cd { 0% { transform: scale(1.4); opacity: 0; } 30% { transform: scale(1); opacity: 1; } }
.wipe { position: absolute; inset: -10%; background: radial-gradient(circle, #f6e3c0 0, #e9c994 45%, #c79a62 100%); opacity: 0; transition: opacity .35s; }
.wipe.show { opacity: 1; }

/* ---- cards / modals ---- */
.modal-wrap { position: absolute; inset: 0; display: none; place-items: center; background: rgba(42,33,64,.35); pointer-events: auto; }
.modal-wrap.show { display: grid; animation: fadein .2s; }
.modal-wrap.clear { background: transparent; }
@keyframes fadein { from { opacity: 0; } }
.modal { width: min(340px, 90vw); overflow: visible; border-radius: 26px; border: 4px solid var(--ink); background: linear-gradient(#fff6e2, #f3dcae); box-shadow: 0 8px 0 var(--ink); padding: 0 16px 16px; text-align: center; animation: pop .35s cubic-bezier(.3,1.6,.6,1); }
@keyframes pop { from { transform: scale(.7); } }
.modal .head { margin: 0 -16px 10px; padding: 12px 10px 10px; border-radius: 22px 22px 0 0; background: linear-gradient(#ffb36b, var(--terra)); border-bottom: 4px solid var(--ink); color: #fff; font-family: var(--disp); font-size: 24px; text-shadow: 0 3px 0 var(--ink); }
