<style>/* Moonshot Marshal — UI: wanted-poster panels on a night-sky frontier. Unbounded (space titles), Roboto Slab (poster
   buttons), Rubik (text). Every touch target ≥ 44 px. */
:root {
  --ink: #1d1238; --ink2: #3a2a66; --paper: #fff3dc; --paper2: #f4dfb6; --orange: #ff8a3d; --orange2: #d65f27; --gold: #ffd23f;
  --cyan: #5ff3ff; --red: #ff4a5a; --green: #46d27a; --blue: #4fb3ff; --night: #1b1240; --pink: #ff5ea8;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--paper); font-family: 'Rubik', system-ui, sans-serif; font-weight: 600; touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
#app { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

/* ---- HUD ---- */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 8px) 10px 0; display: flex; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
.rbtn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; padding: 0; flex: none; }
.rbtn svg { width: 24px; height: 24px; fill: var(--ink); stroke: var(--ink); }
.rbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.hud-mid { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-right: 54px; pointer-events: none; }
.lvltitle { background: var(--ink); border: 2px solid #4b3a86; border-radius: 14px; padding: 4px 12px 5px; font: 900 13px 'Unbounded', sans-serif; letter-spacing: .3px; text-align: center; color: var(--paper); line-height: 1.25; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvltitle small { display: block; font: 700 11px 'Rubik', sans-serif; letter-spacing: .4px; opacity: .95; }
.lvltitle .mb { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 8px; margin-left: 4px; color: var(--ink); font: 800 10px 'Rubik', sans-serif; text-transform: uppercase; }
.mb.classic { background: var(--cyan); } .mb.grenade { background: #c79bff; } .mb.hostage { background: var(--blue); color: #fff; } .mb.ff { background: var(--pink); color: #fff; } .mb.duel { background: var(--gold); }
.ammo { display: flex; gap: 3px; align-items: center; background: rgba(29,18,56,.82); border-radius: 12px; padding: 4px 8px; min-height: 28px; }
.ammo i { width: 12px; height: 22px; border-radius: 6px 6px 3px 3px; background: linear-gradient(#e9feff, var(--cyan)); border: 2px solid var(--ink); box-shadow: 0 0 6px rgba(95,243,255,.6); display: block; transition: transform .2s, opacity .2s; }
.ammo i.nade { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd6ff, #b45cff 60%, #5a2a9e); box-shadow: 0 0 6px rgba(180,92,255,.6); }
.ammo i.spent { opacity: .28; filter: grayscale(1); box-shadow: none; }
.ammo i.pop { animation: pop .35s ease-out; }
.ammo b { font: 900 11px 'Unbounded', sans-serif; color: var(--paper); margin-left: 4px; }
.ammo .room { display: flex; gap: 3px; margin-right: 6px; }
.ammo .room span { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--paper); opacity: .5; }
.ammo .room span.on { background: var(--green); opacity: 1; } .ammo .room span.cur { background: var(--gold); opacity: 1; }
@keyframes pop { 0% { transform: scale(1.6) translateY(-6px); } 100% { transform: none; } }

#band { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px calc(var(--sab) + 12px); display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; pointer-events: none; z-index: 4; }
#band .rbtn { pointer-events: auto; width: 52px; height: 52px; }
.hintbtn { background: #dff8ff !important; }
.padhint { flex: 1; text-align: center; font: 700 13px 'Rubik', sans-serif; color: rgba(255,243,220,.92); text-shadow: 0 2px 0 var(--ink); padding-bottom: 14px; line-height: 1.3; }
.padhint.warn { color: var(--gold); }
.cancelzone { position: absolute; left: 50%; top: calc(var(--sat) + 104px); transform: translateX(-50%); width: 132px; height: 64px; border-radius: 32px; border: 3px dashed rgba(255,243,220,.7); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--paper); font: 800 14px 'Rubik', sans-serif; background: rgba(29,18,56,.55); z-index: 6; pointer-events: none; }
.cancelzone span { font-size: 22px; }
.cancelzone.hot { background: var(--red); border-style: solid; border-color: var(--paper); }
body.aiming .padhint { opacity: 0; }

.toast { position: absolute; left: 50%; top: calc(var(--sat) + 96px); transform: translate(-50%, -10px); background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 9px 16px; font: 700 14px 'Rubik', sans-serif; box-shadow: 0 4px 0 var(--ink); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; max-width: 88vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---- modal screens ---- */
.modal { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: calc(var(--sat) + 10px) 12px calc(var(--sab) + 10px); background: rgba(14,8,36,.55); overflow-y: auto; touch-action: pan-y; }
.modal.full { background: linear-gradient(180deg, rgba(20,13,51,0.72) 0%, rgba(42,24,84,0.5) 55%, rgba(80,35,90,0.62) 100%); align-items: flex-start; }
.modal.clearbg { background: transparent; pointer-events: none; }
.modal.clearbg .card { pointer-events: auto; }
.card { width: min(380px, 100%); background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink), 0 12px 40px rgba(0,0,0,.4); padding: 18px 16px 16px; text-align: center; position: relative; animation: cardIn .28s cubic-bezier(.2,1.4,.4,1); }
.card.wide { width: min(460px, 100%); }
@keyframes cardIn { from { transform: translateY(24px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.card h1 { font: 900 24px 'Unbounded', sans-serif; margin: 2px 0 8px; letter-spacing: .3px; line-height: 1.15; }
.card h2 { font: 800 17px 'Roboto Slab', serif; margin: 4px 0 8px; }
.card p { font: 600 14px 'Rubik', sans-serif; margin: 6px 0; line-height: 1.35; color: var(--ink2); }
.card .sub { font: 600 13px 'Rubik', sans-serif; color: var(--ink2); }
.card .rivet { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--paper2); border: 2px solid var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; min-width: 52px; padding: 0 20px; border-radius: 16px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); font: 800 17px 'Roboto Slab', serif; box-shadow: 0 5px 0 var(--ink); margin: 5px; letter-spacing: .2px; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--orange); color: #fff; text-shadow: 0 2px 0 var(--orange2); font-size: 20px; min-height: 60px; min-width: 200px; }
.btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 #23864a; }
.btn.danger { background: var(--red); color: #fff; }
.btn.small { min-height: 46px; font-size: 14px; padding: 0 14px; }
.btn[disabled] { opacity: .45; filter: grayscale(.8); }
.btn svg { width: 22px; height: 22px; fill: currentColor; }
.row { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
.stars svg { width: 54px; height: 54px; }
.stars svg.on { animation: starIn .45s cubic-bezier(.2,1.6,.4,1) both; }
.stars svg:nth-child(2) { width: 66px; height: 66px; margin-top: -10px; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: none; } }
.cash { display: inline-flex; align-items: center; gap: 6px; font: 900 20px 'Unbounded', sans-serif; color: #1e8a4c; }
.cashchip { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--paper); border-radius: 14px; padding: 6px 12px; font: 900 14px 'Unbounded', sans-serif; }
.coin { width: 22px; height: 22px; flex: none; }
.cause { background: #ffe1e4; border: 3px solid var(--red); border-radius: 16px; padding: 8px 10px; margin: 6px 0 10px; font: 700 14px 'Rubik', sans-serif; color: #7a1222; }
.goal { display: inline-block; background: var(--ink); color: var(--gold); border-radius: 12px; padding: 6px 12px; margin: 6px 0 4px; font: 800 13px 'Rubik', sans-serif; }
.notice { background: #e5fbff; border: 3px dashed var(--ink); border-radius: 16px; padding: 8px 10px; margin: 8px 0; font: 700 14px 'Rubik', sans-serif; color: var(--ink); }

/* menu */
.menu { width: min(460px, 100%); display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
.logo { text-align: center; margin: 6px 0 2px; }
.logo canvas { width: min(360px, 92vw); height: auto; }
.tagline { text-align: center; font: 700 13px 'Rubik', sans-serif; color: rgba(255,243,220,.85); margin-top: -6px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-right: 54px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; min-height: 112px; border-radius: 20px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 var(--ink); padding: 10px 10px 8px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.tile b { font: 900 14px 'Unbounded', sans-serif; line-height: 1.15; position: relative; z-index: 1; }
.tile small { font: 600 12px 'Rubik', sans-serif; color: var(--ink2); position: relative; z-index: 1; }
.tile .ic { position: absolute; right: 8px; top: 8px; width: 42px; height: 42px; }
.tile .art { position: absolute; right: 6px; top: 6px; width: 64px; height: 54px; pointer-events: none; }
.tile.big .art { left: auto; right: 0; top: 0; width: 64%; height: 100%; }
.tile.locked .art { opacity: .35; filter: grayscale(.9); }
.tile.locked { background: #d9cfe8; opacity: .85; }
.tile.locked .ic { opacity: .4; }
.tile .lock { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; }
.tile.big { grid-column: 1 / -1; min-height: 110px; background: linear-gradient(135deg, #ffb27a, var(--orange)); color: #fff; }
.tile.big b { font-size: 22px; text-shadow: 0 2px 0 var(--orange2); }
.tile.big small { color: #fff7ea; font-size: 13px; }
.tile .badge { position: absolute; top: 8px; left: 10px; font: 800 10px 'Rubik', sans-serif; background: var(--red); color: #fff; border-radius: 8px; padding: 2px 6px; }

/* dossier map */
.dossiers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.dos { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 var(--ink); padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.dos canvas { width: 100%; flex: 1; min-height: 0; display: block; border-bottom: 3px solid var(--ink); }
.dos b { font: 900 10px 'Unbounded', sans-serif; padding: 4px 4px 0; line-height: 1.1; }
.dos small { font: 700 11px 'Rubik', sans-serif; padding: 0 4px 5px; color: var(--ink2); }
.dos.locked { filter: grayscale(.85) brightness(.75); }
.grid12 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.cell { position: relative; aspect-ratio: 1; border-radius: 14px; border: 3px solid var(--ink); background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; }
.cell b { font: 900 16px 'Unbounded', sans-serif; }
.cell .st { font-size: 11px; letter-spacing: -1px; color: #e0a800; min-height: 13px; }
.cell .mi { position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.cell.cur { background: #fff1c2; animation: pulse 1.2s ease-in-out infinite; }
.cell.locked { background: #cfc4e0; opacity: .7; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.mi.classic { background: var(--cyan); } .mi.grenade { background: #c79bff; } .mi.hostage { background: var(--blue); } .mi.ff { background: var(--pink); }

/* settings */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; text-align: left; font: 700 15px 'Rubik', sans-serif; }
.setrow input[type=range] { flex: 1; max-width: 190px; height: 44px; accent-color: var(--orange); }
.seg { display: flex; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; }
.seg button { min-width: 64px; min-height: 44px; border: 0; background: var(--paper); font: 800 15px 'Roboto Slab', serif; color: var(--ink); }
.seg button.on { background: var(--orange); color: #fff; }
.toggle { width: 64px; height: 38px; border-radius: 19px; border: 3px solid var(--ink); background: #cfc4e0; position: relative; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: left .15s; }
.toggle.on { background: var(--green); } .toggle.on::after { left: 29px; }
.credits { text-align: left; font: 500 12px 'Rubik', sans-serif; max-height: 46vh; overflow-y: auto; color: var(--ink2); white-space: pre-wrap; background: #fff8ea; border-radius: 12px; padding: 8px; border: 2px solid var(--ink); }

/* wardrobe */
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.suit { border: 3px solid var(--ink); border-radius: 14px; background: #fff; padding: 2px 2px 4px; box-shadow: 0 3px 0 var(--ink); display: flex; flex-direction: column; align-items: center; min-height: 44px; }
.suit canvas { width: 100%; aspect-ratio: 1; }
.suit small { font: 800 10px 'Rubik', sans-serif; line-height: 1.1; }
.suit.sel { outline: 4px solid var(--orange); }
.suit.eq { background: #e3ffe9; }
.preview { display: flex; align-items: center; justify-content: center; gap: 10px; }
.preview canvas { width: 120px; height: 150px; }

/* tabs / lists */
.tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { min-height: 44px; padding: 0 12px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; font: 800 13px 'Roboto Slab', serif; color: var(--ink); }
.tabs button.on { background: var(--ink); color: var(--paper); }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; align-items: center; gap: 10px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 8px 10px; min-height: 56px; text-align: left; box-shadow: 0 3px 0 var(--ink); color: var(--ink); }
.li b { font: 900 13px 'Unbounded', sans-serif; flex: 1; }
.li small { display: block; font: 600 12px 'Rubik', sans-serif; color: var(--ink2); }
.li.locked { opacity: .55; }
.li .st { color: #e0a800; font-size: 14px; letter-spacing: -1px; white-space: nowrap; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 10px; }
.opts button { min-height: 44px; padding: 0 12px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; font: 800 13px 'Roboto Slab', serif; color: var(--ink); }
.opts button.on { background: var(--orange); color: #fff; }
.opts button[disabled] { opacity: .45; }
.label { font: 800 12px 'Rubik', sans-serif; text-transform: uppercase; letter-spacing: .6px; color: var(--ink2); margin-top: 6px; }
.big-number { font: 900 34px 'Unbounded', sans-serif; color: var(--ink); }
.vs { display: flex; align-items: center; justify-content: center; gap: 14px; font: 900 15px 'Unbounded', sans-serif; }
.vs .tag { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 3px 8px; font-size: 12px; }

/* boot */
.boot { position: absolute; inset: 0; background: radial-gradient(circle at 50% 35%, #3a1f6b, #1b1240 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; transition: opacity .5s; }
.boot.gone { opacity: 0; pointer-events: none; }
.boot-title { font: 900 30px 'Unbounded', sans-serif; text-align: center; color: var(--gold); text-shadow: 0 4px 0 var(--orange2), 0 6px 0 var(--ink); line-height: 1.1; }
.boot-star { width: 70px; height: 70px; margin-bottom: 16px; background: var(--gold); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* duel banner */
.duelbar { position: absolute; left: 50%; top: calc(var(--sat) + 100px); transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.duelbar .aim { background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 4px 14px; font: 900 18px 'Unbounded', sans-serif; box-shadow: 0 4px 0 var(--ink); }
.duelbar .clock { width: 46px; height: 46px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); display: grid; place-items: center; font: 900 18px 'Unbounded', sans-serif; color: var(--ink); }
.duelbar .ready { background: var(--green); color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 3px 10px; font: 800 12px 'Rubik', sans-serif; }

/* landscape: HUD stays left of the board */
#app.land #hud { width: var(--sidew, 150px); flex-direction: column; align-items: stretch; padding: 10px; }
#app.land .hud-mid { margin-right: 0; align-items: stretch; }
#app.land #band { left: 0; right: auto; width: var(--sidew, 150px); flex-direction: column; align-items: center; top: auto; }
#app.land .padhint { padding-bottom: 6px; font-size: 11px; }
#app.land .cancelzone { left: calc(var(--sidew, 150px) / 2); top: 120px; width: 120px; }
#app.tiny .lvltitle { font-size: 10px; padding: 2px 8px; } #app.tiny .lvltitle small { display: none; }
#app.tiny .ammo { min-height: 20px; padding: 2px 6px; } #app.tiny .ammo i { height: 14px; width: 8px; } #app.tiny .ammo i.nade { width: 12px; height: 12px; }
#app.tiny .rbtn, #app.tiny #band .rbtn { width: 44px; height: 44px; }
#app.tiny .padhint { display: none; }
</style>
